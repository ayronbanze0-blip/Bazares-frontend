<style>
/* ── Login v3 — centered card, scenic footer ─────────────────── */
*,*::before,*::after{box-sizing:border-box}

.auth-page{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  background:var(--g-25);
  position:relative;overflow-x:hidden;
}
/* Textura capulana muito subtil a flutuar atrás do cartão — dá
   profundidade e liga esta página à identidade visual da marca. */
.auth-page::before{
  content:'';position:absolute;inset:-40px -40px auto -40px;height:520px;
  background-image:var(--capulana-pattern);background-size:170px;
  opacity:.05;filter:invert(1);
  animation:capulana-drift 34s linear infinite;
  pointer-events:none;
}
@keyframes capulana-drift{from{background-position:0 0}to{background-position:340px 170px}}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.auth-topbar,.auth-logo,.auth-welcome,.af-field,.af-row,.af-submit,.af-divider,.af-social,.af-foot{
  animation:fadeUp .6s cubic-bezier(.16,.8,.3,1) both;
}
.auth-topbar{animation-delay:.02s}
.auth-logo{animation-delay:.08s}
.auth-welcome{animation-delay:.16s}
.af-field:nth-of-type(1){animation-delay:.24s}
.af-field:nth-of-type(2){animation-delay:.3s}
.af-row{animation-delay:.36s}
.af-submit{animation-delay:.42s}
.af-divider{animation-delay:.48s}
.af-social{animation-delay:.54s}
.af-social button{animation:fadeUp .5s cubic-bezier(.16,.8,.3,1) both}
.af-social button:nth-child(1){animation-delay:.58s}
.af-social button:nth-child(2){animation-delay:.63s}
.af-social button:nth-child(3){animation-delay:.68s}
.af-foot{animation-delay:.74s}
.auth-scene{animation:fadeUp .8s cubic-bezier(.16,.8,.3,1) .3s both}
@media(prefers-reduced-motion:reduce){
  .auth-page::before,.auth-topbar,.auth-logo,.auth-logo-mark,.auth-logo-mark::after,.auth-welcome,.af-field,.af-row,.af-submit,.af-divider,.af-social,.af-social button,.af-foot,.auth-scene,.auth-scene-sun,.auth-scene-water::before,.auth-scene-boat{animation:none}
}

/* ── Top bar: language switcher ──────────────────────────────── */
.auth-topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 22px 0;position:relative;z-index:3;
}
.auth-back{position:static;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--g-600,#3C4658);text-decoration:none}
.auth-back:hover{color:var(--b-600,#00B837)}
.auth-lang{
  display:flex;align-items:center;gap:6px;
  background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--g-600,#3C4658);
  padding:6px 4px;
}
.auth-lang svg{transition:transform .18s ease}
.auth-lang[aria-expanded="true"] svg{transform:rotate(180deg)}

/* ── Main content ─────────────────────────────────────────────── */
.auth-main{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 26px 0;position:relative;z-index:2;
}
.auth-card-v3{width:100%;max-width:400px;margin:0 auto;padding-bottom:28px}

.auth-logo{display:flex;flex-direction:column;align-items:center;margin:14px 0 26px}
.auth-logo-mark{
  width:76px;height:76px;border-radius:22px;
  background:linear-gradient(160deg,var(--b-500,#00E043) 0%,var(--b-700,#166534) 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(0,224,67,.28);position:relative;margin-bottom:14px;
  overflow:hidden;
  animation:logo-breathe 3.6s ease-in-out infinite;
}
.auth-logo-mark svg{display:block;position:relative;z-index:1}
.auth-logo-mark::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 66%);
  background-size:220% 220%;background-position:130% 0;
  animation:logo-shine 3.6s ease-in-out infinite;
}
@keyframes logo-breathe{0%,100%{box-shadow:0 10px 26px rgba(0,224,67,.28)}50%{box-shadow:0 12px 34px rgba(0,224,67,.42)}}
@keyframes logo-shine{0%{background-position:130% 0}55%,100%{background-position:-40% 0}}
.auth-logo-name{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--n-900,#0F172A)}
.auth-logo-name span{color:var(--b-500,#00E043)}
.auth-logo-tag{font-size:12.5px;color:var(--g-500,#586478);font-weight:500;margin-top:2px}

.auth-welcome{text-align:center;margin-bottom:26px}
.auth-welcome h1{font-size:21px;font-weight:800;color:var(--n-900,#0F172A);letter-spacing:-.01em;margin-bottom:6px}
.auth-welcome p{font-size:13.5px;color:var(--g-500,#586478)}

/* Input fields */
.af-field{margin-bottom:14px}
.af-inp{position:relative;display:flex;align-items:center}
.af-inp svg{position:absolute;left:16px;color:var(--g-400,#7C8AA0);pointer-events:none;flex-shrink:0}
.af-inp input{
  width:100%;padding:15px 16px 15px 46px;
  border:1.5px solid var(--g-200,#DCE3EA);border-radius:16px;
  font-family:inherit;font-size:16px;color:var(--n-900,#0F172A);
  background:#fff;transition:border-color .18s ease,box-shadow .18s ease;
  outline:none;
}
/* O campo de senha tem o botão-olho flutuando por cima; sem isto, texto
   digitado longo passa por baixo do ícone em vez de parar antes dele. */
#lpw{padding-right:44px}
.af-inp input::placeholder{color:var(--g-400,#7C8AA0)}
.af-inp input:focus{border-color:var(--b-500,#00E043);box-shadow:0 0 0 3px rgba(0,224,67,.1)}
.af-inp .af-pw-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--g-400,#7C8AA0);cursor:pointer;padding:7px;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  transition:color .15s ease,background .15s ease;
}
.af-inp .af-pw-toggle svg{stroke-width:1.75}
.af-inp .af-pw-toggle:hover{color:var(--b-600,#00B837);background:var(--b-50,#F0FDF4)}
.af-inp .af-pw-toggle:active{background:var(--b-100,#DCFCE7)}

.af-row{display:flex;justify-content:center;margin:2px 0 20px}
.af-forgot{font-size:13px;font-weight:600;color:var(--b-600,#00B837);text-decoration:none}
.af-forgot:hover{text-decoration:underline}

.af-submit{
  width:100%;padding:16px;border-radius:16px;font-size:15.5px;font-weight:700;
  background:linear-gradient(100deg,var(--b-600,#00B837) 0%,var(--b-500,#00E043) 30%,var(--a-500,#F59E0B) 50%,var(--b-500,#00E043) 70%,var(--b-600,#00B837) 100%);
  background-size:250% 100%;
  color:#fff;border:none;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,224,67,.32);
  transition:transform .18s ease,box-shadow .18s ease;
  animation:submit-shine 6s linear infinite;
}
.af-submit:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,224,67,.4)}
@keyframes submit-shine{0%{background-position:0% 0}100%{background-position:250% 0}}
.af-submit:active{transform:scale(.98)}
.af-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

.af-divider{
  display:flex;align-items:center;gap:10px;
  margin:22px 0;color:var(--g-400,#7C8AA0);font-size:12.5px;font-weight:500;
}
.af-divider::before,.af-divider::after{content:'';flex:1;height:1px;background:var(--g-200,#DCE3EA)}

.af-social{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.af-social button{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 6px;border:1.5px solid var(--g-200,#DCE3EA);border-radius:14px;
  background:#fff;font-size:12.5px;font-weight:600;color:var(--n-700,#1E2D4A);
  cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.af-social button:hover{border-color:var(--b-300,#86EFAC);box-shadow:0 2px 10px rgba(0,224,67,.12);transform:translateY(-1px)}

.af-foot{text-align:center;font-size:13.5px;color:var(--g-500,#586478)}
.af-foot a{color:var(--b-600,#00B837);font-weight:700;text-decoration:none}
.af-foot a:hover{text-decoration:underline}

.af-alert{
  border-radius:12px;padding:11px 14px;margin-bottom:16px;
  font-size:13px;font-weight:500;display:flex;align-items:flex-start;gap:8px;
  animation:slideUp .25s ease both;
}
.af-alert-err{background:var(--red-bg);border:1px solid var(--r-500);color:var(--r-600)}
.af-alert-ok {background:var(--grn-bg);border:1px solid var(--b-500);color:var(--b-700)}

/* ── Scenic footer illustration ──────────────────────────────── */
.auth-scene{
  position:relative;width:100%;height:190px;margin-top:auto;
  overflow:hidden;flex-shrink:0;
}
.auth-scene-sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#FDFBF5 0%,#F3E7D6 30%,#E8CBAE 55%,#D9A98A 75%,#C98E75 100%);
}
.auth-scene-sun{
  position:absolute;left:50%;top:18%;width:70px;height:70px;border-radius:50%;
  transform:translateX(-50%);
  background:radial-gradient(circle,#FDE08A 0%,#FBBF24 60%,rgba(251,191,36,0) 72%);
  opacity:.8;
  animation:sun-glow 5s ease-in-out infinite;
}
@keyframes sun-glow{0%,100%{opacity:.8;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
.auth-scene-water{
  position:absolute;left:0;right:0;bottom:34px;height:70px;
  background:linear-gradient(180deg,#8FAFC4 0%,#5E85A0 55%,#3F6480 100%);
}
.auth-scene-water::before{
  content:'';position:absolute;inset:0;width:200%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 3px,transparent 3px 22px);
  opacity:.5;
  animation:water-shimmer 7s linear infinite;
}
@keyframes water-shimmer{from{transform:translateX(0)}to{transform:translateX(-22px)}}
.auth-scene-boat{
  position:absolute;bottom:44px;left:-14%;width:26px;height:26px;
  animation:boat-sail 22s linear infinite;
}
@keyframes boat-sail{from{left:-14%}to{left:114%}}
.auth-scene-hills{
  position:absolute;left:0;right:0;bottom:78px;height:60px;
  background:
    radial-gradient(ellipse 180px 60px at 12% 100%,#4A6E5A 0%,transparent 70%),
    radial-gradient(ellipse 220px 70px at 55% 100%,#3D5C4A 0%,transparent 70%),
    radial-gradient(ellipse 200px 65px at 92% 100%,#2F4A3A 0%,transparent 70%);
  opacity:.55;
}
.auth-scene-bridge{position:absolute;left:0;right:0;bottom:34px;height:56px}
.auth-scene-city{
  position:absolute;left:0;right:0;bottom:34px;height:38px;
  background:
    linear-gradient(0deg,#2B3B4E 0 100%) 4% 0/3% 60% no-repeat,
    linear-gradient(0deg,#2B3B4E 0 100%) 9% 0/2% 90% no-repeat,
    linear-gradient(0deg,#2B3B4E 0 100%) 14% 0/4% 45% no-repeat,
    linear-gradient(0deg,#31435A 0 100%) 78% 0/3% 70% no-repeat,
    linear-gradient(0deg,#31435A 0 100%) 84% 0/2.5% 100% no-repeat,
    linear-gradient(0deg,#31435A 0 100%) 90% 0/3.5% 50% no-repeat;
  opacity:.85;
}
.auth-scene-capulana{
  position:absolute;left:0;right:0;bottom:0;height:34px;
  background:repeating-linear-gradient(115deg,
    #00E043 0 10%, #00B837 10% 20%, #F59E0B 20% 30%,
    #1E2D4A 30% 40%, #00E043 40% 50%, #F59E0B 50% 60%,
    #00B837 60% 70%, #1E2D4A 70% 80%, #F59E0B 80% 90%, #00E043 90% 100%);
}
.auth-scene-capulana::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(0,0,0,0) 0 8px,rgba(0,0,0,.08) 8px 9px);
}

@media(max-width:380px){
  .auth-logo-mark{width:64px;height:64px;border-radius:18px}
  .auth-scene{height:150px}
}
</style>
</head>
<body style="margin:0;padding:0" data-guest-only="1">

<div class="auth-page">

  <div class="auth-topbar">
    <a href="index.html" class="auth-back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar ao início
    </a>
    <button type="button" class="auth-lang" id="lang-btn" aria-expanded="false">
      Português
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>

  <div class="auth-main">
    <div class="auth-card-v3">

      <div class="auth-logo">
        <div class="auth-logo-mark">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
            <path d="M8 8V6.5a4 4 0 0 1 8 0V8" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
            <path d="M5.2 8h13.6l1 12.2a2 2 0 0 1-2 2.1H6.2a2 2 0 0 1-2-2.1L5.2 8z" fill="#fff" fill-opacity=".95"/>
          </svg>
        </div>
        <div class="auth-logo-name">BAZ<span>ARES</span></div>
        <div class="auth-logo-tag">Marketplace Moçambicano</div>
      </div>

      <div class="auth-welcome">
        <h1>Bem-vindo de volta! <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M6 13.5V11a2 2 0 0 0-4 0c0 4 2 9 8 9h1c4.5 0 7-2.5 7-7v-3"/></svg></h1>
        <p>Faça login para continuar a sua jornada</p>
      </div>

      <div id="login-alert"></div>

      <div class="af-field">
        <div class="af-inp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" id="lem" placeholder="Email" autocomplete="username" required>

      </div>

      <div class="af-field">
        <div class="af-inp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

        <a href="forgot-password.html" class="af-forgot">Esqueceu a senha?</a>
      </div>

      <button class="af-submit" id="login-btn" type="button">Entrar</button>

      <div class="af-divider">ou continue com</div>

      <div class="af-social">
        <button type="button" id="btn-google">
          <svg width="15" height="15" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button type="button" id="btn-facebook">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
        <button type="button" id="btn-apple">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 2c1.89 0 3.627.63 5.03 1.68L4.68 17.03A7.965 7.965 0 0 1 4 12c0-4.418 3.582-8 8-8zm0 16c-1.89 0-3.627-.63-5.03-1.68l12.35-12.35A7.965 7.965 0 0 1 20 12c0 4.418-3.582 8-8 8z"/></svg>
          Apple
        </button>
      </div>

      <!-- Contentor invisível onde o Google Identity Services renderiza o
           seu próprio botão (necessário porque o clique tem de vir de um
           elemento controlado pelo SDK do Google, por razões de segurança
           anti-clickjacking). Escondemo-lo e simulamos o clique a partir
           do nosso botão "Google" acima, para manter o visual da app. -->
      <div id="g_id_hidden_btn" style="position:absolute;opacity:0;pointer-events:none;top:-9999px;"></div>

      <p class="af-foot">Ainda não tem uma conta? <a href="register.html">Criar conta</a></p>

    </div>

<script src="/js/config.js?v=1788700000"></script><script src="/js/seo.js?v=1788700000"></script><script src="/js/action-queue.js?v=1788700000"></script><script src="/js/api.js?v=1788700000"></script>
  <script src="/js/core.js?v=1788700000"></script><script src="/js/runtime.js?v=1788700000"></script>
  <script src="/js/offline-store.js?v=1788700000"></script>
  <script src="/js/virtual-feed.js?v=1788700000"></script><script src="/js/app.js?v=1788700000"></script><script src="/js/mentions.js?v=1788700000"></script><script src="/js/install-prompt.js?v=1788700000"></script><script src="/js/push-notifications.js?v=1788700000"></script>
<script>
initPage({ active:'login.html', guestOnly:true, onReady: (user) => {
  if (user) { go('home.html'); return; }

  // Pre-fill email from register flow
  const preEmail = getParam('email');
  if (preEmail) document.getElementById('lem').value = preEmail;

  // Password toggle
  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw  = document.getElementById('lpw');
    const ico = document.getElementById('eye-icon');
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    ico.innerHTML = show
      ? '<path d="M17.4 17.4A10.6 10.6 0 0 1 12 19c-7 0-11-7-11-7a19.4 19.4 0 0 1 4.6-5.4M9.9 4.2A10 10 0 0 1 12 4c7 0 11 7 11 7a19.2 19.2 0 0 1-2 2.9M14.1 14.1a3 3 0 1 1-4.2-4.2"/><line x1="2" y1="2" x2="22" y2="22"/>'
      : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="2.5"/>';
  });

  // Language selector (decorativo — só PT disponível por agora)
  document.getElementById('lang-btn').addEventListener('click', function() {
    toast('Por agora só está disponível em Português.', 'info');
  });

  // Login handler
  const doLogin = async () => {
    const email    = document.getElementById('lem').value.trim();
    const password = document.getElementById('lpw').value;
    const alertBox = document.getElementById('login-alert');
    alertBox.innerHTML = '';

    if (!email || !password) {
      alertBox.innerHTML = '<div class="af-alert af-alert-err"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Preencha o email e a senha.</div>';
      return;
    }

    const btn = document.getElementById('login-btn');
    setLoading(btn, true);
    try {
      await Session.login(email, password);
      alertBox.innerHTML = '<div class="af-alert af-alert-ok"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Bem-vindo de volta! A redirecionar…</div>';
      const next = getParam('next');
      setTimeout(() => window.location.href = next || 'home.html', 700);
    } catch (err) {
      setLoading(btn, false);
      const msg = err.code === 'EMAIL_NOT_VERIFIED'
        ? 'Credenciais inválidas ou conta não activa.'
        : apiErrorMessage(err);
      alertBox.innerHTML = `<div class="af-alert af-alert-err"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ${msg}</div>`;
      document.getElementById('lem').focus();
    }
  };

  document.getElementById('login-btn').addEventListener('click', doLogin);

  // Allow Enter key in both fields
  ['lem','lpw'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });

  // ── Login social ──────────────────────────────────────────────
  const goAfterLogin = () => {
    const next = getParam('next');
    window.location.href = next || 'home.html';
  };

  const socialFail = (msg) => {
    document.getElementById('login-alert').innerHTML = `<div class="af-alert af-alert-err"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ${msg}</div>`;
  };

  // ── Google ───────────────────────────────────────────────────
  document.getElementById('btn-google').addEventListener('click', () => {
    if (!window.GOOGLE_CLIENT_ID) {
      toast('Login com Google ainda não foi configurado.', 'info');
      return;
    }
    if (!window.google?.accounts?.id) {
      toast('A carregar o Google, tente novamente em instantes.', 'info');
      return;
    }
    google.accounts.id.initialize({
      client_id: window.GOOGLE_CLIENT_ID,
      callback: async (response) => {
        try {
          await Session.socialLogin('google', { idToken: response.credential });
          goAfterLogin();
        } catch (err) {
          socialFail(apiErrorMessage(err));
        }
      }
    });
    // Renderiza o botão real do Google no contentor escondido e simula
    // o clique — é assim que o Google exige que o fluxo seja disparado.
    const hidden = document.getElementById('g_id_hidden_btn');
    hidden.innerHTML = '';
    google.accounts.id.renderButton(hidden, { type: 'standard' });
    setTimeout(() => hidden.querySelector('div[role="button"]')?.click(), 50);
  });

  // ── Facebook ─────────────────────────────────────────────────
  let fbReady = null;
  const loadFacebookSdk = () => {
    if (fbReady) return fbReady;
    fbReady = new Promise((resolve) => {
      window.fbAsyncInit = () => {
        FB.init({ appId: window.FACEBOOK_APP_ID, cookie: false, xfbml: false, version: 'v20.0' });
        resolve();
      };
      const s = document.createElement('script');
      s.src = 'https://connect.facebook.net/pt_PT/sdk.js';
      s.async = true;
      s.defer = true;
      document.body.appendChild(s);
    });
    return fbReady;
  };

  document.getElementById('btn-facebook').addEventListener('click', async () => {
    if (!window.FACEBOOK_APP_ID) {
      toast('Login com Facebook ainda não foi configurado.', 'info');
      return;
    }
    await loadFacebookSdk();
    FB.login((loginResp) => {
      if (loginResp.authResponse?.accessToken) {
        Session.socialLogin('facebook', { accessToken: loginResp.authResponse.accessToken })
          .then(goAfterLogin)
          .catch((err) => socialFail(apiErrorMessage(err)));
      } else {
        toast('Login com Facebook cancelado.', 'info');
      }
    }, { scope: 'public_profile,email' });
  });

  // ── Apple ────────────────────────────────────────────────────
  document.getElementById('btn-apple').addEventListener('click', async () => {
    if (!window.APPLE_CLIENT_ID) {
      toast('Login com Apple ainda não está disponível.', 'info');
      return;
    }
    if (!window.AppleID) {
      toast('A carregar a Apple, tente novamente em instantes.', 'info');
      return;
    }
    try {
      AppleID.auth.init({
        clientId: window.APPLE_CLIENT_ID,
        scope: 'name email',
        redirectURI: window.location.origin + '/login.html',
        usePopup: true
      });
      const data = await AppleID.auth.signIn();
      const fullName = data.user?.name
        ? `${data.user.name.firstName || ''} ${data.user.name.lastName || ''}`.trim()
        : undefined;
      await Session.socialLogin('apple', { identityToken: data.authorization.id_token, name: fullName });
      goAfterLogin();
    } catch (err) {
      if (err?.error === 'popup_closed_by_user') return;
      socialFail(apiErrorMessage(err));
    }
  });
}});
</script>
