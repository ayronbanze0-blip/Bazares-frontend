<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<base href="/">
<script>(function(){try{if(localStorage.getItem('bz_premium_hint')==='1'){document.documentElement.setAttribute('data-premium','true');}}catch(e){}})();</script>

<!-- O cabeçalho ".mf-hero" (avatar+nome+estatísticas+botões) é partilhado
     com bazar.html via css/style.css, para que "Ver como visitante"
     mostre exactamente o mesmo layout que qualquer visitante vê. -->
</head>
<body data-require-auth="1" data-roles="SELLER">
<header id="topbar"></header><div class="overlay" id="overlay"></div><aside id="sidebar" class="closed"></aside>
<main id="main"><div id="view" class="pg-body"></div></main>
<div id="modal-root"></div><div id="toast-root"></div>
<script src="/js/config.js?v=1788740000"></script><script src="/js/seo.js?v=1788700000"></script><script src="/js/action-queue.js?v=1788700000"></script><script src="/js/api.js?v=1788740000"></script><script src="/js/analytics.js?v=1788730000"></script>
  <script src="/js/core.js?v=1788740000"></script><script src="/js/runtime.js?v=1788700000"></script>
  <script src="/js/offline-store.js?v=1788700000"></script>
  <script src="/js/virtual-feed.js?v=1788700000"></script><script src="/js/spa-router.js?v=1788720000"></script><script>BazaresRouter.register(["admin-broadcast.html","admin-denuncias.html","admin-finance.html","admin-logs.html","admin-monitoring.html","admin-orders.html","admin-premium.html","admin-products.html","admin-reports.html","admin-users.html","admin-wallet.html","admin.html","anuncio.html","anuncios.html","bazar.html","bazars.html","cart.html","category.html","chat.html","checkout.html","dashboard.html","explorar.html","favorites.html","finance.html","forgot-password.html","historia.html","home.html","index.html","login.html","meufeed.html","my-bazar.html","my-orders.html","my-products.html","newreels.html","notifications.html","novoproduto.html","order-detail.html","premium.html","privacy.html","product.html","products.html","profile.html","ranking.html","reels.html","referrals.html","refund-policy.html","register.html","search.html","seller-guidelines.html","settings.html","support.html","terms.html","verify-email.html","wallet-history.html","wallet.html"]);</script><script src="/js/app.js?v=1788700000"></script><script src="/js/mentions.js?v=1788700000"></script><script src="/js/install-prompt.js?v=1788700000"></script><script src="/js/push-notifications.js?v=1788700000"></script>
<script>
let _mfBazar = null;
let _mfUser = null;
let _mfTab = 'produtos'; // 'produtos' | 'anuncios' | 'reels' | 'sobre'

initPage({ active:'meufeed.html', requireAuth:true, roles:['SELLER'], onReady: async(user) => {
  const view = document.getElementById('view');
  view.innerHTML = `<div style="text-align:center;padding:60px"><span class="spinner spinner-dark"></span></div>`;

  let bazar = null;
  try{ bazar = (await api.get('/bazars/me'))?.data?.bazar || null; }catch{}
  if(!bazar){
    view.innerHTML = `<div class="card" style="text-align:center;padding:36px;margin:16px">
      <h3 style="margin-bottom:8px">Ainda sem Bazar</h3>
      <p style="margin-bottom:20px">Cria o teu Bazar para teres o teu feed — os teus reels, posts e produtos, tudo num só sítio.</p>
      <button class="btn btn-primary" onclick="go('my-bazar.html')">Criar o meu Bazar</button>
    </div>`;
    return;
  }
  _mfBazar = bazar;
  _mfUser = user;
  window._myBazarId = bazar.id;

  const isPremiumSeller = !!user?.isPremium;
  view.innerHTML = `
    <div class="mf-hero">
      <div class="mf-hero-avatar" ${bazarLogo(bazar)?`onclick="openImageLightbox('${esc(bazarLogo(bazar))}')" style="cursor:pointer"`:''}>${storeAvatar(bazar.name, 74, bazarLogo(bazar))}</div>
      <div class="mf-hero-name">${esc(bazar.name)}
        ${isPremiumSeller?`<span title="Loja Premium"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="15" height="15"><path d="M12 2l2.4 1.2 2.6-.6 1.4 2.3 2.5.9-.2 2.7 1.7 2.1-1.7 2.1.2 2.7-2.5.9-1.4 2.3-2.6-.6L12 22l-2.4-1.2-2.6.6-1.4-2.3-2.5-.9.2-2.7L1.6 13.6l1.7-2.1-.2-2.7 2.5-.9 1.4-2.3 2.6.6z"/><path d="M9 12.5l2 2 4-4.5" stroke="#00B837" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`:''}
      </div>
      <div class="mf-hero-sub">${esc(bazar.category||'')}${bazar.location?' · '+esc(bazar.location):''}</div>
      <div class="mf-hero-stats">
        <div class="mf-hero-stat"><b>${user?.ratingCount?user.rating.toFixed(1):'Novo'}</b><span>Avaliações</span></div>
        <div class="mf-hero-stat"><b id="mf-stat-followers">${bazar.followerCount||0}</b><span>Seguidores</span></div>
        <div class="mf-hero-stat"><b id="mf-stat-products">0</b><span>Produtos</span></div>
      </div>
      <div class="mf-hero-btns">
        <button class="btn btn-sm" style="background:#fff;color:var(--b-700);border:none" onclick="go('my-bazar.html')">${icon('settings',15,2)} Editar Bazar</button>
        <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="go('bazar.html',{id:'${escJsAttr(bazar.slug||bazar.id)}'})">${icon('eye',15,2)} Ver como visitante</button>
      </div>
    </div>

    <div class="mf-tabs">
      <button class="mf-tab active" id="mf-tab-produtos" onclick="mfSetTab('produtos')">${icon('box',15,2)} Produtos</button>
      <button class="mf-tab" id="mf-tab-anuncios" onclick="mfSetTab('anuncios')">${icon('megaphone',15,2)} Posts</button>
      <button class="mf-tab" id="mf-tab-reels" onclick="mfSetTab('reels')">${icon('video',15,2)} Reels</button>
      <button class="mf-tab" id="mf-tab-sobre" onclick="mfSetTab('sobre')">${icon('user',15,2)} Sobre</button>
    </div>

    <div id="mf-produtos" class="ig-grid"></div>
    <div id="mf-anuncios" style="display:none;flex-direction:column;gap:16px;max-width:560px;margin:0 auto"></div>
    <div id="mf-reels" class="ig-grid" style="display:none"></div>
    <div id="mf-sobre" style="display:none"></div>

    <button class="pp-fab" style="position:fixed;top:auto;right:18px;bottom:calc(38px + env(safe-area-inset-bottom));font-size:26px;font-weight:700;line-height:1" onclick="openCreateSheet()" aria-label="Publicar">+</button>
  `;

  document.getElementById('mf-anuncios').addEventListener('scroll', Bazares.Utils.throttle(onCarouselScroll, 80), true);
  view.addEventListener('click', _saveMfState, true);
  const savedMf = getListState('meufeed');
  await mfLoadProdutos();
  if(savedMf && savedMf.tab && savedMf.tab!=='produtos'){
    mfSetTab(savedMf.tab);
  }
  if(savedMf) restoreScrollY(savedMf.scrollY);
}});

// ─── Memória de listagem (voltar sem perder separador/scroll) ──────
function _saveMfState(){
  saveListState('meufeed',{tab:_mfTab, scrollY:window.scrollY});
}

function mfSetTab(tab){
  _mfTab = tab;
  ['produtos','anuncios','reels','sobre'].forEach(t=>{
    document.getElementById(`mf-tab-${t}`).classList.toggle('active', t===tab);
    const panel = document.getElementById(`mf-${t}`);
    panel.style.display = t===tab ? (t==='anuncios'||t==='sobre'?'flex':'grid') : 'none';
    if(t==='sobre') panel.style.flexDirection = 'column';
  });
  if(tab==='produtos' && !document.getElementById('mf-produtos').dataset.loaded) mfLoadProdutos();
  if(tab==='anuncios' && !document.getElementById('mf-anuncios').dataset.loaded) mfLoadAnuncios();
  if(tab==='reels' && !document.getElementById('mf-reels').dataset.loaded) mfLoadReels();
  if(tab==='sobre' && !document.getElementById('mf-sobre').dataset.loaded) mfRenderSobre();
}

function mfRenderSobre(){
  const panel = document.getElementById('mf-sobre');
  panel.dataset.loaded = '1';
  const b = _mfBazar;
  panel.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <h4 style="margin-bottom:10px">${icon('clipboard',16)} Descrição</h4>
      <p style="font-size:13.5px;line-height:1.7;color:var(--t2)">${esc(b.description||b.bio||'Ainda sem descrição — adiciona uma em Editar Bazar.')}</p>
    </div>
    <div class="card">
      <h4 style="margin-bottom:12px">${icon('pin',16)} Informação</h4>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${b.category?infoRow(icon('grid',15),'Categoria',b.category):''}
        ${b.location?infoRow(icon('pin',15),'Localização',b.location):''}
        ${b.phone?infoRow(icon('chat',15),'Telefone',b.phone):''}
        ${infoRow(icon('clock',15),'No Bazares desde',fmtDate(b.createdAt))}
      </div>
    </div>`;
}
function infoRow(ico,lbl,val){
  return `<div style="display:flex;align-items:center;gap:12px;padding:11px;background:var(--surf3);border-radius:var(--r);border:1px solid var(--brd)">
    <span style="width:32px;height:32px;border-radius:9px;background:var(--b-50);color:var(--b-600);display:flex;align-items:center;justify-content:center;flex-shrink:0">${ico}</span>
    <div><div style="font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-weight:700">${lbl}</div><div style="font-weight:700;font-size:13px;color:var(--text)">${esc(val||'Não indicado')}</div></div>
  </div>`;
}

// ─── Reels (vídeo ou foto) ─────────────────────────────────────────
async function mfLoadReels(){
  const grid = document.getElementById('mf-reels');
  grid.dataset.loaded = '1';
  try{
    const r = await api.get(`/bazars/${_mfBazar.id}/reels`, { limit: 60 });
    const reels = r?.data?.reels || [];
    grid.innerHTML = reels.length ? reels.map(mfReelTileHtml).join('') : `
      <div style="grid-column:1/-1;text-align:center;padding:40px 20px">
        <div style="color:var(--t4);margin-bottom:10px">${icon('video',32,1.5)}</div>
        <h3 style="margin-bottom:6px">Ainda sem publicações</h3>
        <p style="color:var(--t4);font-size:13px;margin-bottom:16px">Publica um vídeo ou uma foto — aparece aqui e no feed dos teus seguidores.</p>
        <button class="btn btn-primary btn-sm" onclick="go('newreels.html')">+ Novo Reel</button>
      </div>`;
  }catch(e){ grid.innerHTML = `<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--t4)">${esc(apiErrorMessage(e))}</div>`; }
}
function mfReelTileHtml(rl){
  const isVideo = !!rl.videoUrl;
  const thumb = isVideo
    ? `<video src="${esc(rl.videoUrl)}" muted playsinline preload="metadata"></video>`
    : `<img src="${esc(cldUrl(rl.imageUrl,'w_400,q_auto:good,f_auto,c_fill'))}" alt="" loading="lazy">`;
  // Tocar no cartão agora ABRE o reel (reels.html, com o vídeo/foto real
  // já em primeiro, em vez de depender do feed aleatório com 1000+
  // vídeos); o "..." isolado no canto continua a levar a Editar/Apagar.
  return `<div class="ig-tile" id="feed-REEL-${rl.id}" onclick="go('reels.html',{reel:'${rl.id}',bazar:'${_mfBazar.id}'})">
    ${thumb}
    <button type="button" class="ig-tile-kebab" aria-label="Mais opcoes" onclick="event.stopPropagation();mfOpenReelMenu('${rl.id}')">${icon('more',16,2.4)}</button>
    <span class="ig-tile-kind">${isVideo?icon('video',16,2):icon('image',16,2)}</span>
    ${rl.text?`<div class="ig-tile-caption">${esc(rl.text)}</div>`:''}
  </div>`;
}
function mfOpenReelMenu(reelId){ openFeedKebab('REEL', reelId, _mfBazar.id); }

// ─── Posts (texto + fotos) ──────────────────────────────────────
async function mfLoadAnuncios(){
  const list = document.getElementById('mf-anuncios');
  list.dataset.loaded = '1';
  list.innerHTML = `<div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>`;
  try{
    const r = await api.get(`/bazars/${_mfBazar.id}/announcements`, { limit: 30 });
    const items = r?.data?.announcements || [];
    list.innerHTML = items.length ? items.map(mfAnnouncementCardHtml).join('') : `<div class="empty"><div class="empty-ico">${icon('megaphone',28)}</div><h3>Ainda sem posts</h3><p>Publica o teu primeiro post para apareceres no feed dos teus seguidores.</p><button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="go('anuncio.html')">+ Novo post</button></div>`;
    loadCommentPreviews(items.map(a=>({ targetType:'ANNOUNCEMENT', targetId:a.id, commentCount:a.commentCount||0 })));
  }catch(e){ list.innerHTML = `<div class="empty"><h3>${esc(apiErrorMessage(e))}</h3></div>`; }
}
function mfAnnouncementCardHtml(a){
  const cardId = `feed-ANNOUNCEMENT-${a.id}`;
  const images = a.images?.length ? a.images.map(i=>i.url||i) : (a.imageUrl ? [a.imageUrl] : []);
  const liked = a.myReaction === 1;
  const parsedAnn = parseQuickTags(a.text || '');
  const caption = escWithMentions(parsedAnn.text);
  const captionLong = caption.length > 140;
  return `
  <div class="card feed-card" id="${cardId}" style="padding:0;overflow:hidden">
    <div class="fc-post-header" style="display:flex;align-items:center;gap:10px;padding:12px 14px">
      ${storeAvatar(_mfBazar.name, 34, bazarLogo(_mfBazar))}
      <div style="flex:1;min-width:0">
        <strong style="font-size:13.5px">${esc(_mfBazar.name)}</strong>
        <div style="font-size:11px;color:var(--t4);display:flex;align-items:center;gap:6px;margin-top:2px">
          <span class="fc-type-tag fc-type-tag--post">Post</span>
          <span>${fmtDate(a.createdAt)}</span>
        </div>
      </div>
      <button class="btn-kebab" title="Mais opções" aria-label="Mais opções" onclick="openFeedKebab('ANNOUNCEMENT','${a.id}','${_mfBazar.id}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none" width="18" height="18"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    </div>
    ${quickTagBadgesHtml(parsedAnn.tags)}
    ${images.length?`<div class="fc-carousel" data-heart-host="${cardId}" style="position:relative" ondblclick="doubleTapLike(this,'ANNOUNCEMENT','${a.id}',${liked})">${carouselHtml(images, '', images, cardId)}</div>`:''}
    <div class="fc-caption-block" style="padding:12px 14px 2px">
      <p id="${cardId}-caption" class="fc-caption${captionLong?' truncated':''}" style="font-size:13.5px;color:var(--t2);white-space:pre-wrap;margin:0">${caption}</p>
      ${captionLong?`<button class="fc-caption-more" onclick="toggleCaption(this)">Ver mais</button>`:''}
    </div>
    ${feedReactionBar(cardId, 'ANNOUNCEMENT', a.id, a.myReaction, a.likeCount, a.shareCount, a.commentCount)}
    <div id="${cardId}-preview" style="padding:6px 14px 4px;display:flex;flex-direction:column;gap:3px"></div>
    <div id="${cardId}-comments" style="display:none;padding:0 14px 14px;border-top:1px solid var(--brd)"></div>
  </div>`;
}

// ─── Produtos (publicações com preço/loja) ─────────────────────────
async function mfLoadProdutos(){
  const grid = document.getElementById('mf-produtos');
  grid.dataset.loaded = '1';
  try{
    const r = await api.get('/products/mine', { limit: 60 });
    const products = r?.data?.products || [];
    const countEl = document.getElementById('mf-stat-products');
    if(countEl) countEl.textContent = r?.data?.total ?? products.length;
    grid.innerHTML = products.length ? products.map(mfProductTileHtml).join('') : `
      <div style="grid-column:1/-1;text-align:center;padding:40px 20px">
        <div style="color:var(--t4);margin-bottom:10px">${icon('box',32,1.5)}</div>
        <h3 style="margin-bottom:6px">Ainda sem produtos</h3>
        <p style="color:var(--t4);font-size:13px;margin-bottom:16px">Publica o teu primeiro produto para começares a vender.</p>
        <button class="btn btn-primary btn-sm" onclick="go('novoproduto.html')">+ Novo produto</button>
      </div>`;
  }catch(e){ grid.innerHTML = `<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--t4)">${esc(apiErrorMessage(e))}</div>`; }
}
function mfProductTileHtml(p){
  const img = p.images?.[0]?.url;
  return `<div class="ig-tile" onclick="go('product.html',{id:'${escJsAttr(p.slug || p.id)}'})">
    ${img?`<img src="${esc(cldUrl(img,'w_400,q_auto:good,f_auto,c_fill'))}" alt="${esc(p.name)}" loading="lazy">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--t4)">${icon('image',26,1.5)}</div>`}
    <button type="button" class="ig-tile-kebab" onclick="event.stopPropagation();openFeedKebab('PRODUCT','${p.id}','${_mfBazar.id}')" aria-label="Mais opções"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="14" height="14"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    <div class="ig-tile-caption">${esc(p.name)} · ${fmtMT(p.price)}</div>
  </div>`;
}
</script>
</body>
</html>
