<script>
let _cartItems=[];
initPage({ active:'cart.html', requireAuth:true, roles:['BUYER'], onReady: async()=>{
  document.getElementById('view').innerHTML=`
    <div class="pg-hero">
      <div class="pg-hero-content">
        <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Carrinho</div>
        <h1>O meu carrinho</h1>
      </div>
    </div>
    <div id="cart-body"></div>`;
  await loadCart();
}});

async function loadCart(){
  const body=document.getElementById('cart-body');
  body.innerHTML=`<div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>`;
  try{
    const res=await api.get('/cart');
    _cartItems=res?.data?.items||[];
    if(!_cartItems.length){
      document.getElementById('sticky-cta-mount')?.remove();
      document.body.classList.remove('has-sticky-cta');
      body.innerHTML=`<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div><h3>Carrinho vazio</h3><p>Explore os nossos produtos e adicione ao carrinho</p><button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="go('products.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Explorar produtos</button></div>`;
      return;
    }
    const total=_cartItems.reduce((s,i)=>s+(i.price||i.product?.price||0)*i.qty,0);
    body.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start" id="cart-grid" class="reveal">
        <div style="display:flex;flex-direction:column;gap:10px" id="cart-items">
          ${_cartItems.map(i=>cartItemHtml(i)).join('')}
        </div>
        <div class="cart-summary" style="position:sticky;top:80px">
          <h3 style="margin-bottom:18px">Resumo</h3>
          <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
            ${_cartItems.map(i=>`<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--t2)">${esc(i.name||i.product?.name||'')} ×${i.qty}</span><span style="font-weight:600">${fmtMT((i.price||i.product?.price||0)*i.qty)}</span></div>`).join('')}
          </div>
          <div class="divider"></div>
          <div style="display:flex;justify-content:space-between;margin:14px 0">
            <span style="font-weight:700">Total</span>
            <span style="font-family:'Inter',sans-serif;font-weight:800;font-size:20px;font-weight:900;color:var(--b-600)">${fmtMT(total)}</span>
          </div>
          <button class="btn btn-primary btn-block" style="font-size:14px;padding:13px" onclick="go('checkout.html')" id="cart-checkout-btn"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Finalizar compra</button>
          <button class="btn btn-ghost btn-block btn-sm" style="margin-top:8px" onclick="go('products.html')">Continuar a comprar</button>
          <div class="pay-badges" style="margin-top:14px;justify-content:center">
            <span class="pay-badge"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg> M-Pesa</span>
            <span class="pay-badge"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg> e-Mola</span>
            <span class="pay-badge"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Na entrega</span>
          </div>
        </div>
      </div>`;
    // Barra fixa em mobile — total e "Finalizar compra" sempre visíveis.
    document.getElementById('sticky-cta-mount')?.remove();
    document.body.classList.add('has-sticky-cta');
    document.body.insertAdjacentHTML('beforeend', `<div class="sticky-cta" id="sticky-cta-mount">
      <div class="sc-total"><span>Total</span><b>${fmtMT(total)}</b></div>
      <button class="btn btn-primary" onclick="go('checkout.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Finalizar compra</button>
    </div>`);
    // responsive
    if(window.innerWidth<700) document.getElementById('cart-grid').style.gridTemplateColumns='1fr';
  }catch(e){
    document.getElementById('sticky-cta-mount')?.remove();
    document.body.classList.remove('has-sticky-cta');
    body.innerHTML=`<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;}
}

function cartItemHtml(i){
  const img=i.image||i.product?.images?.[0]?.url||'';
  return `<div class="cart-item" id="ci-${i.id}">
    <div class="cart-img">${img?`<img loading="lazy" decoding="async" src="${esc(img)}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<div style="width:100%;height:100%;background:var(--g-100);display:flex;align-items:center;justify-content:center;font-size:24px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>`}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:14px;margin-bottom:2px">${esc(i.name||i.product?.name||'')}</div>
      <div style="font-size:12px;color:var(--t4)">${fmtMT(i.price||i.product?.price||0)} / un.</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-icon" style="width:28px;height:28px;border-radius:8px;font-size:14px" onclick="updateQty('${i.id}',${i.qty-1})">−</button>
      <span style="font-weight:700;min-width:20px;text-align:center">${i.qty}</span>
      <button class="btn-icon" style="width:28px;height:28px;border-radius:8px;font-size:14px" onclick="updateQty('${i.id}',${i.qty+1})">+</button>
    </div>
    <div style="font-family:'Inter',sans-serif;font-weight:800;font-weight:800;font-size:16px;color:var(--b-600);min-width:80px;text-align:right">${fmtMT((i.price||i.product?.price||0)*i.qty)}</div>
    <button class="btn-icon" style="color:var(--red)" onclick="removeItem('${i.id}')" aria-label="Remover do carrinho"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
  </div>`;
}

async function updateQty(itemId,qty){
  if(qty<=0){await removeItem(itemId);return;}
  try{await api.patch(`/cart/items/${itemId}`,{qty});await refreshCartCount();await loadCart();}
  catch(e){toast(apiErrorMessage(e),'err');}
}
async function removeItem(itemId){
  const row = document.getElementById(`ci-${itemId}`);
  if (!row) { try{await api.delete(`/cart/items/${itemId}`);await refreshCartCount();await loadCart();}catch(e){toast(apiErrorMessage(e),'err');} return; }

  const snapshot = row.outerHTML;
  const placeholder = document.createComment(`ci-placeholder-${itemId}`);
  row.replaceWith(placeholder);
  refreshCartCount();

  Bazares.Undo.perform({
    message: 'Item removido do carrinho.',
    onUndo: () => {
      placeholder.replaceWith(document.createRange().createContextualFragment(snapshot));
      refreshCartCount();
    },
    onCommit: async () => {
      placeholder.remove();
      await api.delete(`/cart/items/${itemId}`);
      await refreshCartCount();
      // se o carrinho ficou vazio, mostra o estado vazio em vez de deixar o ecrã em branco
      if (!document.querySelector('.cart-item')) loadCart();
    }
  });
}
</script></body></html>
