<script>
let _monHours = 24;

initPage({ active: 'admin-monitoring.html', requireAuth: true, roles: ['ADMIN'], onReady: async () => {
  loadMonitoring();
}});

function setMonHours(h) {
  _monHours = h;
  document.querySelectorAll('[data-hours]').forEach(b => b.classList.toggle('btn-primary', Number(b.dataset.hours) === h));
  document.querySelectorAll('[data-hours]').forEach(b => b.classList.toggle('btn-ghost', Number(b.dataset.hours) !== h));
  loadMonitoring();
}

async function loadMonitoring() {
  const summaryEl = document.getElementById('mon-summary');
  const routesEl = document.getElementById('mon-routes');
  routesEl.innerHTML = `<div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>`;
  try {
    const [summaryRes, routesRes] = await Promise.all([
      api.get('/analytics/summary'),
      api.get('/analytics/routes-health', { hours: _monHours })
    ]);

    const totals = summaryRes?.data?.totals || [];
    const byEvent = Object.fromEntries(totals.map(t => [t.event, t.count]));
    const cards = [
      { label: 'Erros no cliente', value: byEvent.client_error || 0, icon: 'alert' },
      { label: 'Chamadas à API falhadas', value: byEvent.api_error || 0, icon: 'alert' },
      { label: 'Chamadas lentas (>3s)', value: byEvent.api_slow || 0, icon: 'clock' },
      { label: 'Visitas registadas', value: byEvent.page_view || 0, icon: 'eye' }
    ];
    summaryEl.innerHTML = cards.map(c => `<div class="card" style="text-align:center;padding:16px">
      <div style="font-size:24px;font-weight:800;color:var(--n-900)">${c.value.toLocaleString('pt-PT')}</div>
      <div style="font-size:12px;color:var(--t3);margin-top:4px">${c.label}</div>
    </div>`).join('');

    const routes = routesRes?.data?.routes || [];
    if (!routes.length) {
      routesEl.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><h3>Sem falhas nem lentidão no período — tudo saudável.</h3></div>`;
      return;
    }
    routesEl.innerHTML = `<div class="tbl-wrap"><table><thead><tr>
        <th>Rota</th><th>Tipo</th><th>Ocorrências</th><th>Utilizadores</th><th>Duração média</th>
      </tr></thead><tbody>
      ${routes.map(r => `<tr>
        <td style="font-size:12.5px"><span class="badge b-gray" style="margin-right:4px">${esc(r.method || '—')}</span>${esc(r.path || '—')}</td>
        <td>${r.event === 'api_error' ? '<span class="badge b-red">Falha</span>' : '<span class="badge b-amb">Lenta</span>'}</td>
        <td style="font-weight:700">${r.count}</td>
        <td>${r.affected_users}</td>
        <td style="font-size:12px;color:var(--t3)">${r.avg_duration_ms != null ? r.avg_duration_ms + 'ms' : '—'}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
  } catch (e) {
    routesEl.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
    summaryEl.innerHTML = '';
  }
}
</script>
