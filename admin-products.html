<script>
initPage({ active: 'admin-products.html', requireAuth: true, roles: ['ADMIN'], onReady: () => loadAdminProducts(1) });

async function loadAdminProducts(page = 1) {
  _apPage = page;
  const list = document.getElementById('ap-list');
  try {
    const res = await api.get('/admin/products', { page, limit: 30 });
    const products = res?.data?.products || [];
    const meta = res?.data?.meta || {};
    document.getElementById('ap-title').textContent = `Produtos (${meta.total ?? products.length})`;
    if (!products.length) {
      list.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div><h3>Sem produtos</h3></div>`;
      document.getElementById('ap-pagination').innerHTML = '';
      return;
    }
    list.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Produto</th><th>Bazar</th><th>Categoria</th><th>Preço</th><th>Stock</th><th>Vendas</th><th>Views</th><th>Destaque</th><th>Estado</th><th>Acções</th></tr></thead><tbody>
      ${products.map(p => `<tr>
        <td><strong>${esc(p.name)}</strong></td>
        <td style="font-size:12px">${esc(p.bazar?.name||'')}</td>
        <td style="font-size:12px;color:var(--t3)">${esc(p.category)}</td>
        <td style="font-weight:700">${fmtMT(p.price)}</td>
        <td>${p.stock}</td>
        <td>${p.sales||0}</td>
        <td style="color:var(--t4);font-size:12px">${p.views||0}</td>
        <td><button class="btn btn-xs ${p.featured?'btn-gold':'btn-ghost'}" onclick="toggleFeaturedProduct('${p.id}')" title="${p.featured?'Remover destaque':'Destacar produto'}">${p.featured?'<svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Destacado':'<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Destacar'}</button></td>
        <td><span class="badge ${p.active?'b-grn':'b-gray'}">${p.active?'Activo':'Removido'}</span></td>
        <td style="white-space:nowrap"><button class="btn btn-ghost btn-xs" onclick="confirmToggleAdminProduct('${p.id}',${p.active?'true':'false'})">${p.active?'Remover':'Restaurar'}</button></td>
      </tr>`).join('')}
    </tbody></table></div>`;
    renderPagination('ap-pagination', meta, loadAdminProducts);
  } catch (e) {
    list.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}

async function toggleFeaturedProduct(id) {
  try {
    const res = await api.patch(`/admin/products/${id}/featured`);
    toast(res?.data?.featured ? '<svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Produto em destaque!' : 'Destaque removido.', res?.data?.featured ? 'ok' : 'info');
    loadAdminProducts(_apPage);
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

let _apPage = 1;

function confirmToggleAdminProduct(id, isActive) {
  // Só pede confirmação para a acção destrutiva (remover); restaurar é seguro e reversível de imediato.
  if (!isActive) return toggleAdminProduct(id);
  openModal(`
    <div class="modal-hd"><h3>Remover produto</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <p style="margin-bottom:20px">Tem a certeza que quer remover este produto da plataforma? Deixa de aparecer para compradores até ser restaurado.</p>
    <div style="display:flex;gap:9px">
      <button class="btn btn-danger" style="flex:1" onclick="closeModal();toggleAdminProduct('${id}')">Remover</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
}

async function toggleAdminProduct(id) {
  try {
    const res = await api.patch(`/admin/products/${id}/toggle`);
    toast(`Produto ${res?.data?.active ? 'restaurado' : 'removido'}.`);
    loadAdminProducts(_apPage);
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}
</script>
