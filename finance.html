<body data-require-auth="1" data-roles="SELLER">
<header id="topbar"></header><div class="overlay" id="overlay"></div><aside id="sidebar" class="closed"></aside>
<main id="main"><div id="view" class="pg-body"></div></main>
<div id="modal-root"></div><div id="toast-root"></div>
<script src="/js/config.js?v=1788700000"></script><script src="/js/seo.js?v=1788700000"></script><script src="/js/action-queue.js?v=1788700000"></script><script src="/js/api.js?v=1788700000"></script>
  <script src="/js/core.js?v=1788700000"></script><script src="/js/runtime.js?v=1788700000"></script>
  <script src="/js/offline-store.js?v=1788700000"></script>
  <script src="/js/virtual-feed.js?v=1788700000"></script><script src="/js/app.js?v=1788700000"></script><script src="/js/mentions.js?v=1788700000"></script><script src="/js/install-prompt.js?v=1788700000"></script><script src="/js/push-notifications.js?v=1788700000"></script>
<script>
initPage({ active:'finance.html', requireAuth:true, roles:['SELLER'], onReady: async()=>{
  const view=document.getElementById('view');
  view.innerHTML=`<div style="text-align:center;padding:60px"><span class="spinner spinner-dark"></span></div>`;
  let bazar=null, orders=[], payments=[];
  try{ bazar=(await api.get('/bazars/me'))?.data?.bazar; } catch{}
  try{ orders=(await api.get('/orders/received',{limit:200,status:'ENTREGUE'}))?.data?.orders||[]; } catch{}
  try{ payments=(await api.get('/finance/payments'))?.data?.payments||[]; } catch{}

  const FEE=150;
  const pf=bazar?.pendingFees||0;
  const totalRev=orders.reduce((s,o)=>s+o.total,0);
  const totalPaid=payments.filter(p=>p.status==='APROVADO').reduce((s,p)=>s+p.amount,0);
  const pct=Math.min(100,Math.round((pf/FEE)*100));

  view.innerHTML=`
    <div class="pg-hero">
      <div class="pg-hero-content">
        <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2"/><circle cx="12" cy="13.5" r="2.5"/></svg> Financeiro</div>
        <h1>Painel Financeiro</h1>
        <p>Acompanhe as suas receitas e contribuições</p>
      </div>
    </div>
    ${pf>=FEE?`<div class="alert a-err" style="margin-bottom:18px"><span><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span><div>Contribuição de <strong>${fmtMT(pf)}</strong> atingida! <a href="wallet.html" style="font-weight:700;color:var(--red);text-decoration:underline">Pague agora na sua Carteira <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a></div></div>`:''}
    <div class="stats-row reveal">
      <div class="stat acc"><div class="stat-accent-bar" style="background:var(--g-gold)"></div><div class="val">${fmtMT(totalRev)}</div><div class="lbl">Receita total</div></div>
      <div class="stat"><div class="stat-accent-bar" style="background:var(--g-green)"></div><div class="val">${orders.length}</div><div class="lbl">Encomendas entregues</div></div>
      <div class="stat"><div class="stat-accent-bar" style="background:var(--a-500)"></div><div class="val" style="color:var(--a-600)">${fmtMT(pf)}</div><div class="lbl">Contribuição acumulada</div></div>
      <div class="stat"><div class="stat-accent-bar" style="background:var(--b-500)"></div><div class="val">${fmtMT(totalPaid)}</div><div class="lbl">Total pago</div></div>
    </div>
    <div class="widget-grid reveal" style="margin-bottom:24px">
      <div class="fin-progress-card">
        <div class="fin-progress-head">
          <h3 style="margin:0">Contribuição de plataforma</h3>
          <span style="font-weight:700;color:${pct>=100?'var(--red)':pct>=70?'var(--amb)':'var(--b-500)'}">${fmtMT(pf)} / ${fmtMT(FEE)}</span>
        </div>
        <div class="prog" style="height:12px;margin-bottom:8px">
          <div class="prog-fill ${pct>=100?'pf-red':pct>=70?'pf-gold':'pf-grn'}" style="width:${pct}%"></div>
        </div>
        <p style="font-size:12px;color:var(--t3)">A cada ${fmtMT(FEE)} de vendas efectuadas, é solicitado o pagamento de uma contribuição de plataforma.</p>
        ${pf>0?`<a href="wallet.html" class="btn btn-primary btn-sm btn-block" style="margin-top:12px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Pagar contribuição na Carteira</a>`:''}
      </div>
      <div class="card">
        <h4 style="margin-bottom:16px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Resumo mensal</h4>
        ${orders.length?(()=>{
          const byMonth = Object.entries(orders.reduce((acc,o)=>{const m=new Date(o.createdAt).toLocaleDateString('pt-MZ',{month:'short',year:'numeric'});acc[m]=(acc[m]||0)+o.total;return acc;},{})).slice(-4);
          const maxV = Math.max(...byMonth.map(([,v])=>v), 1);
          return `<div style="display:flex;flex-direction:column;gap:10px">
            ${byMonth.map(([m,v])=>`
              <div>
                <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
                  <span style="font-weight:500;text-transform:capitalize">${m}</span>
                  <span style="font-family:'Inter',sans-serif;font-weight:700;color:var(--b-600)">${fmtMT(v)}</span>
                </div>
                <div class="prog"><div class="prog-fill pf-dark" style="width:${Math.round((v/maxV)*100)}%"></div></div>
              </div>`).join('')}
          </div>`;
        })():`<div class="empty" style="padding:20px"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div><p>Sem dados ainda</p></div>`}
      </div>
    </div>
    <div class="sh-row reveal"><h2>Histórico de vendas</h2></div>
    <div class="tbl-wrap reveal">
      <table>
        <thead><tr><th>Data</th><th>Produto(s)</th><th>Comprador</th><th>Total</th><th>Estado</th></tr></thead>
        <tbody>
          ${orders.length?orders.map(o=>`<tr>
            <td style="color:var(--t3)">${fmtDate(o.createdAt)}</td>
            <td>${esc(o.items?.[0]?.name||o.items?.[0]?.product?.name||'N/D')}</td>
            <td>${esc(o.buyer?.name||'N/D')}</td>
            <td style="font-family:'Inter',sans-serif;font-weight:800;font-weight:700;color:var(--b-600)">${fmtMT(o.total)}</td>
            <td>${stBadge(o.status)}</td>
          </tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:var(--t4);padding:32px">Sem vendas ainda</td></tr>`}
        </tbody>
      </table>
    </div>`;
}});
</script></body></html>
