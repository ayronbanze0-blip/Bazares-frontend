<script>
let _product=null;

initPage({ active:'products.html', onReady: async(user)=>{
  // URL amigável primeiro (/product/nome-do-produto, via window.location.pathname).
  // getPathSlug('produto') fica como retrocompatibilidade — quem já tinha um
  // link antigo partilhado (/produto/:slug) continua a abrir o produto certo,
  // mesmo sem a Function de servidor (ver _redirects) o reescrever primeiro.
  // ?id= e window.BAZARES_PRODUCT_ID (injectado pela Cloudflare Function em
  // functions/product/[slug].js) ficam como retrocompatibilidade adicional.
  const id=getPathSlug('product')||getPathSlug('produto')||getParam('id')||window.BAZARES_PRODUCT_ID; const view=document.getElementById('view');
  if(!id){
    // Link sem identificador de produto (URL antigo/partilhado incorrectamente,
    // ou aberto à mão sem /product/:slug nem ?id=) — em vez de deixar a barra
    // de endereço presa em /product (ou /product.html) com um ecrã vazio por
    // baixo, substitui já o URL pela listagem real. replace() (não href/go())
    // troca a entrada no histórico em vez de empilhar mais uma — o botão
    // "voltar" do telemóvel não regressa a este link inválido.
    location.replace('products.html');
    return;
  }
  try{_product=(await api.get(`/products/${id}`))?.data?.product;window.BZSEO?.setProduct(_product);Bazares.Analytics?.trackProductViewed(_product);}
  catch{view.innerHTML=`<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div><h3>Produto não encontrado</h3><button class="btn btn-ghost btn-sm" style="margin-top:14px" onclick="goBack()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Voltar</button></div>`;return;}
  // Fire-and-forget: incrementa views sem bloquear o render
  api.post(`/products/${id}/viewed`).catch(()=>{});
  renderProduct(user);
  await Promise.allSettled([loadReviewForm(), loadRelated(), loadComments(), loadProductReactions()]);
}});

function renderProduct(user){
  const p=_product; const imgs=p.images||[]; const view=document.getElementById('view');
  view.innerHTML=`
    <div class="pd-grid" id="pd-grid">
      <div>
        <div class="pd-main-img" id="main-img-wrap" style="cursor:zoom-in" onclick="if(document.getElementById('main-img')?.src)openImageLightbox(document.getElementById('main-img').src)"><img decoding="async" id="main-img" src="${imgs[0]?.url||''}" alt="${esc(p.name)}" style="${imgs[0]?.url?'':'display:none'}" onload="this.classList.add('loaded');this.closest('.pd-main-img').classList.add('loaded')" onerror="this.closest('.pd-main-img').classList.add('loaded')">
          ${!imgs[0]?.url?`<span style="color:var(--t4);font-size:13px">Sem imagem</span>`:''}</div>
        ${imgs.length>1?`<div class="pd-thumbs">${imgs.map((img,i)=>`<div class="pd-thumb ${i===0?'on':''}" onclick="setMainImg(${i})"><img loading="lazy" decoding="async" src="${esc(img.url)}" alt=""></div>`).join('')}</div>`:''}
      </div>
      <div>
        <div style="font-size:11px;color:var(--t4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">${esc(p.category)}${p.createdAt?` · Publicado ${timeAgo(p.createdAt)}`:''}</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px">
          <h2 style="line-height:1.25">${esc(p.name)}</h2>
          ${user?.role==='BUYER'?`<button class="btn-icon" style="font-size:20px;flex-shrink:0" onclick="toggleFavorite('${p.id}',this)" aria-label="${p.isFavorite?'Remover dos favoritos':'Adicionar aos favoritos'}">${p.isFavorite?'<svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>':'<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'}</button>`:''}
        </div>
        ${p.ratingCount?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">${stars(p.rating)} <span style="font-size:12px;color:var(--t3)">${p.rating.toFixed(1)} · ${p.ratingCount} avaliações</span></div>`:''}
        ${p.sales?`<div style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--b-600);font-weight:600;margin-bottom:12px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/></svg> ${p.sales} venda${p.sales===1?'':'s'} concluída${p.sales===1?'':'s'}</div>`:''}
        <div class="pd-price" style="margin-bottom:10px">${fmtMT(p.price)}</div>
        <div class="pay-badges" style="margin-bottom:16px">
          <span class="pay-badge"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg> M-Pesa</span>
          <span class="pay-badge"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg> e-Mola</span>
          <span class="pay-badge"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Na entrega</span>
        </div>
        <div style="font-size:14px;color:var(--t2);line-height:1.75;margin-bottom:16px">${esc(p.description)}</div>
        <div class="pd-info-grid">
          ${p.location?`<div class="pd-info-item"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${esc(p.location)}</div>`:''}
          ${p.condition?`<div class="pd-info-item"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg> ${esc(p.condition)}</div>`:''}
          ${p.deliveryMethod?`<div class="pd-info-item"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> ${esc(p.deliveryMethod)}</div>`:''}
          ${p.size?`<div class="pd-info-item"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M3 15l6-6 4 4 8-8"/></svg> ${esc(p.size)}</div>`:''}
          ${p.color?`<div class="pd-info-item"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="8" cy="10" r="1"/><circle cx="16" cy="10" r="1"/><circle cx="9" cy="15" r="1"/><path d="M12 2a10 10 0 1 0 6 18c1 0 1-1 .5-1.6-.5-.5-1-.9-1-1.6a1.7 1.7 0 0 1 1.7-1.8H21a2 2 0 0 0 2-2 10 10 0 0 0-11-11z"/></svg> ${esc(p.color)}</div>`:''}
          <div class="pd-info-item" style="color:${p.stock>0?'var(--b-500)':'var(--r-500)'}">
            ${p.stock>0?`<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> ${p.stock} em stock${p.stock<=3?` <span class="stock-low" style="margin-left:4px">Últimas unidades</span>`:''}`:'<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Esgotado'}
          </div>
        </div>
        ${p.stock>0&&(!user||user.role!=='SELLER')?`
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <label style="text-transform:none;font-weight:500;color:var(--t2);white-space:nowrap;font-size:13px">Quantidade:</label>
            <input type="number" id="qty-i" value="1" min="1" max="${p.stock}" style="width:80px;border-radius:var(--r)" oninput="syncStickyTotal()">
          </div>
          <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px" id="pd-cta-row">
            <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="addToCartFromProduct()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Carrinho</button>
            <button class="btn btn-terra" onclick="goCheckout()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Encomendar</button>
          </div>
          ${user&&user.id!==p.sellerId?`
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
            <button class="btn btn-primary btn-sm" style="flex:1;justify-content:center;min-width:150px" onclick="expressInterestFromProduct()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Tenho interesse</button>
            <button class="btn btn-soft btn-sm" style="flex:1;justify-content:center;min-width:130px" onclick="openOfferModalFromProduct()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Propor preço</button>
          </div>
          <button class="btn btn-ghost btn-sm btn-block" onclick="contactSeller('${p.sellerId}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Falar com o vendedor</button>`:''}
          <div id="pd-reactions" style="display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--brd)"></div>
          <div class="safety-note" style="margin-top:12px">
            <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/></svg>
            <div><strong>Compre com segurança</strong>Combine a entrega e o pagamento sempre pelo chat da Bazares. Nunca envie dinheiro antes de confirmar o produto com o vendedor.</div>
          </div>
        `:p.stock<=0?`<div class="alert a-err"><span><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span> Produto esgotado</div>`:''}
        <div class="card card-sm card-hover" style="margin-top:14px;border-radius:var(--rl)" onclick="go('bazar.html',{id:'${escJsAttr(p.bazar?.slug||'')}'})">

// Carrega formulário de avaliação (só para compradores com encomenda entregue)
async function loadReviewForm(){
  const wrap = document.getElementById('review-form-wrap');

    const orders = (await api.get('/orders/mine', {limit:100}))?.data?.orders || [];

    wrap.innerHTML = `

      <div class="card reveal">

        <div style="margin-bottom:14px">
          <label style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t4);display:block;margin-bottom:6px">Classificação</label>

      </div>`;

async function submitReview(orderId){
  const rating = document.getElementById('star-pick')._getValue ? document.getElementById('star-pick')._getValue() : 0;
  if(!rating){ toast('Escolha uma classificação de 1 a 5 estrelas.','warn'); return; }
  const comment = document.getElementById('rev-comment')?.value?.trim() || '';
  const btn = document.querySelector('#review-form-wrap .btn-terra');
  setLoading(btn, true);
  try{
    await api.post('/reviews', { orderId, productId: _product.id, rating, comment });
    document.getElementById('review-form-wrap').innerHTML = `<div class="alert a-ok" style="margin-top:16px"><span><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Avaliação enviada com sucesso! Obrigado.</div>
    ${rating===5?`<button class="btn btn-terra btn-sm" style="margin-top:10px" onclick="shareHappyBuyBadge(_product,5,(_product.images&&_product.images[0]&&_product.images[0].url)||null)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Partilhar selo "Compra Feliz"</button>`:''}`;
    toast('Avaliação enviada! <svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>','ok');
  }catch(e){
    setLoading(btn, false);
    toast(apiErrorMessage(e),'err');
  }
}

function renderProductReactions({likeCount=0, dislikeCount=0, myReaction=0, shareCount=0}={}){
  const wrap = document.getElementById('pd-reactions');
  if(!wrap) return;

      <svg class="ico-inline" viewBox="0 0 24 24" fill="${myReaction===1?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>

    </button>
    <button class="btn-icon btn-sm" id="pd-dislike-btn" style="${myReaction===-1?'color:var(--red)':''}" onclick="reactProduct(-1)" aria-label="Não gostei">
      <svg class="ico-inline" viewBox="0 0 24 24" fill="${myReaction===-1?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>
      <span id="pd-dislike-count">${dislikeCount||''}</span>
    </button>
    <button class="btn-icon btn-sm" style="margin-left:auto" onclick="openShareSheet('PRODUCT','${_product.id}',{title:${escJsonAttr(_product.name||'')},slug:${escJsonAttr(_product.slug||'')}})">

      Partilhar <span id="pd-share-count" data-share-count="feed-PRODUCT-${_product.id}">${shareCount||''}</span>
    </button>

      <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </button>`;
}

async function reactProduct(value){
  if(!Session.isLoggedIn()){ go('login.html'); return; }
  const likeBtn = document.getElementById('pd-like-btn'), dislikeBtn = document.getElementById('pd-dislike-btn');
  const likeCountEl = document.getElementById('pd-like-count'), dislikeCountEl = document.getElementById('pd-dislike-count');
  const wasReaction = likeBtn?.style.color ? 1 : (dislikeBtn?.style.color ? -1 : 0);
  const wasLike = parseInt(likeCountEl?.textContent, 10) || 0;
  const wasDislike = parseInt(dislikeCountEl?.textContent, 10) || 0;

  // toque na mesma reacção desliga-a (alterna), tal como o resto da app
  const newReaction = wasReaction === value ? 0 : value;
  let newLike = wasLike, newDislike = wasDislike;
  if (wasReaction === 1) newLike--;
  if (wasReaction === -1) newDislike--;
  if (newReaction === 1) newLike++;
  if (newReaction === -1) newDislike++;

  const paint = (myReaction, likeCount, dislikeCount) => {
    if (likeCountEl) likeCountEl.textContent = likeCount || '';
    if (dislikeCountEl) dislikeCountEl.textContent = dislikeCount || '';
    if (likeBtn) { likeBtn.style.color = myReaction===1 ? 'var(--b-600)' : ''; likeBtn.querySelector('svg').setAttribute('fill', myReaction===1?'currentColor':'none'); }
    if (dislikeBtn) { dislikeBtn.style.color = myReaction===-1 ? 'var(--red)' : ''; dislikeBtn.querySelector('svg').setAttribute('fill', myReaction===-1?'currentColor':'none'); }
  };

  paint(newReaction, Math.max(0, newLike), Math.max(0, newDislike)); // aplica já — sem esperar pela rede

  try{
    const r = await api.post(`/feed/PRODUCT/${_product.id}/react`, { value });
    const { likeCount, dislikeCount, myReaction } = r?.data || {};
    paint(myReaction, likeCount, dislikeCount); // reconcilia com a resposta real
  }catch(e){
    paint(wasReaction, wasLike, wasDislike); // repõe o estado anterior
    toast(apiErrorMessage(e),'err');
  }
}

async function shareProduct(){
  if(!Session.isLoggedIn()){ go('login.html'); return; }
  try{
    const r = await api.post(`/feed/PRODUCT/${_product.id}/share`, {});
    document.getElementById('pd-share-count').textContent = r?.data?.shareCount || '';
    toast('Partilhado no teu feed!','ok');
  }catch(e){ toast(apiErrorMessage(e),'err'); }
}

// ─── Comentários — pré-visualização; a lista completa (com gosto,
// respostas e apagar) abre no modal partilhado usado em todo o app ───
async function loadComments(){
  const wrap = document.getElementById('comments-wrap');
  if(!wrap) return;
  try{
    const r = await api.get(`/feed/PRODUCT/${_product.id}/comments`, {limit:3});
    const comments = r?.data?.comments || [];
    const total = comments.reduce((s,c)=>s+1+(c.replyCount||0),0);
    renderCommentsPreview(comments, total);
  }catch{ wrap.innerHTML = ''; }
}

function renderCommentsPreview(comments, total){
  const wrap = document.getElementById('comments-wrap');
  if(!wrap) return;
  const isOwner = !!(user && (user.role==='ADMIN' || user.id===_product.sellerId));

      <button class="btn btn-ghost btn-xs" onclick="openCommentsModal('PRODUCT','${_product.id}',{isOwner:${isOwner},onCountChange:(n)=>renderCommentsPreviewCount(n)})">${total?'Ver todos':'Comentar'}</button>

      ${comments.map(c=>cmtModalRowHtml(c,false)).join('') || `<p style="font-size:12.5px;color:var(--t4);padding:6px 0">Sê o primeiro a comentar.</p>`}
    </div>`;
}
function renderCommentsPreviewCount(n){ loadComments(); }

  const el=document.getElementById('main-img');

}
function goCheckout(){

  const qty=Math.max(1,parseInt(document.getElementById('qty-i').value)||1);

function openOfferModalFromProduct(){

async function contactSeller(sid){
  try{const r=await api.get(`/chat/with/${sid}`);go('chat.html',{with:sid,chatId:r?.data?.chat?.id||''});}
  catch(e){toast(apiErrorMessage(e),'err');}

function openProductReport(){
  if(!Session.isLoggedIn()){go('login.html');return;}
  openModal(`<div class="modal-hd"><h3>Denunciar produto</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

    <div class="fg"><label>Descrição</label><textarea id="rp-d" rows="3" placeholder="Descreva o problema..."></textarea></div>
    <div style="display:flex;gap:9px"><button class="btn btn-danger" onclick="submitProdReport()">Enviar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>`);
}
async function submitProdReport(){
  const reason=document.getElementById('rp-r').value;
  const description=document.getElementById('rp-d').value.trim();
  if(!description){toast('Descreva o problema.','warn');return;}
  try{await api.post('/reports',{type:'PRODUCT',targetId:_product.id,reason,description});closeModal();toast('Denúncia enviada.');}
  catch(e){toast(apiErrorMessage(e),'err');}
}
