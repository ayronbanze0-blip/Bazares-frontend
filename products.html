<script>
function _totalLabel(meta,filtered){
  if(!meta?.total) return '';
  return filtered
    ? `${meta.total} resultado${meta.total===1?'':'s'} para a tua pesquisa`
    : `<strong style="color:var(--b-600)">+${meta.total}</strong> produto${meta.total===1?'':'s'} disponíve${meta.total===1?'l':'is'} em Moçambique inteiro`;
}

let _curPage=1,_curCat='',_lastMeta=null,_loadingMore=false,_reachedEnd=false,_io=null,_myLoc=null;

let _smartSearchOn = false;

function toggleSmartSearch() {
  _smartSearchOn = !_smartSearchOn;
  const btn = document.getElementById('ai-search-toggle');
  if (btn) btn.classList.toggle('btn-primary', _smartSearchOn);
  const inp = document.getElementById('psrch');
  if (inp) inp.placeholder = _smartSearchOn ? 'Pesquisa IA: ex. vestido azul até 1500 MT' : 'Pesquisar produtos...';
  if (inp?.value?.trim()) loadProducts(1);
}

function _sentinelIdle(){
  const s=document.getElementById('pp-sentinel');
  if(s) s.innerHTML='';
}
function _sentinelLoading(){
  const s=document.getElementById('pp-sentinel');
  if(s) s.innerHTML=`<span class="spinner spinner-dark"></span>`;
}
function _sentinelError(){
  const s=document.getElementById('pp-sentinel');
  if(s) s.innerHTML=`<button type="button" class="btn btn-soft btn-sm" onclick="loadProducts(_curPage+1,true)">Tentar novamente</button>`;
}
function _setupInfiniteScroll(){
  const sentinel=document.getElementById('pp-sentinel');
  if(!sentinel) return;
  if(_io) _io.disconnect();
  _io=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting && !_loadingMore && !_reachedEnd) loadProducts(_curPage+1,true);
  },{rootMargin:'600px 0px'});
  _io.observe(sentinel);
}

async function loadProducts(page=1,append=false){
  if(_loadingMore) return;
  _loadingMore=true;
  _curPage=page;
  const grid=document.getElementById('pp-grid');
  if(append){ _sentinelLoading(); }
  else { grid.innerHTML=`<div style="text-align:center;padding:40px;grid-column:1/-1"><span class="spinner spinner-dark"></span></div>`; _reachedEnd=false; }
  const q=document.getElementById('psrch').value.trim();
  const sort=document.getElementById('psort').value;
  const priceMin=document.getElementById('pmin').value;
  const priceMax=document.getElementById('pmax').value;
  const condition=document.getElementById('pcond').value;
  try{
    let res;
    if (_smartSearchOn && q) {
      // Pesquisa IA: a interpretação de categoria/preço fica a cargo da
      // própria IA — os filtros manuais de categoria/preço/ordenação não
      // se aplicam aqui, para não haver contradição entre os dois.
      res = await api.get('/search/smart', { q, page, limit: 24 });
    } else {
      res=await api.get('/products',{q:q||undefined,category:_curCat||undefined,sort,page,limit:24,
        minPrice:priceMin||undefined,maxPrice:priceMax||undefined,condition:condition||undefined,
        lat:(sort==='distance'&&_myLoc)?_myLoc.lat:undefined, lng:(sort==='distance'&&_myLoc)?_myLoc.lng:undefined});
    }
    const products=res?.data?.products||[];
    const meta=res?.data?.meta||{};
    _lastMeta=meta;
    const filtered=!!(q||_curCat||sort!=='new'||priceMin||priceMax||condition);
    document.getElementById('pp-total').innerHTML = _totalLabel(meta,filtered);
    if(append){
      if(products.length) grid.insertAdjacentHTML('beforeend',products.map(productCard).join(''));
    } else {
      grid.innerHTML=products.length?products.map(productCard).join('')
        :`<div class="empty" style="grid-column:1/-1"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><h3>Sem resultados</h3><p>Tente outros termos de pesquisa</p></div>`;
    }
    _reachedEnd = !meta.pages || meta.page>=meta.pages;
    _sentinelIdle();
    _setupInfiniteScroll();
    if (!append) {
      if (q) {
        Bazares.Analytics?.trackSearchPerformed({ query: q, tab: 'produtos', resultsCount: meta.total ?? products.length });
      } else if (filtered) {
        Bazares.Analytics?.trackFeatureUsed('product_filters_applied', { category: _curCat||null, sort, priceMin: priceMin||null, priceMax: priceMax||null, condition: condition||null });
      }
    }
  } catch(e){
    if(append){ _sentinelError(); }
    else {
      grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
    }
  } finally {
    _loadingMore=false;
  }
}

function resetFilters(){
  document.getElementById('pmin').value='';
  document.getElementById('pmax').value='';
  document.getElementById('pcond').value='';
  loadProducts(1);
}

function _savePP(){
  saveListState('products',{
    page:_curPage, q:document.getElementById('psrch').value,
    cat:_curCat, sort:document.getElementById('psort').value,
    min:document.getElementById('pmin').value, max:document.getElementById('pmax').value,
    cond:document.getElementById('pcond').value
  });
  saveListCache('products', document.getElementById('pp-grid').innerHTML, _lastMeta);
}

initPage({ active:'products.html', onReady: async()=>{
  const sel=document.getElementById('pcat');
  CATS.forEach(c=>sel.insertAdjacentHTML('beforeend',`<option value="${esc(c.l)}">${esc(c.l)}</option>`));
  const saved=getListState('products');
  if(saved){
    _curCat=saved.cat||''; sel.value=_curCat;
    document.getElementById('psrch').value=saved.q||'';
    document.getElementById('psort').value=saved.sort||'new';
    document.getElementById('pmin').value=saved.min||'';
    document.getElementById('pmax').value=saved.max||'';
    document.getElementById('pcond').value=saved.cond||'';
  } else {
    const fromUrl=getParam('category')||window.BAZARES_CATEGORY;
    if(fromUrl){_curCat=fromUrl;sel.value=fromUrl;}
    const qFromUrl=getParam('q');
    if(qFromUrl) document.getElementById('psrch').value=qFromUrl;
  }
  renderCatStrip('cat-strip',_curCat,cat=>{_curCat=cat;document.getElementById('pcat').value=cat;loadProducts(1);});
  document.getElementById('pp-grid').addEventListener('click',_savePP,true);
  document.getElementById('psrch').addEventListener('input', Bazares.Utils.debounce(() => loadProducts(1), 350));
  document.getElementById('pcat').addEventListener('change',e=>{_curCat=e.target.value;loadProducts(1);});
  document.getElementById('psort').addEventListener('change',async e=>{
    if(e.target.value==='distance' && !_myLoc){
      try{
        await Bazares.Utils.loadScriptOnce('/js/maps.js?v=1788700000');
        _myLoc=await getBrowserLocation();
      }
      catch(err){
        toast(describeGeoError ? describeGeoError(err) : 'Não foi possível obter a localização.','warn');
        e.target.value='new';
        return;
      }
    }
    loadProducts(1);
  });
  // Puxar para actualizar recomeça sempre da página 1 — com scroll infinito
  // não faz sentido "actualizar" apenas a página em que se está.
  initPullToRefresh(()=>loadProducts(1));

  // Se há uma listagem em cache para este URL exacto (voltámos de um
  // produto), pinta-a de imediato — sem spinner, sem pedido novo à API.
  // A página não "reinicia": aparece tal como a deixámos, incluindo todos
  // os produtos já carregados pelo scroll infinito. Para dados frescos,
  // a pessoa arrasta para baixo (puxar para actualizar).
  const cache=saved?getListCache('products'):null;
  if(cache){
    _curPage=saved.page||1;
    document.getElementById('pp-grid').innerHTML=cache.html;
    _lastMeta=cache.meta;
    document.getElementById('pp-total').innerHTML = _totalLabel(cache.meta, !!(saved.q||saved.cat||saved.sort!=='new'||saved.min||saved.max||saved.cond));
    _reachedEnd = !cache.meta?.pages || cache.meta.page>=cache.meta.pages;
    _sentinelIdle();
    _setupInfiniteScroll();
    return;
  }
  // Aguardar aqui é importante: initPage() chama animateItems() logo a
  // seguir a onReady terminar. Sem este await, isso corria antes da
  // grelha ter produtos — o CSS já garante visibilidade de qualquer forma,
  // mas isto mantém o efeito de cascata a funcionar correctamente também.
  // A posição de scroll em si é restaurada automaticamente pelo app.js
  // (memória universal por URL), por isso não é tratada aqui.
  // Sem cache: recomeça sempre da página 1 (não faz sentido "saltar" para

  await loadProducts(1);
