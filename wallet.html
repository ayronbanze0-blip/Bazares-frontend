<script>
let _walletUser = null;
let _walletBazar = null;

initPage({ active:'wallet.html', requireAuth:true, onReady: async (user) => {
  _walletUser = user;
  await loadWallet();
  // Vem do botão "Pagar comissão" do dashboard — abre o modal direto,
  // sem o vendedor precisar procurar onde pagar.
  if (getParam('action') === 'pay') openPayCommissionStk();
}});

async function loadWallet() {
  const view = document.getElementById('view');
  view.innerHTML = `<div style="text-align:center;padding:60px"><span class="spinner spinner-dark"></span></div>`;

  let statement = { balance: 0, transactions: [] };
  try { statement = (await api.get('/wallet/me', { limit: 30 }))?.data || statement; } catch (e) { toast(apiErrorMessage(e), 'err'); }

  let bazar = null;
  if (_walletUser.role === 'SELLER') {
    try { bazar = (await api.get('/bazars/me'))?.data?.bazar || null; } catch {}
  }
  _walletBazar = bazar;

  const pf = bazar?.pendingFees || 0;
  const FEE = 150;

  view.innerHTML = `
    <div class="pg-hero pg-hero--compact">
      <div class="pg-hero-content">
        <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Wallet</div>
        <h1>A minha Wallet</h1>
        <p>Saldo e contribuição de plataforma</p>
      </div>
    </div>

    <div class="wallet-card reveal">
      <div class="wallet-card-top">
        <div>
          <div class="wallet-label"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2"/><circle cx="12" cy="13.5" r="2.5"/></svg> Saldo disponível</div>
          <div class="wallet-figs">
            <div class="wallet-fig"><div class="v">${fmtMT(statement.balance)}</div><div class="l">Saldo actual</div></div>
          </div>
        </div>
        <div class="wallet-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
      </div>
      ${_walletUser.role === 'SELLER' && pf > 0 ? `<div class="wallet-warn"><span>${pf >= FEE ? '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' : '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'}</span><div>Contribuição de plataforma pendente: <strong>${fmtMT(pf)}</strong>${pf >= FEE ? ' — pague agora para continuar a vender.' : '.'}</div></div>` : ''}
    </div>

    ${_walletUser.role === 'SELLER' && pf > 0 ? `
    <div class="card" style="margin-top:16px;border:1.5px solid var(--a-300)">
      <h4 style="margin-bottom:6px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M12 10C7 10 4 7 4 3c5 0 8 3 8 7z"/><path d="M12 14c4 0 7-2 7-6-4 0-7 2-7 6z"/></svg> Mantenha a sua loja sempre activa</h4>
      <p style="font-size:13px;color:var(--t3);line-height:1.7;margin-bottom:14px">A cada 150 MT em vendas, contribui com uma pequena parte para mantermos a Bazares rápida, segura e sempre a melhorar para si. Neste momento deve <strong style="color:var(--a-600)">${fmtMT(pf)}</strong> — regularize agora e continue a vender sem interrupções.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="payCommissionWallet()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Pagar com saldo da wallet</button>
        <button class="btn btn-terra btn-sm" onclick="openPayCommissionStk()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg> Pagar com M-Pesa ou e-Mola</button>
      </div>
    </div>` : ''}

    <div class="qa-grid reveal" style="margin-top:20px">
      <div class="qa-tile" onclick="go('wallet-history.html')"><div class="qa-tile-ico" style="background:var(--a-500)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div><span>Histórico</span></div>
    </div>

    <div class="sh-row reveal" style="margin-top:24px"><h2>Movimentos recentes</h2></div>
    <div class="tbl-wrap reveal">
      <table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Saldo após</th></tr></thead>
        <tbody>
          ${statement.transactions.length ? statement.transactions.map(t => `<tr>
            <td style="color:var(--t3);font-size:12px">${fmtDate(t.createdAt)}</td>
            <td>${esc(t.description)}</td>
            <td>${txTypeBadge(t.type)}</td>
            <td style="font-weight:700;color:${isCreditType(t.type) ? 'var(--grn)' : 'var(--red)'}">${isCreditType(t.type) ? '+' : '−'}${fmtMT(t.amount)}</td>
            <td style="color:var(--t3)">${fmtMT(t.balanceAfter)}</td>
          </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--t4);padding:32px">Sem movimentos ainda</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function isCreditType(type) {
  return ['CREDITO_DEPOSITO', 'TRANSFERENCIA_RECEBIDA', 'CREDITO_COMISSAO', 'AJUSTE_ADMIN'].includes(type);
}

function txTypeBadge(type) {
  const map = {
    CREDITO_DEPOSITO: ['Depósito', 'b-grn'],
    DEBITO_LEVANTAMENTO: ['Levantamento', 'b-red'],
    TRANSFERENCIA_ENVIADA: ['Transferência enviada', 'b-blu'],
    TRANSFERENCIA_RECEBIDA: ['Transferência recebida', 'b-grn'],
    DEBITO_COMISSAO: ['Comissão paga', 'b-red'],
    CREDITO_COMISSAO: ['Comissão recebida', 'b-grn'],
    AJUSTE_ADMIN: ['Ajuste admin', 'b-gld']
  };
  const [label, cls] = map[type] || [type, 'b-blu'];
  return `<span class="badge ${cls}">${label}</span>`;
}

// ─── COMMISSION PAYMENT ──────────────────────────────────────────
async function payCommissionWallet() {
  if (!await confirmDialog(`Confirmar pagamento de ${fmtMT(_walletBazar?.pendingFees || 0)} a partir do saldo da sua wallet?`, { title:'Confirmar pagamento', confirmLabel:'Pagar' })) return;
  try {
    await api.post('/wallet/commission/pay', { method: 'WALLET' });
    toast('Contribuição paga com sucesso!');
    await loadWallet();
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

function openPayCommissionStk() {
  openModal(`
    <div class="modal-hd">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--g-green);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
        <div>
          <h3 style="margin-bottom:2px">Pagamento por M-Pesa ou e-Mola</h3>
          <p style="font-size:11.5px;color:var(--t3);margin:0">Rápido e seguro, sem sair da Bazares</p>
        </div>
      </div>
      <button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p style="font-size:13px;color:var(--t2);line-height:1.75;margin-bottom:16px">Confirme o seu número abaixo e enviamos um pedido de pagamento directamente para o seu telemóvel — tal como numa compra normal por M-Pesa ou e-Mola. Basta introduzir o seu PIN pessoal para concluir, em menos de um minuto.</p>
    <div style="background:var(--b-50);border:1px solid var(--b-100);border-radius:var(--rl);padding:14px 16px;margin-bottom:18px;font-size:12.5px;color:var(--t2);line-height:2">
      <div><strong>1.</strong> Confirme o número de telefone</div>
      <div><strong>2.</strong> Receberá um pedido de pagamento no telemóvel</div>
      <div><strong>3.</strong> Introduza o seu PIN para confirmar</div>
    </div>
    <div class="fg"><label>Número de telefone *</label><input id="comm-msisdn" placeholder="84xxxxxxx ou 86xxxxxxx"></div>
    <button class="btn btn-terra btn-block" onclick="submitPayCommissionStk()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Confirmar e enviar pedido</button>
    <p style="font-size:11px;color:var(--t4);text-align:center;margin-top:10px">Pagamento processado com segurança. A Bazares nunca vê nem guarda o seu PIN.</p>
  `);
}

async function submitPayCommissionStk() {
  const msisdn = document.getElementById('comm-msisdn').value.trim();
  if (!msisdn) { toast('Indique o número de telefone.', 'warn'); return; }

  try {
    await api.post('/wallet/commission/pay', { method: 'ZUMBOPAY', msisdn });
    closeModal();
    toast('Pedido enviado! Verifique o seu telemóvel e introduza o PIN para confirmar.', 'info', 6000);
    pollCommissionConfirmation();
  } catch (e) {
    // Se o backend indicar que há um pagamento anterior preso (ex: o
    // utilizador nunca confirmou o PIN e o webhook nunca chegou),
    // oferece um botão para cancelar esse pagamento e liberta o
    // caminho para uma nova tentativa, em vez de deixar o vendedor
    // bloqueado sem saber o que fazer.
    const pendingId = e?.errors?.pendingPaymentId;
    if (pendingId) {
      openModal(`
        <div class="modal-hd"><h3>Pagamento anterior pendente</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <p style="font-size:12.5px;color:var(--t3);margin-bottom:14px">${esc(apiErrorMessage(e))}</p>
        <button class="btn btn-danger btn-block" style="margin-bottom:8px" onclick="cancelStuckCommissionPayment('${pendingId}')">Cancelar pagamento anterior e tentar de novo</button>
        <button class="btn btn-ghost btn-block" onclick="closeModal()">Fechar</button>
      `);
    } else {
      toast(apiErrorMessage(e), 'err');
    }
  }
}

async function cancelStuckCommissionPayment(paymentId) {
  try {
    await api.post(`/wallet/commission/${paymentId}/cancel`);
    toast('Pagamento anterior cancelado. Pode tentar novamente.', 'info');
    closeModal();
    openPayCommissionStk();
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

// ─── POLL: confirma quando o pagamento ZumboPay é validado pelo webhook ──
// O utilizador introduz o PIN no telemóvel dele, fora da nossa página —
// sem isto, ele só saberia que a comissão foi paga ao voltar a esta
// página manualmente mais tarde. Sondamos em segundo plano e avisamos
// assim que o saldo pendente descer (ou ao fim de 2 minutos, sem erro).
let _commPollToken = 0;
async function pollCommissionConfirmation() {
  const myToken = ++_commPollToken;
  const baselinePending = _walletBazar?.pendingFees ?? null;
  // Ronda 38 — pára logo ao sair da página via SPA.
  const stopOnLeave = () => { if (myToken === _commPollToken) _commPollToken++; };
  document.addEventListener('bz:spa-leave', stopOnLeave, { once: true });
  for (let i = 0; i < 24; i++) {
    await new Promise(r => setTimeout(r, 5000));
    if (myToken !== _commPollToken) return; // uma tentativa mais recente substituiu esta sondagem
    let bazar = null;
    try { bazar = (await api.get('/bazars/me'))?.data?.bazar || null; } catch { continue; }
    if (bazar && baselinePending !== null && (bazar.pendingFees ?? 0) < baselinePending) {
      toast('Pagamento confirmado! Contribuição actualizada.', 'ok');
      await loadWallet();
      return;
    }
  }
  if (myToken === _commPollToken) {
    toast('Ainda não recebemos a confirmação do pagamento. Se já introduziu o PIN, o saldo actualiza-se em breve — pode voltar a esta página mais tarde para confirmar.', 'info', 7000);
  }
}
</script>
