.ann-stage{position:sticky;top:14px;padding:22px 0 8px;border-radius:var(--rxxl);background:radial-gradient(120% 100% at 50% 0%,rgba(0,224,67,.14),transparent 65%),var(--surf2)}

.ann-pv-media{width:100%;aspect-ratio:1/1;background:var(--surf3);display:flex;align-items:center;justify-content:center;color:var(--t4);overflow:hidden;position:relative}
.ann-pv-media img{width:100%;height:100%;object-fit:cover;display:none}
.ann-pv-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:4px}

.ann-pv-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--pill)}

.ann-thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;flex-shrink:0;border:2px solid var(--brd)}

<script>
let _myBazar = null;
let _annTags = [];
let _annQuick = [];
let _annImages = [];
// Ronda 42 — mesmo cuidado do novoproduto.html: revoga objectURLs de fotos ainda não gravadas ao sair via SPA.
document.addEventListener('bz:spa-leave', () => { _annImages.forEach(it => { if (it?.kind === 'new' && it?.previewUrl) URL.revokeObjectURL(it.previewUrl); }); }, { once: true });
let _annActiveImg = 0;
let _annProducts = [];
let _annLinkedProduct = null;
const MAX_ANN_IMAGES = 6;
const MAX_ANN_QUICK = 2;
const ANN_QUICK_TAGS = [
  { label:'Promoção', ic:'percent' },
  { label:'Novidade', ic:'sparkle' },
  { label:'Stock disponível', ic:'box' },
  { label:'Evento', ic:'calendar' },
];
// Quando se vem de "Editar" (openFeedKebab -> ?edit=ID), esta página
// deixa de publicar e passa a actualizar esse post — mesmo formulário,
// incluindo trocar/adicionar/remover fotos.
let _editAnnouncementId = null;

// Reconstrói {quick, hashtags, body} a partir do texto guardado, que
// junta tudo num só campo: "[Quick1 · Quick2]\nCorpo\n\n#tag1 #tag2".
// Usado só ao ABRIR a edição — o parseQuickTags() partilhado (em
// mentions.js) já trata a parte das etiquetas na leitura normal do feed.
function parseAnnouncementForEdit(rawText){
  const { tags: quick, text: afterQuick } = parseQuickTags(rawText || '');
  const m = /\n\n(#[^\n]+)$/.exec(afterQuick);
  let body = afterQuick, hashtags = [];
  if(m){
    hashtags = m[1].split(/\s+/).map(t=>t.replace(/^#/,'')).filter(Boolean);
    body = afterQuick.slice(0, m.index);
  }
  return { quick, hashtags, body: body.trim() };
}

initPage({ active:'anuncio.html', requireAuth:true, roles:['SELLER'], onReady: async(user) => {
  try{ _myBazar = (await api.get('/bazars/me'))?.data?.bazar || null; }catch{ _myBazar = null; }

  const view = document.getElementById('view');
  if(!_myBazar){
    view.innerHTML = `<div class="card" style="max-width:480px;margin:40px auto;text-align:center;padding:36px">
      <h3 style="margin-bottom:8px">Ainda sem Bazar</h3>
      <p style="margin-bottom:20px">Cria o teu Bazar primeiro para poderes publicar posts.</p>
      <button class="btn btn-primary" onclick="go('my-bazar.html')">Criar o meu Bazar</button>
    </div>`;
    return;
  }

  _editAnnouncementId = getParam('edit');
  if(_editAnnouncementId) document.title = 'Editar post — Bazares';
  let editData = null;
  if(_editAnnouncementId){
    try{
      const r = await api.get(`/bazars/${_myBazar.id}/announcements/${_editAnnouncementId}`);
      editData = r?.data?.announcement || null;
    }catch(e){ toast(apiErrorMessage(e),'err'); }
    if(!editData){ go('anuncios.html'); return; }
    _annLinkedProduct = editData.productId || editData.product?.id || null;
  }
  try{ _annProducts = (await api.get('/products', { bazarId: _myBazar.id, limit: 50 }))?.data?.products || []; }catch{ _annProducts = []; }
  const parsed = editData ? parseAnnouncementForEdit(editData.text) : null;
  if(parsed){
    _annQuick = parsed.quick;
    _annTags = parsed.hashtags;
    _annImages = (editData.images||[]).map(im => ({ kind:'existing', id: im.id, url: im.url, previewUrl: im.url }));
  }

  view.innerHTML = `
    <div class="pg-hero pg-hero--compact">
      ${_editAnnouncementId ? '' : `<button type="button" class="pg-hero-corner" onclick="openAnnDrafts()">${icon('folder',14,2)} Rascunhos</button>`}
      <div class="pg-hero-content">
        <div class="section-pill">${icon('megaphone',16)} Post</div>
        <h1>${_editAnnouncementId ? 'Editar Post' : 'Criar Post'}</h1>
        <p>Uma publicação no feed — texto, várias fotos e etiquetas, para os teus seguidores verem</p>
      </div>
    </div>

    <div id="ann-tip" class="ann-tip" style="max-width:920px;margin:0 auto 18px">
      <span class="ico">${icon('bulb',18,1.8)}</span>
      <div style="flex:1">
        <strong>Dica rápida</strong>
        <p>Um bom post com contexto claro tem até 5x mais alcance.</p>
      </div>
      <button type="button" class="ann-tip-x" onclick="dismissAnnTip()" aria-label="Fechar">${icon('close',15,2)}</button>
    </div>

    <div class="ann-wrap">
      <div>
        <div class="ann-stage">
          <div class="ann-preview-card">
            <div style="display:flex;align-items:center;gap:9px;padding:11px 12px">
              ${storeAvatar(_myBazar.name,32,bazarLogo(_myBazar))}
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:4px">
                  <strong style="font-size:12.5px">${esc(_myBazar.name)}</strong>
                  ${_myBazar.seller?.isPremium?`<span style="color:var(--a-500);display:inline-flex"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="11" height="11">${ICONS.star}</svg></span>`:''}
                </div>
                <div style="font-size:10px;color:var(--t4)">agora mesmo</div>
              </div>
            </div>
            <div class="ann-pv-media" id="ann-pv-media">
              <span id="ann-pv-empty" style="display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;padding:0 20px;text-align:center">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.55"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                A tua foto aparece aqui
              </span>
              <div class="ann-pv-count" id="ann-pv-count" style="display:none"></div>
              <div class="ann-pv-dots" id="ann-pv-dots"></div>
            </div>
            <div style="padding:10px 12px">
              <p id="ann-pv-text" style="font-size:12px;color:var(--t2);margin:0;white-space:pre-wrap;min-height:16px">O que se passa na tua loja hoje?</p>
              <div id="ann-pv-tags" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px"></div>
            </div>
          </div>
          <p class="ann-stage-hint">É assim que vai aparecer no feed</p>
        </div>
      </div>

      <div class="card reveal">
        <div class="form-sec-label"><b>1</b> Etiqueta (máx. 2)</div>
        <p class="form-sec-hint">Ajuda quem segue a tua loja a perceber o contexto num relance</p>
        <div class="fg">
          <label>Etiqueta rápida (opcional)</label>
          <div class="ann-quick-tags" id="ann-quick-tags"></div>
          <div class="ann-custom-tag-row" id="ann-custom-tag-row">
            <input id="ann-custom-tag-input" placeholder="A tua etiqueta..." maxlength="20" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomAnnTag();}">
            <button type="button" class="btn btn-tag-add btn-sm" onclick="addCustomAnnTag()">Adicionar</button>
          </div>
        </div>
        <div class="form-sec-label"><b>2</b> O que se passa na tua loja hoje?</div>
        <div class="fg">
          <textarea id="ann-text" rows="4" placeholder="O que se passa na tua loja hoje?" maxlength="500">${esc(parsed?.body || '')}</textarea>
          <div class="field-counter"><span id="ann-count">${parsed?.body?.length || 0}</span>/500</div>
          <button type="button" class="btn btn-ai btn-sm" id="ann-ai-gen-btn" onclick="generateAnnouncementCaption()" style="margin-top:8px;width:100%;justify-content:center">
            <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
            Gerar texto com IA
          </button>
        </div>
        <div class="form-sec-label"><b>3</b> Mídia (opcional)</div>
        <p class="form-sec-hint">A primeira foto é a que se destaca na miniatura do feed</p>
        <div class="fg">
          <label>Fotos (opcional) — até ${MAX_ANN_IMAGES}</label>
          <div class="ann-media-grid" id="ann-thumbs"></div>
          <input type="file" id="ann-image" accept="image/jpeg,image/jpg,image/png,image/webp" multiple hidden>
          <div class="ann-format-hint">${icon('image',15,2)} Formato recomendado: 1:1 (quadrado) ou 4:5 (vertical)</div>
        </div>
        <div class="form-sec-label"><b>4</b> Hashtags (opcional)</div>
        <p class="form-sec-hint">Aumenta o alcance do teu post na pesquisa</p>
        <div class="fg">
          <div class="field-with-icon" style="display:flex;gap:8px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
            <input id="ann-tag-input" placeholder="Ex: promoção, novidade" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addHashtag();}">
            <button type="button" class="btn btn-tag-add btn-sm" onclick="addHashtag()">Adicionar</button>
          </div>
          <div id="ann-tags" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"></div>
        </div>

        <div class="form-sec-label"><span class="field-label-info"><b>5</b> Associar produto (opcional) <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="O produto aparece como etiqueta clicável sobre o post"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span></div>
        <div class="fg nr-product-picker">
          <div class="nr-product-chips" id="ann-product-chips"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="ann-product-add-btn" onclick="openAnnProductPicker()">${icon('plus',14,2.2)} Adicionar produto</button>
        </div>

        <div style="display:flex;gap:9px;padding-top:6px">
          <button class="btn btn-primary" style="flex:1" id="ann-submit" onclick="postAnnouncement()">${icon('send',15,2.2)} ${_editAnnouncementId ? 'Guardar alterações' : 'Publicar Post'}</button>
          <button class="btn btn-ghost" onclick="goBack()">Cancelar</button>
        </div>
        <p class="ann-lock-note">${icon('lock',13,2)} O teu post será visível para todos os visitantes do Bazares.</p>
      </div>
    </div>`;

  if(localStorage.getItem('bz_ann_tip_dismissed')==='1') document.getElementById('ann-tip')?.remove();

  renderAnnQuickTags();
  renderHashtags();
  renderAnnProductChips();

  document.getElementById('ann-text').addEventListener('input', e=>{
    document.getElementById('ann-count').textContent = e.target.value.length;
    renderAnnPreview();
  });
  attachMentionAutocomplete(document.getElementById('ann-text'));
  document.getElementById('ann-image').addEventListener('change', e=>{ addAnnFiles(e.target.files); e.target.value=''; });

  // Sem esta chamada, o botão "+" de adicionar fotos (dentro de
  // #ann-thumbs) só aparecia depois de já se ter adicionado/removido
  // uma foto — na primeira visita à página não havia nenhuma forma
  // visível de acionar o input de ficheiro escondido.
  renderAnnThumbs();
  renderAnnPreview();
}});

function renderAnnQuickTags(){
  const el = document.getElementById('ann-quick-tags');
  const quickLabels = ANN_QUICK_TAGS.map(t=>t.label);
  const customActive = _annQuick.filter(t=>!quickLabels.includes(t));
  el.innerHTML = ANN_QUICK_TAGS.map(t=>
    `<button type="button" class="ann-qt${_annQuick.includes(t.label)?' active':''}" data-qt="${esc(t.label)}" onclick="toggleQuickTag('${esc(t.label)}')">${icon(t.ic,14,2.2)}${esc(t.label)}</button>`
  ).join('') +
  customActive.map(t=>
    `<button type="button" class="ann-qt active" onclick="toggleQuickTag('${esc(t)}')">${icon('pencil',14,2.2)}${esc(t)}</button>`
  ).join('') +
  `<button type="button" class="ann-qt ann-qt-custom" onclick="toggleCustomTagRow()">${icon('pencil',14,2.2)}Personalizar etiqueta</button>`;
}

function toggleQuickTag(tag){
  const i = _annQuick.indexOf(tag);
  if(i===-1){
    if(_annQuick.length >= MAX_ANN_QUICK){ toast(`Máximo de ${MAX_ANN_QUICK} etiquetas por post.`,'warn'); return; }
    _annQuick.push(tag);
  } else {
    _annQuick.splice(i,1);
  }
  renderAnnQuickTags();
  renderAnnPreview();
}

function toggleCustomTagRow(){
  const row = document.getElementById('ann-custom-tag-row');
  row.classList.toggle('open');
  if(row.classList.contains('open')) document.getElementById('ann-custom-tag-input')?.focus();
}

function addCustomAnnTag(){
  const input = document.getElementById('ann-custom-tag-input');
  const val = input.value.trim();
  if(!val) return;
  if(_annQuick.length >= MAX_ANN_QUICK){ toast(`Máximo de ${MAX_ANN_QUICK} etiquetas por post.`,'warn'); return; }
  if(!_annQuick.includes(val)) _annQuick.push(val);
  input.value = '';
  document.getElementById('ann-custom-tag-row').classList.remove('open');
  renderAnnQuickTags();
  renderAnnPreview();
}

function dismissAnnTip(){
  localStorage.setItem('bz_ann_tip_dismissed','1');
  document.getElementById('ann-tip')?.remove();
}

function addAnnFiles(fileList){
  const accepted = ['image/jpeg','image/jpg','image/png','image/webp'];
  for(const file of Array.from(fileList)){
    if(_annImages.length >= MAX_ANN_IMAGES){ toast(`Máximo de ${MAX_ANN_IMAGES} fotos por post.`,'warn'); break; }
    if(!accepted.includes(file.type)) continue;
    if(file.size > 10*1024*1024) continue;
    _annImages.push({ kind:'new', file, previewUrl: URL.createObjectURL(file) });
  }
  _annActiveImg = 0;
  renderAnnThumbs();
  renderAnnPreview();
}
function removeAnnImage(i){
  if(_annImages[i].kind === 'new') URL.revokeObjectURL(_annImages[i].previewUrl);
  _annImages.splice(i,1);
  if(_annActiveImg >= _annImages.length) _annActiveImg = Math.max(_annImages.length-1,0);
  renderAnnThumbs();
  renderAnnPreview();
}
function editAnnImage(i){
  const item=_annImages[i];
  if(!item) return;
  const source = item.kind==='existing' ? item.url : item.file;
  openImageEditor(source, {
    onDone: (file) => {
      if(item.kind==='new' && item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      _annImages[i] = { kind:'new', file, previewUrl: URL.createObjectURL(file) };
      renderAnnThumbs();
      renderAnnPreview();
      toast('Foto editada.','ok');
    }
  });
}

function renderAnnThumbs(){
  const el = document.getElementById('ann-thumbs');
  const cells = [];
  for(let i=0;i<MAX_ANN_IMAGES;i++){
    if(i < _annImages.length){
      cells.push(`<div class="ann-mg-cell">
        <img loading="lazy" decoding="async" src="${_annImages[i].previewUrl}" alt="">
        ${i===0?'<div class="ann-thumb-cover">CAPA</div>':''}
        <button type="button" class="imgup-edit" style="top:1px;left:1px;bottom:auto;right:auto;width:17px;height:17px" onclick="editAnnImage(${i})" title="Editar foto">${icon('pencil',10,2.2)}</button>
        <button type="button" class="ann-thumb-rm" onclick="removeAnnImage(${i})">✕</button>
      </div>`);
    } else if(i === _annImages.length){
      cells.push(`<div class="ann-mg-cell ann-mg-add" onclick="document.getElementById('ann-image').click()">${icon('plus',18,2.4)}<span>Adicionar</span></div>`);
    } else {
      cells.push(`<div class="ann-mg-cell ann-mg-ghost">${icon('image',18,1.6)}</div>`);
    }
  }
  el.innerHTML = cells.join('');
}

function renderAnnPreview(){
  const media = document.getElementById('ann-pv-media');
  const empty = document.getElementById('ann-pv-empty');
  const dots = document.getElementById('ann-pv-dots');
  const count = document.getElementById('ann-pv-count');
  media.querySelectorAll('img').forEach(i=>i.remove());
  if(_annImages.length){
    empty.style.display = 'none';
    const img = document.createElement('img');
    img.src = _annImages[0].previewUrl;
    img.style.display = 'block';
    media.insertBefore(img, empty);
    if(_annImages.length > 1){
      count.style.display = '';
      count.textContent = `1/${_annImages.length}`;
      dots.innerHTML = _annImages.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join('');
    } else {
      count.style.display = 'none';
      dots.innerHTML = '';
    }
  } else {
    empty.style.display = '';
    count.style.display = 'none';
    dots.innerHTML = '';
  }

  const text = document.getElementById('ann-text')?.value?.trim() || '';
  document.getElementById('ann-pv-text').textContent = text || 'O que se passa na tua loja hoje?';
  document.getElementById('ann-pv-tags').innerHTML = _annQuick.map(t=>
    `<span class="hashtag-chip" style="font-size:10px;padding:3px 8px">${esc(t)}</span>`).join('');
}

async function generateAnnouncementCaption(){
  const btn = document.getElementById('ann-ai-gen-btn');
  setLoading(btn, true);
  try{
    const res = await api.post('/ai/generate-caption', { kind: 'ANNOUNCEMENT' });
    const caption = res?.data?.caption;
    if(caption){
      const ta = document.getElementById('ann-text');
      ta.value = caption;
      document.getElementById('ann-count').textContent = caption.length;
      renderAnnPreview();
    }
    toast('Texto gerado — revê antes de publicar.','ok');
  }catch(e){
    if(isPremiumRequiredError(e)) showPremiumUpsell(e.message);
    else toast(apiErrorMessage(e),'warn');
  }finally{ setLoading(btn, false); }
}

function addHashtag(){
  const input = document.getElementById('ann-tag-input');
  let val = input.value.trim().replace(/^#/,'').replace(/\s+/g,'');
  if(!val) return;
  if(!_annTags.includes(val) && _annTags.length < 10) _annTags.push(val);
  input.value = '';
  renderHashtags();
}
function removeHashtag(i){ _annTags.splice(i,1); renderHashtags(); }
function renderHashtags(){
  document.getElementById('ann-tags').innerHTML = _annTags.map((t,i)=>
    `<span class="hashtag-chip">#${esc(t)}<button type="button" onclick="removeHashtag(${i})">✕</button></span>`).join('');
}

function renderAnnProductChips(){
  const el = document.getElementById('ann-product-chips');
  const addBtn = document.getElementById('ann-product-add-btn');
  if(!el || !addBtn) return;
  if(!_annLinkedProduct){ el.innerHTML=''; addBtn.style.display=''; return; }
  const p = _annProducts.find(x=>x.id===_annLinkedProduct);
  if(!p){ el.innerHTML=''; addBtn.style.display=''; return; }
  el.innerHTML = `<div class="nr-product-chip">
    <img loading="lazy" decoding="async" src="${cldImg(p.images?.[0]?.url, 60)}" alt="">
    <div><b>${esc(p.name)}</b><br><span>${fmtMT(p.price)}</span></div>
    <button type="button" onclick="removeAnnProduct()">✕</button>
  </div>`;
  addBtn.style.display = 'none';
}
function removeAnnProduct(){ _annLinkedProduct = null; renderAnnProductChips(); }
function openAnnProductPicker(){
  if(!_annProducts.length){ toast('Ainda não tens produtos no teu Bazar.','warn'); return; }
  const html = `<div class="card" style="max-width:420px">
    <h3 style="margin-bottom:12px">Associar produto</h3>
    <div style="display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto">
      ${_annProducts.map(p=>`
        <button type="button" class="nr-picker-row" onclick="selectAnnProduct('${p.id}')">
          <img loading="lazy" decoding="async" src="${cldImg(p.images?.[0]?.url, 60)}" alt="">
          <span style="flex:1"><b style="display:block;font-size:12.5px">${esc(p.name)}</b><span style="font-size:11.5px;color:var(--t4)">${fmtMT(p.price)}</span></span>
        </button>`).join('')}
    </div>
    <button class="btn btn-ghost btn-block" style="margin-top:14px" onclick="closeModal()">Cancelar</button>
  </div>`;
  openModal(html);
}
function selectAnnProduct(id){
  _annLinkedProduct = id;
  renderAnnProductChips();
  closeModal();
}

// Comprime antes de subir — mesmo helper do novoproduto.html. Sem isto,
// fotos em bruto da câmara (até 10MB cada, ver addAnnFiles) iam direitas
// para o FormData; com 2-3 fotos numa rede móvel mais lenta, o pedido
// ultrapassava o timeout de upload e falhava com "Não foi possível
// concluir o envio" antes sequer de o servidor responder.
function compressAnnImage(file, maxSize=1600, quality=0.82){
  return window.MediaCompress ? MediaCompress.compressImage(file, maxSize, quality) : Promise.resolve(file);
}

async function postAnnouncement(){
  if(!_myBazar) return;
  const text = document.getElementById('ann-text')?.value?.trim();
  if(!text || text.length<3){ toast('Escreva algo para publicar.','warn'); return; }
  const btn = document.getElementById('ann-submit');
  setLoading(btn, true);
  try{
    const prefix = _annQuick.length ? `[${_annQuick.join(' · ')}]\n` : '';
    const fullText = prefix + text + (_annTags.length ? `\n\n${_annTags.map(t=>'#'+t).join(' ')}` : '');
    const fd = new FormData();
    fd.append('text', fullText);
    fd.append('productId', _annLinkedProduct || '');

    if(_editAnnouncementId){
      // Edição: mantém as fotos existentes que não foram removidas
      // (pela ordem em que ficaram) e envia só as novas a seguir.
      const keepImageIds = _annImages.filter(im=>im.kind==='existing').map(im=>im.id);
      fd.append('keepImageIds', JSON.stringify(keepImageIds));
      const newImgs = _annImages.filter(im=>im.kind==='new');
      if(newImgs.length) toast(`A preparar ${newImgs.length} imagem${newImgs.length>1?'ns':''} para envio…`,'info');
      for(const im of newImgs){ fd.append('images', await compressAnnImage(im.file)); }
      const res = await api.putForm(`/bazars/${_myBazar.id}/announcements/${_editAnnouncementId}`, fd);
      const uploadErrors = res?.data?.imageUploadErrors;
      if(uploadErrors?.length){
        toast(`Post actualizado, mas ${uploadErrors.length===1?'a foto não foi aceite':`${uploadErrors.length} fotos não foram aceites`}: ${uploadErrors[0]}`,'warn');
      } else {
        toast('Post actualizado!','ok');
      }
      go('anuncios.html');
      return;
    }

    if(_annImages.length) toast(`A preparar ${_annImages.length} imagem${_annImages.length>1?'ns':''} para envio…`,'info');
    for(const im of _annImages){ fd.append('images', await compressAnnImage(im.file)); }
    const res = await api.postForm(`/bazars/${_myBazar.id}/announcements`, fd);
    // O backend cria o post mesmo que o upload de UMA OU MAIS fotos
    // falhe (ex.: falha momentânea do Cloudinary) — sem isto, o post
    // ficava publicado sem imagem e o vendedor só descobria mais tarde,
    // ao ver o post "vazio" no feed.
    const uploadErrors = res?.data?.imageUploadErrors;
    if(uploadErrors?.length){
      toast(`Post publicado, mas ${uploadErrors.length===1?'a foto não foi aceite':`${uploadErrors.length} fotos não foram aceites`}: ${uploadErrors[0]}`,'warn');
    } else {
      toast('Post publicado!','ok');
    }
    go('anuncios.html');
  }catch(e){ setLoading(btn, false); toast(apiErrorMessage(e),'err'); }
}

function saveAnnDraft(){
  const text = document.getElementById('ann-text')?.value || '';
  let drafts = [];
  try{ drafts = JSON.parse(localStorage.getItem('bz_ann_drafts')||'[]'); }catch{ drafts = []; }
  drafts.unshift({
    id: Date.now(),
    text,
    quick: _annQuick.slice(),
    tags: _annTags.slice(),
    imageCount: _annImages.length,
    savedAt: new Date().toISOString(),
  });
  drafts = drafts.slice(0,5);
  localStorage.setItem('bz_ann_drafts', JSON.stringify(drafts));
  toast('Rascunho guardado.','ok');
}
function openAnnDrafts(){
  let drafts = [];
  try{ drafts = JSON.parse(localStorage.getItem('bz_ann_drafts')||'[]'); }catch{ drafts = []; }
  const list = drafts.length ? drafts.map(d=>`
    <div class="hs-tpl-card" style="cursor:default">
      <b>${esc(d.text ? (d.text.slice(0,40) + (d.text.length>40?'…':'')) : 'Sem texto')}</b>
      <span>${d.tags?.length ? '#'+d.tags.join(' #')+' · ' : ''}${new Date(d.savedAt).toLocaleDateString('pt-PT')}</span>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button type="button" class="btn btn-primary btn-sm" style="flex:1" onclick="restoreAnnDraft(${d.id})">Restaurar</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="deleteAnnDraft(${d.id})" aria-label="Eliminar rascunho">${icon('trash',14,2)}</button>
      </div>
    </div>`).join('')
    : `<p style="font-size:12.5px;color:var(--t4);text-align:center;padding:20px 0">Ainda não tens rascunhos guardados.</p>`;
  const html = `<div class="card" style="max-width:420px">
    <h3 style="margin-bottom:4px">Rascunhos</h3>
    <p style="font-size:12.5px;color:var(--t3);margin-bottom:16px">Nota: as fotos não são guardadas — volta a adicioná-las ao restaurar.</p>
    <div style="display:flex;flex-direction:column;gap:8px">${list}</div>
    <button type="button" class="btn btn-ghost btn-block" style="margin-top:16px" onclick="saveAnnDraft();closeModal();openAnnDrafts()">${icon('folder',15,2)} Guardar rascunho atual</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">Fechar</button>
  </div>`;
  openModal(html);
}
function restoreAnnDraft(id){
  const drafts = JSON.parse(localStorage.getItem('bz_ann_drafts')||'[]');
  const d = drafts.find(x=>x.id===id);
  if(!d) return;
  document.getElementById('ann-text').value = d.text||'';
  document.getElementById('ann-count').textContent = (d.text||'').length;
  _annQuick = d.quick||[];
  _annTags = d.tags||[];
  renderAnnQuickTags();
  renderHashtags();
  renderAnnPreview();
  closeModal();
  toast('Rascunho restaurado.','ok');
}
function deleteAnnDraft(id){
  let drafts = JSON.parse(localStorage.getItem('bz_ann_drafts')||'[]');
  drafts = drafts.filter(x=>x.id!==id);
  localStorage.setItem('bz_ann_drafts', JSON.stringify(drafts));
  openAnnDrafts();
}
</script></body></html>
