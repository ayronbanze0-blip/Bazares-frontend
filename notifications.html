<script>
let _notifPage = 1;
let _notifHasMore = true;
let _notifCurrentFilter = 'all';

initPage({ active:'notifications.html', requireAuth:true, onReady: async(user) => {
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="np-header">
      <button class="np-header-btn" onclick="goBack()" aria-label="Voltar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
      <h1>Notificações</h1>
      <button class="np-header-btn" onclick="markAllNotifsReadPage()" aria-label="Marcar todas como lidas" title="Marcar todas como lidas">${icon('check',16,2.4)}</button>
    </div>
    <div class="sh-row" id="np-desktop-title" style="align-items:center">
      <h1 style="font-size:19px;margin:0">Notificações</h1>
      <button class="btn btn-ghost btn-xs" onclick="markAllNotifsReadPage()">Marcar todas como lidas</button>
    </div>
    <div style="display:flex;gap:8px;margin:10px 0 16px">
      <button class="btn btn-xs btn-primary" id="nf-filter-all" onclick="filterNotifPage('all')">Todas</button>
      <button class="btn btn-xs btn-ghost" id="nf-filter-unread" onclick="filterNotifPage('unread')">Não lidas</button>
    </div>
    <div id="np-list" style="display:flex;flex-direction:column;gap:2px"></div>
    <div id="np-sentinel" style="text-align:center;padding:20px;min-height:1px"></div>
  `;
  await loadNotifPage(1, 'all');
}});

async function filterNotifPage(filter){
  _notifCurrentFilter = filter;
  document.getElementById('nf-filter-all').className = `btn btn-xs ${filter==='all'?'btn-primary':'btn-ghost'}`;
  document.getElementById('nf-filter-unread').className = `btn btn-xs ${filter==='unread'?'btn-primary':'btn-ghost'}`;
  await loadNotifPage(1, filter);
}

let _notifIO = null, _notifLoading = false;
function _setupNotifInfiniteScroll(filter){
  const sentinel = document.getElementById('np-sentinel');
  if (!sentinel) return;
  if (_notifIO) _notifIO.disconnect();
  _notifIO = new IntersectionObserver(entries=>{
    if (entries[0].isIntersecting && !_notifLoading && _notifHasMore) loadNotifPage(_notifPage+1, filter);
  }, { rootMargin: '600px 0px' });
  _notifIO.observe(sentinel);
}

async function loadNotifPage(page, filter){
  if (_notifLoading) return;
  _notifLoading = true;
  const list = document.getElementById('np-list');
  const sentinel = document.getElementById('np-sentinel');
  if(page===1) skeletonRows(list, 6);
  else if(sentinel) sentinel.innerHTML = `<span class="spinner spinner-dark"></span>`;
  try{
    const params = { page, limit: 20 };
    if(filter==='unread') params.unreadOnly = 'true';
    const r = await api.get('/notifications', params);
    const notifs = r?.data?.notifications || [];
    const meta = r?.data?.meta || {};
    _notifHasMore = meta.page < meta.totalPages;
    if(page===1) list.innerHTML = '';
    if(page===1 && notifs.length===0){
      list.innerHTML = `<div class="empty" style="padding:50px 20px;text-align:center;color:var(--t3)">
        <div style="margin-bottom:10px;color:var(--t4)">${icon('bell',40,1.4)}</div>
        <p>${filter==='unread'?'Sem notificações por ler.':'Ainda sem notificações.'}</p>
      </div>`;
      _notifPage = page;
      if(sentinel) sentinel.innerHTML = '';
      return;
    }
    list.insertAdjacentHTML('beforeend', notifs.map(notifPageItemHtml).join(''));
    _notifPage = page;
    if(sentinel) sentinel.innerHTML = '';
    _setupNotifInfiniteScroll(filter);
  }catch{
    if(page===1) list.innerHTML = `<div style="text-align:center;padding:30px;color:var(--t3)">Falha ao carregar. <button class="btn btn-ghost btn-sm" onclick="loadNotifPage(1,'${filter}')">Tentar de novo</button></div>`;
    else if(sentinel) sentinel.innerHTML = `<button type="button" class="btn btn-soft btn-sm" onclick="loadNotifPage(${page},'${filter}')">Tentar novamente</button>`;
  } finally {
    _notifLoading = false;
  }
}

function notifPageItemHtml(n){
  const dest = notifDestination(n);
  const ico = notifIcon(n);
  return `
  <div class="ni${n.read ? '' : ' unread'}" id="np-item-${n.id}" style="border-radius:var(--r);padding:12px;display:flex;gap:10px;align-items:flex-start">
    <div onclick="handleNotifPageClick('${n.id}','${dest||''}')" style="flex:1;display:flex;gap:10px;cursor:${dest?'pointer':'default'}">
      <div style="font-size:20px;flex-shrink:0;line-height:1">${ico}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13.5px">${esc(n.title)}</div>
        <div style="font-size:12.5px;color:var(--t2);margin-top:2px">${esc(n.message)}</div>
        <div style="font-size:10.5px;color:var(--t4);margin-top:4px">${fmtDate(n.createdAt)}</div>
      </div>
      ${!n.read ? `<div style="width:8px;height:8px;border-radius:50%;background:var(--blu);flex-shrink:0;margin-top:6px"></div>` : ''}
    </div>
    <button class="btn-icon btn-xs" title="Apagar" aria-label="Apagar notificação" onclick="deleteNotifPage('${n.id}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
  </div>`;
}

async function handleNotifPageClick(id, dest){
  try{ await api.patch(`/notifications/${id}/read`); }catch{}
  document.getElementById(`np-item-${id}`)?.classList.remove('unread');
  refreshNotifDot();
  if(dest) go(dest);
}

async function deleteNotifPage(id){
  try{
    await api.delete(`/notifications/${id}`);
    document.getElementById(`np-item-${id}`)?.remove();
  }catch(e){ toast(apiErrorMessage(e),'err'); }
}

async function markAllNotifsReadPage(){
  try{ await api.patch('/notifications/read-all'); }catch{}
  document.querySelectorAll('.ni.unread').forEach(e => e.classList.remove('unread'));
  refreshNotifDot();
  toast('Todas marcadas como lidas.','ok');
}
</script>
