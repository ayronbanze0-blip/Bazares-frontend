/* ── Imagens ──────────────────────────────────────────────── */
let _imgState=[];
// Ronda 42 — sem isto, ficheiros ainda por gravar ficavam com o
// objectURL preso em memória se a pessoa saísse a meio via SPA.
document.addEventListener('bz:spa-leave', () => { _imgState.forEach(it => { if (it?.previewUrl) URL.revokeObjectURL(it.previewUrl); }); }, { once: true });
const MAX_IMAGES=20;

function initImageUploader(){
  _imgState=[];
  renderImgGrid();
  const drop=document.getElementById('imgup-drop');
  const input=document.getElementById('imgup-input');
  input.addEventListener('change', e=>{ addFiles(e.target.files); input.value=''; });
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('drag-over'); });
  drop.addEventListener('dragleave', ()=> drop.classList.remove('drag-over'));
  drop.addEventListener('drop', e=>{
    e.preventDefault(); drop.classList.remove('drag-over');
    if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });
}

/* Reduz uma imagem antes do envio — mesma lógica de my-products.html.
   O trabalho pesado corre numa Worker thread (js/media-compress.js). */
function compressImage(file, maxSize=1600, quality=0.82){
  return window.MediaCompress ? MediaCompress.compressImage(file, maxSize, quality) : Promise.resolve(file);
}

function addFiles(fileList){
  const accepted=['image/jpeg','image/jpg','image/png','image/webp'];
  const files=Array.from(fileList);
  let rejected=0, tooBig=0;
  for(const file of files){
    if(_imgState.length>=MAX_IMAGES){ toast(`Máximo de ${MAX_IMAGES} imagens por post.`,'warn'); break; }
    if(!accepted.includes(file.type)){ rejected++; continue; }
    if(file.size>10*1024*1024){ tooBig++; continue; }
    _imgState.push({kind:'new', file, previewUrl:URL.createObjectURL(file)});
  }
  if(rejected) toast('Algumas imagens foram ignoradas (formato não suportado). Use JPG, PNG ou WEBP.','warn');
  if(tooBig) toast('Algumas imagens excedem 10MB e foram ignoradas.','warn');
  renderImgGrid();
}

function removeImg(idx){
  const item=_imgState[idx];
  if(item?.previewUrl) URL.revokeObjectURL(item.previewUrl);
  _imgState.splice(idx,1);
  renderImgGrid();
}

function editImg(idx){
  const item=_imgState[idx];
  if(!item) return;
  openImageEditor(item.file, {
    onDone: (file) => {
      if(item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      _imgState[idx] = { kind:'new', file, previewUrl: URL.createObjectURL(file) };
      renderImgGrid();
      toast('Foto editada.','ok');
    }
  });
}

let _dragIdx=null;
function renderImgGrid(){
  const grid=document.getElementById('imgup-grid');
  const counter=document.getElementById('imgup-counter');
  const drop=document.getElementById('imgup-drop');
  if(!grid) return;
  counter.textContent=`${_imgState.length}/${MAX_IMAGES}`;
  if(drop) drop.style.display = _imgState.length ? 'none' : '';
  grid.innerHTML=_imgState.map((item,i)=>`<div class="imgup-thumb" draggable="true" data-idx="${i}">
      ${_imgState.length>1?'<span class="imgup-grip">⠿</span>':''}
      <img loading="lazy" decoding="async" src="${esc(item.previewUrl)}" alt="" onclick="event.stopPropagation();openImageLightbox('${esc(item.previewUrl)}')">
      <button type="button" class="imgup-edit" onclick="event.stopPropagation();editImg(${i})" title="Editar foto">${icon('pencil',12,2.2)}</button>
      <button type="button" class="imgup-rm" onclick="event.stopPropagation();removeImg(${i})" aria-label="Remover imagem"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      ${i===0?'<div class="imgup-cover">Capa</div>':''}
    </div>`).join('') + (_imgState.length && _imgState.length<MAX_IMAGES ? `<div class="imgup-add" onclick="document.getElementById('imgup-input').click()" aria-label="Adicionar mais fotos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>` : '');

  grid.querySelectorAll('.imgup-thumb').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ _dragIdx=+el.dataset.idx; el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); grid.querySelectorAll('.drag-target').forEach(x=>x.classList.remove('drag-target')); });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-target'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-target'));
    el.addEventListener('drop', e=>{
      e.preventDefault();
      const targetIdx=+el.dataset.idx;
      if(_dragIdx===null||_dragIdx===targetIdx) return;
      const [moved]=_imgState.splice(_dragIdx,1);
      _imgState.splice(targetIdx,0,moved);
      _dragIdx=null;
      renderImgGrid();
    });
  });
}

/* ── IA ───────────────────────────────────────────────────── */
async function generateWithAI(){
  const nameEl=document.getElementById('pm-name');
  const name=nameEl?.value?.trim();
  if(!name){ toast('Escreve o nome do produto primeiro.','warn'); nameEl?.focus(); return; }
  const catEl=document.getElementById('pm-cat');
  const condEl=document.getElementById('pm-cond');
  const kwEl=document.getElementById('pm-ai-keywords');
  const btn=document.getElementById('ai-gen-btn');
  setLoading(btn,true);
  try{
    const res=await api.post('/products/generate-description',{
      name, category:catEl?.value||'', condition:condEl?.value||'', keywords:kwEl?.value?.trim()||''
    });
    const data=res?.data||{};
    if(data.description) document.getElementById('pm-desc').value=data.description;
    if(data.suggestedCategory && catEl){
      const opt=[...catEl.options].find(o=>o.value.toLowerCase()===String(data.suggestedCategory).toLowerCase());
      if(opt) catEl.value=opt.value;
    }
    toast('Descrição gerada — revê antes de publicar.','ok');
  }catch(e){
    if (isPremiumRequiredError(e)) { showPremiumUpsell(e.message); }
    else toast(apiErrorMessage(e),'warn');
  }finally{
    setLoading(btn,false);
  }
}

async function suggestPrice(){
  const catEl=document.getElementById('pm-cat');
  const nameEl=document.getElementById('pm-name');
  const category=catEl?.value;
  if(!category){ toast('Escolhe a categoria primeiro.','warn'); return; }
  try{
    toast('A analisar preços de produtos semelhantes...','info');
    const res=await api.get('/premium/price-suggestion',{ category, name: nameEl?.value?.trim()||'' });
    const d=res?.data;
    if(!d || d.sampleSize < 3){ toast(d?.message||'Sem dados suficientes para sugerir um preço.','warn'); return; }
    openModal(`
      <div class="modal-hd"><h3>Preço sugerido</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
      <p style="font-size:12.5px;color:var(--t3);margin-bottom:14px">Baseado em ${d.sampleSize} produtos semelhantes já publicados.</p>
      <div style="text-align:center;padding:14px 0;margin-bottom:14px;background:var(--b-50);border-radius:12px">
        <div style="font-size:11px;color:var(--t3)">Preço sugerido</div>
        <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:28px;color:var(--grn)">${fmtMT(d.suggested)}</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t3);margin-bottom:16px">
        <span>Mín: ${fmtMT(d.min)}</span><span>Média: ${fmtMT(d.average)}</span><span>Máx: ${fmtMT(d.max)}</span>
      </div>
      <button class="btn btn-primary btn-block" onclick="document.getElementById('pm-price').value=${d.suggested};closeModal()">Usar este preço</button>
    `);
  }catch(e){
    if (isPremiumRequiredError(e)) { showPremiumUpsell(e.message); return; }
    toast(apiErrorMessage(e),'err');
  }
}

/* ── Guardar ──────────────────────────────────────────────── */
async function saveProduct(){
  const name=document.getElementById('pm-name').value.trim();
  const description=document.getElementById('pm-desc').value.trim();
  const price=parseFloat(document.getElementById('pm-price').value);
  const stock=parseInt(document.getElementById('pm-stock').value)||0;
  const category=document.getElementById('pm-cat').value;
  const location=document.getElementById('pm-loc').value.trim();
  const condition=document.getElementById('pm-cond').value;
  const color=document.getElementById('pm-color').value.trim();
  const size=document.getElementById('pm-size').value.trim();
  const deliveryMethod=document.getElementById('pm-del').value;

  if(!name||!description||!price||!category){toast('Preencha os campos obrigatórios (*).','warn');return;}
  if(_imgState.length===0){toast('Adicione pelo menos uma imagem do produto.','warn');return;}

  const btn=document.getElementById('pm-submit');
  setLoading(btn,true);
  try{
    const fd=new FormData();
    fd.append('name',name); fd.append('description',description); fd.append('price',price);
    fd.append('stock',stock); fd.append('category',category); fd.append('location',location);
    fd.append('condition',condition); fd.append('color',color); fd.append('size',size);
    fd.append('deliveryMethod',deliveryMethod);

    toast(`A preparar ${_imgState.length} imagem${_imgState.length>1?'ns':''} para envio…`,'info');
    for(const it of _imgState){
      const compressed = await compressImage(it.file);
      fd.append('images', compressed);
    }

    const res=await api.postForm('/products',fd);
    const imagesFailed=res?.data?.imagesFailed||0, serverMsg=res?.message;

    if(imagesFailed>0){
      toast(serverMsg||'Produto guardado, mas algumas fotos falharam — tente adicioná-las novamente em Editar.','warn');
    } else {
      toast('Produto publicado! <svg class="ico-inline ico-fill" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 21l3-9 6 6z"/><circle cx="18" cy="6" r="1.5"/><circle cx="14" cy="4" r="1"/><circle cx="20" cy="11" r="1"/><path d="M13 2l1.5 1.5L13 5l-1.5-1.5z"/></svg>');
    }
    go('my-products.html');
  }catch(e){setLoading(btn,false);toast(apiErrorMessage(e),'err');}
}

function saveNpDraft(){
  const draft = {
    id: Date.now(),
    name: document.getElementById('pm-name')?.value||'',
    price: document.getElementById('pm-price')?.value||'',
    stock: document.getElementById('pm-stock')?.value||'',
    cat: document.getElementById('pm-cat')?.value||'',
    loc: document.getElementById('pm-loc')?.value||'',
    del: document.getElementById('pm-del')?.value||'',
    cond: document.getElementById('pm-cond')?.value||'',
    color: document.getElementById('pm-color')?.value||'',
    size: document.getElementById('pm-size')?.value||'',
    desc: document.getElementById('pm-desc')?.value||'',
    savedAt: new Date().toISOString(),
  };
  if(!draft.name && !draft.desc){ toast('Preenche pelo menos o nome ou a descrição antes de guardar.','warn'); return; }
  let drafts = [];
  try{ drafts = JSON.parse(localStorage.getItem('bz_np_drafts')||'[]'); }catch{ drafts = []; }
  drafts.unshift(draft);
  drafts = drafts.slice(0,5);
  localStorage.setItem('bz_np_drafts', JSON.stringify(drafts));
  toast('Rascunho guardado.','ok');
}
function openPmDrafts(){
  let drafts = [];
  try{ drafts = JSON.parse(localStorage.getItem('bz_np_drafts')||'[]'); }catch{ drafts = []; }
  const list = drafts.length ? drafts.map(d=>`
    <div class="hs-tpl-card" style="cursor:default">
      <b>${esc(d.name || 'Sem nome')}</b>
      <span>${d.price ? fmtMT(Number(d.price))+' · ' : ''}${new Date(d.savedAt).toLocaleDateString('pt-PT')}</span>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button type="button" class="btn btn-primary btn-sm" style="flex:1" onclick="restoreNpDraft(${d.id})">Restaurar</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="deleteNpDraft(${d.id})" aria-label="Eliminar rascunho">${icon('trash',14,2)}</button>
      </div>
    </div>`).join('')
    : `<p style="font-size:12.5px;color:var(--t4);text-align:center;padding:20px 0">Ainda não tens rascunhos guardados.</p>`;
  const html = `<div class="card" style="max-width:420px">
    <h3 style="margin-bottom:4px">Rascunhos</h3>
    <p style="font-size:12.5px;color:var(--t3);margin-bottom:16px">Nota: as fotos não são guardadas — volta a adicioná-las ao restaurar.</p>
    <div style="display:flex;flex-direction:column;gap:8px">${list}</div>
    <button type="button" class="btn btn-ghost btn-block" style="margin-top:16px" onclick="saveNpDraft();closeModal();openPmDrafts()">${icon('folder',15,2)} Guardar rascunho atual</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">Fechar</button>
  </div>`;
  openModal(html);
}
function restoreNpDraft(id){
  const drafts = JSON.parse(localStorage.getItem('bz_np_drafts')||'[]');
  const d = drafts.find(x=>x.id===id);
  if(!d) return;
  const set = (id,v)=>{ const el=document.getElementById(id); if(el && v!==undefined && v!=='') el.value=v; };
  set('pm-name', d.name); set('pm-price', d.price); set('pm-stock', d.stock);
  set('pm-cat', d.cat); set('pm-loc', d.loc); set('pm-del', d.del);
  set('pm-cond', d.cond); set('pm-color', d.color); set('pm-size', d.size);
  set('pm-desc', d.desc);
  const descEl = document.getElementById('pm-desc'), descCount = document.getElementById('pm-desc-count');
  if(descEl && descCount){
    const len = descEl.value.length;
    descCount.textContent = `${len}/1000`;
    descCount.classList.toggle('field-counter--near', len>=850 && len<1000);
    descCount.classList.toggle('field-counter--full', len>=1000);
  }
  closeModal();
  toast('Rascunho restaurado.','ok');
}
function deleteNpDraft(id){
  let drafts = JSON.parse(localStorage.getItem('bz_np_drafts')||'[]');
  drafts = drafts.filter(x=>x.id!==id);
  localStorage.setItem('bz_np_drafts', JSON.stringify(drafts));
  openPmDrafts();
}
</script></body></html>
