<body data-require-auth="1" data-roles="ADMIN">
<header id="topbar"></header>
<div class="overlay" id="overlay"></div>
<aside id="sidebar" class="closed"></aside>
<main id="main">
  <div class="pg-body">
    <div class="sh-row">
      <div class="sh"><h2 id="au-title">Utilizadores</h2></div>
      <div style="display:flex;gap:8px">
        <select id="au-role" style="width:160px">
          <option value="">Todos os tipos</option><option value="SELLER">Vendedores</option>
          <option value="BUYER">Compradores</option><option value="REVENDEDOR">Revendedores</option><option value="ADMIN">Administradores</option>
        </select>
        <input id="au-q" placeholder="Pesquisar..." style="width:200px">
        <button id="au-pending-btn" class="btn btn-outline btn-sm" onclick="togglePendingVerification()">Fila de verificação</button>
      </div>
    </div>
    <div id="au-list" class="reveal"><div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div></div>
    <div id="au-pagination"></div>
  </div>
</main>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/js/config.js?v=1788617999"></script><script src="/js/seo.js?v=1788617999"></script><script src="/js/action-queue.js?v=1788617999"></script>
<script src="/js/api.js?v=1788617999"></script>
  <script src="/js/core.js?v=1788617999"></script><script src="/js/runtime.js?v=1788617999"></script>
  <script src="/js/offline-store.js?v=1788617999"></script>
  <script src="/js/virtual-feed.js?v=1788617999"></script>
<script src="/js/app.js?v=1788617999"></script><script src="/js/mentions.js?v=1788617999"></script><script src="/js/install-prompt.js?v=1788617999"></script><script src="/js/push-notifications.js?v=1788617999"></script>
<script>
let _auPendingOnly = false;
initPage({ active: 'admin-users.html', requireAuth: true, roles: ['ADMIN'], onReady: () => {
  let t;
  document.getElementById('au-role').addEventListener('change', () => loadUsers(1));
  document.getElementById('au-q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => loadUsers(1), 350); });
  loadUsers(1);
}});

function togglePendingVerification() {
  _auPendingOnly = !_auPendingOnly;
  document.getElementById('au-pending-btn').className = _auPendingOnly ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
  loadUsers(1);
}

async function loadUsers(page = 1) {
  const list = document.getElementById('au-list');
  const role = document.getElementById('au-role').value;
  const q = document.getElementById('au-q').value.trim();
  try {
    const res = await api.get('/admin/users', { role: role || undefined, q: q || undefined, page, limit: 30, pendingVerification: _auPendingOnly ? 'true' : undefined });
    const users = res?.data?.users || [];
    const meta = res?.data?.meta || {};
    document.getElementById('au-title').textContent = `Utilizadores (${meta.total ?? users.length})`;
    if (!users.length) {
      list.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><h3>Sem utilizadores</h3></div>`;
      document.getElementById('au-pagination').innerHTML = '';
      return;
    }
    list.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Email</th><th>Tipo</th><th>Bazar</th><th>Avaliação</th><th>Estado</th><th>Acções</th></tr></thead><tbody>
      ${users.map(u => `<tr>
        <td><strong>${esc(u.name)}</strong>${u.isPremium?' <span style="color:var(--a-500)" title="Premium"><svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="width:12px;height:12px"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.7 7.1-.7z"/></svg></span>':''}${u.revendedor ? `<div style="font-size:10px;color:var(--t4)">via ${esc(u.revendedor.name)}</div>` : ''}${u.verificationRequestedAt && !u.verifiedSeller ? `<div style="font-size:10px;color:var(--t4)">Pediu verificação: ${fmtDate(u.verificationRequestedAt)}</div>` : ''}</td>
        <td style="font-size:12px;color:var(--t3)">${esc(u.email)}</td>
        <td><span class="badge b-gray">${ROLE_LABEL[u.role]}</span></td>
        <td>${u.bazar ? `${esc(u.bazar.name)} (${fmtMT(u.bazar.totalSales)})` : 'Sem loja'}</td>
        <td>${u.ratingCount ? `${u.rating.toFixed(1)} <svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>` : 'Novo'}</td>
        <td><span class="badge ${u.active?'b-grn':'b-red'}">${u.active?'Activo':'Suspenso'}</span></td>
        <td style="white-space:nowrap">
          ${u.role!=='ADMIN' ? `<button class="btn btn-ghost btn-xs" onclick="toggleUser('${u.id}','${esc(u.name)}')">${u.active?'Suspender':'Reactivar'}</button>` : ''}
          ${u.role==='SELLER' ? `<button class="btn btn-ghost btn-xs" style="margin-left:4px" onclick="verifySeller('${u.id}','${esc(u.name)}')">${u.verifiedSeller?'Reverificar':'Verificar'}</button>` : ''}
          <button class="btn btn-ghost btn-xs" style="margin-left:4px" onclick="messageUser('${u.id}')">Msg</button>
          ${u.role!=='ADMIN' ? `<button class="btn btn-ghost btn-xs" style="margin-left:4px;color:var(--r-600)" onclick="deleteUser('${u.id}','${esc(u.name)}')">Eliminar</button>` : ''}
        </td>
      </tr>`).join('')}
    </tbody></table></div>`;
    renderPagination('au-pagination', meta, loadUsers);
  } catch (e) {
    list.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}

function toggleUser(id, name) {
  openModal(`
    <div class="modal-hd"><h3>Confirmar acção</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <p style="margin-bottom:20px">Tem a certeza que quer alterar o estado da conta de <strong>${esc(name)}</strong>? Isto pode impedir o acesso da pessoa à plataforma.</p>
    <div style="display:flex;gap:9px">
      <button class="btn btn-danger" style="flex:1" onclick="confirmToggleUser('${id}','${esc(name)}')">Confirmar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
}
async function confirmToggleUser(id, name) {
  try {
    const res = await api.patch(`/admin/users/${id}/toggle`);
    closeModal();
    toast(`${name}: ${res?.data?.user?.active ? 'reactivado' : 'suspenso'}.`, res?.data?.user?.active ? 'ok' : 'warn');
    loadUsers();
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

async function verifySeller(id, name) {
  try {
    const res = await api.patch(`/admin/users/${id}/verify-seller`);
    toast(`${name} ${res?.data?.user?.verifiedSeller ? 'verificado' : 'desverificado'}.`);
    loadUsers();
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

function messageUser(id) {
  openModal(`
    <div class="modal-hd"><h2>Enviar mensagem</h2><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="fg"><label>Mensagem</label><textarea id="amsg" rows="4" placeholder="Escreva a mensagem..."></textarea></div>
    <div style="display:flex;gap:9px"><button class="btn btn-primary" onclick="sendUserMessage('${id}')">Enviar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>`);
}
async function sendUserMessage(id) {
  const message = document.getElementById('amsg').value.trim();
  if (!message) { toast('Escreva a mensagem.', 'warn'); return; }
  try {
    await api.post(`/admin/users/${id}/message`, { message });
    closeModal();
    toast('Mensagem enviada.');
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

function deleteUser(id, name) {
  openModal(`
    <div class="modal-hd"><h3>Eliminar conta</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <p style="margin-bottom:14px">Esta acção é <strong>permanente e irreversível</strong>. Elimina a conta de <strong>${esc(name)}</strong> e todos os dados associados (bazar, produtos, encomendas, avaliações, carteira, mensagens).</p>
    <div class="fg"><label>Escreva o nome exacto para confirmar</label><input id="adu-confirm" placeholder="${esc(name)}"></div>
    <div style="display:flex;gap:9px">
      <button class="btn btn-danger" style="flex:1" onclick="confirmDeleteUser('${id}','${esc(name)}')">Eliminar definitivamente</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
}
async function confirmDeleteUser(id, name) {
  const typed = document.getElementById('adu-confirm').value.trim();
  if (typed !== name) { toast('O nome não corresponde.', 'warn'); return; }
  try {
    await api.delete(`/admin/users/${id}`);
    closeModal();
    toast(`${name}: conta eliminada.`, 'ok');
    loadUsers();
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}
</script>
