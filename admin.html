<script>
initPage({ active: 'admin.html', requireAuth: true, roles: ['ADMIN'], onReady: async (user) => {
  const view = document.getElementById('view');
  try {
    const res = await api.get('/admin/overview');
    const d = res.data;
    const totalOrders = d.ordersByStatus.reduce((s,o)=>s+o._count,0) || 1;

    view.innerHTML = `
      <div class="pg-hero pg-hero--compact">
        <div class="pg-hero-content">
          <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/></svg> Administração</div>
          <h1>${greeting()}, ${esc((user?.name||'').split(' ')[0]||'Admin')}</h1>
          <p>Visão geral da plataforma — utilizadores, vendas e actividade em tempo real.</p>
        </div>
      </div>
      <div class="stats-row reveal">
        ${[['Vendedores',d.sellers],['Compradores',d.buyers],['Revendedores',`${d.revendedores}/${d.revendedoresMax}`],['Bazares',d.bazars],['Produtos',d.products],['Encomendas',d.orders]].map(([l,v])=>`<div class="stat acc"><div class="val">${v}</div><div class="lbl">${l}</div></div>`).join('')}
      </div>
      <div class="stats-row reveal">
        <div class="stat" style="border-left:3px solid var(--grn)"><div class="val" style="color:var(--grn)">${fmtMT(d.totalSalesVolume)}</div><div class="lbl">Volume de vendas</div></div>
        <div class="stat" style="border-left:3px solid #D97706"><div class="val" style="color:var(--amb)">${fmtMT(d.totalFeesGenerated)}</div><div class="lbl">Taxas geradas</div></div>
        <div class="stat" style="border-left:3px solid var(--red)"><div class="val" style="color:var(--red)">${d.pendingReports}</div><div class="lbl">Denúncias pendentes</div></div>
      </div>
      <div class="row2 reveal">
        <div class="card">
          <h4 style="margin-bottom:12px">Estado das encomendas</h4>
          ${d.ordersByStatus.map(({status,_count}) => `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span style="min-width:110px;font-size:12px;color:var(--t3)">${STATUS_LABEL[status]||status}</span>
            <div class="prog" style="flex:1"><div class="prog-fill pf-dark" style="width:${Math.round((_count/totalOrders)*100)}%"></div></div>
            <span style="font-size:12px;font-weight:700;min-width:28px;text-align:right">${_count}</span>
          </div>`).join('')}
        </div>
        <div class="card">
          <h4 style="margin-bottom:12px">Acções rápidas</h4>
          <div style="display:flex;flex-direction:column;gap:7px">
            <button class="btn btn-ghost btn-sm btn-block" onclick="go('admin-users.html')">Gerir Utilizadores</button>
            <button class="btn btn-ghost btn-sm btn-block" onclick="go('admin-orders.html')">Todas as encomendas</button>
            <button class="btn btn-ghost btn-sm btn-block" onclick="go('admin-monitoring.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Monitorização</button>
            <button class="btn btn-ghost btn-sm btn-block" onclick="go('admin-denuncias.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg> Denúncias</button>
            <button class="btn btn-ghost btn-sm btn-block" onclick="go('admin-broadcast.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l4 4V6l-4 4H4a1 1 0 0 0-1 1z"/><path d="M15 8a4 4 0 0 1 0 8"/><path d="M18 5a8 8 0 0 1 0 14"/></svg> Enviar aviso</button>
          </div>
        </div>
      </div>`;
  } catch (e) {
    view.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}});
</script>
