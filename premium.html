<script>
let _premUser = null;
let _premStatus = null;

initPage({ active:'premium.html', requireAuth:true, onReady: async (user) => {
  _premUser = user;
  await loadPremium();
}});

async function loadPremium() {
  const view = document.getElementById('view');
  view.innerHTML = `<div style="text-align:center;padding:60px"><span class="spinner spinner-dark"></span></div>`;

  try { _premStatus = (await api.get('/premium/me'))?.data || null; }
  catch (e) { toast(apiErrorMessage(e), 'err'); _premStatus = null; }

  const isActive = !!_premStatus?.isPremium;
  const hasBazar = !!(_premUser.bazar || _premUser.role === 'SELLER');

  const benefits = [
    ['Selo Premium visível no seu perfil e bazar', true],
    ['Produtos e bazar em destaque no topo da pesquisa', true],
    [_premStatus?.feeRate === 0 ? 'Isenção total da taxa de comissão (0%)' : `Taxa de comissão reduzida para ${_premStatus?.feeRate ?? 0}%`, true],
    ['Dashboard de analytics avançado (vendas por dia, top produtos)', true],
    ['Banner promocional personalizado no seu bazar', true],
    ['Selo de Vendedor Verificado atribuído automaticamente', true],
    ['"Destaque do dia" — fixe 1 produto no topo do bazar por 24h', true],
    ['Botão de contacto directo por WhatsApp na página do bazar', true],
    ['Exportação de relatórios de vendas e inventário em CSV', true],
    ['Respostas rápidas personalizadas no chat', true],
    ['Assistente de IA: geração de descrições de produtos', true],
    ['Melhorador de fotografias com IA', true],
    ['Assistente de preços com IA', true],
    ['Assistente de atendimento ao cliente com IA no chat', true]
  ];

  view.innerHTML = `
    <div class="prem-hero reveal">
      <span class="prem-pill">${icon('star',14,2)} Conta Premium</span>
      <h1>${isActive ? 'A sua Conta Premium está activa' : 'Destaque o seu bazar na Bazares'}</h1>
      <p>${isActive
        ? `Válida até ${fmtDate(_premStatus.premiumExpiresAt)}. Obrigado por apoiar a plataforma.`
        : 'Selo de confiança, mais visibilidade na pesquisa e isenção total da taxa de comissão — por um valor fixo mensal.'}</p>
      ${!isActive ? `<div class="prem-price">${fmtMT(_premStatus?.price ?? 2499)} <span>/ mês</span></div>` : ''}
    </div>

    ${isActive ? `
      <div class="prem-status-card reveal" style="margin-bottom:22px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div>
            <div class="prem-badge-chip">${icon('star',12,2.2)} PREMIUM</div>
            <p style="font-size:12.5px;color:var(--t3);margin:8px 0 0">Membro desde ${fmtDate(_premStatus.premiumSince)}</p>
          </div>
          <button class="btn btn-outline btn-sm" onclick="openPremiumStk(true)">Renovar agora</button>
        </div>
      </div>
    ` : `
      <div class="reveal" style="display:grid;gap:10px;margin-bottom:22px">
        <button class="btn btn-primary btn-block" style="background:var(--g-green)" onclick="openPremiumStk(false)">
          ${icon('wallet',18,2)} Pagar com M-Pesa / e-Mola
        </button>
        <button class="btn btn-outline btn-block" onclick="openRedeemCode()">
          ${icon('qrcode',18,2)} Tenho um código Premium
        </button>
      </div>
    `}

    <div class="card reveal" style="margin-bottom:22px">
      <h4 style="margin-bottom:14px">O que está incluído</h4>
      <ul class="prem-benefits">
        ${benefits.map(([label, live]) => `
          <li class="${live ? '' : 'soon'}">
            ${icon(live ? 'check' : 'clock', 16, 2)}
            <span>${esc(label)}</span>
            ${live ? '' : '<span class="tag-soon">Em breve</span>'}
          </li>
        `).join('')}
      </ul>
    </div>

    <div id="prem-analytics"></div>
  `;

  if (isActive && hasBazar) loadPremiumAnalytics();
}

async function loadPremiumAnalytics() {
  const root = document.getElementById('prem-analytics');
  if (!root) return;
  root.innerHTML = `<div class="card"><h4 style="margin-bottom:14px">${icon('pulse',16,2)} Analytics avançado</h4><div style="text-align:center;padding:20px"><span class="spinner spinner-dark"></span></div></div>`;

  let data = null;
  try { data = (await api.get('/premium/analytics'))?.data; } catch { root.innerHTML = ''; return; }
  if (!data) { root.innerHTML = ''; return; }

  const days = data.salesByDay || [];
  const maxV = Math.max(...days.map(d => d.total), 1);
  _lastAnalytics = data;

  root.innerHTML = `
    <div class="card reveal" style="margin-bottom:22px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div>
          <h4 style="margin-bottom:4px">${icon('pulse',16,2)} Vendas — últimos 30 dias</h4>
          <p style="font-size:12px;color:var(--t3);margin-bottom:6px">${data.totalOrders30d} encomendas · ${fmtMT(data.totalRevenue30d)} em receita · ${data.whatsappClicks || 0} cliques em "Contactar via WhatsApp"</p>
        </div>
        <button class="btn btn-ghost btn-xs" onclick="exportSalesCSV()" title="Exportar relatório para CSV"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> CSV</button>
      </div>
      ${days.length ? `
        <div class="prem-bar-row">
          ${days.map(d => `<div class="prem-bar" style="height:${Math.max(4, Math.round((d.total / maxV) * 90))}px" title="${d.date}: ${fmtMT(d.total)}"></div>`).join('')}
        </div>
      ` : `<p style="font-size:12.5px;color:var(--t3);padding:16px 0">Ainda sem vendas neste período.</p>`}
    </div>

    <div class="card reveal">
      <h4 style="margin-bottom:14px">${icon('box',16,2)} Top produtos</h4>
      ${data.topProducts?.length ? `
        <div style="display:flex;flex-direction:column;gap:10px">
          ${data.topProducts.map((p, i) => `
            <div style="display:flex;align-items:center;gap:10px;font-size:13px">
              <span style="width:20px;color:var(--t3);font-weight:700">${i + 1}</span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
              <span style="color:var(--t3);font-size:12px">${p.sales} vendas</span>
            </div>
          `).join('')}
        </div>
      ` : `<p style="font-size:12.5px;color:var(--t3)">Sem dados de produtos ainda.</p>`}
    </div>
  `;
}

// ─── Exportar relatório de vendas (30 dias) em CSV ───────────────────
let _lastAnalytics = null;
function exportSalesCSV(){
  if (!_lastAnalytics || !_lastAnalytics.salesByDay?.length) { toast('Ainda sem vendas para exportar.', 'warn'); return; }
  exportToCSV(
    `bazares-vendas-${new Date().toISOString().slice(0,10)}.csv`,
    { date: 'Data', total: 'Total (MT)' },
    _lastAnalytics.salesByDay
  );
}

// ─── STK push: assinar/renovar ─────────────────────────────────────
function openPremiumStk(isRenew) {
  const price = _premStatus?.price ?? 2499;
  openModal(`
    <div class="modal-hd">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--g-gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--n-900)">${icon('star',20,2.2)}</div>
        <div>
          <h3 style="margin-bottom:2px">${isRenew ? 'Renovar' : 'Assinar'} Conta Premium</h3>
          <p style="font-size:11.5px;color:var(--t3);margin:0">${fmtMT(price)} / mês via M-Pesa ou e-Mola</p>
        </div>
      </div>
      <button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button>
    </div>
    <p style="font-size:13px;color:var(--t2);line-height:1.75;margin-bottom:16px">Confirme o seu número abaixo e enviamos um pedido de pagamento directamente para o seu telemóvel. Basta introduzir o seu PIN pessoal para activar a Conta Premium por 30 dias.</p>
    <div class="fg"><label>Número de telefone *</label><input id="prem-msisdn" placeholder="84xxxxxxx ou 86xxxxxxx"></div>
    <button class="btn btn-terra btn-block" onclick="submitPremiumStk()">${icon('wallet',18,2)} Confirmar e enviar pedido</button>
    <p style="font-size:11px;color:var(--t4);text-align:center;margin-top:10px">Pagamento processado com segurança. A Bazares nunca vê nem guarda o seu PIN.</p>
  `);
}

async function submitPremiumStk() {
  const msisdn = document.getElementById('prem-msisdn').value.trim();
  if (!msisdn) { toast('Indique o número de telefone.', 'warn'); return; }

  try {
    await api.post('/premium/subscribe', { msisdn });
    closeModal();
    toast('Pedido enviado! Verifique o seu telemóvel e introduza o PIN para confirmar.', 'info', 6000);
    pollPremiumConfirmation();
  } catch (e) {
    const pendingId = e?.errors?.pendingSubscriptionId;
    if (pendingId) {
      openModal(`
        <div class="modal-hd"><h3>Pagamento anterior pendente</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
        <p style="font-size:12.5px;color:var(--t3);margin-bottom:14px">${esc(apiErrorMessage(e))}</p>
        <button class="btn btn-danger btn-block" style="margin-bottom:8px" onclick="cancelStuckPremiumStk('${pendingId}')">Cancelar pagamento anterior e tentar de novo</button>
        <button class="btn btn-ghost btn-block" onclick="closeModal()">Fechar</button>
      `);
    } else {
      toast(apiErrorMessage(e), 'err');
    }
  }
}

async function cancelStuckPremiumStk(subId) {
  try {
    await api.post(`/premium/subscriptions/${subId}/cancel`);
    toast('Pagamento anterior cancelado. Pode tentar novamente.', 'info');
    closeModal();
    openPremiumStk(false);
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

// ─── Código Premium (gerado pelo admin) ────────────────────────────
function openRedeemCode() {
  openModal(`
    <div class="modal-hd">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--g-green);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff">${icon('qrcode',20,2.2)}</div>
        <div>
          <h3 style="margin-bottom:2px">Resgatar código Premium</h3>
          <p style="font-size:11.5px;color:var(--t3);margin:0">Recebeu um código da equipa Bazares ou de uma parceria?</p>
        </div>
      </div>
      <button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button>
    </div>
    <div class="fg"><label>Código Premium *</label><input id="prem-code" placeholder="BAZ-XXXX-XXXX" style="text-transform:uppercase;letter-spacing:.03em;font-weight:700" maxlength="14"></div>
    <button class="btn btn-primary btn-block" style="background:var(--g-green)" onclick="submitRedeemCode()">${icon('check',18,2)} Resgatar código</button>
  `);
  setTimeout(() => {
    const input = document.getElementById('prem-code');
    if (input) input.oninput = () => { input.value = input.value.toUpperCase(); };
  }, 0);
}

async function submitRedeemCode() {
  const code = document.getElementById('prem-code').value.trim();
  if (!code) { toast('Indique o código Premium.', 'warn'); return; }

  try {
    const res = await api.post('/premium/redeem', { code });
    closeModal();
    toast(res?.message || 'Código resgatado! A sua Conta Premium está activa. ⭐', 'ok', 5000);
    await loadPremium();
  } catch (e) {
    toast(apiErrorMessage(e), 'err');
  }
}

// ─── POLL: confirma quando o pagamento ZumboPay é validado pelo webhook ──
let _premPollToken = 0;
async function pollPremiumConfirmation() {
  const myToken = ++_premPollToken;
  // Ronda 38 — pára logo ao sair da página via SPA.
  const stopOnLeave = () => { if (myToken === _premPollToken) _premPollToken++; };
  document.addEventListener('bz:spa-leave', stopOnLeave, { once: true });
  for (let i = 0; i < 24; i++) {
    await new Promise(r => setTimeout(r, 5000));
    if (myToken !== _premPollToken) return;
    let status = null;
    try { status = (await api.get('/premium/me'))?.data || null; } catch { continue; }
    if (status?.isPremium) {
      toast('Pagamento confirmado! A sua Conta Premium está activa. ⭐', 'ok');
      await loadPremium();
      return;
    }
  }
  if (myToken === _premPollToken) {
    toast('Ainda não recebemos a confirmação do pagamento. Se já introduziu o PIN, a activação acontece em breve — pode voltar a esta página mais tarde para confirmar.', 'info', 7000);
  }
}
