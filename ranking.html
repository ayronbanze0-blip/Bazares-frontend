<script>
function medalRowClass(tier){
  return tier==='OURO'?'rk-row rk-ouro':tier==='PRATA'?'rk-row rk-prata':'rk-row';
}
function rankBadge(rank){
  if(rank===1) return `<span class="rk-num rk-num-1">${icon('trophy',18,2)}</span>`;
  if(rank===2) return `<span class="rk-num rk-num-2">${icon('trophy',18,2)}</span>`;
  if(rank===3) return `<span class="rk-num rk-num-3">${icon('trophy',18,2)}</span>`;
  return `<span class="rk-num">#${rank}</span>`;
}
initPage({ active:'ranking.html', onReady: async()=>{
  const el=document.getElementById('rk-list');
  try{
    const res=await api.get('/bazars/ranking');
    const list=res?.data?.ranking||[];
    const period=res?.data?.period;
    if(period?.label) document.getElementById('rk-period').textContent=`Ranking de ${period.label} — actualizado em tempo real`;
    if(!list.length){
      el.innerHTML=`<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/></svg></div><h3>Ainda sem vendas este mês</h3><p>Assim que houver encomendas entregues, o ranking aparece aqui.</p></div>`;
      return;
    }
    el.innerHTML=`<div class="rk-table">${list.map(s=>`
      <div class="${medalRowClass(s.badge?.tier)}" onclick="go('bazar.html',{slug:'${escJsAttr(s.bazar.slug)}'})">
        ${rankBadge(s.rank)}
        ${bazarLogo(s.bazar)?`<img loading="lazy" decoding="async" class="rk-logo" src="${esc(bazarLogo(s.bazar))}" alt="">`:storeAvatar(s.name,44)}
        <div class="rk-info">
          <div class="rk-name">${esc(s.bazar.name)} ${s.verifiedSeller?`<svg class="ico-inline" style="color:var(--b-500)" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l2.4 2.4 3.4-.6.6 3.4L21 9l-2.4 2.4.6 3.4-3.4.6L14 21l-2-2.4L10 21l-2.4-2.4-3.4.6.6-3.4L3 9l2.4-2.4-.6-3.4 3.4.6L12 2z"/></svg>`:''}</div>
          <div class="rk-seller">${esc(s.name)}</div>
        </div>
        <div class="rk-stats">
          ${badgeChip(s.badge)}
          <div class="rk-count">${s.totalEncomendas} venda(s)</div>
        </div>
      </div>`).join('')}</div>`;
  }catch(e){
    el.innerHTML=`<div class="empty"><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}});
</script></body></html>
