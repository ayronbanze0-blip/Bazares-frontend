<script>
let _products=[], _page=1;
let _selMode=null;        // null | 'edit' | 'stock' | 'del'
let _selectedIds=new Set();

initPage({ active:'my-products.html', requireAuth:true, roles:['SELLER'], onReady: async()=>{
  document.getElementById('view').innerHTML=`
    <div class="pg-hero">
      <div class="pg-hero-content">
        <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> Catálogo</div>
        <h1>Os meus Produtos</h1>
        <p>Gerencie o seu catálogo de produtos</p>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap" class="reveal">
      <div style="position:relative;flex:1;min-width:160px">
        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t4)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input id="psrch" placeholder="Pesquisar produtos..." style="padding-left:40px;border-radius:var(--pill)">
      </div>
      <select id="pcat" style="width:180px;border-radius:var(--pill)"><option value="">Todas as categorias</option></select>
      <button class="btn btn-primary btn-sm" onclick="go('novoproduto.html')">${icon('plus',15,2.4)} Adicionar produto</button>
      <button class="btn btn-ghost btn-sm" onclick="exportProductsCSV()" title="Exportar catálogo para CSV"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Exportar CSV</button>
    </div>
    <div id="prod-sel-banner"></div>
    <div id="prod-grid" class="p-grid"></div>
    <div id="prod-tip" style="margin:18px 0"></div>
    <div id="prod-pagination"></div>
    <div id="pp-fab-root"></div>`;

  const sel=document.getElementById('pcat');
  CATS.forEach(c=>sel.insertAdjacentHTML('beforeend',`<option value="${esc(c.l)}">${esc(c.l)}</option>`));
  let t;
  document.getElementById('psrch').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>loadMyProducts(1),350);});
  document.getElementById('pcat').addEventListener('change',()=>loadMyProducts(1));
  renderFab();
  renderProductTip();
  await loadMyProducts(1);
  if (getParam('action') === 'new') go('novoproduto.html');
  if (getParam('edit')) openEditModal(getParam('edit'));
}});

async function loadMyProducts(page=1){
  _page=page;
  const grid=document.getElementById('prod-grid');
  grid.innerHTML=`<div style="text-align:center;padding:40px;grid-column:1/-1"><span class="spinner spinner-dark"></span></div>`;
  const q=document.getElementById('psrch').value.trim();
  const cat=document.getElementById('pcat').value;
  try{
    const res=await api.get('/products/mine',{q:q||undefined,category:cat||undefined,page,limit:24});
    _products=res?.data?.products||[];
    const meta=res?.data?.meta||{};
    grid.innerHTML=_products.length?_products.map(myProductCard).join(''):`<div class="empty" style="grid-column:1/-1"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div><h3>Sem produtos ainda</h3><p>Adicione o seu primeiro produto</p><button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="go('novoproduto.html')">+ Adicionar produto</button></div>`;
    animateItems(grid);
    renderPagination('prod-pagination',meta,loadMyProducts);
    renderSelBanner();
  } catch(e){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`; }
}

// ─── Dica Bazares — banner dispensável com uma sugestão útil.
// Fica escondido depois de dispensado (guardado no localStorage),
// para não repetir a mesma dica em todas as visitas.
function renderProductTip(){
  const host = document.getElementById('prod-tip');
  if(!host || localStorage.getItem('bz_tip_photos_dismissed')==='1') return;
  host.innerHTML = `<div class="card" style="display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--b-50);border-color:var(--b-100);position:relative">
    <button onclick="document.getElementById('prod-tip').innerHTML='';localStorage.setItem('bz_tip_photos_dismissed','1')" style="position:absolute;top:8px;right:8px;background:none;border:none;color:var(--t4);cursor:pointer;padding:4px" aria-label="Dispensar">${icon('close',13,2.2)}</button>
    <div style="width:38px;height:38px;border-radius:12px;background:var(--surf);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--b-600);box-shadow:var(--sh0)">${icon('sparkle',18,2)}</div>
    <div style="flex:1;min-width:0;padding-right:14px">
      <div style="font-weight:800;font-size:13px;color:var(--b-700,var(--b-600))">Dica Bazares</div>
      <div style="font-size:12.5px;color:var(--t3)">Produtos com fotos de qualidade recebem até 3x mais visitas.</div>
    </div>
    <button class="btn btn-soft btn-xs" style="flex-shrink:0" onclick="showPhotoTipModal()">Saber mais</button>
  </div>`;
}
function showPhotoTipModal(){
  openModal(`<div class="modal-hd"><h3>${icon('sparkle',18,2)} Fotos que vendem mais</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <div style="display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--t2)">
      <div style="display:flex;gap:10px"><span style="color:var(--b-600);flex-shrink:0">${icon('check',16,2.4)}</span><span>Use luz natural — evite fotos escuras ou com flash directo.</span></div>
      <div style="display:flex;gap:10px"><span style="color:var(--b-600);flex-shrink:0">${icon('check',16,2.4)}</span><span>Mostre o produto de vários ângulos, incluindo detalhes e defeitos se houver.</span></div>
      <div style="display:flex;gap:10px"><span style="color:var(--b-600);flex-shrink:0">${icon('check',16,2.4)}</span><span>Use um fundo neutro e limpo — evite distrações à volta do produto.</span></div>
      <div style="display:flex;gap:10px"><span style="color:var(--b-600);flex-shrink:0">${icon('check',16,2.4)}</span><span>A primeira foto é a que aparece na grelha — escolha a mais nítida e atractiva.</span></div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="closeModal()">Entendi</button>`);
}

function openProductKebab(id){
  const p = _products.find(x=>x.id===id);
  if(!p) return;
  const isPinned = p.featured && p.featuredUntil && new Date(p.featuredUntil) > new Date();
  const isPremiumSeller = !!Session.user?.isPremium;
  openModal(`<div class="modal-hd"><h3>${esc(p.name)}</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <button class="btn btn-ghost btn-block" onclick="closeModal();openEditModal('${id}')">${icon('settings',17,1.8)} Editar</button>
      <button class="btn btn-ghost btn-block" onclick="closeModal();toggleProductStock('${id}')">${icon(p.stock>0?'box':'check',17,1.8)} Marcar como ${p.stock>0?'esgotado':'disponível'}</button>
      ${isPremiumSeller?`<button class="btn btn-ghost btn-block" onclick="closeModal();${isPinned?`unpinProduct('${id}')`:`pinProduct('${id}')`}">${icon('sparkle',17,1.8)} ${isPinned?'Remover destaque':'Destacar por 24h'}</button>`:''}
      <button class="btn btn-danger btn-block" onclick="closeModal();deleteProductWithUndo('${id}')">${icon('close',17,2)} Eliminar</button>
    </div>`);
}

function myProductCard(p){
  const picked=_selectedIds.has(p.id);
  const inSelMode=!!_selMode;
  const checkbox=inSelMode?`<div class="p-select-check"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>`:'';
  const clickAttr=inSelMode?`onclick="pickProduct('${p.id}')"`:`onclick="go('product.html',{id:'${escJsAttr(p.slug || p.id)}'})"`;
  const isPinned = p.featured && p.featuredUntil && new Date(p.featuredUntil) > new Date();
  const isPremiumSeller = !!Session.user?.isPremium;
  return `<div class="p-card anim-item${inSelMode?' sel-active':''}${picked?' sel-picked':''}" id="mp-card-${p.id}">
    <div class="p-img" ${clickAttr}>
      ${checkbox}
      ${!inSelMode?`<button class="p-kebab" onclick="event.stopPropagation();openProductKebab('${p.id}')" aria-label="Mais opções">${icon('more',16,2.4)}</button>`:''}
      ${isPinned?`<div class="p-badges"><span class="p-badge p-badge-feat"><svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Destaque do dia</span></div>`:''}
      ${p.images?.[0]?.url?`<img src="${esc(p.images[0].url)}" alt="${esc(p.name)}" loading="lazy" onload="this.classList.add('loaded');this.closest('.p-img').classList.add('loaded')" onerror="imgFallback(this,false)">`:`<span style="color:var(--t4);font-size:12px">Sem foto</span>`}
    </div>
    <div class="p-body">
      <div class="p-name">${esc(p.name)}</div>
      ${p.createdAt?`<div style="font-size:10.5px;color:var(--t4);margin-top:1px">Publicado ${timeAgo(p.createdAt)}</div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
        <div class="p-price">${fmtMT(p.price)}</div>
        <span style="font-size:10px;font-weight:600;color:${p.stock>0?'var(--grn)':'var(--red)'}">${p.stock>0?p.stock+' un.':'Esgotado'}</span>
      </div>
      ${p.active===false?`<span class="badge b-gray" style="margin-top:6px">Pausado — invisível na loja</span>`:''}
      ${(p.views||p.likeCount||p.commentCount)?`<div class="p-engage" style="margin-top:6px">
        ${p.views?`<span class="p-engage-item"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${p.views}</span>`:''}
        ${p.likeCount?`<span class="p-engage-item"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>${p.likeCount}</span>`:''}
        ${p.commentCount?`<span class="p-engage-item"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>${p.commentCount}</span>`:''}
      </div>`:''}
      ${isPremiumSeller&&!inSelMode?`<button class="btn btn-xs ${isPinned?'btn-ghost':'btn-terra'}" style="margin-top:8px;width:100%;justify-content:center" onclick="event.stopPropagation();${isPinned?`unpinProduct('${p.id}')`:`pinProduct('${p.id}')`}">${icon('sparkle',12,2.2)} ${isPinned?'Remover destaque':'Destacar por 24h'}</button>`:''}
    </div>
  </div>`;
}

// ─── "Destaque do dia" (Premium) — fixa/remove o produto no topo do
// bazar e das pesquisas por 24h. Só 1 produto por vendedor de cada vez
// — o backend remove automaticamente o destaque anterior.
async function pinProduct(id){
  try{
    await api.post(`/products/${id}/pin`,{});
    toast('Produto destacado por 24h!','success');
    await loadMyProducts(_page);
  }catch(e){
    if(isPremiumRequiredError(e)){ showPremiumUpsell(e.message); return; }
    toast(apiErrorMessage(e),'err');
  }
}
async function unpinProduct(id){
  try{ await api.delete(`/products/${id}/pin`); toast('Destaque removido.','info'); await loadMyProducts(_page); }
  catch(e){ toast(apiErrorMessage(e),'err'); }
}

// ─── Exportar catálogo em CSV ────────────────────────────────────────
function exportProductsCSV(){
  if(!_products.length){ toast('Sem produtos para exportar.','warn'); return; }
  exportToCSV(
    `bazares-produtos-${new Date().toISOString().slice(0,10)}.csv`,
    { name:'Nome', category:'Categoria', price:'Preço (MT)', stock:'Stock', condition:'Estado', sales:'Vendas', views:'Visualizações', active:'Activo' },
    _products.map(p=>({ name:p.name, category:p.category, price:p.price, stock:p.stock, condition:p.condition||'', sales:p.sales||0, views:p.views||0, active:p.active!==false?'Sim':'Não' }))
  );
}

/* ── FAB (3 pontinhos) ─ menu com Editar / Esgotado / Eliminar ────── */
let _fabOpen=false;
function renderFab(){
  document.getElementById('pp-fab-root').innerHTML=`
    <div class="pp-fab-wrap">
      <div class="pp-fab-menu${_fabOpen?' open':''}" id="pp-fab-menu">
        <div class="pp-fab-menu-item mi-edit" onclick="startSelMode('edit')">
          <div class="ico-box"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
          Editar
        </div>
        <div class="pp-fab-menu-item mi-stock" onclick="startSelMode('stock')">

function confirmBulkAction(){
  if(_selMode==='del'){

    runBulkStock();

    runBulkActive();
  }
}

// Mesma lógica de "apaga já, mas dá para desfazer" do deleteProductWithUndo,
// só que aqui esconde vários cartões de uma vez e o onCommit dispara os
// vários DELETE em paralelo quando a janela de desfazer expira.
function runBulkDeleteWithUndo(){
  const ids=[..._selectedIds];
  if(!ids.length) return;
  const placeholders=[];
  ids.forEach(id=>{
    const card=document.getElementById(`mp-card-${id}`);
    if(!card) return;
    const ph=document.createComment(`mp-placeholder-${id}`);
    card.replaceWith(ph);
    placeholders.push(ph);
  });
  const n=ids.length;
  const bar=document.getElementById('pp-confirm-bar');
  if(bar) bar.remove();
  _selMode=null; _selectedIds=new Set();
  document.getElementById('prod-sel-banner').innerHTML='';

  Bazares.Undo.perform({
    message: `${n} produto${n>1?'s':''} eliminado${n>1?'s':''}.`,
    onUndo: () => { loadMyProducts(_page); },
    onCommit: async () => {
      placeholders.forEach(ph=>ph.remove());
      let ok=0;
      for(const id of ids){ try{ await api.delete(`/products/${id}`); ok++; }catch(e){} }
      if(ok<ids.length) toast(`${ok}/${ids.length} produtos eliminados.`,'warn');
      if(!document.querySelector('#prod-grid .p-card')) loadMyProducts(_page);
    }
  });
}

async function runBulkStock(){
  const ids=[..._selectedIds];
  toast(`A actualizar ${ids.length} produto(s)…`,'info');
  let ok=0;
  for(const id of ids){ try{ await api.patch(`/products/${id}/stock`,{}); ok++; }catch(e){} }
  toast(ok===ids.length?'Disponibilidade actualizada.':`${ok}/${ids.length} produtos actualizados.`, ok===ids.length?'ok':'warn');
  exitSelMode();
}

async function runBulkActive(){
  const ids=[..._selectedIds];
  toast(`A actualizar ${ids.length} produto(s)…`,'info');
  let ok=0;
  for(const id of ids){ try{ await api.patch(`/products/${id}/toggle`,{}); ok++; }catch(e){} }
  toast(ok===ids.length?'Visibilidade actualizada.':`${ok}/${ids.length} produtos actualizados.`, ok===ids.length?'ok':'warn');
  exitSelMode();
}

// ─── Geração de descrição por IA ────────────────────────────────
async function generateWithAI(){
  const nameEl=document.getElementById('pm-name');
  const name=nameEl?.value?.trim();
  if(!name){ toast('Escreve o nome do produto primeiro.','warn'); nameEl?.focus(); return; }

  const catEl=document.getElementById('pm-cat');
  const condEl=document.getElementById('pm-cond');
  const kwEl=document.getElementById('pm-ai-keywords');
  const btn=document.getElementById('ai-gen-btn');

  setLoading(btn,true);
  try{
    const res=await api.post('/products/generate-description',{
      name, category:catEl?.value||'', condition:condEl?.value||'', keywords:kwEl?.value?.trim()||''
    });
    const data=res?.data||{};
    if(data.description) document.getElementById('pm-desc').value=data.description;
    if(data.suggestedCategory && catEl){
      const opt=[...catEl.options].find(o=>o.value.toLowerCase()===String(data.suggestedCategory).toLowerCase());
      if(opt) catEl.value=opt.value;
    }
    toast('Descrição gerada — revê antes de publicar.','ok');
  }catch(e){
    if (isPremiumRequiredError(e)) { showPremiumUpsell(e.message); }
    else toast(apiErrorMessage(e),'warn');
  }finally{
    setLoading(btn,false);
  }
}

/* ── IMAGE UPLOADER ──────────────────────────────────────────────
   _imgState items: { kind:'existing', id, url }  <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> already saved on server
                     { kind:'new', file, previewUrl } <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> local file, not uploaded yet
   Order in the array = display/cover order. Item 0 is always the cover. */
let _imgState=[];
const MAX_IMAGES=20;

// ─── Melhorador de fotografias (Premium) ───────────────────────
async function enhanceProductPhoto(idx){
  const item=_imgState[idx];
  if(!item || item.kind!=='existing') return;
  try{
    toast('A melhorar a fotografia...','info');
    const res=await api.post('/premium/enhance-photo',{ imageUrl: item.url, imageId: item.id });
    const enhancedUrl=res?.data?.enhancedUrl;
    if(enhancedUrl){ item.url=enhancedUrl; renderImgGrid(); toast('Fotografia melhorada!','ok'); }
  }catch(e){
    if (isPremiumRequiredError(e)) { showPremiumUpsell(e.message); return; }
    toast(apiErrorMessage(e),'err');
  }
}

function initImageUploader(p){
  _imgState = (p?.images||[]).map(img=>({kind:'existing', id:img.id, url:img.url}));
  renderImgGrid();

  const drop=document.getElementById('imgup-drop');
  const input=document.getElementById('imgup-input');

  input.addEventListener('change', e=>{ addFiles(e.target.files); input.value=''; });

  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('drag-over'); });
  drop.addEventListener('dragleave', ()=> drop.classList.remove('drag-over'));
  drop.addEventListener('drop', e=>{
    e.preventDefault(); drop.classList.remove('drag-over');
    if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });
}

/* Reduz uma imagem antes do envio: redimensiona para no máximo 1600px no
   lado maior e reexporta como JPEG com qualidade 0.82. Isto não altera o
   que o utilizador vê no preview (que continua a usar o ficheiro original
   via URL.createObjectURL) — só comprime no momento de publicar, para
   tornar o envio mais rápido e fiável em redes móveis mais lentas.
   O trabalho pesado corre numa Worker thread (js/media-compress.js) —
   ver esse ficheiro para o porquê e o fallback. */
function compressImage(file, maxSize=1600, quality=0.82){
  return window.MediaCompress ? MediaCompress.compressImage(file, maxSize, quality) : Promise.resolve(file);
}

function addFiles(fileList){
  const accepted=['image/jpeg','image/jpg','image/png','image/webp'];
  const files=Array.from(fileList);
  let rejected=0, tooBig=0;
  for(const file of files){
    if(_imgState.length>=MAX_IMAGES){ toast(`Máximo de ${MAX_IMAGES} imagens por post.`,'warn'); break; }
    if(!accepted.includes(file.type)){ rejected++; continue; }
    if(file.size>10*1024*1024){ tooBig++; continue; }
    _imgState.push({kind:'new', file, previewUrl:URL.createObjectURL(file)});
  }
  if(rejected) toast('Algumas imagens foram ignoradas (formato não suportado). Use JPG, PNG ou WEBP.','warn');
  if(tooBig) toast('Algumas imagens excedem 10MB e foram ignoradas.','warn');
  renderImgGrid();
}

function removeImg(idx){
  const item=_imgState[idx];
  if(item.kind==='existing'){
    // Remove imediatamente do servidor — é uma imagem já publicada.
    api.delete(`/products/images/${item.id}`).catch(()=>{ toast('Não foi possível remover esta imagem do servidor.','err'); });
  } else if(item.previewUrl){
    URL.revokeObjectURL(item.previewUrl);
  }
  _imgState.splice(idx,1);
  renderImgGrid();
}

function editImg(idx){
  const item=_imgState[idx];
  if(!item) return;
  const source = item.kind==='existing' ? item.url : item.file;
  openImageEditor(source, {
    onDone: (file) => {
      if(item.kind==='existing' && item.id){
        api.delete(`/products/images/${item.id}`).catch(()=>{});
      } else if(item.previewUrl){
        URL.revokeObjectURL(item.previewUrl);
      }
      _imgState[idx] = { kind:'new', file, previewUrl: URL.createObjectURL(file) };
      renderImgGrid();
      toast('Foto editada.','ok');
    }
  });
}

let _dragIdx=null;
function renderImgGrid(){
  const grid=document.getElementById('imgup-grid');
  const counter=document.getElementById('imgup-counter');
  const drop=document.getElementById('imgup-drop');
  if(!grid) return;
  counter.textContent=`${_imgState.length}/${MAX_IMAGES}`;
  if(drop) drop.style.display = _imgState.length ? 'none' : '';
  grid.innerHTML=_imgState.map((item,i)=>{
    const src=item.kind==='existing'?item.url:item.previewUrl;
    return `<div class="imgup-thumb" draggable="true" data-idx="${i}">
      ${_imgState.length>1?'<span class="imgup-grip">⠿</span>':''}
      <img loading="lazy" decoding="async" src="${esc(src)}" alt="">
      ${item.kind==='existing'?`<button type="button" onclick="event.stopPropagation();enhanceProductPhoto(${i})" title="Melhorar foto com IA" style="position:absolute;bottom:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--g-gold);border:none;color:var(--n-900);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">${icon('star',12,2.5)}</button>`:''}
      <button type="button" class="imgup-edit" onclick="event.stopPropagation();editImg(${i})" title="Editar foto">${icon('pencil',12,2.2)}</button>
      <button type="button" class="imgup-rm" onclick="event.stopPropagation();removeImg(${i})" aria-label="Remover imagem"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      ${i===0?'<div class="imgup-cover">Capa</div>':''}
    </div>`;
  }).join('') + (_imgState.length && _imgState.length<MAX_IMAGES ? `<div class="imgup-add" onclick="document.getElementById('imgup-input').click()" aria-label="Adicionar mais fotos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>` : '');

  grid.querySelectorAll('.imgup-thumb').forEach(el=>{
    el.addEventListener('dragstart', e=>{ _dragIdx=+el.dataset.idx; el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); grid.querySelectorAll('.drag-target').forEach(x=>x.classList.remove('drag-target')); });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-target'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-target'));
    el.addEventListener('drop', e=>{
      e.preventDefault();
      const targetIdx=+el.dataset.idx;
      if(_dragIdx===null||_dragIdx===targetIdx) return;
      const [moved]=_imgState.splice(_dragIdx,1);
      _imgState.splice(targetIdx,0,moved);
      _dragIdx=null;
      renderImgGrid();
    });
  });
}

async function saveProduct(id){
  const name=document.getElementById('pm-name').value.trim();
  const description=document.getElementById('pm-desc').value.trim();
  const price=parseFloat(document.getElementById('pm-price').value);
  const stock=parseInt(document.getElementById('pm-stock').value)||0;
  const category=document.getElementById('pm-cat').value;
  const location=document.getElementById('pm-loc').value.trim();
  const condition=document.getElementById('pm-cond').value;
  const color=document.getElementById('pm-color').value.trim();
  const size=document.getElementById('pm-size').value.trim();
  const deliveryMethod=document.getElementById('pm-del').value;

  if(!name||!description||!price||!category){toast('Preencha os campos obrigatórios (*).','warn');return;}
  if(_imgState.length===0){toast('Adicione pelo menos uma imagem do produto.','warn');return;}

  const btn=document.querySelector('#modal-root .btn-primary');
  setLoading(btn,true);
  try{
    const fd=new FormData();
    fd.append('name',name); fd.append('description',description); fd.append('price',price);
    fd.append('stock',stock); fd.append('category',category); fd.append('location',location);
    fd.append('condition',condition); fd.append('color',color); fd.append('size',size);
    fd.append('deliveryMethod',deliveryMethod);

    // Apenas os ficheiros novos vão como multipart — as imagens já existentes
    // (kind:'existing') já estão no servidor e só precisam de reordenação.
    // Cada ficheiro é primeiro reduzido (redimensionado/comprimido) para
    // tornar o envio mais rápido e fiável em redes móveis mais lentas —
    // isto não afecta o que já viu no preview, só o ficheiro que é enviado.
    const newFiles=_imgState.filter(it=>it.kind==='new');
    if(newFiles.length){
      toast(`A preparar ${newFiles.length} imagem${newFiles.length>1?'ns':''} para envio…`,'info');
    }
    for(const it of newFiles){
      const compressed = await compressImage(it.file);
      fd.append('images', compressed);
    }

    let savedId=id, imagesFailed=0, serverMsg=null;
    if(id){
      const res=await api.putForm(`/products/${id}`,fd);
      imagesFailed=res?.data?.imagesFailed||0; serverMsg=res?.message;
    } else {
      const res=await api.postForm('/products',fd);
      savedId=res?.data?.product?.id;
      imagesFailed=res?.data?.imagesFailed||0; serverMsg=res?.message;
    }

    // Persistir a ordem final. As imagens novas são sempre anexadas pelo
    // servidor a seguir às existentes, por isso só conseguimos reordenar
    // com exactidão quando não há imagens novas nesta gravação (a posição
    // relativa entre "existentes" e "novas" não é controlável pelo cliente).
    const existingIds=_imgState.filter(it=>it.kind==='existing').map(it=>it.id);
    if(id && existingIds.length>1 && newFiles.length===0){
      await api.patch(`/products/${id}/images/reorder`,{imageIds:existingIds}).catch(()=>{});
    }

    closeModal();
    if(imagesFailed>0){
      // O servidor não conseguiu guardar uma ou mais fotos (normalmente falha
      // de ligação ao Cloudinary) — avisamos claramente em vez de deixar o
      // vendedor a pensar que está tudo bem quando o produto ficou sem fotos.
      toast(serverMsg||'Produto guardado, mas algumas fotos falharam — tente adicioná-las novamente em Editar.','warn');
    } else {
      toast(id?'Produto actualizado!':'Produto publicado! <svg class="ico-inline ico-fill" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 21l3-9 6 6z"/><circle cx="18" cy="6" r="1.5"/><circle cx="14" cy="4" r="1"/><circle cx="20" cy="11" r="1"/><path d="M13 2l1.5 1.5L13 5l-1.5-1.5z"/></svg>');
    }
    await loadMyProducts(_page);
  }catch(e){setLoading(btn,false);toast(apiErrorMessage(e),'err');}
}

async function toggleProductStock(id){
  try{
    await api.patch(`/products/${id}/stock`,{});
    await loadMyProducts(_page);
  }catch(e){ toast(apiErrorMessage(e),'err'); }
}

async function deleteProduct(id){
  try{await api.delete(`/products/${id}`);closeModal();toast('Produto eliminado.','info');await loadMyProducts(_page);}
  catch(e){toast(apiErrorMessage(e),'err');}
}

// Substitui o antigo fluxo de confirmDelete/deleteProduct (modal a
// bloquear + eliminação imediata) por eliminação optimista com
// janela de "Desfazer" — mais rápido e igualmente seguro, porque o
// pedido real ao servidor só sai se a pessoa não desfizer a tempo.
function deleteProductWithUndo(id){
  const card = document.getElementById(`mp-card-${id}`);
  if (!card) { deleteProduct(id); return; }

  const placeholder = document.createComment(`mp-placeholder-${id}`);
  card.replaceWith(placeholder);

  Bazares.Undo.perform({
    message: 'Produto eliminado.',
    onUndo: () => {
      // mais simples e sempre correcto recarregar a grelha do que
      // tentar re-inserir o cartão à mão (a paginação/selecção podia
      // ter mudado entretanto)
      loadMyProducts(_page);
    },
    onCommit: async () => {
      placeholder.remove();
      await api.delete(`/products/${id}`);
      _products = _products.filter(p => p.id !== id);
      if (!document.querySelector('#prod-grid .p-card')) loadMyProducts(_page);
    }
  });
}
