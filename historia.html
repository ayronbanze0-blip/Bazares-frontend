<style>
.hs-wrap{display:grid;grid-template-columns:1fr;gap:26px;max-width:920px;margin:0 auto}
@media(min-width:760px){.hs-wrap{grid-template-columns:296px 1fr;align-items:start}}

/* Palco do telefone — moldura com brilho ambiente atrás, ao estilo
   das pré-visualizações do Instagram/TikTok, em vez de um retângulo
   plano a flutuar na página. */
.hs-stage{position:relative;padding:30px 0 8px;border-radius:var(--rxxl);background:radial-gradient(120% 100% at 50% 0%,rgba(0,224,67,.14),transparent 65%),var(--surf2)}
.hs-stage::before{content:'';position:absolute;inset:0;background-image:var(--capulana-pattern);background-size:70px 70px;opacity:.06;border-radius:inherit;pointer-events:none}
.hs-phone{width:250px;aspect-ratio:9/16;margin:0 auto;border-radius:30px;background:#0B0E13;position:relative;overflow:hidden;box-shadow:0 22px 46px -14px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.06) inset;border:7px solid #0B0E13;z-index:1}
.hs-phone-notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:64px;height:16px;background:#0B0E13;border-radius:0 0 12px 12px;z-index:3}
.hs-phone-segs{position:absolute;top:12px;left:9px;right:9px;display:flex;gap:4px;z-index:2}
.hs-phone-seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.32);overflow:hidden}
.hs-phone-seg span{display:block;height:100%;width:0%;background:#fff;border-radius:3px}
.hs-phone-seg.done span{width:100%}
.hs-phone-seg.live span{animation:hs-fill 4s linear infinite}
@keyframes hs-fill{from{width:0%}to{width:100%}}
.hs-phone-topinfo{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:7px;z-index:2}
.hs-phone-avatar{width:22px;height:22px;border-radius:50%;background:var(--g-green);flex-shrink:0}
.hs-phone-topinfo b{color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hs-phone-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0B1F3A;overflow:hidden}
.hs-phone-media img{width:100%;height:100%;object-fit:cover}
.hs-phone-cap{position:absolute;left:12px;right:12px;font-weight:700;font-size:13px;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,.55);word-break:break-word}
.hs-stage-hint{text-align:center;font-size:11px;color:var(--t4);margin-top:14px}

/* Separador de tipo — grupo de pílulas sólido, não três botões
   cinzentos iguais */
.hs-type-group{display:flex;gap:6px;padding:4px;background:var(--surf2);border-radius:var(--pill);margin-bottom:18px}
.hs-type-btn{flex:1;padding:10px 8px;border-radius:var(--pill);border:none;background:transparent;cursor:pointer;text-align:center;font-weight:700;font-size:12.5px;color:var(--t3);display:flex;align-items:center;justify-content:center;gap:6px;transition:var(--ease)}
.hs-type-btn.active{color:#fff;background:var(--g-green);box-shadow:var(--sh-green)}

.hs-swatch-row{display:flex;gap:12px;flex-wrap:wrap}
.hs-swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid var(--surf);box-shadow:0 0 0 1.5px var(--brd);flex-shrink:0;transition:var(--ease)}
.hs-swatch.active{box-shadow:0 0 0 2.5px var(--text)}

.hs-pos-label{font-size:11px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:8px}
.hs-pos-group{display:flex;gap:6px;padding:4px;background:var(--surf2);border-radius:var(--r);margin-top:6px}
.hs-pos-btn{flex:1;padding:8px;border-radius:calc(var(--r) - 3px);border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:700;color:var(--t3);transition:var(--ease)}
.hs-pos-btn.active{color:var(--grn);background:var(--surf);box-shadow:0 0 0 2px var(--grn),0 1px 4px rgba(0,0,0,.08)}

.hs-slide-thumb{position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;flex-shrink:0;border:2px solid var(--brd);cursor:pointer;transition:var(--ease)}
.hs-slide-thumb.active{border-color:var(--grn);box-shadow:0 0 0 3px var(--b-100)}
.hs-slide-thumb img{width:100%;height:100%;object-fit:cover}
.hs-slide-rm{position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;border:none;cursor:pointer;padding:0}
.hs-slide-add{width:56px;height:56px;border-radius:12px;flex-shrink:0;border:2px dashed var(--brd2);background:var(--surf2);color:var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer}

.nr-file-card{display:flex;gap:12px;padding:12px;border:1px solid var(--brd);border-radius:var(--rl);background:var(--surf)}
.nr-file-thumb{width:72px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative;background:#0B0E13}
.nr-file-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.nr-file-meta{flex:1;min-width:0}
.nr-file-meta .name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;word-break:break-all}
.nr-file-meta .name svg{color:var(--grn);flex-shrink:0}

.pg-hero-corner{position:absolute;top:16px;right:18px;z-index:2;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--pill);border:1px solid var(--brd);background:var(--surf);font-size:12px;font-weight:700;color:var(--t2);cursor:pointer;transition:var(--ease);box-shadow:var(--sh1)}
.pg-hero-corner:hover{background:var(--surf2)}
.imgup-action-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.imgup-action-btn{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--r);border:1px solid var(--brd);background:var(--surf);font-size:11.5px;font-weight:700;color:var(--t2);cursor:pointer;transition:var(--ease)}
.imgup-action-btn:hover{background:var(--surf2);border-color:var(--brd2)}
.hs-tpl-card{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--rl);border:1.5px solid var(--brd);cursor:pointer;transition:var(--ease);text-align:left;background:var(--surf)}
.hs-tpl-card:hover{border-color:var(--grn);background:var(--b-50)}
.hs-tpl-card b{font-size:13px}
.hs-tpl-card span{font-size:11.5px;color:var(--t4)}
.nr-product-picker{display:flex;flex-direction:column;gap:8px}
.nr-product-chips{display:flex;flex-wrap:wrap;gap:8px}
.nr-product-chip{display:flex;align-items:center;gap:8px;background:var(--b-50);border:1px solid var(--b-200);border-radius:var(--pill);padding:5px 6px 5px 5px}
.nr-product-chip img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--surf2)}
.nr-product-chip b{font-size:12px;font-weight:700}
.nr-product-chip span{font-size:11px;color:var(--t3)}
.nr-product-chip button{background:none;border:none;color:var(--t3);cursor:pointer;padding:2px;display:flex}
.nr-picker-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);border:1px solid var(--brd);background:var(--surf);cursor:pointer;text-align:left;width:100%;transition:var(--ease)}
.nr-picker-row:hover{background:var(--surf2);border-color:var(--brd2)}
.nr-picker-row img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--surf2);flex-shrink:0}
</style>
</head>
<body data-require-auth="1" data-roles="SELLER">
<header id="topbar"></header><div class="overlay" id="overlay"></div><aside id="sidebar" class="closed"></aside>
<main id="main"><div id="view" class="pg-body"></div></main>

<script src="/js/config.js?v=1788617999"></script><script src="/js/seo.js?v=1788617999"></script><script src="/js/action-queue.js?v=1788617999"></script><script src="/js/api.js?v=1788617999"></script>
  <script src="/js/core.js?v=1788617999"></script><script src="/js/runtime.js?v=1788617999"></script>

<script src="/js/virtual-feed.js?v=1788617999"></script><script src="/js/media-compress.js?v=1788617999"></script><script src="/js/app.js?v=1788617999"></script><script src="/js/mentions.js?v=1788617999"></script><script src="/js/video-editor.js?v=1788617999"></script><script src="/js/install-prompt.js?v=1788617999"></script><script src="/js/push-notifications.js?v=1788617999"></script>
<script>
let _myBazar = null;
let _hsType = 'photo';          // 'photo' | 'text' | 'video'
let _hsSlides = [];             // [{file, previewUrl}]
let _hsActiveSlide = 0;
let _hsCaption = '';
let _hsCapPos = 'bottom';       // 'top' | 'middle' | 'bottom'
let _hsBg = '#12A02A';
let _hsTags = [];
let _hsVideoFile = null;
let _hsVideoPreviewUrl = null;
let _hsVideoJobId = null;   // vídeo já cortado/editado e processado no servidor (Fase 3)
let _bzNameForPreview = '';
let _hsProducts = [];
let _hsLinkedProduct = null;
const HS_COLORS = ['#12A02A','#E2703A','#0B1F3A','#7C3AED','#B91C1C','#0369A1','#B45309'];
const MAX_SLIDES = 6;
const MAX_VIDEO_SECONDS = 30;
const MAX_VIDEO_MB = 40;
// Quando se vem de "Editar" numa história própria (?edit=ID) esta
// página deixa de publicar e passa a actualizar essa história — uma
// história é sempre UM único registo (mesmo quando "Criar história"
// publica vários slides de uma vez, cada slide fica gravado como um
// registo próprio), por isso a edição é sempre de uma só foto/vídeo.
let _editStoryId = null;
let _editStoryHasVideo = false;

function parseStoryCaptionForEdit(rawText){
  const t = rawText || '';
  const m = /\n\n(#[^\n]+)$/.exec(t);
  if(!m) return { caption: t.trim(), tags: [] };
  return { caption: t.slice(0, m.index).trim(), tags: m[1].split(/\s+/).map(x=>x.replace(/^#/,'')).filter(Boolean) };
}

initPage({ active:'historia.html', requireAuth:true, roles:['SELLER'], onReady: async(user) => {
  try{ _myBazar = (await api.get('/bazars/me'))?.data?.bazar || null; }catch{ _myBazar = null; }
  _bzNameForPreview = _myBazar?.name || '';

  const view = document.getElementById('view');
  if(!_myBazar){
    view.innerHTML = `<div class="card" style="max-width:480px;margin:40px auto;text-align:center;padding:36px">
      <h3 style="margin-bottom:8px">Ainda sem Bazar</h3>
      <p style="margin-bottom:20px">Cria o teu Bazar primeiro para poderes publicar histórias.</p>
      <button class="btn btn-primary" onclick="go('my-bazar.html')">Criar o meu Bazar</button>
    </div>`;
    return;
  }

  _editStoryId = getParam('edit');
  let editData = null;
  if(_editStoryId){
    try{
      const r = await api.get(`/bazars/${_myBazar.id}/stories/${_editStoryId}`);
      editData = r?.data?.story || null;
    }catch(e){ toast(apiErrorMessage(e),'err'); }
    if(!editData){ go('home.html'); return; }
    document.title = 'Editar história — Bazares';
    _editStoryHasVideo = !!editData.videoUrl;
    _hsType = _editStoryHasVideo ? 'video' : 'photo';
    _hsLinkedProduct = editData.productId || editData.product?.id || null;
  }
  try{ _hsProducts = (await api.get('/products', { bazarId: _myBazar.id, limit: 50 }))?.data?.products || []; }catch{ _hsProducts = []; }
  const parsedCaption = editData ? parseStoryCaptionForEdit(editData.text) : null;
  if(parsedCaption){
    _hsCaption = parsedCaption.caption;
    _hsTags = parsedCaption.tags;
    if(!_editStoryHasVideo && editData.imageUrl) _hsSlides = [{ file:null, previewUrl: editData.imageUrl }];
  }

  view.innerHTML = `
    <div class="pg-hero">
      ${_editStoryId ? '' : `<button type="button" class="pg-hero-corner" onclick="openHsDrafts()">${icon('folder',14,2)} Rascunhos</button>`}
      <div class="pg-hero-content">
        <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> História</div>
        <h1>${_editStoryId ? 'Editar História' : 'Criar História'}</h1>
        <p>Fica visível 24 horas e depois desaparece automaticamente</p>
      </div>
    </div>
    <div class="hs-wrap">
      <div>
        <div class="hs-stage">
          <div class="hs-phone" id="hs-phone">
            <div class="hs-phone-segs" id="hs-phone-segs"></div>
            <div class="hs-phone-notch"></div>
            <div class="hs-phone-topinfo"><div class="hs-phone-avatar"></div><b>${esc(_bzNameForPreview||'A tua loja')}</b></div>
            <div class="hs-phone-media" id="hs-phone-media"></div>
          </div>
          <p class="hs-stage-hint">Pré-visualização em tempo real</p>
        </div>
        <div id="hs-slide-strip" style="display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding:2px;justify-content:center"></div>
      </div>

      <div class="card reveal">
        <div class="form-sec-label"><b>1</b> Conteúdo</div>
        <p class="form-sec-hint">Escolha o tipo de conteúdo para a sua história</p>
        <div class="hs-type-group">
          <button type="button" class="hs-type-btn active" id="hs-type-photo" onclick="setHsType('photo')" ${_editStoryId?'disabled':''}><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Foto</button>
          <button type="button" class="hs-type-btn" id="hs-type-video" onclick="setHsType('video')" ${_editStoryId?'disabled':''}><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M23 7l-7 5 7 5V7z"/></svg> Vídeo</button>
          <button type="button" class="hs-type-btn" id="hs-type-text" onclick="setHsType('text')" ${_editStoryId?'disabled':''}><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg> Só texto</button>
        </div>

        <div id="hs-photo-panel">
          <div class="imgup-drop" id="hs-drop" onclick="document.getElementById('hs-input').click()">
            <div class="ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
            <div><strong>Toque para ${_editStoryId?'trocar a foto':'escolher fotos'}</strong> ou arraste aqui</div>
            <small>${_editStoryId?'Escolhe uma foto para substituir a actual':`Até ${MAX_SLIDES} fotos — cada uma vira um slide da história`}</small>
            <div class="slot-dots" id="hs-slot-dots"></div>
            <div class="imgup-action-row" onclick="event.stopPropagation()">
              <button type="button" class="imgup-action-btn" onclick="document.getElementById('hs-input').click()">${icon('image',14,2)} Selecionar</button>
              <button type="button" class="imgup-action-btn" onclick="document.getElementById('hs-input').click()">${icon('image',14,2)} Galeria</button>
              <button type="button" class="imgup-action-btn" onclick="document.getElementById('hs-camera-input').click()">${icon('camera',14,2)} Câmera</button>
              ${_editStoryId ? '' : `<button type="button" class="imgup-action-btn" onclick="openHsTemplates()">${icon('sparkle',14,2)} Modelos</button>`}
            </div>
          </div>
          <input type="file" id="hs-input" accept="image/jpeg,image/jpg,image/png,image/webp" ${_editStoryId?'':'multiple'} hidden>
          <input type="file" id="hs-camera-input" accept="image/*" capture="environment" hidden>
        </div>

        <div id="hs-video-panel" style="display:none">
          ${_editStoryId && _editStoryHasVideo ? `
          <div class="nr-file-card">
            <div class="nr-file-thumb"><video src="${esc(editData.videoUrl)}" muted playsinline></video></div>
            <div class="nr-file-meta">
              <div class="name">${icon('checkCircle',15,2.2)} <span>Vídeo actual</span></div>
              <p style="font-size:11.5px;color:var(--t4);margin-top:6px;line-height:1.5">Para trocar o vídeo em si, apaga esta história e publica uma nova — aqui só dá para mudar a legenda e as hashtags.</p>
            </div>
          </div>` : `
          <div class="imgup-drop" id="hs-video-drop" onclick="document.getElementById('hs-video-input').click()">
            <div class="ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M23 7l-7 5 7 5V7z"/></svg></div>
            <div><strong>Toque para escolher um vídeo</strong> ou arraste aqui</div>
            <small>Até ${MAX_VIDEO_SECONDS}s e ${MAX_VIDEO_MB}MB — ao estilo Instagram/TikTok</small>
          </div>
          <input type="file" id="hs-video-input" accept="video/mp4,video/webm,video/quicktime" hidden>`}
        </div>

        <div id="hs-text-panel" style="display:none">
          <label style="font-size:12px;font-weight:700;color:var(--t3);display:block;margin-bottom:8px">Cor de fundo</label>
          <div class="hs-swatch-row" id="hs-swatches"></div>
        </div>

        <div class="form-sec-label"><b>2</b> Legenda</div>
        <p class="form-sec-hint">Conte mais sobre a sua história</p>
        <div class="fg" style="margin-top:0">
          <textarea id="hs-caption" rows="2" maxlength="500" placeholder="Escreve algo sobre esta história...">${esc(_hsCaption)}</textarea>
          <div class="field-counter" id="hs-caption-count">${_hsCaption.length}/500</div>
          <button type="button" class="btn btn-ai btn-sm" id="hs-ai-gen-btn" onclick="generateStoryCaption()" style="margin-top:8px;width:100%;justify-content:center">
            <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
            Gerar legenda com IA
          </button>
        </div>

        <div class="fg" style="margin-top:20px">
          <label class="hs-pos-label">Posição da legenda</label>
          <div class="hs-pos-group">
            <button type="button" class="hs-pos-btn" data-pos="top" onclick="setHsPos('top')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg> Topo</button>

function setHsVideoFile(file){
  if(!file) return;
  const accepted = ['video/mp4','video/webm','video/quicktime'];
  if(!accepted.includes(file.type)){ toast('Formato de vídeo não suportado. Usa MP4, WebM ou MOV.','warn'); return; }
  if(file.size > MAX_VIDEO_MB*1024*1024){ toast(`O vídeo tem de ter até ${MAX_VIDEO_MB}MB.`,'warn'); return; }
  // O vídeo bruto tem sempre de passar pelo editor (corte + capa) antes
  // de poder ser publicado — o backend só aceita o `processedVideoJobId`
  // devolvido no fim desse processamento, nunca o ficheiro em bruto.
  _hsVideoFile = file;
  _hsVideoJobId = null;
  if(_hsVideoPreviewUrl){ URL.revokeObjectURL(_hsVideoPreviewUrl); _hsVideoPreviewUrl = null; }
  renderPreview();
  openVideoEditor(file, {
    target: 'stories',
    maxSeconds: MAX_VIDEO_SECONDS,
    onDone: (result) => {
      _hsVideoJobId = result.jobId;
      _hsVideoPreviewUrl = result.resultUrl;
      renderPreview();
      toast('Vídeo pronto — já podes publicar.','ok');
    },
    onCancel: () => {
      _hsVideoFile = null;
      renderPreview();
    }
  });
}

function addHsFiles(fileList){
  const accepted=['image/jpeg','image/jpg','image/png','image/webp'];
  // Em edição só existe um registo (uma foto) — escolher outra foto
  // substitui a actual em vez de se juntar como mais um slide.
  if(_editStoryId && fileList.length){
    _hsSlides.forEach(s=>{ if(s.file) URL.revokeObjectURL(s.previewUrl); });
    _hsSlides = [];
  }
  for(const file of Array.from(fileList)){
    if(_hsSlides.length>=MAX_SLIDES){ toast(`Máximo de ${MAX_SLIDES} fotos por história.`,'warn'); break; }
    if(!accepted.includes(file.type)) continue;
    if(file.size>10*1024*1024) continue;
    _hsSlides.push({file, previewUrl:URL.createObjectURL(file)});
  }
  _hsActiveSlide = _hsSlides.length-1;
  renderSlideStrip();
  renderPreview();
}
function removeHsSlide(i){
  URL.revokeObjectURL(_hsSlides[i].previewUrl);
  _hsSlides.splice(i,1);
  if(_hsActiveSlide>=_hsSlides.length) _hsActiveSlide=_hsSlides.length-1;
  renderSlideStrip();
  renderPreview();
}

function renderSlideStrip(){
  const strip = document.getElementById('hs-slide-strip');
  const dots = document.getElementById('hs-slot-dots');
  if(_hsType!=='photo'){ strip.innerHTML=''; if(dots) dots.innerHTML=''; return; }
  const canAddMore = _hsSlides.length < MAX_SLIDES;
  strip.innerHTML = _hsSlides.map((s,i)=>`
    <div class="hs-slide-thumb${i===_hsActiveSlide?' active':''}" onclick="pickSlide(${i})">
      <img loading="lazy" decoding="async" src="${s.previewUrl}" alt="">
      <button type="button" class="hs-slide-rm" onclick="event.stopPropagation();removeHsSlide(${i})">✕</button>
    </div>`).join('') + (canAddMore ? `<div class="hs-slide-add" onclick="document.getElementById('hs-input').click()" style="font-size:22px;font-weight:400;line-height:1">+</div>` : '');
  if(dots){
    dots.innerHTML = Array.from({length:MAX_SLIDES}).map((_,i)=>
      `<span class="${i<_hsSlides.length?'filled':''}"></span>`).join('');
  }
}

// Renderiza uma história "só texto" para uma imagem (fundo colorido + legenda),
// para reaproveitar o mesmo endpoint de upload de imagem do backend.
function renderTextSlideToFile(){
  return new Promise(resolve=>{
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1920;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = _hsBg;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(_hsCaption.trim()){
      ctx.fillStyle = '#fff';
      ctx.font = '700 64px Sora, sans-serif';
      ctx.textAlign = 'center';
      const words = _hsCaption.split(' ');
      const lines = [];
      let line = '';
      for(const w of words){
        const test = line ? line+' '+w : w;
        if(ctx.measureText(test).width > canvas.width-140 && line){ lines.push(line); line = w; }
        else line = test;
      }
      if(line) lines.push(line);
      const lineHeight = 78;
      let startY;
      if(_hsCapPos==='top') startY = 220;
      else if(_hsCapPos==='middle') startY = canvas.height/2 - (lines.length*lineHeight)/2 + lineHeight/2;
      else startY = canvas.height - 220 - lines.length*lineHeight;
      lines.forEach((l,i)=> ctx.fillText(l, canvas.width/2, startY + i*lineHeight));
    }
    canvas.toBlob(blob=>{
      resolve(new File([blob], 'historia.jpg', {type:'image/jpeg'}));
    }, 'image/jpeg', 0.92);
  });
}

async function publishStory(){
  if(!_myBazar) return;
  if(_editStoryId){
    const btn = document.getElementById('hs-submit');
    setLoading(btn, true);
    try{
      const caption = _hsCaption.trim();
      const fullCaption = _hsTags.length ? `${caption}\n\n${_hsTags.map(t=>'#'+t).join(' ')}`.trim() : caption;
      const fd = new FormData();
      fd.append('text', fullCaption);
      fd.append('productId', _hsLinkedProduct || '');
      // Só envia uma foto nova se o utilizador tiver mesmo escolhido
      // outra (senão a foto/vídeo actual da história fica como está).
      const newSlide = _hsSlides[0];
      if(!_editStoryHasVideo && newSlide?.file) fd.append('image', await compressHsImage(newSlide.file));
      await api.putForm(`/stories/${_editStoryId}`, fd);
      toast('História actualizada!','ok');
      go('home.html');
    }catch(e){ setLoading(btn, false); toast(apiErrorMessage(e),'err'); }
    return;
  }
  if(_hsType==='photo' && _hsSlides.length===0){ toast('Escolhe pelo menos uma foto.','warn'); return; }
  if(_hsType==='video' && !_hsVideoFile){ toast('Escolhe um vídeo.','warn'); return; }
  if(_hsType==='video' && !_hsVideoJobId){ toast('Aguarda o vídeo terminar de ser processado antes de publicar.','warn'); return; }
  const btn = document.getElementById('hs-submit');
  setLoading(btn, true);
  try{
    const caption = _hsCaption.trim();
    const fullCaption = _hsTags.length ? `${caption}\n\n${_hsTags.map(t=>'#'+t).join(' ')}`.trim() : caption;

    if(_hsType==='text'){
      const file = await renderTextSlideToFile();
      const fd = new FormData();
      fd.append('image', file);
      if(fullCaption) fd.append('text', fullCaption);
      if(_hsLinkedProduct) fd.append('productId', _hsLinkedProduct);
      await api.postForm(`/bazars/${_myBazar.id}/stories`, fd);
    } else if(_hsType==='video'){
      // Vídeo já foi cortado/editado no servidor pelo editor (Fase 3) —
      // referencia-se o job processado em vez de reenviar o ficheiro.
      const fd = new FormData();
      fd.append('processedVideoJobId', _hsVideoJobId);
      if(fullCaption) fd.append('text', fullCaption);
      if(_hsLinkedProduct) fd.append('productId', _hsLinkedProduct);
      await api.postForm(`/bazars/${_myBazar.id}/stories`, fd);
    } else {
      // Publicação sequencial, um pedido por slide (o backend só aceita
      // uma foto de história de cada vez). Se um slide a meio falhar
      // (ex: timeout), os anteriores já ficaram publicados — o utilizador
      // precisa de saber isso em vez de ver só "falhou" e achar que nada
      // foi publicado.
      let published = 0;
      try{
        for(const slide of _hsSlides){
          const fd = new FormData();
          fd.append('image', await compressHsImage(slide.file));
          if(fullCaption) fd.append('text', fullCaption);
          if(_hsLinkedProduct) fd.append('productId', _hsLinkedProduct);
          await api.postForm(`/bazars/${_myBazar.id}/stories`, fd);
          published++;
        }
      }catch(e){
        setLoading(btn, false);
        if(published>0) toast(`${published} de ${_hsSlides.length} fotos publicadas — a última falhou (${apiErrorMessage(e)}). Podes tentar de novo só com o resto.`,'warn',6000);
        else toast(apiErrorMessage(e),'err');
        return;
      }
    }
    toast(_hsSlides.length>1?'História publicada — vários slides, visível 24h!':'História publicada — fica visível 24h!','ok');
    go('home.html');
  }catch(e){ setLoading(btn, false); toast(apiErrorMessage(e),'err'); }
}
</script></body></html>
