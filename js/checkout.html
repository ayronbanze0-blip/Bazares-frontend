<script>
let _co_product = null;
let _co_mode = 'single'; // 'single' (Comprar agora) ou 'cart' (Finalizar compra a partir do carrinho)
let _co_cartItems = [];

initPage({ active: '', requireAuth: true, onReady: async (user) => {
  const id = getParam('id');
  const qty = Math.max(1, parseInt(getParam('qty')) || 1);
  const view = document.getElementById('view');

  if (id) {
    _co_mode = 'single';
    try { _co_product = (await api.get(`/products/${id}`))?.data?.product; }
    catch { view.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div><h3>Produto não encontrado</h3></div>`; return; }
    renderSingleCheckout(user, _co_product, qty);
    return;
  }

  // Sem ?id= na URL <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> veio do carrinho ("Finalizar compra"). Carregar o carrinho inteiro.
  _co_mode = 'cart';
  try {
    const res = await api.get('/cart');
    _co_cartItems = res?.data?.items || [];
  } catch (e) {
    view.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
    return;
  }
  if (!_co_cartItems.length) {
    view.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div><h3>O seu carrinho está vazio</h3><p>Adicione produtos antes de finalizar a compra.</p><button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="go('products.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Explorar produtos</button></div>`;
    return;
  }
  renderCartCheckout(user, _co_cartItems);
}});

function renderSingleCheckout(user, p, qty) {
  const view = document.getElementById('view');
  view.innerHTML = `<div style="max-width:580px;margin:0 auto">
    <div class="sh"><h2>Finalizar encomenda</h2></div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t4);margin-bottom:12px">Resumo</div>
      <div style="display:flex;gap:12px;align-items:center">
        ${p.images?.[0]?.url ? `<img loading="lazy" decoding="async" src="${esc(p.images[0].url)}" alt="${esc(p.name)}" style="width:60px;height:60px;border-radius:var(--r);object-fit:cover">` : ''}
        <div style="flex:1"><div style="font-weight:600">${esc(p.name)}</div><div style="font-size:12px;color:var(--t4)">${esc(p.bazar?.name||'')}</div></div>
        <div id="co-total" style="font-size:17px;font-weight:800;color:var(--n-900)">${fmtMT(p.price * qty)}</div>
      </div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px">
        <label style="text-transform:none;font-weight:400">Quantidade:</label>
        <input type="number" id="co-qty" value="${qty}" min="1" max="${p.stock}">
      </div>
    </div>
    ${checkoutFormHtml(user, p)}
  </div>`;

  Bazares.Analytics?.trackCheckoutStarted({ mode: 'single', itemCount: qty, total: p.price * qty });
  Bazares.Analytics?.trackFunnelStep('checkout', 'iniciado', { mode: 'single' });

  document.body.classList.add('has-sticky-cta');
  document.body.insertAdjacentHTML('beforeend', `<div class="sticky-cta" id="sticky-cta-mount">
    <div class="sc-total"><span>Total</span><b id="sc-co-total">${fmtMT(p.price * qty)}</b></div>
    <button class="btn btn-primary" id="sc-submit" onclick="document.getElementById('co-submit').click()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Confirmar</button>
  </div>`);

  document.getElementById('co-qty').addEventListener('input', (e) => {
    const q = Math.max(1, Math.min(p.stock, parseInt(e.target.value) || 1));
    document.getElementById('co-total').textContent = fmtMT(p.price * q);
    document.getElementById('sc-co-total').textContent = fmtMT(p.price * q);
  });
  initCheckoutMap();

  document.getElementById('co-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const shared = readSharedFields();
    if (!shared) return;
    const finalQty = Math.max(1, Math.min(p.stock, parseInt(document.getElementById('co-qty').value) || 1));
    await submitOrder({
      items: [{ productId: p.id, qty: finalQty }],
      ...shared,
      size: document.getElementById('co-size')?.value || undefined,
      color: document.getElementById('co-color')?.value || undefined,
    });
  });
}

function renderCartCheckout(user, items) {
  const view = document.getElementById('view');
  const total = items.reduce((s,i)=>s+(i.price||i.product?.price||0)*i.qty,0);
  view.innerHTML = `<div style="max-width:580px;margin:0 auto">
    <div class="sh"><h2>Finalizar encomenda</h2></div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t4);margin-bottom:12px">Resumo (${items.length} ${items.length>1?'produtos':'produto'})</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${items.map(i=>{
          const img = i.image || i.product?.images?.[0]?.url || '';
          return `<div style="display:flex;gap:12px;align-items:center">
            ${img ? `<img loading="lazy" decoding="async" src="${esc(img)}" alt="${esc(i.name||i.product?.name||'')}" style="width:44px;height:44px;border-radius:var(--r);object-fit:cover">` : ''}
            <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(i.name||i.product?.name||'')} ×${i.qty}</div></div>
            <div style="font-size:13px;font-weight:700">${fmtMT((i.price||i.product?.price||0)*i.qty)}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="divider" style="margin:12px 0"></div>
      <div style="display:flex;justify-content:space-between">
        <span style="font-weight:700">Total</span>
        <span style="font-size:17px;font-weight:800;color:var(--n-900)">${fmtMT(total)}</span>
      </div>
    </div>
    ${checkoutFormHtml(user, null)}
  </div>`;

  Bazares.Analytics?.trackCheckoutStarted({ mode: 'cart', itemCount: items.length, total });
  Bazares.Analytics?.trackFunnelStep('checkout', 'iniciado', { mode: 'cart' });

  document.body.classList.add('has-sticky-cta');
  document.body.insertAdjacentHTML('beforeend', `<div class="sticky-cta" id="sticky-cta-mount">
    <div class="sc-total"><span>Total</span><b>${fmtMT(total)}</b></div>
    <button class="btn btn-primary" id="sc-submit" onclick="document.getElementById('co-submit').click()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Confirmar</button>
  </div>`);
  initCheckoutMap();

  document.getElementById('co-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const shared = readSharedFields();
    if (!shared) return;
    await submitOrder({
      items: items.map(i => ({ productId: i.productId || i.product?.id, qty: i.qty })),
      ...shared,
    });
  });
}

// Campos de entrega partilhados entre o modo "produto único" e o modo "carrinho".
function checkoutFormHtml(user, p) {
  return `<form class="card" id="co-form">
      <div class="safety-note" style="margin-bottom:18px">
        <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/></svg>
        <div><strong>A sua encomenda é combinada diretamente com o vendedor</strong>Confirme os dados abaixo com atenção — o vendedor vai usá-los para lhe entregar a encomenda.</div>
      </div>
      <div class="form-sec-label"><b>1</b> Dados de entrega</div>
      <p class="form-sec-hint">Estes dados vão diretamente para o vendedor combinar a entrega contigo</p>
      <div class="fg"><label>Nome completo</label><input id="co-nm" value="${esc(user.name)}" required></div>
      <div class="row2">
        <div class="fg"><label>Contacto / Telefone</label><input id="co-ph" placeholder="+258 8X XXX XXXX" value="${esc(user.phone||'')}" required></div>
        <div class="fg"><label>Localização / Cidade</label><input id="co-loc" placeholder="Maputo, Beira..."></div>
      </div>
      <div class="fg"><label>Morada detalhada</label><textarea id="co-addr" rows="2" placeholder="Bairro, rua, número..." required></textarea></div>
      <div class="fg">
        <label>Marcar no mapa <span style="text-transform:none;font-weight:400;color:var(--t4)">(opcional, ajuda o vendedor a encontrar-te)</span></label>
        <div style="display:flex;gap:8px;margin-bottom:4px">
          <button type="button" class="btn btn-soft btn-sm" id="co-map-locate" onclick="_coUseMyLocation()">
            <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg> Usar a minha localização
          </button>
        </div>
        <div id="co-loc-status" style="font-size:11.5px;color:var(--t4);margin-bottom:6px;display:flex;align-items:center;gap:4px"></div>
        <div id="co-map" style="width:100%;height:200px;border-radius:var(--r);background:var(--n-100)"></div>
        <input type="hidden" id="co-lat"><input type="hidden" id="co-lng">
      </div>
      ${p?.size ? `<div class="fg"><label>Tamanho</label><input id="co-size" placeholder="S, M, L, XL..."></div>` : ''}
      ${p?.color ? `<div class="fg"><label>Cor</label><input id="co-color"></div>` : ''}
      <div class="fg"><label>Método de pagamento</label>${payGridHtml('co-pay','Pagamento na entrega')}</div>
      <div class="fg"><label>Observações adicionais</label><textarea id="co-notes" rows="2" maxlength="300" placeholder="Ex: tocar a campainha, entregar após as 18h..."></textarea><div class="field-counter" id="co-notes-count">0/300</div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap" id="co-actions">
        <button class="btn btn-primary" style="flex:1;justify-content:center" type="submit" id="co-submit"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Confirmar encomenda</button>
        <button class="btn btn-ghost" type="button" onclick="history.back()">Cancelar</button>
      </div>
    </form>`;
}

function readSharedFields() {
  const buyerPhone = document.getElementById('co-ph').value.trim();
  const address = document.getElementById('co-addr').value.trim();
  if (!buyerPhone || !address) { toast('Preencha contacto e morada.', 'warn'); return null; }
  const loc = document.getElementById('co-loc').value.trim();
  const fullAddress = loc ? `${address}, ${loc}` : address;
  const lat = document.getElementById('co-lat')?.value;
  const lng = document.getElementById('co-lng')?.value;
  return {
    buyerName: document.getElementById('co-nm').value.trim(),
    buyerPhone,
    address: fullAddress,
    payment: getPayGridValue('co-pay'),
    notes: document.getElementById('co-notes').value.trim() || undefined,
    ...(lat && lng ? { latitude: parseFloat(lat), longitude: parseFloat(lng) } : {})
  };
}

// ─── Morada com pin (Google Maps) ──────────────────────────────
let _coPinMap = null;
let _coPendingPin = null;

function _coSetPin(lat, lng) {
  document.getElementById('co-lat').value = lat;
  document.getElementById('co-lng').value = lng;
  const status = document.getElementById('co-loc-status');
  if (_coPinMap) {
    _coPinMap.setPosition(lat, lng);
    if (status) status.innerHTML = `${icon('pin',12,2.2)} Localização marcada no mapa.`;
  } else {
    _coPendingPin = { lat, lng };
    if (status) status.innerHTML = `${icon('pin',12,2.2)} Localização guardada (o mapa ainda está a carregar).`;
  }
}

async function _coUseMyLocation() {
  const btn = document.getElementById('co-map-locate');
  const status = document.getElementById('co-loc-status');
  setLoading(btn, true);
  if (status) status.textContent = 'A obter a tua localização...';
  try {
    const { lat, lng } = await getBrowserLocation();
    _coSetPin(lat, lng);
  } catch (err) {
    if (status) status.textContent = '';
    toast(describeGeoError(err), 'warn');
  } finally {
    setLoading(btn, false);
  }
}

async function initCheckoutMap() {
  const notesEl = document.getElementById('co-notes'), notesCount = document.getElementById('co-notes-count');
  notesEl?.addEventListener('input', ()=>{
    const len = notesEl.value.length;
    notesCount.textContent = `${len}/300`;
    notesCount.classList.toggle('field-counter--near', len>=250&&len<300);
    notesCount.classList.toggle('field-counter--full', len>=300);
  });
  try {
    _coPinMap = await createPinMap(document.getElementById('co-map'), { draggable: true });
    _coPinMap.onDragEnd(({ lat, lng }) => { document.getElementById('co-lat').value = lat; document.getElementById('co-lng').value = lng; });
    // Ronda 40 — sem isto, o WebGL context do MapLibre ficava preso em
    // memória para sempre ao sair do checkout via SPA.
    document.addEventListener('bz:spa-leave', () => { try { _coPinMap?.map?.remove(); } catch (e) {} }, { once: true });
    attachPlacesAutocomplete(document.getElementById('co-addr'), ({ lat, lng, formatted }) => {
      _coSetPin(lat, lng);
      if (formatted) document.getElementById('co-addr').value = formatted;
    }, { country: 'mz' });
    if (_coPendingPin) { _coSetPin(_coPendingPin.lat, _coPendingPin.lng); _coPendingPin = null; }
  } catch (e) {
    // Rede em baixo ou o mapa falhou a carregar — não bloqueia o checkout,
    // só avisa e segue com a morada em texto livre (o botão de localização
    // continua a funcionar, só não há mapa visual para confirmar o pin).
    document.getElementById('co-map').innerHTML = '<div style="padding:12px;font-size:11.5px;color:var(--t4);text-align:center">Mapa indisponível agora — a morada em texto e "Usar a minha localização" continuam a funcionar.</div>';
  }
}

async function submitOrder(body) {
  const btn = document.getElementById('co-submit');
  const scBtn = document.getElementById('sc-submit');
  setLoading(btn, true);
  if (scBtn) setLoading(scBtn, true);
  try {
    const orderRes = await api.post('/orders', body);
    const order = orderRes?.data?.order;
    Bazares.Analytics?.trackOrderCreated({
      id: order?.id, total: order?.total, itemCount: body?.items?.length,
      paymentMethod: body?.payment, mode: _co_mode
    });
    Bazares.Analytics?.trackFunnelStep('checkout', 'concluido', { mode: _co_mode });
    // Se veio do carrinho, esvaziar o carrinho agora que a encomenda foi criada.
    if (_co_mode === 'cart' && _co_cartItems.length) {
      await Promise.allSettled(_co_cartItems.map(i => api.delete(`/cart/items/${i.id}`)));
      refreshCartCount().catch(()=>{});
    }
    toast('Encomenda realizada! <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>');
    setTimeout(() => go('my-orders.html'), 700);
  } catch (err) {
    setLoading(btn, false);
    if (scBtn) setLoading(scBtn, false);
    toast(apiErrorMessage(err), 'err');
  }
}
</script>
