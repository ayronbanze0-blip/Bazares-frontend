<script>
const CAT_BG = ['#12A02A','#E2703A','#2563EB','#C026D3','#0EA5A5','#D97706','#DC2626','#7C3AED','#059669','#EA580C','#0891B2','#BE185D'];
initPage({ active:'', onReady: () => {
  const grid = document.getElementById('cat-tile-grid');
  grid.innerHTML = CATS.map((c,i) => `
    <div class="cat-tile anim-item" onclick="go('products.html',{category:'${esc(c.l)}'})">
      <div class="ci" style="background:${CAT_BG[i % CAT_BG.length]}22;color:${CAT_BG[i % CAT_BG.length]}">${c.ico}</div>
      <div class="cl">${esc(c.l)}</div>
    </div>`).join('');
  animateItems(grid);
  grid.addEventListener('click',()=>saveListState('category',{scrollY:window.scrollY}),true);
  const savedCat=getListState('category');
  if(savedCat) restoreScrollY(savedCat.scrollY);
}});
</script>
