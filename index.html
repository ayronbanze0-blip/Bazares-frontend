  // ─── Saudação moçambicana por região ────────────────────────────
  // "Hoyo Hoyo!" (Xichangana/Xitsonga, "Bem-vindo") fica sempre visível
  // por omissão — funciona em qualquer província e não depende de
  // permissão nenhuma. Se o visitante autorizar a localização do
  // navegador, trocamos a legenda por baixo por uma saudação mais
  // próxima da região dele, escolhida pela província mais próxima das
  // coordenadas recebidas (não é geocodificação exacta — é só a
  // província cujo centro fica mais perto em linha recta).
  // NOTA: os agrupamentos linguísticos abaixo são uma aproximação —
  // Moçambique tem muito mais línguas/dialectos locais do que os 4
  // grupos aqui representados; valer a pena confirmar com falantes
  // nativos antes de tratar isto como definitivo.
  const MZ_REGIONS = [
    { name:'Maputo Cidade',   lat:-25.9692, lng:32.5732, word:'Avuxeni',     lang:'Xichangana' },
    { name:'Maputo Província',lat:-25.40,   lng:32.45,   word:'Avuxeni',     lang:'Xichangana' },
    { name:'Gaza',            lat:-25.0519, lng:33.6442, word:'Avuxeni',     lang:'Xichangana' },
    { name:'Inhambane',       lat:-23.865,  lng:35.383,  word:'Avuxeni',     lang:'Xitsonga/Xitswa' },
    { name:'Sofala',          lat:-19.833,  lng:34.85,   word:'Mauya',       lang:'Cisena/Chiteve' },
    { name:'Manica',          lat:-19.117,  lng:33.483,  word:'Mauya',       lang:'Chimanyika' },
    { name:'Tete',            lat:-16.156,  lng:33.586,  word:'Muli Bwanji', lang:'Cinyungwe' },
    { name:'Zambézia',        lat:-17.874,  lng:36.888,  word:'Muli Bwanji', lang:'Cinyanja/Cisena' },
    { name:'Niassa',          lat:-13.313,  lng:35.241,  word:'Muli Bwanji', lang:'Cinyanja' },
    { name:'Nampula',         lat:-15.116,  lng:39.267,  word:'Karibu',      lang:'Emakhuwa/Kimwani' },
    { name:'Cabo Delgado',    lat:-12.975,  lng:40.517,  word:'Karibu',      lang:'Kimwani' },
  ];
  function mzNearestRegion(lat, lng) {
    const toRad = d => d * Math.PI / 180;
    let best = null, bestD = Infinity;
    for (const r of MZ_REGIONS) {
      const dLat = toRad(r.lat - lat), dLng = toRad(r.lng - lng);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat)) * Math.cos(toRad(r.lat)) * Math.sin(dLng / 2) ** 2;
      const d = 2 * 6371 * Math.asin(Math.sqrt(a));
      if (d < bestD) { bestD = d; best = r; }
    }
    return best;
  }
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const r = mzNearestRegion(pos.coords.latitude, pos.coords.longitude);
      if (!r) return;
      const wordEl = document.getElementById('hero-greet-word');
      const subEl = document.getElementById('hero-greet-sub');
      if (wordEl) wordEl.textContent = r.word + '!';
      if (subEl) { subEl.textContent = `Saudação em ${r.lang} · perto de ${r.name}`; subEl.classList.add('on'); }
    }, () => { /* sem permissão ou indisponível — mantém "Hoyo Hoyo!" por omissão, sem incomodar o visitante */ }, { timeout: 6000, maximumAge: 600000 });
  }

      // um pedido falhado fica com o skeleton em vez de mostrar "0" (que

      if(bEl && bOk) bEl.textContent = '+'+(b.value?.data?.meta?.total||0);
