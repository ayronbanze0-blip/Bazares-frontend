<style>
/* Os separadores de filtro fazem scroll horizontal, mas sem qualquer
   pista visual disso o último botão parece só "cortado" a meio —
   como se fosse um bug de layout. Este envolucro + gradiente na
   margem direita mostra claramente que há mais para deslizar. */
.filter-scroll-wrap{position:relative}
.filter-scroll-wrap::after{
  content:'';position:absolute;top:0;right:0;bottom:4px;width:34px;
  background:linear-gradient(90deg,transparent,var(--bg,#F8FAFC) 78%);
  pointer-events:none;
}
[data-theme=dark] .filter-scroll-wrap::after{background:linear-gradient(90deg,transparent,var(--bg,#0A0F14) 78%)}
</style>

<script>
const ORDER_TRANSITIONS = {
  SELLER:{ PENDENTE:['ACEITE','CANCELADA'], ACEITE:['EM_PREPARACAO'], EM_PREPARACAO:['EM_ENTREGA'], EM_ENTREGA:['ENTREGUE'] },
  BUYER:{ PENDENTE:['CANCELADA'] }
};

const ORDER_FLOW = ['PENDENTE','ACEITE','EM_PREPARACAO','EM_ENTREGA','ENTREGUE'];

// Rótulos em forma de verbo para os botões de acção — STATUS_LABEL (em
// app.js) é usado nos badges de estado ("Aceite", "Cancelada") e fica
// gramaticalmente errado num botão ("Aceite" como acção soa mal); aqui
// cada estado-alvo tem o verbo correcto para quem carrega no botão.
const ACTION_LABEL = {
  ACEITE: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Aceitar encomenda', EM_PREPARACAO: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> Iniciar preparação',
  EM_ENTREGA: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Marcar como enviada', ENTREGUE: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Marcar como entregue',
  CANCELADA: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Cancelar'
};

initPage({ active:'my-orders.html', requireAuth:true, onReady: async(user)=>{
  const isSeller = user.role==='SELLER';
  document.getElementById('view').innerHTML=`
    <div class="pg-hero">
      <div class="pg-hero-content">
        <div class="section-pill">${isSeller?'<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> Recebidas':'<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Compras'}</div>
        <h1>${isSeller?'Encomendas recebidas':'As minhas encomendas'}</h1>
        <p>${isSeller?'Gira cada encomenda dos teus clientes, do pedido à entrega.':'Acompanha o percurso das tuas compras em tempo real.'}</p>
      </div>
    </div>
    <div id="orders-stats" class="stats-row reveal" style="margin-bottom:20px"></div>
    <div class="filter-scroll-wrap">
    <div class="filter-scroll reveal" style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px">
      ${['','PENDENTE','ACEITE','EM_PREPARACAO','EM_ENTREGA','ENTREGUE','CANCELADA'].map(s=>
        `<button class="btn btn-xs ${s===''?'btn-primary':'btn-soft'}" id="ftb-${s||'ALL'}" style="white-space:nowrap" onclick="filterOrders('${s}')">${s?STATUS_LABEL[s]:'Todas'} <span id="ftc-${s||'ALL'}" style="opacity:.65"></span></button>`
      ).join('')}
    </div>
    </div>
    <div id="orders-list" style="display:flex;flex-direction:column;gap:12px"></div>`;

  await loadOrders(isSeller, user.role);
}});

let _allOrders=[], _userRole='';
async function loadOrders(isSeller, role){
  _userRole=role;
  const list=document.getElementById('orders-list');
  skeletonCards(list, 3);
  try{
    const endpoint = isSeller ? '/orders/received' : '/orders/mine';
    const res=await api.get(endpoint,{limit:100});
    _allOrders=res?.data?.orders||[];
    renderStats(_allOrders);
    renderCounts(_allOrders);
    renderOrders(_allOrders, role);
  }catch(e){ list.innerHTML=`<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`; }
}

function renderStats(orders){
  const el=document.getElementById('orders-stats');
  if(!el) return;
  const pending = orders.filter(o=>['PENDENTE','ACEITE','EM_PREPARACAO','EM_ENTREGA'].includes(o.status)).length;
  const delivered = orders.filter(o=>o.status==='ENTREGUE');
  const total = delivered.reduce((s,o)=>s+(o.total||0),0);
  el.innerHTML=`
    <div class="stat"><div class="val">${orders.length}</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="val">${pending}</div><div class="lbl">Em curso</div></div>
    <div class="stat"><div class="val">${delivered.length}</div><div class="lbl">Entregues</div></div>
    <div class="stat"><div class="val">${fmtMT(total)}</div><div class="lbl">${_userRole==='SELLER'?'Vendido':'Gasto'}</div></div>`;
}

function renderCounts(orders){
  const keys=['','PENDENTE','ACEITE','EM_PREPARACAO','EM_ENTREGA','ENTREGUE','CANCELADA'];
  keys.forEach(s=>{
    const el=document.getElementById(`ftc-${s||'ALL'}`);
    if(!el) return;
    const n = s ? orders.filter(o=>o.status===s).length : orders.length;
    el.textContent = n?`(${n})`:'';
  });
}

function filterOrders(status){
  document.querySelectorAll('[id^="ftb-"]').forEach(b=>{b.className='btn btn-xs btn-soft';});
  const key=status||'ALL';
  document.getElementById(`ftb-${key}`).className='btn btn-xs btn-primary';
  const filtered = status ? _allOrders.filter(o=>o.status===status) : _allOrders;
  renderOrders(filtered, _userRole);
}

function renderOrders(orders, role){
  const list=document.getElementById('orders-list');
  if(!orders.length){ list.innerHTML=`<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div><h3>Sem encomendas por aqui</h3><p>${role==='SELLER'?'Assim que alguém encomendar na tua loja, aparece aqui.':'As tuas próximas compras vão aparecer aqui.'}</p></div>`; return; }
  list.innerHTML=orders.map(o=>orderCard(o,role)).join('');
  animateItems(list);
}

function orderProgress(status){
  if(status==='CANCELADA') return `<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--red);font-weight:700"><span><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span> Encomenda cancelada</div>`;
  const idx = ORDER_FLOW.indexOf(status);
  return `<div class="order-steps">
    ${ORDER_FLOW.map((s,i)=>`<div class="order-step ${i<=idx?'done':''}" title="${STATUS_LABEL[s]}"></div>`).join('')}
  </div>`;
}

function orderCard(o, role){
  const transitions=(ORDER_TRANSITIONS[role]||{})[o.status]||[];
  const actionBtns = transitions.map(ns=>`<button class="btn btn-sm ${ns==='CANCELADA'?'btn-danger':ns==='ENTREGUE'?'btn-success':'btn-primary'}" onclick="updateStatus('${o.id}','${ns}')">${ACTION_LABEL[ns]||STATUS_LABEL[ns]}</button>`).join('');
  const canReview = role==='BUYER' && o.status==='ENTREGUE' && !o.reviewed;
  const itemCount = (o.items||[]).reduce((s,it)=>s+(it.qty||1),0);
  return `<div class="order-card">
    <div class="order-head">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
          <div style="font-weight:700;font-size:14px">Nº #${o.id.slice(0,8).toUpperCase()}</div>
          <span class="badge b-gray">${itemCount} ${itemCount===1?'item':'itens'}</span>
        </div>
        <div style="font-size:12px;color:var(--t4)">${fmtDate(o.createdAt)} · ${fmtTime(o.createdAt)}</div>
        ${o.address?`<div style="font-size:12px;color:var(--t3);margin-top:3px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${esc(o.address)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
        ${stBadge(o.status)}
        <span style="font-family:'Inter',sans-serif;font-weight:800;font-size:16px;color:var(--b-600)">${fmtMT(o.total)}</span>
      </div>
    </div>
    <div style="margin-bottom:14px">${orderProgress(o.status)}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${(o.items||[]).map(it=>`
        <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surf3);border-radius:var(--r);border:1px solid var(--brd)">
          ${it.image?`<img loading="lazy" decoding="async" src="${esc(it.image)}" alt="${esc(it.name||'')}" style="width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0">`:`<div style="width:44px;height:44px;border-radius:8px;background:var(--surf3);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--t3)">${icon('box',18)}</div>`}
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px">${esc(it.name||it.product?.name||'Produto')}</div>
            <div style="font-size:11px;color:var(--t4)">Qtd: ${it.qty} · ${fmtMT(it.price||0)}/un.</div>
          </div>
          <div style="font-weight:700;color:var(--b-600);font-family:'Inter',sans-serif;font-weight:800">${fmtMT((it.qty||1)*(it.price||0))}</div>
        </div>`).join('')}
    </div>
    <div class="order-actions">
      <button class="btn btn-ghost btn-sm" onclick="go('order-detail.html',{id:'${o.id}'})"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> Ver detalhes</button>
      ${actionBtns}
      ${canReview?`<button class="btn btn-soft btn-sm" onclick="openReview('${o.id}','${o.items?.[0]?.productId||''}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Avaliar</button>`:''}
      ${role==='BUYER'&&o.status!=='CANCELADA'?`<button class="btn btn-soft btn-sm" onclick="openChat('${o.sellerId}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Falar com vendedor</button>`:''}
    </div>
  </div>`;
}

async function updateStatus(orderId, newStatus){
  try{await api.patch(`/orders/${orderId}/status`,{status:newStatus});toast('Estado actualizado!');await loadOrders(_userRole==='SELLER',_userRole);}
  catch(e){toast(apiErrorMessage(e),'err');}
}
async function openChat(sid){
  try{const r=await api.get(`/chat/with/${sid}`);go('chat.html',{chatId:r?.data?.chat?.id||''});}
  catch(e){toast(apiErrorMessage(e),'err');}
}
function openReview(orderId, productId){
  openModal(`<div class="modal-hd"><h3>Avaliar compra</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="fg"><label>Classificação</label><div id="star-pick" class="star-pick"></div></div>
    <div class="fg"><label>Recomenda este vendedor?</label>
      <div class="thumb-btns" id="rv-thumb-pick">
        <button type="button" class="thumb-btn" data-val="up" onclick="pickThumb(this)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg> Sim</button>
        <button type="button" class="thumb-btn" data-val="down" onclick="pickThumb(this)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg> Não</button>
      </div>
    </div>
    <div class="fg"><label>Comentário (opcional)</label><textarea id="rv-comment" rows="3" placeholder="Como foi a sua experiência?"></textarea></div>
    <div style="display:flex;gap:9px">
      <button class="btn btn-primary" style="flex:1" onclick="submitReview('${orderId}','${productId}')">Enviar avaliação</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
  starPicker('star-pick');
}
function pickThumb(btn){
  btn.parentElement.querySelectorAll('.thumb-btn').forEach(b=>b.classList.remove('on-up','on-down'));
  btn.classList.add(btn.dataset.val==='up'?'on-up':'on-down');
}
async function submitReview(orderId,productId){
  const starEl=document.getElementById('star-pick');
  const r=starEl && starEl._getValue ? starEl._getValue() : 0;
  const comment=document.getElementById('rv-comment').value.trim();
  const thumbBtn=document.querySelector('#rv-thumb-pick .thumb-btn.on-up, #rv-thumb-pick .thumb-btn.on-down');
  const recommend=thumbBtn ? thumbBtn.dataset.val==='up' : undefined;
  if(!r){toast('Seleccione uma classificação.','warn');return;}
  try{await api.post('/reviews',{orderId,productId,rating:r,comment,recommend});closeModal();toast('Avaliação enviada! <svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>');await loadOrders(_userRole==='SELLER',_userRole);}
  catch(e){toast(apiErrorMessage(e),'err');}
}
</script></body></html>
