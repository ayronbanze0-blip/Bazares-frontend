<style>
.chat-root {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: calc(100vh - var(--tb-h, 60px));
  background: var(--surf);
  border: 1px solid var(--brd);
  border-radius: var(--rl);
  overflow: hidden;
  box-shadow: var(--sh1);
}
.chat-sidebar {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--brd);
  background: var(--surf);
}
.chat-sidebar-hd {
  padding: 16px;
  border-bottom: 1px solid var(--brd);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surf);
  position: sticky;
  top: 0;
  z-index: 1;
}
.chat-sidebar-hd h3 { font-size: 16px; margin: 0; }
.chat-search {
  padding: 10px 12px;
  border-bottom: 1px solid var(--brd);
}
.chat-search input {
  width: 100%;
  background: var(--surf3);
  border-radius: var(--pill);
  font-size: 16px;
  padding: 8px 14px;
  border: 1px solid transparent;
  transition: border var(--ease);
}
.chat-search input:focus { border-color: var(--b-300); outline: none; }
.chat-filter-tabs { display: flex; gap: 8px; padding: 0 12px 10px; }
.chat-filter-tab {
  flex-shrink: 0;
  border: 1.5px solid var(--brd);
  background: var(--surf);
  color: var(--t3);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: var(--pill);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
}
.chat-filter-tab.on { background: var(--g-green); border-color: transparent; color: #fff; }
.chat-filter-tab .cft-count { opacity: .85; }
.chat-list-inner { flex: 1; overflow-y: auto; }
.chat-bot-fab{
  position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:var(--g-green);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(0,224,67,.4);transition:var(--ease);
}
.chat-bot-fab:hover{transform:scale(1.06)}
.chat-bot-fab .ico-inline{width:24px;height:24px}
@media (min-width:701px){ .chat-bot-fab{right:calc(18px + 300px)} }
.ci {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--brd);
  transition: background .15s;
  position: relative;
}
.ci:hover { background: var(--surf3); }
.ci.active { background: var(--b-50); }
.ci-avatar { position: relative; flex-shrink: 0; }
.ci-online {
  position: absolute;
  bottom: 1px; right: 1px;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #22c55e;
  border: 2px solid var(--surf);
}
.ci-body { flex: 1; min-width: 0; }
.ci-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
.ci-name { font-weight: 700; font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.ci-time { font-size: 10px; color: var(--t4); flex-shrink: 0; }
.ci-preview { font-size: 12px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-preview.unread { color: var(--text); font-weight: 600; }
.ci-badge {
  background: var(--g-green);
  color: #fff;
  border-radius: var(--pill);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  flex-shrink: 0;
  margin-left: 4px;
  min-width: 20px;
  text-align: center;
}
.chat-pane {
  display: flex;
  flex-direction: column;
  background: var(--surf3);
  position: relative;
}
.chat-hd {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  background: var(--surf);
  border-bottom: 1px solid var(--brd);
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
  z-index: 1;
}
.chat-hd-info { flex: 1; }
.chat-hd-name { font-weight: 700; font-size: 15px; color: var(--text); }
.chat-hd-status { font-size: 11px; color: var(--t4); margin-top: 1px; }
.chat-hd-online { color: #22c55e; font-weight: 600; }
.chat-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: var(--surf3);
}
.msg-date-sep {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 8px;
}
.msg-date-sep::before,
.msg-date-sep::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--brd2);
}
.msg-date-sep span {
  font-size: 10px;
  font-weight: 600;
  color: var(--t4);
  background: var(--surf3);
  padding: 2px 10px;
  border-radius: var(--pill);
  border: 1px solid var(--brd2);
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  animation: msgIn .18s ease;
}
.msg-row.me { flex-direction: row-reverse; }
.msg-row.them { flex-direction: row; }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.bubble {
  max-width: 68%;
  padding: 9px 13px 6px;
  border-radius: 18px;
  font-size: 13.5px;
  line-height: 1.55;
  position: relative;
  word-break: break-word;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.bubble.me {
  background: var(--g-green);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.bubble.them {
  background: var(--surf);
  color: var(--text);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--brd);
}
.bubble-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  margin-top: 3px;
}
.bubble-time {
  font-size: 10px;
  opacity: .6;
}
.bubble.them .bubble-time { text-align: left; }
.bubble-tick { font-size: 11px; opacity: .7; }
.bubble-tick.read { opacity: 1; color: #60a5fa; }
.msg-av { width: 26px; height: 26px; flex-shrink: 0; margin-bottom: 2px; }
.msg-av .avatar { width: 26px !important; height: 26px !important; font-size: 10px !important; }
.msg-av-spacer { width: 26px; flex-shrink: 0; }
.msg-row.consec .msg-av { visibility: hidden; }
.msg-row.consec { margin-top: -1px; }
.typing-bubble {
  display: none;
  align-items: flex-end;
  gap: 7px;
  padding: 4px 0 6px;
}
.typing-bubble.show { display: flex; }
.typing-dots {
  background: var(--surf);
  border: 1px solid var(--brd);
  border-radius: 18px;
  border-bottom-left-radius: 4px;
  padding: 10px 16px;
  display: flex;
  gap: 4px;
  align-items: center;
}
.typing-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--t4);
  animation: typingBounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes typingBounce {
  0%,60%,100% { transform: translateY(0); }
  30%          { transform: translateY(-5px); }
}
.chat-inp-bar {
  padding: 10px 14px;
  background: var(--surf);
  border-top: 1px solid var(--brd);
  display: flex;
  align-items: center;
  gap: 10px;
}
.chat-inp-bar textarea {
  flex: 1;
  resize: none;
  border-radius: 22px;
  background: var(--surf3);
  border: 1px solid var(--brd);
  padding: 9px 16px;
  font-size: 13.5px;
  line-height: 1.5;
  max-height: 120px;
  overflow-y: auto;
  transition: border .2s;
  font-family: inherit;
  /* Em navegadores que suportam isto (Chrome/Edge recentes), o próprio
     CSS trata do auto-crescimento da caixa — sem isto, era o JS
     (autoResize) que tinha de recalcular a altura a cada tecla,
     forçando um re-desenho da barra toda e dando a sensação de
     "tremor" enquanto se escreve. */
  field-sizing: content;
}
.chat-inp-bar textarea:focus { outline: none; border-color: var(--b-400); }
.chat-inp-bar textarea::placeholder { color: var(--t4); }
.send-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--g-green);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform .15s, opacity .15s;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.send-btn:hover { transform: scale(1.08); }
.send-btn:active { transform: scale(.94); }
.send-btn svg { width: 18px; height: 18px; fill: #fff; }
.chat-empty-pane {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--t4);
}
.chat-empty-pane .ico { font-size: 52px; opacity: .5; }
.chat-empty-pane p { font-size: 14px; }
.chat-main-wrap { padding: 0 !important; margin-left: 0 !important; }
/* ── Página imersiva: em mobile o #topbar global desaparece — a lista
   de conversas usa .chat-sidebar-hd como cabeçalho próprio, e a
   conversa aberta usa o cabeçalho com botão Voltar já existente em
   .chat-pane-hd. Sem o topbar sticky a ocupar espaço, o chat-root
   passa a ocupar toda a altura do ecrã. ── */
@media (max-width: 900px) { #topbar { display: none; } }
@media (max-width: 700px) {
  .chat-root { grid-template-columns: 1fr; height: 100vh; }
  .chat-sidebar { display: none; }
  .chat-sidebar.mob-show { display: flex; position: absolute; inset: 0; z-index: 10; width: 100%; }
  .chat-sidebar-hd { padding-top: max(16px, env(safe-area-inset-top)); }
  .chat-hd { padding-top: max(12px, env(safe-area-inset-top)); }
  .chat-pane { display: none; }
  .chat-pane.mob-show { display: flex; }
  .chat-mob-back { display: flex !important; }
}
.chat-mob-back { display: none; }
</style>
</head>
<body data-require-auth="1">
<header id="topbar"></header>
<div class="overlay" id="overlay"></div>
<aside id="sidebar" class="closed"></aside>
<main id="main" class="chat-main-wrap">
  <div id="view"><div style="padding:40px;text-align:center;color:var(--t3);font-size:13px">A carregar mensagens...</div></div>
</main>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
function showJsError(label, detail) {
  var el = document.getElementById('view') || document.body;
  el.innerHTML = '<div style="padding:30px;font-family:monospace;font-size:12px;white-space:pre-wrap;color:var(--r-600);background:var(--red-bg);border:1px solid rgba(238,20,20,.25);border-radius:8px;margin:16px">' +
    label + ':\n' + detail + '</div>';
}
window.addEventListener('error', function(ev) {
  showJsError('ERRO JS', (ev.message || 'erro desconhecido') + '\n\nFicheiro: ' + (ev.filename || '-') + '\nLinha: ' + (ev.lineno || '-') + ':' + (ev.colno || '-'));
});
window.addEventListener('unhandledrejection', function(ev) {
  var r = ev.reason;
  var msg = (r && (r.stack || r.message)) ? (r.message || '') + '\n' + (r.stack || '') : String(r);
  showJsError('PROMISE REJEITADA', msg);
});
</script>

<script>
'use strict';
let _chats = [], _activeChatId = null, _meId = null, _pollTimer = null, _socket = null;
let _searchQ = '';
let _socketLoading = false;

function loadSocketIoScript() {
  if (window.io || _socketLoading) return;
  _socketLoading = true;
  const s = document.createElement('script');
  s.src = 'https://cdn.socket.io/4.7.5/socket.io.min.js';
  s.async = true;
  s.onload = () => { try { initSocket(); } catch {} };
  s.onerror = () => {};
  document.head.appendChild(s);
}

initPage({ active: 'chat.html', requireAuth: true, onReady: async (user) => {
  _meId = user.id;

  document.getElementById('view').innerHTML = `
    <div class="chat-root" id="chat-root">
      <div class="chat-sidebar" id="chat-sidebar">
        <div class="chat-sidebar-hd">
          <h3><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Conversas</h3>
          <span id="chat-unread-total" style="font-size:12px;color:var(--t4)"></span>
        </div>
        <div class="chat-search" style="position:relative">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t4);display:flex"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input id="chat-search-inp" placeholder="Pesquisar conversas..." style="padding-left:40px" oninput="filterChats(this.value)">
        </div>
        <div class="chat-filter-tabs" id="chat-filter-tabs">
          <button type="button" class="chat-filter-tab on" data-filter="all" onclick="setChatFilter('all')">Tudo</button>
          <button type="button" class="chat-filter-tab" data-filter="unread" onclick="setChatFilter('unread')">Não lidas <span class="cft-count" id="cft-unread-count"></span></button>
          <button type="button" class="chat-filter-tab" data-filter="groups" onclick="setChatFilter('groups')">Grupos</button>
        </div>
        <div class="chat-list-inner" id="chat-list"></div>
      </div>
      <div class="chat-pane" id="chat-pane">
        <div class="chat-empty-pane">
          <div class="ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
          <p>Seleccione uma conversa para começar</p>
        </div>
      </div>
    </div>
    <button type="button" class="chat-bot-fab" onclick="openBazarBot()" aria-label="Falar com o BazarBot" title="Falar com o BazarBot">
      <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
    </button>`;

  await loadChats();
  loadSocketIoScript();

  // On mobile: sidebar starts hidden (CSS), must add mob-show to make it visible
  if (window.innerWidth <= 700) {
    document.getElementById('chat-sidebar')?.classList.add('mob-show');
  }

  // Keep sidebar/pane visible on resize
  window.addEventListener('resize', () => {
    const sidebar = document.getElementById('chat-sidebar');
    const pane = document.getElementById('chat-pane');
    if (!sidebar || !pane) return;
    if (window.innerWidth > 700) {
      sidebar.classList.remove('mob-show');
      pane.classList.remove('mob-show');
    } else if (!_activeChatId) {
      sidebar.classList.add('mob-show');
      pane.classList.remove('mob-show');
    }
  });

  const initId = getParam('chatId');
  const initWith = getParam('with');
  if (initId) await openChat(initId);
  _applyPendingDraft(initWith);
}});

// Se veio de um botão "Tenho interesse" / "Propor um preço" no produto,
// pré-preenche a caixa de mensagem — o comprador continua a poder rever
// e editar antes de enviar, nada é disparado automaticamente.
function _applyPendingDraft(sellerId) {
  if (!sellerId) return;
  try {
    const key = 'bz_chat_draft_' + sellerId;
    const draft = sessionStorage.getItem(key);
    if (!draft) return;
    sessionStorage.removeItem(key);
    const inp = document.getElementById('msg-inp');
    if (inp) {
      inp.value = draft;
      inp.dispatchEvent(new Event('input'));
      inp.focus();
    }
  } catch (e) {}
}

function renderChatList(chats) {
  const list = document.getElementById('chat-list');
  const q = _searchQ.toLowerCase();
  let filtered = q ? chats.filter(c => {
    const other = c.other || (c.userAId === _meId ? c.userB : c.userA);
    return other?.name?.toLowerCase().includes(q);
  }) : chats;

  if (_chatFilter === 'unread') filtered = filtered.filter(c => (c.unreadCount || 0) > 0);
  else if (_chatFilter === 'groups') filtered = filtered.filter(c => c.isGroup);

  const unreadTotal = chats.reduce((s, c) => s + (c.unreadCount || 0), 0);
  const cftCount = document.getElementById('cft-unread-count');
  if (cftCount) cftCount.textContent = unreadTotal > 0 ? unreadTotal : '';

  if (!filtered.length) {
    const emptyMsg = q ? 'Sem resultados' : _chatFilter === 'unread' ? 'Sem conversas por ler' : _chatFilter === 'groups' ? 'Ainda sem grupos' : 'Sem conversas';
    list.innerHTML = `<div class="empty" style="padding:40px"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div><h3>${emptyMsg}</h3></div>`;
    return;
  }

  list.innerHTML = filtered.map(c => {
    const other = c.other || (c.userAId === _meId ? c.userB : c.userA);
    const last = c.lastMessage;
    const isUnread = (c.unreadCount || 0) > 0;
    const timeStr = last?.createdAt ? fmtChatTime(last.createdAt) : '';
    const preview = last?.text
      ? (last.senderId === _meId ? `Você: ${last.text}` : last.text)
      : 'Sem mensagens';
    return `<div class="ci${_activeChatId === c.id ? ' active' : ''}" id="ci-${c.id}" onclick="openChat('${c.id}')">
      <div class="ci-avatar">
        ${other?.avatarUrl
          ? `<img loading="lazy" decoding="async" src="${esc(other.avatarUrl)}" alt="${esc(other?.name||'')}" style="width:42px;height:42px;border-radius:50%;object-fit:cover">`
          : avatar(other?.name || '?', 42)}
        <span class="online-dot"></span>
      </div>
      <div class="ci-body">
        <div class="ci-top">
          <div class="ci-name">${esc(other?.name || 'Utilizador')}</div>
          <div class="ci-time">${esc(timeStr)}</div>
        </div>
        <div class="ci-preview${isUnread ? ' unread' : ''}">${esc(preview)}</div>
      </div>
      ${isUnread ? `<div class="ci-badge">${c.unreadCount}</div>` : ''}
    </div>`;
  }).join('');
}

function fmtChatTime(d) {
  if (!d) return '';
  const dt = new Date(d);
  const now = new Date();
  const diff = now - dt;
  if (diff < 60000) return 'agora';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' min';
  if (dt.toDateString() === now.toDateString()) return fmtTime(d);
  if (diff < 86400000 * 7) {
    return dt.toLocaleDateString('pt-MZ', { weekday: 'short' });
  }
  return dt.toLocaleDateString('pt-MZ', { day: '2-digit', month: '2-digit' });
}

function fmtMsgDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  const now = new Date();
  if (dt.toDateString() === now.toDateString()) return 'Hoje';
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (dt.toDateString() === yesterday.toDateString()) return 'Ontem';
  return dt.toLocaleDateString('pt-MZ', { day: '2-digit', month: 'long', year: 'numeric' });
}

        ${other?.avatarUrl
          ? `<img loading="lazy" decoding="async" src="${esc(other.avatarUrl)}" alt="${esc(other?.name||'')}" style="width:40px;height:40px;border-radius:50%;object-fit:cover">`
          : avatar(other?.name || '?', 40)}
        <div class="ci-online" id="online-dot"></div>
      </div>
      <div class="chat-hd-info">
        <div class="chat-hd-name">${esc(other?.name || 'Utilizador')}</div>
        <div class="chat-hd-status" id="hd-status">${esc(ROLE_LABEL[other?.role] || '')}</div>
      </div>
    </div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="typing-bubble" id="typing-bubble">
      <div class="msg-av">${avatar(other?.name||'?',26,other?.avatarUrl||other?.photoUrl||null)}</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="img-preview-bar" style="display:none;padding:8px 12px;align-items:center;gap:8px"></div>
    <div class="chat-inp-bar">
      <button class="btn-icon" onclick="document.getElementById('chat-img-input').click()" aria-label="Anexar imagem" title="Anexar imagem">
        <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <input type="file" id="chat-img-input" accept="image/jpeg,image/jpg,image/png,image/webp" hidden onchange="onChatImagePicked(this)">
      ${!other?.isBazarBot ? `<button class="btn-icon" onclick="suggestReply()" aria-label="Sugerir resposta" title="Sugerir resposta com IA">
        <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      </button>` : ''}
      ${(!other?.isBazarBot && Session.user?.isPremium) ? `<button class="btn-icon" onclick="openQuickReplies()" aria-label="Respostas rápidas" title="Respostas rápidas">

async function loadMessages(chatId, silent = false) {
  if (_activeChatId !== chatId) return;
  const container = document.getElementById('chat-msgs');
  if (!container) return;
  if (!silent) container.innerHTML = `<div style="text-align:center;padding:24px"><span class="spinner spinner-dark"></span></div>`;

  try {
    const res = await api.get(`/chat/${chatId}/messages`, { limit: 60 });
    const msgs = res?.data?.messages || [];
    // Garantir ordem cronológica: mais antigas em cima, mais recentes em baixo
    msgs.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    if (!msgs.length) {
      container.innerHTML = `<div class="chat-empty-pane" style="height:100%"><div class="ico" style="font-size:36px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M6 13.5V11a2 2 0 0 0-4 0c0 4 2 9 8 9h1c4.5 0 7-2.5 7-7v-3"/></svg></div><p>Comece a conversa!</p></div>`;
      return;
    }

    const atBottom = !silent || (container.scrollHeight - container.scrollTop - container.clientHeight < 100);

    let html = '';
    let lastDate = '';
    let lastSender = '';

    msgs.forEach((m, i) => {
      const isMe = m.senderId === _meId;
      const side = isMe ? 'me' : 'them';
      const msgDate = fmtMsgDate(m.createdAt);
      const consec = lastSender === m.senderId && msgDate === lastDate;
      lastSender = m.senderId;

      if (msgDate !== lastDate) {
        lastDate = msgDate;
        html += `<div class="msg-date-sep"><span>${esc(msgDate)}</span></div>`;
      }

      const avHtml = !isMe
        ? `<div class="msg-av">${consec ? '' : (m.sender?.avatarUrl || m.sender?.photoUrl || m.sender?.photo_url
            ? `<img loading="lazy" decoding="async" src="${esc(m.sender.avatarUrl||m.sender.photoUrl||m.sender.photo_url)}" alt="${esc(m.sender?.name||'')}" style="width:26px;height:26px;border-radius:50%;object-fit:cover">`
            : avatar(m.sender?.name || '?', 26))}</div>`
        : `<div class="msg-av-spacer"></div>`;

      const tick = isMe ? `<span class="bubble-tick${m.read ? ' read' : ''}"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>` : '';

      html += `
        <div class="msg-row ${side}${consec ? ' consec' : ''}">
          ${!isMe ? avHtml : ''}
          <div class="bubble ${side}">
            ${m.imageUrl ? `<img loading="lazy" decoding="async" src="${esc(m.imageUrl)}" alt="Imagem enviada" style="max-width:220px;border-radius:10px;display:block;margin-bottom:${m.text ? '6px' : '0'};cursor:pointer" onclick="window.open('${esc(m.imageUrl)}','_blank')">` : ''}
            ${esc(m.text || m.content || '')}
            <div class="bubble-meta">
              <span class="bubble-time">${fmtTime(m.createdAt)}</span>
              ${tick}
            </div>
          </div>
          ${isMe ? avHtml : ''}
        </div>`;
    });

    container.innerHTML = html;
    if (atBottom) container.scrollTop = container.scrollHeight;

  } catch {}
}

let _pendingImage = null; // File seleccionado, ainda não enviado

function onChatImagePicked(input) {
  const file = input.files?.[0];
  input.value = '';
  if (!file) return;
  // Sem isto o ficheiro da câmara ia direito para o FormData em
  // sendMessage() sem limite nem compressão — a mesma classe de bug
  // corrigida em anuncio.html (Ronda 30c): fotos grandes numa rede
  // mais lenta batiam no timeout de upload.
  if (file.size > 10 * 1024 * 1024) { toast('A imagem deve ter no máximo 10MB.', 'warn'); return; }
  _pendingImage = file;
  const bar = document.getElementById('img-preview-bar');
  if (!bar) return;
  const url = URL.createObjectURL(file);
  bar.style.display = 'flex';
  bar.innerHTML = `
    <img loading="lazy" decoding="async" src="${url}" alt="Pré-visualização da imagem a enviar" style="width:44px;height:44px;border-radius:8px;object-fit:cover">
    <span style="font-size:12px;color:var(--t4);flex:1">Imagem pronta a enviar</span>
    <button class="btn-icon" onclick="clearPendingImage()" aria-label="Remover"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
}

function clearPendingImage() {
  _pendingImage = null;
  const bar = document.getElementById('img-preview-bar');
  if (bar) { bar.style.display = 'none'; bar.innerHTML = ''; }
}

function autoResize(el) {
  // Reserva para navegadores sem suporte a "field-sizing: content" (CSS,
  // ver acima). Só escreve no DOM quando a altura precisa mesmo de mudar
  // — reescrever a cada tecla, mesmo sem alteração real, é o que causava
  // o "tremor" na caixa de mensagem.
  const prevHeight = el.style.height;
  el.style.height = 'auto';
  const target = Math.min(el.scrollHeight, 120) + 'px';
  el.style.height = target === prevHeight ? prevHeight : target;
}

// Comprime antes de subir — mesmo helper usado em anuncio.html/novoproduto.html
// (Ronda 30c/30d): sem isto, a foto da câmara ia em bruto (até 10MB, ver
// onChatImagePicked) para o FormData e podia bater no timeout de upload.
function compressChatImage(file, maxSize=1600, quality=0.82){
  return window.MediaCompress ? MediaCompress.compressImage(file, maxSize, quality) : Promise.resolve(file);
}

async function sendMsg() {
  const inp = document.getElementById('msg-inp');
  const text = inp?.value?.trim();
  if ((!text && !_pendingImage) || !_activeChatId) return;

  const imageToSend = _pendingImage;
  clearPendingImage();
  inp.value = '';
  inp.style.height = 'auto';

  const container = document.getElementById('chat-msgs');
  if (container) {
    const tmp = document.createElement('div');
    tmp.className = 'msg-row me';
    tmp.style.opacity = '.65';
    const imgPreviewHtml = imageToSend ? `<img loading="lazy" decoding="async" src="${URL.createObjectURL(imageToSend)}" alt="Imagem pronta a enviar" style="max-width:180px;border-radius:10px;display:block;margin-bottom:${text ? '6px' : '0'}">` : '';
    tmp.innerHTML = `
      <div class="msg-av-spacer"></div>
      <div class="bubble me">
        ${imgPreviewHtml}${esc(text || '')}
        <div class="bubble-meta">
          <span class="bubble-time">${fmtTime(new Date())}</span>
          <span class="bubble-tick"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        </div>
      </div>`;
    container.appendChild(tmp);
    container.scrollTop = container.scrollHeight;
  }

  try {
    if (imageToSend) {
      // Mensagens com imagem vão sempre por REST (multipart) — o socket
      // não transporta ficheiros.
      const fd = new FormData();
      if (text) fd.append('text', text);
      fd.append('image', await compressChatImage(imageToSend));
      await api.postForm(`/chat/${_activeChatId}/messages`, fd);
    } else if (_socket?.connected) {
      _socket.emit('message:send', { chatId: _activeChatId, text });
    } else {
      await api.post(`/chat/${_activeChatId}/messages`, { text });
    }
    await loadMessages(_activeChatId, true);

    const ch = _chats.find(c => c.id === _activeChatId);
    if (ch) {
      ch.lastMessage = { text: text || 'Imagem', senderId: _meId, createdAt: new Date().toISOString() };
      renderChatList(_chats);
      document.getElementById(`ci-${_activeChatId}`)?.classList.add('active');
    }
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

function initSocket() {
  if (_socket || typeof io === 'undefined') return;
  const token = getAccessToken();
  if (!token) return;

  try {
    _socket = io(SOCKET_BASE, { auth: { token }, transports: ['websocket', 'polling'] });
  } catch { _socket = null; return; }

  _socket.on('connect', () => {
    if (_activeChatId) _socket.emit('chat:join', { chatId: _activeChatId });
  });

  _socket.on('message:new', (msg) => {
    if (msg.chatId === _activeChatId) {
      loadMessages(_activeChatId, true);
    } else {
      const ch = _chats.find(c => c.id === msg.chatId);
      if (ch) {
        ch.lastMessage = msg;
        ch.unreadCount = (ch.unreadCount || 0) + 1;
        renderChatList(_chats);
        document.getElementById(`ci-${_activeChatId}`)?.classList.add('active');
      }
    }
  });

  _socket.on('typing:start', ({ chatId, userId }) => {
    if (chatId === _activeChatId && userId !== _meId) {
      const tb = document.getElementById('typing-bubble');
      if (tb) {
        tb.classList.add('show');
        clearTimeout(tb._t);
        tb._t = setTimeout(() => tb.classList.remove('show'), 2500);
      }
    }
  });

  _socket.on('typing:stop', ({ chatId, userId }) => {
    if (chatId === _activeChatId && userId !== _meId) {
      const tb = document.getElementById('typing-bubble');
      if (tb) tb.classList.remove('show');
    }
  });

  _socket.on('connect_error', () => {});
}

// Stop polling when user navigates away or logs out
window.addEventListener('beforeunload', () => { if (_pollTimer) clearInterval(_pollTimer); });
document.addEventListener('bazares:unauthorized', () => {
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = null;
  _activeChatId = null;
});

let _typingTimer;
document.addEventListener('input', e => {
  if (e.target.id !== 'msg-inp' || !_socket?.connected || !_activeChatId) return;
  _socket.emit('typing:start', { chatId: _activeChatId });
  clearTimeout(_typingTimer);
  _typingTimer = setTimeout(() => {
    _socket.emit('typing:stop', { chatId: _activeChatId });
  }, 2000);
});

function mobileBack() {
  document.getElementById('chat-pane')?.classList.remove('mob-show');
  document.getElementById('chat-sidebar')?.classList.add('mob-show');
  document.querySelector('.chat-bot-fab')?.style.removeProperty('display');
  if (_pollTimer) clearInterval(_pollTimer);
  if (_socket?.connected && _activeChatId) _socket.emit('chat:leave', { chatId: _activeChatId });
  _activeChatId = null;
}
</script>
</body>
