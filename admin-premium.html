<script>
initPage({ active:'admin-premium.html', requireAuth:true, roles:['ADMIN'], onReady: async () => {
  await renderShell();
}});

let _apFilterStatus = '';

async function renderShell() {
  document.getElementById('view').innerHTML = `
    <div class="pg-hero pg-hero--compact"><div class="pg-hero-content">
      <div class="section-pill">${icon('star',14,2)} Conta Premium</div>
      <h1>Códigos Premium</h1>
      <p>Gere códigos para conceder Conta Premium sem passar pelo pagamento — cortesias, parcerias, testes</p>
    </div></div>

    <div class="card reveal" style="margin-bottom:22px">
      <h4 style="margin-bottom:14px">${icon('sparkle',16,2)} Gerar novos códigos</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="fg"><label>Quantidade</label><input id="ap-qty" type="number" min="1" max="100" value="1"></div>
        <div class="fg"><label>Duração (meses)</label><input id="ap-months" type="number" min="1" max="24" value="1"></div>
      </div>
      <div class="fg"><label>Nota (opcional)</label><input id="ap-note" placeholder="Ex: Parceria feira de Maputo, Jul/2026"></div>
      <button class="btn btn-primary btn-block" onclick="generateCodes()">${icon('check',18,2)} Gerar código(s)</button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <h4 style="margin:0">Códigos gerados</h4>
      <select id="ap-status-filter" onchange="filterCodes(this.value)" style="max-width:180px">
        <option value="">Todos os estados</option>
        <option value="ACTIVO">Activo</option>
        <option value="USADO">Usado</option>
        <option value="REVOGADO">Revogado</option>
        <option value="EXPIRADO">Expirado</option>
      </select>
    </div>

    <div id="ap-content" class="reveal"><div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div></div>
    <div id="ap-pagination"></div>`;

  await loadCodes();
}

async function generateCodes() {
  const quantity = parseInt(document.getElementById('ap-qty').value) || 1;
  const months = parseInt(document.getElementById('ap-months').value) || 1;
  const note = document.getElementById('ap-note').value.trim();

  try {
    const res = await api.post('/premium/admin/codes', { quantity, months, note });
    const codes = res?.data?.codes || [];
    toast(res?.message || 'Código(s) gerado(s).', 'ok');
    if (codes.length) showGeneratedCodes(codes);
    await loadCodes();
  } catch (e) {
    toast(apiErrorMessage(e), 'err');
  }
}

function showGeneratedCodes(codes) {
  const list = codes.join('\n');
  openModal(`
    <div class="modal-hd"><h3>${codes.length} código(s) gerado(s)</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <p style="font-size:12.5px;color:var(--t3);margin-bottom:12px">Copie e partilhe com o vendedor. Cada código só pode ser usado uma vez.</p>
    <div style="background:var(--b-50);border-radius:var(--rm);padding:14px;font-family:monospace;font-size:14px;font-weight:700;line-height:2;letter-spacing:.02em;max-height:220px;overflow-y:auto">
      ${codes.map(c => esc(c)).join('<br>')}
    </div>
    <button class="btn btn-outline btn-block" style="margin-top:12px" onclick="copyCodes(\`${list}\`)">${icon('clipboard',18,2)} Copiar todos</button>
  `);
}

function copyCodes(text) {
  navigator.clipboard?.writeText(text)
    .then(() => toast('Copiado!', 'ok'))
    .catch(() => toast('Não foi possível copiar. Copie manualmente.', 'warn'));
}

function filterCodes(status) {
  _apFilterStatus = status;
  loadCodes();
}

async function loadCodes(page = 1) {
  const content = document.getElementById('ap-content');
  content.innerHTML = `<div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>`;
  try {
    const res = await api.get('/premium/admin/codes', { page, limit: 30, status: _apFilterStatus || undefined });
    const codes = res.data.codes || [];
    const meta = res.data.meta || {};
    content.innerHTML = `<div class="tbl-wrap"><table>
      <thead><tr><th>Código</th><th>Meses</th><th>Estado</th><th>Usado por</th><th>Gerado por</th><th>Data</th><th></th></tr></thead>
      <tbody>${codes.length ? codes.map(c => `<tr>
        <td style="font-family:monospace;font-weight:700">${esc(c.code)}</td>
        <td>${c.months}</td>
        <td>${codeStatusBadge(c.status)}</td>
        <td style="font-size:12px;color:var(--t3)">${c.usedBy ? esc(c.usedBy.name) : 'Por usar'}</td>
        <td style="font-size:12px;color:var(--t3)">${esc(c.createdBy?.name || 'N/D')}</td>
        <td style="font-size:11.5px;color:var(--t4)">${fmtDate(c.createdAt)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-ghost btn-sm" onclick="copyCodes('${c.code}')" title="Copiar">${icon('clipboard',15,2)}</button>
          ${c.status === 'ACTIVO' ? `<button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="revokeCode('${c.id}')" title="Revogar">${icon('close',15,2)}</button>` : ''}
        </td>
      </tr>`).join('') : `<tr><td colspan="7" style="text-align:center;color:var(--t4);padding:32px">Sem códigos gerados</td></tr>`}</tbody>
    </table></div>`;
    renderPagination('ap-pagination', meta, loadCodes);
  } catch (e) {
    content.innerHTML = `<div class="empty"><div class="empty-ico">${icon('flag',24,2)}</div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}

async function revokeCode(id) {
  if (!await confirmDialog('Revogar este código? Deixa de poder ser resgatado.', { title:'Revogar código', confirmLabel:'Revogar', danger:true })) return;
  try {
    await api.post(`/premium/admin/codes/${id}/revoke`);
    toast('Código revogado.', 'ok');
    await loadCodes();
  } catch (e) {
    toast(apiErrorMessage(e), 'err');
  }
}

function codeStatusBadge(s) {
  const map = { ACTIVO: ['Activo', 'b-grn'], USADO: ['Usado', 'b-blu'], REVOGADO: ['Revogado', 'b-red'], EXPIRADO: ['Expirado', 'b-gld'] };
  const [label, cls] = map[s] || [s, 'b-blu'];
  return `<span class="badge ${cls}">${label}</span>`;
}
