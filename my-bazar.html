<style>
/* ── O meu Bazar — refinamento visual (só nesta página) ─────────
   Objectivo: elevar os cartões de estatística, o widget de medalha
   e os "Detalhes da loja" de caixas cinzentas genéricas para um
   layout com hierarquia clara, ícones consistentes e mais
   respiração — sem tocar no hero nem em nenhuma lógica/JS. */

/* Grelha de estatísticas — ícone no seu próprio badge circular,
   separado do número, em vez de emoji colado ao valor. */
.mb-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.mb-stat{
  background:var(--surf,#fff);border:1px solid var(--brd);border-radius:var(--rl);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--sh0);transition:box-shadow .18s ease,transform .18s ease;
}
.mb-stat:hover{box-shadow:var(--sh1);transform:translateY(-1px)}
.mb-stat-ico{
  width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;
}
.mb-stat .val{font-size:24px;font-weight:900;color:var(--n-900,#18181B);line-height:1;letter-spacing:-.02em}
[data-theme=dark] .mb-stat .val{color:#fff}
.mb-stat .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t4)}

/* Widget "Medalha do mês" — cabeçalho com badge circular em vez de
   emoji solto ao lado do texto. */
.mb-medal-card{padding:20px}
.mb-medal-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mb-medal-badge{
  width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:21px;flex-shrink:0;box-shadow:var(--sh0);
}
.mb-medal-badge.tier-bronze{background:linear-gradient(155deg,#E3A867,#CD7F32)}
.mb-medal-badge.tier-prata{background:linear-gradient(155deg,#D7D8DC,#A8A9AD)}
.mb-medal-badge.tier-ouro{background:linear-gradient(155deg,#FFD700,#D4AF37)}

/* Marcadores de nível por baixo da barra — mostram onde estás e o que
   falta, em vez de só uma barra sem contexto nenhum. */
.mb-tier-row{display:flex;justify-content:space-between;margin-top:7px}
.mb-tier-mark{font-size:10.5px;font-weight:700;color:var(--t4);display:flex;align-items:center;gap:4px}
.mb-tier-mark.is-active{color:var(--t2)}
.mb-tier-mark .dot{width:6px;height:6px;border-radius:50%;background:var(--brd2)}
.mb-tier-mark.is-active .dot{background:currentColor}
.mb-medal-pct{font-size:12.5px;font-weight:800;color:var(--t3);white-space:nowrap}

/* "Detalhes da loja" — linhas com ícone em círculo e texto alinhado,
   em vez de caixas cinzentas repetidas com emoji inline. */
.mb-info-list{display:flex;flex-direction:column;gap:6px}
.mb-info-row{
  display:flex;align-items:center;gap:12px;padding:11px 4px;
  border-bottom:1px solid var(--brd);font-size:13.5px;color:var(--t2);
}
.mb-info-row:last-child{border-bottom:none}
.mb-info-ico{
  width:32px;height:32px;border-radius:10px;background:var(--surf3);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:var(--t2);
}
.mb-info-row.verified{color:var(--a-700,#B45309);font-weight:700}
.mb-info-row.verified .mb-info-ico{background:rgba(245,158,11,.14);color:var(--a-600)}
.mb-info-empty{
  padding:12px;background:var(--red-bg);border-radius:var(--r);border:1px solid var(--brd);
  font-size:12.5px;color:var(--t3);display:flex;align-items:center;gap:8px;
}
.mb-store-hd{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--surf3);border-radius:var(--rl);border:1px solid var(--brd);margin-bottom:12px;
}

/* ── Novo dashboard gamificado (réplica do mockup) ──────────────── */
.mb-idcard{
  position:relative;border-radius:var(--rl);padding:20px;margin-bottom:16px;color:#fff;
  background:linear-gradient(135deg,var(--b-600),var(--b-500));
  box-shadow:var(--sh1);
}
.mb-idcard-gear{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.16);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:var(--ease)}
.mb-idcard-gear:hover{background:rgba(255,255,255,.28)}
.mb-idcard-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mb-idcard-name{font-size:17px;font-weight:800}
.mb-idcard-link{background:none;border:none;color:rgba(255,255,255,.85);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:0;margin-top:2px}
.mb-idcard-link:hover{color:#fff}
.mb-idcard-medal{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:var(--r);padding:10px 12px}
.mb-idcard-medal-lbl{font-size:12.5px;font-weight:700}
.mb-idcard-sub{font-size:11.5px;color:rgba(255,255,255,.8);margin-top:8px;text-align:center}

.mb-stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.mb-stat3{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:13px 10px;text-align:center;box-shadow:var(--sh0)}
.mb-stat3 .val{font-size:19px;font-weight:900;color:var(--n-900,#18181B);line-height:1.1}
[data-theme=dark] .mb-stat3 .val{color:#fff}
.mb-stat3 .lbl{font-size:10.5px;color:var(--t4);font-weight:600;margin-top:3px}
.mb-stat3-delta{color:var(--grn);font-weight:700}

.mb-chart-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 10px;color:var(--t4);text-align:center;font-size:12px}

.mb-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.mb-metric{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:12px}
.mb-metric-ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mb-metric .val{font-size:15px;font-weight:800;line-height:1.1}
.mb-metric .lbl{font-size:10px;color:var(--t4);font-weight:600}

.mb-prod-mini{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:var(--r);padding:6px;margin:-6px;transition:background .15s ease}
.mb-prod-mini:hover{background:var(--surf3)}
.mb-prod-mini img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex-shrink:0}
.mb-prod-mini-noimg{width:44px;height:44px;border-radius:9px;background:var(--surf3);display:flex;align-items:center;justify-content:center;color:var(--t4);flex-shrink:0}

.mb-review-mini{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--brd)}
.mb-review-mini:last-child{border-bottom:none;padding-bottom:0}

.mb-link-btn{background:none;border:none;color:var(--b-600);font-weight:700;font-size:11.5px;display:inline-flex;align-items:center;gap:3px;cursor:pointer;padding:0}
.mb-link-btn:hover{text-decoration:underline}

.mb-actions4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.mb-actions4 button{
  display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--brd);
  border-radius:var(--r);padding:12px 6px;font-size:10.5px;font-weight:700;color:var(--t2);cursor:pointer;transition:var(--ease);text-align:center;
}
.mb-actions4 button:hover{border-color:var(--b-300);background:var(--b-50);transform:translateY(-1px)}
.mb-actions4-ico{width:34px;height:34px;border-radius:11px;background:var(--b-50);color:var(--b-600);display:flex;align-items:center;justify-content:center}
@media (max-width:420px){.mb-actions4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body data-require-auth="1" data-roles="SELLER">

<script src="/js/config.js?v=1788617999"></script><script src="/js/seo.js?v=1788617999"></script><script src="/js/action-queue.js?v=1788617999"></script><script src="/js/api.js?v=1788617999"></script>

  <script src="/js/offline-store.js?v=1788617999"></script>
<script src="/js/virtual-feed.js?v=1788617999"></script><script src="/js/media-compress.js?v=1788617999"></script><script src="/js/maps.js?v=1788617999"></script><script src="/js/app.js?v=1788617999"></script><script src="/js/mentions.js?v=1788617999"></script><script src="/js/install-prompt.js?v=1788617999"></script><script src="/js/push-notifications.js?v=1788617999"></script>
<script>
initPage({ active:'my-bazar.html', requireAuth:true, roles:['SELLER'], onReady: async()=>{
  const view=document.getElementById('view');
  let bazar=null;
  try{ bazar=(await api.get('/bazars/me'))?.data?.bazar; } catch{}

  const memberSince = bazar ? fmtDate(bazar.createdAt) : '';
  const rating = bazar?.seller?.rating || 0;
  const ratingCount = bazar?.seller?.ratingCount || 0;
  const thumbsUp = bazar?.seller?.thumbsUp || 0;
  const thumbsDown = bazar?.seller?.thumbsDown || 0;
  const weeklyVisits = bazar?.weeklyVisits || 0;
  const monthlySales = bazar?.monthlySales || 0;
  const badge = bazar?.badge || { tier:'BRONZE', label:'Bronze', icon:'<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>' };
  const nextTier = bazar?.nextTier;

  // ── Dados extra para os widgets do dashboard (Seguidores, Mensagens,
  // Produto mais visto, Últimas avaliações, Produtos esgotados). Cada
  // pedido corre isoladamente (Promise.allSettled) para que a falha de
  // um endpoint que ainda não exista no backend não derrube o resto do
  // painel — nesse caso o respectivo cartão simplesmente não aparece.
  let followerCount = bazar?.followerCount ?? null;
  let unreadMsgs = 0, myProductsAll = [], latestReviews = [];
  if(bazar){
    const [followRes, unreadRes, prodRes, reviewsRes] = await Promise.allSettled([
      followerCount==null ? api.get(`/bazars/${bazar.id}/follow-status`) : Promise.resolve(null),
      api.get('/chat/unread-count'),
      api.get('/products/mine', { limit: 100 }),
      api.get('/reviews', { bazarId: 'me', limit: 3 }),
    ]);
    if(followRes.status==='fulfilled' && followRes.value) followerCount = followRes.value?.data?.followerCount ?? 0;
    if(unreadRes.status==='fulfilled') unreadMsgs = unreadRes.value?.data?.count || 0;
    if(prodRes.status==='fulfilled') myProductsAll = prodRes.value?.data?.products || [];
    if(reviewsRes.status==='fulfilled') latestReviews = reviewsRes.value?.data?.reviews || [];
  }
  const mostViewed = myProductsAll.length ? [...myProductsAll].sort((a,b)=>(b.views||0)-(a.views||0))[0] : null;
  const soldOutCount = myProductsAll.filter(p=>p.stock<=0).length;
  const newOrders = bazar?._count?.pendingOrders;
  const monthlySalesMT = bazar?.monthlySalesTotal;
  const salesChart = bazar?.salesChart;
  const responseRate = bazar?.responseRate;

  view.innerHTML=`
    ${!bazar?`
    <div class="pg-hero pg-hero--dark">
      <div class="pg-hero-content">
        <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-6h16l1 6"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21v-6h6v6"/></svg> A tua loja em Moçambique</div>
        <h1>Cria o teu Bazar</h1>
        <p>Configura a tua loja em minutos e começa a vender hoje mesmo</p>
      </div>
    </div>` : `
    <div class="mb-idcard reveal">
      <button class="mb-idcard-gear" onclick="openEditBazar()" title="Editar Bazar">${icon('settings',18,2)}</button>
      <div class="mb-idcard-top">
        <div class="avatar-edit-wrap" onclick="document.getElementById('logo-input').click()" title="Alterar foto da loja">
          ${storeAvatar(bazar.name, 52, bazarLogo(bazar))}
          <div class="avatar-edit-badge"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="mb-idcard-name">${esc(bazar.name)}</span>
            ${bazar.verified?`<span title="Loja verificada">${icon('check',15,3)}</span>`:''}
          </div>
          <button class="mb-idcard-link" onclick="go('bazar.html',{id:'${escJsAttr(bazar.slug||bazar.id)}'})">Ver loja pública ${icon('arrowRight',12,2.6)}</button>
        </div>
      </div>
      <div class="mb-idcard-medal">
        <div class="mb-medal-badge tier-${badge.tier.toLowerCase()}">${badge.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="mb-idcard-medal-lbl">Medalha ${badge.label}</div>
          <div class="medal-track" style="margin-top:5px">
            <div class="medal-track-fill medal-fill-${badge.tier.toLowerCase()}" style="width:${Math.min(100, badge.tier==='OURO'?100:(monthlySales/(badge.tier==='PRATA'?51:30))*100)}%"></div>
          </div>
        </div>
        <span class="mb-medal-pct" style="color:#fff">${badge.tier==='OURO'?'100%':Math.round(Math.min(100,(monthlySales/(badge.tier==='PRATA'?51:30))*100))+'%'}</span>
      </div>
      <div class="mb-idcard-sub">${nextTier ? `Faltam <strong>${nextTier.needed}</strong> venda${nextTier.needed===1?'':'s'} para ${nextTier.label}` : 'Nível máximo atingido — parabéns!'}</div>
      <input type="file" id="banner-input" accept="image/jpeg,image/jpg,image/png,image/webp" hidden>
    </div>

    <div class="mb-stats3 reveal">
      <div class="mb-stat3"><div class="val">${bazar._count?.products||0}</div><div class="lbl">Produtos</div></div>
      <div class="mb-stat3"><div class="val">${bazar._count?.orders||0}</div><div class="lbl">Encomendas${newOrders?` <span class="mb-stat3-delta">+${newOrders} novas</span>`:''}</div></div>
      <div class="mb-stat3"><div class="val">${fmtMT(monthlySalesMT||0)}</div><div class="lbl">Vendas (este mês)</div></div>
    </div>

    <div class="card reveal" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <h4 style="margin:0">Vendas últimos 30 dias</h4>
        <button class="mb-link-btn" onclick="toast('Relatório detalhado — brevemente disponível.','info')">Ver relatório ${icon('arrowRight',11,2.6)}</button>
      </div>
      <div style="font-size:22px;font-weight:900;color:var(--n-900,#18181B);letter-spacing:-.02em;margin-bottom:8px">${fmtMT(monthlySalesMT||0)}</div>
      ${salesChart&&salesChart.length>1?`<div id="mb-chart"></div>`:`<div class="mb-chart-empty">${icon('pulse',22,1.6)}<span>O gráfico de vendas diárias aparece aqui assim que houver dados suficientes.</span></div>`}
    </div>

    <div class="mb-metrics reveal">
      <div class="mb-metric"><div class="mb-metric-ico" style="background:var(--b-50);color:var(--b-600)">${icon('heart',15,2)}</div><div><div class="val">${followerCount??0}</div><div class="lbl">Seguidores</div></div></div>

// ─── Mini-gráfico de linha (sparkline) para "Vendas últimos 30 dias".
// Sem dependências externas — um polyline SVG simples a partir de
// bazar.salesChart = [{date, total}, ...], quando o backend o fornecer.
function renderMbSparkline(containerId, data){
  const host = document.getElementById(containerId);
  if(!host) return;
  const W = 600, H = 120, pad = 6;
  const values = data.map(d=>d.total||0);
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const range = (max-min)||1;
  const stepX = (W-pad*2)/(values.length-1);
  const pts = values.map((v,i)=>{
    const x = pad + i*stepX;
    const y = H - pad - ((v-min)/range)*(H-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const areaPts = `${pad},${H-pad} ${pts.join(' ')} ${W-pad},${H-pad}`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:110px;display:block" preserveAspectRatio="none">
    <defs><linearGradient id="mbChartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--b-500)" stop-opacity=".22"/>
      <stop offset="100%" stop-color="var(--b-500)" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${areaPts}" fill="url(#mbChartGrad)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--b-500)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--t4);margin-top:2px">
    <span>${fmtDate(data[0].date)}</span><span>${fmtDate(data[data.length-1].date)}</span>
  </div>`;
}

// ─── Localização exacta da banca (mapa) ─────────────────
let _bzPinMap = null;
let _bzPendingPin = null; // guarda {lat,lng} obtidos antes do mapa estar pronto

function _bzSetPin(lat, lng){
  document.getElementById('bz-lat').value = lat;
  document.getElementById('bz-lng').value = lng;
  const status = document.getElementById('bz-loc-status');
  if(_bzPinMap){
    _bzPinMap.setPosition(lat, lng);
    if(status) status.innerHTML = `${icon('pin',12,2.2)} Localização definida no mapa.`;
  } else {
    // O mapa ainda não carregou (ou falhou) — guarda para aplicar assim
    // que estiver pronto, e avisa já que a localização foi guardada
    // (não depende do mapa aparecer para ser gravada ao salvar).
    _bzPendingPin = { lat, lng };
    if(status) status.innerHTML = `${icon('pin',12,2.2)} Localização guardada (o mapa ainda está a carregar).`;
  }
}

async function _bzUseMyLocation(){
  const btn = document.getElementById('bz-map-locate');
  const status = document.getElementById('bz-loc-status');
  setLoading(btn, true);
  if(status) status.textContent = 'A obter a tua localização...';
  try{
    const {lat,lng} = await getBrowserLocation();
    _bzSetPin(lat, lng);
  }catch(err){
    if(status) status.textContent = '';
    toast(describeGeoError(err),'warn');
  }finally{ setLoading(btn, false); }
}

async function initBazarPinMap(){
  const mapEl=document.getElementById('bz-map');
  if(!mapEl) return;
  try{
    const lat=document.getElementById('bz-lat').value, lng=document.getElementById('bz-lng').value;
    _bzPinMap = await createPinMap(mapEl, { draggable:true, ...(lat&&lng?{lat:parseFloat(lat),lng:parseFloat(lng)}:{}) });
    _bzPinMap.onDragEnd(({lat,lng})=>{ document.getElementById('bz-lat').value=lat; document.getElementById('bz-lng').value=lng; });
    attachPlacesAutocomplete(document.getElementById('bz-loc'), ({lat,lng,formatted})=>{
      _bzSetPin(lat,lng);
      if(formatted) document.getElementById('bz-loc').value=formatted;
    }, { country:'mz' });
    // Se o utilizador clicou "Usar a minha localização" antes do mapa
    // acabar de carregar, aplica agora o pin pendente.
    if(_bzPendingPin){ _bzSetPin(_bzPendingPin.lat, _bzPendingPin.lng); _bzPendingPin = null; }
  }catch{
    mapEl.innerHTML = '<div style="padding:14px;font-size:12px;color:var(--t4);text-align:center">Não foi possível carregar o mapa (verifica a tua ligação à internet). A tua localização continua a ser guardada normalmente.</div>';
  }
}
async function saveBazar(mode){
  const name=document.getElementById('bz-name').value.trim();
  const category=document.getElementById('bz-cat').value;
  const description=document.getElementById('bz-desc').value.trim();
  const location=document.getElementById('bz-loc').value.trim();
  const phone=document.getElementById('bz-phone').value.trim();
  const lat=document.getElementById('bz-lat')?.value, lng=document.getElementById('bz-lng')?.value;
  if(!name||!category){toast('Preencha os campos obrigatórios.','warn');return;}
  const btn=document.querySelector('#modal-root .btn-primary');setLoading(btn,true);
  try{
    const body={name,category,description,location,phone};
    if(lat&&lng){ body.latitude=parseFloat(lat); body.longitude=parseFloat(lng); }
    const promoTitleEl=document.getElementById('bz-promo-title');
    if(promoTitleEl){
      body.promoTitle=promoTitleEl.value.trim();
      body.promoSubtitle=document.getElementById('bz-promo-sub')?.value.trim()||'';
      body.promoColor=document.getElementById('bz-promo-color')?.value||'';
    }
    if(mode==='edit') await api.put('/bazars/me',body); else await api.post('/bazars',body);
    closeModal();toast(mode==='edit'?'Bazar actualizado!':'Bazar criado! <svg class="ico-inline ico-fill" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 21l3-9 6 6z"/><circle cx="18" cy="6" r="1.5"/><circle cx="14" cy="4" r="1"/><circle cx="20" cy="11" r="1"/><path d="M13 2l1.5 1.5L13 5l-1.5-1.5z"/></svg>');setTimeout(()=>window.location.reload(),700);
  }catch(e){setLoading(btn,false);toast(apiErrorMessage(e),'err');}
}
function copyBazarLink(){
  const url=document.getElementById('baz-url')?.textContent;
  if(url){navigator.clipboard.writeText(url).then(()=>toast('Link copiado! <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>')).catch(()=>toast('Não foi possível copiar.','err'));}
}
function printBazarQr(){
  const img=document.getElementById('baz-qr-img');
  if(!img) return;
  const name=(img.alt||'').replace('QR code da loja ','');
  const w=window.open('', '_blank', 'width=420,height=560');
  w.document.write(`<!DOCTYPE html><html><head><title>QR da loja</title><style>
    body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;gap:14px}
    img{width:280px;height:280px}
    h3{margin:0;font-size:18px}
    p{margin:0;font-size:12px;color:#666}
  </style></head><body>
    <img loading="lazy" decoding="async" src="${img.src.replace('260x260','500x500')}" alt="${name}">
    <h3>${name}</h3>
    <p>Escaneia para visitares a loja no Bazares</p>
  </body></html>`);
  w.document.close();
  w.onload=()=>{ w.focus(); setTimeout(()=>w.print(),400); };
}
