<script>
initPage({ active:'admin-wallet.html', requireAuth:true, roles:['ADMIN'], onReady: async () => {
  await renderShell();
}});

async function renderShell() {
  let gatewayStatus = null;
  try { gatewayStatus = (await api.get('/wallet/admin/gateway/validate'))?.data; } catch {}

  document.getElementById('view').innerHTML = `
    <div class="pg-hero pg-hero--compact"><div class="pg-hero-content">
      <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Carteira</div>
      <h1>Contribuições de Plataforma</h1>
      <p>Pagamentos de comissão dos vendedores via STK push</p>
    </div></div>

    ${gatewayStatus ? (gatewayStatus.configured
      ? `<div class="alert a-info" style="margin-bottom:16px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ZumboPay configurada e ${gatewayStatus.ready ? 'pronta para uso.' : 'com configuração incompleta — verifique as carteiras no painel.'}</div>`
      : `<div class="alert a-warn" style="margin-bottom:16px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ZumboPay ainda não está configurada (variáveis de ambiente em falta). O pagamento de comissão via STK não vai funcionar até isso ser feito.</div>`
    ) : ''}

    <div id="aw-content" class="reveal"><div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div></div>
    <div id="aw-pagination"></div>`;

  await loadComissoes();
}

async function loadComissoes(page = 1) {
  const content = document.getElementById('aw-content');
  content.innerHTML = `<div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>`;
  try {
    const res = await api.get('/wallet/admin/commission-payments', { page, limit: 30 });
    const payments = res.data.payments || [];
    const meta = res.data.meta || {};
    content.innerHTML = `<div class="tbl-wrap"><table>
      <thead><tr><th>Data</th><th>Vendedor</th><th>Valor</th><th>Método</th><th>Estado</th></tr></thead>
      <tbody>${payments.length ? payments.map(p => `<tr>
        <td style="color:var(--t3);font-size:12px">${fmtDate(p.createdAt)}</td>
        <td>${esc(p.seller.name)}</td>
        <td style="font-weight:700">${fmtMT(p.amount)}</td>
        <td>${p.method === 'WALLET' ? '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Carteira' : p.method === 'ZUMBOPAY' ? '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg> ZumboPay' : '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h16v20l-3-2-3 2-3-2-3 2-3-2-1 2z" fill="none"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/></svg> Manual'}</td>
        <td>${commissionStatusBadge(p.status)}</td>
      </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--t4);padding:32px">Sem contribuições registadas</td></tr>`}</tbody>
    </table></div>`;
    renderPagination('aw-pagination', meta, loadComissoes);
  } catch (e) {
    content.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}

function commissionStatusBadge(s) {
  const map = { PENDENTE: ['Pendente', 'b-gld'], PROCESSANDO: ['A processar', 'b-blu'], PAGA: ['Paga', 'b-grn'], FALHADA: ['Falhou', 'b-red'] };
  const [label, cls] = map[s] || [s, 'b-blu'];
  return `<span class="badge ${cls}">${label}</span>`;
}
