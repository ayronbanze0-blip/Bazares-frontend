<script>
initPage({ active:'dashboard.html', requireAuth:true, onReady: async(user) => {
  const view = document.getElementById('view');
  view.innerHTML='<div style="text-align:center;padding:60px"><span class="spinner spinner-dark"></span></div>';
  try {
    if(user.role==='ADMIN'){ window.location.replace('admin.html'); return; }
    if (!user.onboardedAt) showOnboardingModal();
    if(user.role==='SELLER'){ await renderSellerDash(user); return; }
    await renderBuyerDash(user);
  } catch (err) {
    // Rede protectora: se algo inesperado falhar a meio do render (em vez
    // de deixar o spinner preso para sempre em silêncio), mostra um erro
    // visível com opção de tentar de novo.
    console.error('[dashboard] falha ao renderizar:', err);
    view.innerHTML = `<div class="pg-hero"><div class="pg-hero-content"><h1>Não foi possível carregar o dashboard</h1><p>Ocorreu um erro inesperado. Tente novamente.</p><div class="pg-hero-actions"><button class="btn btn-terra btn-sm" onclick="location.reload()"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Tentar novamente</button></div></div></div>`;
  }
}});

            ${stBadge(o.status)}

        <button class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" onclick="go('my-orders.html')">Ver todas as encomendas <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>

        <div class="quick-actions">
          <button class="qa-btn" onclick="go('products.html')"><div class="qa-btn-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div><div><div style="font-weight:600">Explorar produtos</div><div style="font-size:11px;color:var(--t4)">Navegue por todos os produtos</div></div></button>
          <button class="qa-btn" onclick="go('bazars.html')"><div class="qa-btn-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-6h16l1 6"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21v-6h6v6"/></svg></div><div><div style="font-weight:600">Ver Bazares</div><div style="font-size:11px;color:var(--t4)">Descubra as nossas lojas</div></div></button>

async function renderSellerDash(user) {
  const view = document.getElementById('view');
  let bazar=null, orders=[];
  try { bazar=(await api.get('/bazars/me'))?.data?.bazar; } catch{ bazar=false; }
  if(!bazar){
    view.innerHTML=`<div class="pg-hero"><div class="pg-hero-content"><h1>Criar o seu Bazar</h1><p>Ainda não tem um Bazar. Crie o seu espaço de venda agora.</p><div class="pg-hero-actions"><button class="btn btn-terra btn-sm" onclick="go('my-bazar.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-6h16l1 6"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21v-6h6v6"/></svg> Criar Bazar agora</button></div></div></div>`;
    return;
  }
  // As 3 chamadas abaixo são independentes entre si — disparam em paralelo
  // em vez de em sequência. Antes, se o backend estivesse lento (cold
  // start no Railway, por exemplo), cada `await` sequencial podia levar
  // até ~1 min (timeout + retries do api.js), somando vários minutos de
  // spinner. Em paralelo, o pior caso é o tempo da chamada mais lenta,
  // não a soma de todas.
  let unread=0, paymentInfo={name:'José Jeque',number:'84 676 1897'}, walletBalance=0;
  const [ordersRes, unreadRes, finRes] = await Promise.allSettled([
    api.get('/orders/received',{limit:100}),
    api.get('/chat/unread-count'),
    api.get('/finance/me',{limit:1})
  ]);
  orders = ordersRes.status==='fulfilled' ? (ordersRes.value?.data?.orders||[]) : [];
  unread = unreadRes.status==='fulfilled' ? (unreadRes.value?.data?.count||0) : 0;
  if (finRes.status==='fulfilled') {
    const fin = finRes.value?.data;
    if(fin?.paymentInfo) paymentInfo=fin.paymentInfo;
    if(fin?.walletBalance!=null) walletBalance=fin.walletBalance;
  }

  const rev=orders.filter(o=>o.status==='ENTREGUE').reduce((s,o)=>s+o.total,0);
  const counts={
    aguardando: orders.filter(o=>o.status==='PENDENTE').length,
    confirmados: orders.filter(o=>o.status==='ACEITE'||o.status==='EM_PREPARACAO').length,
    enviados: orders.filter(o=>o.status==='EM_ENTREGA').length,
    entregues: orders.filter(o=>o.status==='ENTREGUE').length,
    cancelados: orders.filter(o=>o.status==='CANCELADA').length,
  };
  const FEE=150, pf=bazar.pendingFees||0;
  const firstName=esc(user.name.split(' ')[0]);
  const avatarHtml = userPhoto(user)
    ? `<img loading="lazy" decoding="async" src="${esc(userPhoto(user))}" alt="" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--b-200)">`
    : avatar(user.name,46);

  view.innerHTML=`
    <div class="pg-hero pg-hero--dark">
      <div class="pg-hero-content">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div style="display:flex;align-items:center;gap:14px;min-width:0">
            ${avatarHtml}
            <div style="min-width:0">
              <div class="section-pill" style="background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-6h16l1 6"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21v-6h6v6"/></svg> Painel do vendedor</div>
              <h1 style="margin-bottom:2px">${greeting()}, ${firstName}!</h1>
              <p>${esc(bazar.name||'O seu Bazar')} — bem-vindo ao seu dashboard</p>
            </div>
          </div>
          <button class="btn-icon" onclick="go('notifications.html')" style="position:relative;flex-shrink:0;background:rgba(255,255,255,.14);color:#fff" aria-label="Notificações"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
        </div>

        <div class="wallet-inline reveal">
          <div class="wallet-card-top">
            <div>
              <div class="wallet-label">
                <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Saldo da Wallet
                <button class="wallet-eye" id="wb-eye" onclick="toggleWalletBalance()" aria-label="Mostrar/ocultar saldo"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
              </div>
              <div class="wallet-balance" id="wb-amount" data-value="${fmtMT(walletBalance)}">${fmtMT(walletBalance)}</div>
            </div>
            <div class="wallet-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2"/><circle cx="12" cy="13.5" r="2.5"/></svg></div>
          </div>
          <div class="wallet-actions">
            <button class="wallet-act-btn primary" onclick="go('wallet.html',{action:'pay'})"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pagar comissão</button>
            <button class="wallet-act-btn" onclick="go('wallet-history.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Histórico</button>
          </div>
          ${pf>0?`<div class="wallet-warn"><span>${pf>=FEE?'<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>':'<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'}</span><div>Contribuição pendente: <strong>${fmtMT(pf)}</strong> de ${fmtMT(FEE)}${pf>=FEE?' — pague agora para continuar a vender.':'.'}</div></div>`:''}
        </div>
      </div>
    </div>

    <div class="sh-row reveal" style="margin-top:4px;margin-bottom:10px"><h3 style="font-size:14px">Resumo do seu negócio</h3><a href="my-bazar.html" style="font-size:12.5px;font-weight:600;color:var(--b-500)">Ver detalhes <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a></div>
    <div class="biz-stats reveal">
      <div class="biz-stat"><div class="n">${bazar._count?.products ?? 0}</div><div class="l">Produtos</div></div>
      <div class="biz-stat"><div class="n">${bazar._count?.orders ?? 0}</div><div class="l">Pedidos</div></div>
      <div class="biz-stat"><div class="n">${fmtMT(rev)}</div><div class="l">Faturado</div></div>
      <div class="biz-stat"><div class="n">${(user.rating||0).toFixed(1)} <svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div><div class="l">Avaliação</div></div>
    </div>

    <div class="sh-row" style="margin-top:4px;margin-bottom:10px"><h3 style="font-size:14px">Meus pedidos</h3><a href="my-orders.html" style="font-size:12.5px;font-weight:600;color:var(--b-500)">Ver todos <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a></div>
    <div class="order-pills reveal">
      <div class="order-pill" onclick="go('my-orders.html',{status:'PENDENTE'})">
        ${counts.aguardando?`<span class="badge-dot">${counts.aguardando}</span>`:''}
        <div class="order-pill-ico" style="background:var(--amb-bg);color:var(--amb)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><span>Aguardando</span>
      </div>
      <div class="order-pill" onclick="go('my-orders.html',{status:'ACEITE'})">
        ${counts.confirmados?`<span class="badge-dot">${counts.confirmados}</span>`:''}
        <div class="order-pill-ico" style="background:var(--blu-bg);color:var(--blu)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><span>Confirmados</span>
      </div>
      <div class="order-pill" onclick="go('my-orders.html',{status:'EM_ENTREGA'})">
        ${counts.enviados?`<span class="badge-dot">${counts.enviados}</span>`:''}
        <div class="order-pill-ico" style="background:var(--n-800);color:#fff"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div><span>Enviados</span>
      </div>
      <div class="order-pill" onclick="go('my-orders.html',{status:'ENTREGUE'})">
        ${counts.entregues?`<span class="badge-dot">${counts.entregues}</span>`:''}
        <div class="order-pill-ico" style="background:var(--grn-bg);color:var(--grn)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><span>Entregues</span>
      </div>
      <div class="order-pill" onclick="go('my-orders.html',{status:'CANCELADA'})">
        ${counts.cancelados?`<span class="badge-dot">${counts.cancelados}</span>`:''}
        <div class="order-pill-ico" style="background:var(--red-bg);color:var(--red)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div><span>Cancelados</span>
      </div>
    </div>

    <h3 style="font-size:14px;margin-bottom:10px">Ações rápidas</h3>
    <div class="qa-grid reveal">
      <div class="qa-tile" onclick="go('my-products.html',{action:'new'})"><div class="qa-tile-ico" style="background:var(--g-green)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><span>Adicionar produto</span></div>
      <div class="qa-tile" onclick="go('my-products.html')"><div class="qa-tile-ico" style="background:var(--n-700)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div><span>Meus produtos</span></div>
      <div class="qa-tile" onclick="go('chat.html')">
        ${unread?`<span class="badge-dot">${unread}</span>`:''}
        <div class="qa-tile-ico" style="background:var(--blu)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div><span>Mensagens</span>
      </div>
      <div class="qa-tile" onclick="go('favorites.html')"><div class="qa-tile-ico" style="background:var(--c-500)"><svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><span>Favoritos</span></div>
    </div>

    <div class="premium-banner reveal"${user.isPremium ? ` style="background:var(--g-gold)"` : ''}>
      <div class="premium-banner-txt">
        ${user.isPremium ? `
          <b>${icon('star',15,2.5)} Conta Premium activa</b>
          <p>Os seus produtos e bazar já estão em destaque na Bazares.</p>
          <button class="premium-banner-btn" onclick="go('premium.html')">Ver detalhes</button>
        ` : `
          <b>Seja Premium</b>
          <p>Destaque os seus produtos e venda muito mais!</p>
          <button class="premium-banner-btn" onclick="go('premium.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h20l-2-9-5 4-3-7-3 7-5-4z"/><line x1="4" y1="21" x2="20" y2="21"/></svg> Upgrade agora</button>
        `}
      </div>
      <div class="premium-banner-photo-wrap">
        <div class="premium-banner-photo" style="background:var(--g-green);display:flex;align-items:center;justify-content:center;font-size:26px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div class="premium-banner-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h20l-2-9-5 4-3-7-3 7-5-4z"/><line x1="4" y1="21" x2="20" y2="21"/></svg></div>
      </div>
    </div>`;

  mountBottomNav('dashboard', 'SELLER', unread);
}

// Alterna entre mostrar o saldo real e ocultá-lo (útil em espaços públicos).
// Guarda a preferência só na sessão — não persiste entre visitas por design.
let _wbHidden = false;
function toggleWalletBalance() {
  _wbHidden = !_wbHidden;
  const el = document.getElementById('wb-amount');
  if (!el) return;
  el.textContent = _wbHidden ? '••••••' : el.dataset.value;
}

</script>
</body></html>
