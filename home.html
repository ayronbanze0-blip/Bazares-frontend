<style>
/* ══════════════════════════════════════════════════════════════════
   HOME — reescrita de raiz (31 Jul 2026).
   Princípio desta versão: nada de blocos inteiros pintados numa única
   cor forte empilhados uns sobre os outros (era isso que, com o tema
   Premium dourado/laranja a substituir o verde da marca em cascata,
   deixava a página toda numa única cor). Em vez disso: fundo neutro
   em toda a página, e cor só onde ajuda a distinguir — ícones,
   badges, uma barra de progresso, uma borda. O único bloco cheio de
   cor é o cabeçalho (identidade da marca), e mesmo esse é pequeno.
   ══════════════════════════════════════════════════════════════════ */
.home-wrap{max-width:560px;margin:0 auto}
@media(min-width:900px){
  .home-wrap{max-width:none;margin:0}
}
body{background:var(--bg)}
.home-section{margin-bottom:20px}
.home-section:last-child{margin-bottom:0}
.home-section-title{font-size:12.5px;font-weight:800;letter-spacing:.01em;color:var(--t3);margin-bottom:10px;padding:0 2px 0 10px;text-transform:uppercase;position:relative}
.home-section-title::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--b-500),var(--a-500))}

.chip-strip{scrollbar-width:none}
.chip-strip::-webkit-scrollbar{display:none}
.story-tile{transition:transform .15s ease}
.story-tile:active{transform:scale(.93)}

/* ── Cartão de saudação — avatar próprio com anel + botão de
   história, saudação, e (para vendedores) atalhos rápidos de
   publicação. Para quem não vende, cai numa barra de pesquisa. ──── */
.hh-card{padding:12px}
.hh-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hh-user{display:flex;align-items:center;gap:9px;min-width:0}
.hh-avatar-wrap{position:relative;flex-shrink:0;width:38px;height:38px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--g-green),#F59E0B)}
.hh-avatar-wrap .store-ring-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid var(--surf)}
.hh-avatar-add{position:absolute;bottom:-1px;right:-1px;width:15px;height:15px;border-radius:50%;background:var(--b-500);color:#fff;
  border:2px solid var(--surf);display:flex;align-items:center;justify-content:center}
.hh-greet{font-family:var(--f-display);font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hh-sub{font-size:10px;color:var(--t3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hh-level{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--brd);
  color:var(--a-700);padding:4px 8px;border-radius:var(--pill);font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.hh-level svg{color:var(--a-500)}

/* ── Linha do topo: cartão de saudação + mini-cartão de carteira,
   lado a lado (a carteira nunca tem menos de 148px, por isso empilha
   por baixo em ecrãs muito estreitos). ─────────────────────────────── */
.hh-row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.hh-row .hh-card{flex:1 1 200px}
.hh-wallet-card{flex:1 1 148px;min-width:148px;padding:10px 11px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:3px;cursor:pointer}
.hh-wallet-label{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--t3);padding-right:20px}
.hh-wallet-label svg{color:var(--t4);flex-shrink:0}
.hh-wallet-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hh-wallet-amt{font-family:var(--f-display);font-size:23px;font-weight:900;letter-spacing:-.02em;color:var(--grn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.hh-wallet-amt small{font-size:11px;font-weight:700;color:var(--t3);margin-right:2px}
.hh-wallet-eye{flex-shrink:0;background:none;border:none;color:var(--t4);cursor:pointer;padding:1px;display:flex;align-items:center;transition:color .15s ease;margin-left:1px}
.hh-wallet-chev{flex-shrink:0;color:var(--t4);display:flex;align-items:center;opacity:.7}
@media(max-width:420px){
  .hh-row{flex-wrap:nowrap;flex-direction:column}
  .hh-row .hh-card,.hh-wallet-card{flex-basis:auto;width:100%;min-width:0}
  .hh-greet,.hh-sub{max-width:none}
}
.hh-wallet-eye:active{transform:scale(.85)}
.hh-wallet-add{position:absolute;top:7px;right:7px;width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:transparent;color:var(--t4);border:1.3px solid var(--brd2);border-radius:50%;cursor:pointer;transition:var(--ease)}
.hh-wallet-add:active{transform:scale(.85);background:var(--surf2)}

/* ── Barra de pesquisa — entrada directa para produtos, sem repetir
   a barra do topbar (que já existe, mas fica escondida no scroll). */
.hh-search{display:flex;align-items:center;gap:8px;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--pill);
  padding:9px 14px;margin-top:10px;color:var(--t3);font-size:12.5px;cursor:pointer}

/* ── Atalhos rápidos de publicação (Publicar / Foto / Reel / Enquete) */
.hh-quick-row{display:flex;gap:6px;margin-top:8px}
.hh-quick{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:none;border:1.5px solid var(--brd);
  border-radius:var(--pill);padding:5px 4px;cursor:pointer;font-size:10.5px;font-weight:700;color:var(--t2);font-family:var(--f-body);white-space:nowrap}
.hh-quick:active{transform:scale(.96);background:var(--surf2)}
.hh-quick-ico{width:16px;height:16px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Composer ─────────────────────────────────────────────────── */
.fc-composer{border:1px solid var(--brd)!important;box-shadow:var(--sh0);overflow:visible!important}
.fc-actions{display:flex;align-items:center;gap:12px;padding:0 2px}
.fc-actions-scroll{display:flex;align-items:center;gap:12px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent 100%)}
.fc-actions-scroll::-webkit-scrollbar{display:none}
.fc-action{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--t2);cursor:pointer;flex-shrink:0}
.fc-action svg{flex-shrink:0}
.fc-publish-btn{margin-left:auto;flex-shrink:0;background:var(--g-green);color:#fff;border:none;border-radius:var(--pill);
  padding:6px 15px;font-size:12px;font-weight:800;font-family:var(--f-body);cursor:pointer;box-shadow:var(--sh-green);transition:transform .12s ease,box-shadow .15s ease}
.fc-publish-btn:active{transform:scale(.93)}

/* ── Cartão curto "Reels" — ocupa a metade de baixo da coluna do
   composer (metade de cima é o composer), atalho para a página de
   Reels. Altura reduzida a metade (pedido do Darwin) — icon/gaps/
   padding encolhidos proporcionalmente. ── */
.reels-quickcard{flex:1;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rl);
  background:var(--g-reels);color:#fff;text-decoration:none;box-shadow:var(--sh0);min-height:0}
.reels-quickcard-ico{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reels-quickcard-ico svg{width:14px;height:14px}
.reels-quickcard-text{min-width:0}
.reels-quickcard-text b{display:block;font-family:var(--f-display);font-size:12px;font-weight:800}
.reels-quickcard-text span{display:block;font-size:9.5px;opacity:.9;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reels-quickcard-cta{flex-shrink:0;background:rgba(255,255,255,.22);color:#fff;font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:var(--pill);white-space:nowrap;margin-left:auto}

/* ── Banner promocional — cartão cheio de cor a convidar a vender
   mais / assinar Premium. Roda entre 5 "vantagens" (título, subtítulo,
   cor de fundo e foto) a cada 0.7s. Altura fixa e texto limitado a um
   número fixo de linhas para a troca nunca redimensionar o cartão nem
   empurrar o resto da página (era isso que causava o "salto" a cada
   5s). Altura reduzida a metade (pedido do Darwin), a par do cartão
   Reels ao lado. ── */
.promo-banner{position:relative;display:flex;flex-direction:column;gap:6px;padding:9px;border-radius:var(--rl);
  background:var(--g-green);color:#fff;text-decoration:none;flex-shrink:0;width:150px;overflow:hidden;box-shadow:var(--sh-green);
  transition:background-color .35s ease}
.promo-banner--full{width:100%;flex-direction:row;align-items:center;gap:14px;padding:16px 20px;height:auto!important}
.promo-banner--full .promo-banner-text{order:1}
.promo-banner--full em{order:2}
.promo-banner--full .promo-img-frame{order:3}
.promo-img-frame{position:relative;z-index:1;flex-shrink:0;border-radius:9px;overflow:hidden;background:var(--promo-color,var(--g-green));width:100%;height:30px}
.promo-banner--full .promo-img-frame{width:120px;height:72px;margin-left:auto}
.promo-img-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:.5;transition:opacity .3s ease}
.promo-img-frame img.promo-img-out{opacity:0}
/* Degradê a fundir a foto com a cor do banner — em vez de a imagem
   parecer um recorte colado por cima, dissolve-se no fundo colorido. */
.promo-img-frame::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(115deg,var(--promo-color,var(--g-green)) 0%,transparent 68%);
}
.promo-banner-text{position:relative;z-index:1;min-width:0;flex:1}
.promo-banner b{display:block;font-family:var(--f-display);font-size:11.5px;font-weight:800;line-height:1.2;transition:opacity .3s ease;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo-banner .promo-sub{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;
  font-size:9.5px;opacity:.9;line-height:1.25;margin-top:2px;transition:opacity .3s ease;max-height:calc(9.5px*1.25)}
.promo-banner b.promo-txt-out,.promo-banner .promo-sub.promo-txt-out{opacity:0}
.promo-banner em{position:relative;z-index:1;flex-shrink:0;font-style:normal;align-self:flex-start;background:#fff;color:var(--b-700);
  font-size:10px;font-weight:800;padding:5px 11px;border-radius:var(--pill);white-space:nowrap}
.promo-banner--full em{align-self:center;font-size:12px;padding:9px 16px}
.promo-banner:focus-visible{outline-offset:2px;border-radius:var(--rl)}

/* ── Botão flutuante "gostei rápido" sobre a imagem do post ─────── */
/* Canto superior esquerdo — evita colidir com o selo "Produto
   disponível"/contador de fotos (topo direito) e com a barra de
   compra, que agora ocupa toda a largura do fundo da imagem. */
.feed-quick-like{position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:50%;background:var(--b-500);color:#fff;
  border:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-green);cursor:pointer;z-index:2;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.feed-quick-like:active{transform:scale(.82)}
.feed-quick-like.liked{background:var(--red)}

/* ── Selo "Produto disponível" + mini-cartão de compra flutuante,
   para publicações associadas a um produto (ver feedCardHtml). ──── */
.fc-avail-badge{position:absolute;top:12px;right:12px;background:var(--g-green);color:#fff;font-size:10.5px;font-weight:800;
  padding:5px 10px 5px 8px;border-radius:var(--pill);display:flex;align-items:center;gap:4px;box-shadow:var(--sh1);z-index:2}
.fc-shop-card{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:var(--rl);padding:6px 12px 6px 6px;box-shadow:var(--sh2);
  max-width:calc(100% - 66px);z-index:2;cursor:pointer;transition:transform .12s ease}
.fc-shop-card:active{transform:scale(.96)}
.fc-shop-thumb{width:36px;height:36px;border-radius:var(--r);overflow:hidden;flex-shrink:0;background:var(--surf2)}
.fc-shop-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fc-shop-info{display:flex;flex-direction:column;min-width:0}
.fc-shop-info b{font-size:11.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.fc-shop-info span{font-size:9.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.fc-shop-price{font-size:12.5px;font-weight:800;color:var(--b-700);margin-left:2px;flex-shrink:0}
/* .fc-buy-bar / .fc-buy-price / .fc-buy-btn agora vivem em css/style.css
   (partilhado com o visualizador de Histórias) — substituem o antigo
   .fc-linked-product-chip usado só aqui. */

/* ── Tabs do feed (Para si / Seguindo / Amigos / Lojas / Novidades) ── */
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--b-500);margin-left:4px;vertical-align:middle}

/* ── Cartão "Nível e desafios" — anel de progresso à esquerda (SVG),
   lista de missões à direita. Substitui a barra horizontal + cartão
   separado das versões anteriores por uma composição só. ─────────── */
.mission-card{display:none;border:1px solid var(--brd);border-radius:var(--rl);background:var(--surf);padding:14px;gap:14px;align-items:center}
.mission-ring{position:relative;width:64px;height:64px;flex-shrink:0}
.mission-ring svg{transform:rotate(-90deg)}
.mission-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.mission-ring-num b{font-family:var(--f-display);font-size:17px;font-weight:800;color:var(--text)}
.mission-ring-num span{font-size:8.5px;color:var(--t4);text-transform:uppercase;letter-spacing:.03em}
.mission-list{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.mission-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.mission-row.done{color:var(--t4)}
.mission-row.done b{text-decoration:line-through}
.mission-check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--brd2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent}
.mission-row.done .mission-check{background:var(--b-500);border-color:var(--b-500);color:#fff}
.mission-row b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mission-row em{font-style:normal;font-weight:800;font-size:10.5px;color:var(--a-700);flex-shrink:0}

/* ── Comunidades — chips com ícone (não depende de imagem de
   produto, funciona mesmo em categorias sem fotos boas). ─────────── */
.comm-chip{flex-shrink:0;width:96px;text-align:center;padding:14px 8px;border-radius:var(--rl);border:1px solid var(--brd);
  background:var(--surf);cursor:pointer;transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease}
.comm-chip:active{transform:scale(.95);border-color:var(--b-200)}
.comm-chip-ico{width:38px;height:38px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:var(--b-50);color:var(--b-600)}
.comm-chip b{display:block;font-size:11px;font-weight:700;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comm-chip span{display:block;font-size:9.5px;color:var(--t4);margin-top:2px}

.store-ring-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid var(--surf)}

/* ── "Produtos para ti" — faixa horizontal de cartões de produto
   (reaproveita .p-card, só muda o contentor para scroll lateral). ── */
.reco-strip{display:flex;gap:11px;overflow-x:auto;padding:2px 2px 4px;align-items:stretch}
/* Tamanho fixo e permanente — a altura nunca varia consoante o texto
   (nome, localização, loja). O cartão tem uma altura total fixa; cada
   campo de texto está limitado a 1-2 linhas com reticências, e o
   preço fica sempre ancorado ao fundo (via flex + p-name a absorver
   o espaço livre), para que todos os cartões da faixa fiquem sempre
   com o mesmo tamanho, tenham o texto que tiverem. */
.reco-strip .pc-compact{flex-shrink:0;width:134px;height:300px;display:flex;flex-direction:column;overflow:hidden}

   um espaço vazio grande entre a localização e o fundo do cartão.

   ficam sempre ancorados ao fundo, ocupando esse espaço. */

// ─── Rotação de "vantagens" no banner verde — troca título, subtítulo,
// foto e cor de fundo a cada 5s, com um fade suave entre trocas. ────
const PROMO_ADVANTAGES = [
  { texto: 'Vende mais', subtitulo: 'Uma loja online completa para impulsionar as tuas vendas.', imagem: 'images/vantagens/01_vende_mais.png', cor: 'var(--grn)', cta: 'Começar a vender', href: 'my-bazar.html' },
  { texto: 'Compra com confiança', subtitulo: 'Compras seguras com proteção ao comprador e garantia.', imagem: 'images/vantagens/02_compra_confianca.png', cor: '#2E6DE0', cta: 'Comprar agora', href: 'products.html' },
  { texto: 'Segue as lojas', subtitulo: 'Segue as tuas lojas favoritas e recebe novidades em primeiro.', imagem: 'images/vantagens/03_segue_lojas.png', cor: '#E24C4C', cta: 'Ver lojas', href: 'bazars.html' },
  { texto: 'Descobre novidades', subtitulo: 'Novos produtos, tendências e promoções todos os dias.', imagem: 'images/vantagens/04_descobre_novidades.png', cor: '#E0A62E', cta: 'Descobrir', href: 'explorar.html' },
  { texto: 'Marketplace + Rede social', subtitulo: 'Compra, vende e interage com uma comunidade ativa.', imagem: 'images/vantagens/05_marketplace_social.png', cor: '#7C5CE0', cta: 'Explorar', href: 'explorar.html' }
];
let _promoIdx = 0;
let _promoTimer = null;
// dynamicCta: true só para quem ainda não tem bazar — o botão troca
// junto com a mensagem (Comprar agora / Ver lojas / Descobrir / ...),
// nunca ficando preso em "Começar a vender" fora de contexto. Quem já
// vende mantém sempre "Ver mais" → Premium.
function startPromoTicker(dynamicCta){
  const banner = document.getElementById('promo-banner');
  const img = document.getElementById('promo-img');
  const titulo = document.getElementById('promo-titulo');
  const sub = document.getElementById('promo-subtitulo');
  const cta = document.getElementById('promo-cta');
  if (!banner || !img || !titulo || !sub) return;
  clearInterval(_promoTimer);
  _promoTimer = setInterval(() => {
    _promoIdx = (_promoIdx + 1) % PROMO_ADVANTAGES.length;
    const v = PROMO_ADVANTAGES[_promoIdx];
    titulo.classList.add('promo-txt-out');
    sub.classList.add('promo-txt-out');
    img.classList.add('promo-img-out');
    setTimeout(() => {
      titulo.textContent = v.texto;
      sub.textContent = v.subtitulo;
      img.src = v.imagem;
      banner.style.backgroundColor = v.cor;
      banner.style.setProperty('--promo-color', v.cor);
      if (dynamicCta) {
        banner.href = v.href;
        if (cta) cta.textContent = v.cta;
      }
      titulo.classList.remove('promo-txt-out');
      sub.classList.remove('promo-txt-out');
      img.classList.remove('promo-img-out');
    }, 260);
  }, 5000);
}

// ─── Indicador de novidades — reaproveita a contagem de notificações
// por ler para acender o pontinho verde na tab "Novidades". ─────────
async function loadNewsDot(){
  try{
    const r = await api.get('/notifications', { unreadOnly: 'true', limit: 1 });
    const unread = r?.data?.unreadCount || 0;
    const dot = document.getElementById('news-dot');
    if(dot) dot.style.display = unread > 0 ? 'inline-block' : 'none';
  }catch(e){}
}

// ─── Mini-cartão "Minha carteira" — reaproveita /wallet/me (o mesmo
// endpoint da página wallet.html), mostra só o saldo actual. Saldo
// pode ser ocultado (toque no ícone de olho) por privacidade. ────────
let _walletAmtFormatted = '0,00';
let _walletHidden = false;
async function loadHomeWallet(){
  const el = document.getElementById('hh-wallet-amt');
  if(!el) return;
  try{
    const r = await api.get('/wallet/me', { limit: 1 });
    const balance = r?.data?.balance ?? 0;
    _walletAmtFormatted = Number(balance).toLocaleString('pt-MZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }catch(e){
    _walletAmtFormatted = '0,00';
  }
  renderWalletAmt();
}
function renderWalletAmt(){
  const el = document.getElementById('hh-wallet-amt');
  if(!el) return;
  el.innerHTML = `<small>MT</small> ${_walletHidden ? '••••' : _walletAmtFormatted}`;
}
function toggleWalletVisibility(){
  _walletHidden = !_walletHidden;
  renderWalletAmt();
  const btn = document.getElementById('hh-wallet-eye-btn');
  if(btn) btn.innerHTML = icon(_walletHidden ? 'eyeOff' : 'eye', 13);
}

// ─── "Produtos para ti" — faixa horizontal de recomendações, mesmo
// cartão de produto (.p-card) usado em products.html/explorar.html. ──
async function loadRecoProducts(){
  const section = document.getElementById('reco-products-section');
  const strip = document.getElementById('reco-products-strip');
  try{
    // Pedimos um lote maior do que o necessário para termos margem para
    // garantir lojas diferentes nos primeiros lugares (ver diversifyByStore).
    let r = await api.get('/products', { limit: 20, sort: 'recommended' }).catch(()=>null);
    let products = r?.data?.products || [];
    if(!products.length){
      r = await api.get('/products', { limit: 20, sort: 'new' }).catch(()=>null);
      products = r?.data?.products || [];
    }
    if(!products.length) return;
    section.style.display = '';
    strip.innerHTML = diversifyByStore(products, 3).map(productCardCompact).join('');
    animateItems(strip);
  }catch(e){ /* widget silencioso */ }
}

// Garante que, sempre que possível, os 3 primeiros produtos da faixa
// vêm de 3 lojas diferentes — evita que "Produtos para ti" pareça a
// montra de uma única loja. O resto mantém a ordem original devolvida
// pelo backend; se não houver 3 lojas distintas no lote, preenche só
// com o que existir, sem forçar repetições nem inventar produtos.
function diversifyByStore(products, frontCount = 3){
  const seen = new Set();
  const front = [];
  const rest = [];
  for(const p of products){
    const storeKey = p.bazar?.id || p.bazar?.name || `_${rest.length}`;
    if(front.length < frontCount && !seen.has(storeKey)){
      seen.add(storeKey);
      front.push(p);
    } else {
      rest.push(p);
    }
  }
  return [...front, ...rest];
}

let _feedPage = 1;
let _feedHasMore = true;
let _feedScope = 'foryou';

function switchFeedTab(scope){
  if(_feedScope===scope) return;
  _feedScope = scope;
  document.getElementById('tab-foryou')?.classList.toggle('active', scope==='foryou');
  document.getElementById('tab-following')?.classList.toggle('active', scope==='following');
  document.getElementById('tab-friends')?.classList.toggle('active', scope==='friends');
  loadFeed(1);
}

let _feedIO = null;
function _feedSentinelIdle(){ const s=document.getElementById('feed-sentinel'); if(s) s.innerHTML=''; }
function _feedSentinelLoading(){ const s=document.getElementById('feed-sentinel'); if(s) s.innerHTML=`<span class="spinner spinner-dark"></span>`; }
function _feedSentinelError(page){ const s=document.getElementById('feed-sentinel'); if(s) s.innerHTML=`<button type="button" class="btn btn-soft btn-sm" onclick="loadFeed(${page})">Tentar novamente</button>`; }
function _setupFeedInfiniteScroll(){
  const sentinel = document.getElementById('feed-sentinel');
  if (!sentinel) return;
  if (_feedIO) _feedIO.disconnect();
  _feedIO = new IntersectionObserver(entries=>{
    if (entries[0].isIntersecting && !_feedLoading && _feedHasMore) loadFeed(_feedPage+1);
  }, { rootMargin: '600px 0px' });
  _feedIO.observe(sentinel);
}
let _feedLoading = false;
async function loadFeed(page){
  if (_feedLoading) return;
  _feedLoading = true;
  const list = document.getElementById('feed-list');
  if(page===1) list.innerHTML = `<div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>`;
  else _feedSentinelLoading();
  try{
    // "Amigos" ainda não tem um scope dedicado no backend — tentamos
    // à mesma (pode já existir amanhã) e caímos num aviso claro em
    // vez de fingir que a funcionalidade está pronta.
    // Só a 1ª página do feed "Para si" usa a cache offline (é a que
    // interessa mostrar logo ao abrir a app sem rede; páginas
    // seguintes do scroll infinito continuam a exigir rede).
    const fetchFeed = () => api.get('/feed', { page, limit: 10, scope: _feedScope });
    const r = (page === 1 && _feedScope === 'foryou' && window.OfflineStore)
      ? (await OfflineStore.getWithFallback('home-feed-p1', fetchFeed, { maxAgeMs: 24 * 60 * 60 * 1000 })).data
      : await fetchFeed();
    const items = r?.data?.items || [];
    const meta = r?.data?.meta || {};
    _feedHasMore = meta.page < meta.totalPages;
    if(page===1) { list.innerHTML = ''; if (window.VirtualFeed) VirtualFeed.reset(list); }
    if(page===1 && items.length===0){
      list.innerHTML = _feedScope==='following' ? `<div class="empty">
        <div class="empty-ico">${icon('store',28,1.6)}</div>
        <h3>Ainda não segues nenhuma loja</h3>
        <p>Explora e segue as tuas lojas favoritas para veres as novidades aqui.</p>
        <button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="go('bazars.html')">Explorar lojas</button>
      </div>` : _feedScope==='friends' ? `<div class="empty">
        <div class="empty-ico">${icon('clock',28,1.6)}</div>
        <h3>O feed de Amigos está a caminho</h3>
        <p>Ainda não há novidades aqui.</p>
        <button class="btn btn-ghost btn-sm" style="margin-top:16px" onclick="switchFeedTab('foryou')">Ver Para si</button>
      </div>` : `<div class="empty">
        <div class="empty-ico">${icon('box',28,1.6)}</div>
        <h3>Ainda sem novidades no feed</h3>
        <p>Volta mais tarde para veres o que há de novo.</p>
        <button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="go('products.html')">Explorar produtos</button>
      </div>`;
      _feedPage = page;
      _feedSentinelIdle();
      return;
    }
    list.insertAdjacentHTML('beforeend', items.map(feedCardHtml).join(''));
    animateItems(list);
    _feedPage = page;
    _feedSentinelIdle();
    _setupFeedInfiniteScroll();
    loadCommentPreviews(items);
    hydrateFeedAvatars(items);
    if (window.VirtualFeed) VirtualFeed.prune(list);
  }catch(e){
    if(page===1 && _feedScope==='friends'){
      list.innerHTML = `<div class="empty">
        <div class="empty-ico">${icon('clock',28,1.6)}</div>
        <h3>O feed de Amigos ainda não está disponível</h3>
        <button class="btn btn-ghost btn-sm" style="margin-top:16px" onclick="switchFeedTab('foryou')">Ver Para si</button>
      </div>`;
    } else if(page===1) {
      list.innerHTML = `<div class="empty">
        <div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
        <h3>Não foi possível carregar o feed</h3>
        <button class="btn btn-ghost btn-sm" style="margin-top:16px" onclick="loadFeed(1)">Tentar de novo</button>
      </div>`;
    } else {
      _feedSentinelError(page);
    }
  } finally {
    _feedLoading = false;
  }
}

// ─── Gamificação: badge de nível + cartão "Nível e desafios" com
// anel de progresso SVG (em vez de barra horizontal). ───────────────
async function loadGamification(){
  const badge = document.getElementById('hh-level');
  const section = document.getElementById('gami-section');
  const card = document.getElementById('mission-card');
  try{
    const g = (await api.get('/gamification/me'))?.data;
    if(!g){ return; }
    section.style.display = '';

    badge.innerHTML = `
      <div class="hh-level" onclick="document.getElementById('gami-section')?.scrollIntoView({behavior:'smooth',block:'center'})">
        ${icon('star',13,2)} Nível ${g.level}
      </div>`;

    const pct = Math.max(0, Math.min(100, Math.round((g.pointsIntoLevel / g.pointsForNextLevel) * 100)));
    const R = 27, C = 2 * Math.PI * R;
    const dash = (pct/100) * C;

    card.style.display = 'flex';
    card.innerHTML = `
      <div class="mission-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--surf2)" stroke-width="6"/>
          <circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--a-500)" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="${dash} ${C}"/>
        </svg>
        <div class="mission-ring-num"><b>${g.level}</b><span>nível</span></div>
      </div>
      <div class="mission-list">
        ${g.challenges.map(c=>`
          <div class="mission-row ${c.completed?'done':''}">
            <div class="mission-check">${c.completed?icon('check',10,3):''}</div>
            <b>${esc(c.label)}</b>
            <em>+${c.points}</em>
          </div>`).join('')}
      </div>`;
  }catch(e){ section.style.display='none'; }
}

// ─── Comunidades por categoria (produtos activos agrupados) ────────
async function loadCommunities(){
  const section = document.getElementById('communities-section');
  const strip = document.getElementById('communities-strip');
  try{
    const r = await api.get('/products/categories-overview');
    const cats = r?.data?.categories || [];
    if(!cats.length) return;
    section.style.display = '';
    strip.innerHTML = cats.map(c=>{
      const meta = CATS.find(x=>x.l===c.category);
      const label = meta?.l || c.category;
      const goCat = `go('products.html',{category:'${c.category}'})`;
      return `
      <div class="comm-chip" onclick="${goCat}">
        <div class="comm-chip-ico">${meta?.ico||icon('grid',16)}</div>
        <b>${esc(label)}</b>
        <span>${c.count} produtos</span>
      </div>`;
    }).join('');
  }catch(e){ /* widget silencioso */ }
}

// carouselHtml(), onCarouselScroll() e toggleCaption() agora vivem em
// js/app.js — partilhadas com anuncios.html (mesmo carrossel/legenda).

function feedCardHtml(it){
  const isProduct = it.targetType === 'PRODUCT';
  const content = isProduct ? it.product : it.announcement;
  const bazar = content.bazar;
  const sellerAvatar = bazarLogo(bazar);
  const isPremiumSeller = !!content.seller?.isPremium;
  const images = isProduct
    ? (content.images||[]).map(i=>i.url)
    : (content.images?.length ? content.images.map(i=>i.url) : (content.imageUrl?[content.imageUrl]:[]));
  const thumbUrl = images[0] ? cldImg(images[0], 120) : '';
  const cardId = `feed-${it.targetType}-${it.targetId}`;
  const clickThrough = isProduct ? `go('product.html',{id:'${escJsAttr(content.slug || content.id)}'})` : '';
  const liked = it.myReaction===1;
  const parsedAnn = !isProduct ? parseQuickTags(content.text||'') : null;
  const caption = !isProduct ? escWithMentions(parsedAnn.text) : '';
  const captionLong = caption.length > 140;

  const isOwn = bazar.id === window._myBazarId;
  return `
  <div class="card feed-card anim-item" id="${cardId}" style="padding:0;overflow:hidden">
    <div class="fc-post-header" style="display:flex;align-items:center;gap:10px;padding:12px 14px">
      <span data-fc-avatar="${bazar.id}" data-fc-size="38" class="tap-fx" style="cursor:pointer;display:flex;position:relative" onclick="go('bazar.html',{id:'${escJsAttr(bazar.slug||bazar.id)}'})">${storeAvatar(bazar.name, 38, sellerAvatar)}<span class="online-dot"></span></span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:5px">
          <strong style="font-size:13.5px;cursor:pointer" onclick="go('bazar.html',{id:'${escJsAttr(bazar.slug||bazar.id)}'})">${esc(bazar.name)}</strong>
          ${isPremiumSeller?`<span class="fc-verified" title="Loja Premium"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="14" height="14"><path d="M12 2l2.4 1.2 2.6-.6 1.4 2.3 2.5.9-.2 2.7 1.7 2.1-1.7 2.1.2 2.7-2.5.9-1.4 2.3-2.6-.6L12 22l-2.4-1.2-2.6.6-1.4-2.3-2.5-.9.2-2.7L1.6 13.6l1.7-2.1-.2-2.7 2.5-.9 1.4-2.3 2.6.6z"/><path d="M9 12.5l2 2 4-4.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`:''}
        </div>
        <div style="font-size:11px;color:var(--t4);display:flex;align-items:center;gap:6px;margin-top:2px">
          <span class="fc-type-tag ${isProduct?'fc-type-tag--product':'fc-type-tag--post'}">${isProduct?'Produto novo':'Post'}</span>
          <span>${timeAgo(it.createdAt)}</span>
        </div>
      </div>
      ${it.sharedByMe?`<span style="font-size:10.5px;color:var(--b-600);font-weight:700;display:flex;align-items:center;gap:3px;margin-right:4px">${icon('share',12,2)} Partilhaste</span>`:''}
      ${isOwn ? feedKebabBtnHtml(it.targetType, it.targetId, bazar.id) : `<div style="display:flex;align-items:center;gap:4px">${feedFollowBtnHtml(bazar.id, !!bazar.isFollowing)}${feedMoreBtnHtml(it.targetType, it.targetId, bazar.id, content.seller?.id||'', !!bazar.isFollowing)}</div>`}
    </div>
    ${!isProduct ? quickTagBadgesHtml(parsedAnn.tags) : ''}

    ${images.length?`<div class="fc-carousel" data-heart-host="${cardId}" style="position:relative" ondblclick="doubleTapLike(this,'${it.targetType}','${it.targetId}',${liked})">${carouselHtml(images, clickThrough, isProduct ? null : images, isProduct ? null : cardId)}
      ${isProduct?`<span class="fc-avail-badge">${icon('cart',12,2.4)} Produto disponível</span>`:''}
      <button class="feed-quick-like" title="Gostei" onclick="event.stopPropagation();doubleTapLike(this.parentElement,'${it.targetType}','${it.targetId}',${liked})">${icon('plus',18,2.6)}</button>
      ${isProduct?`<div class="fc-shop-card" onclick="event.stopPropagation();${clickThrough}">
        <div class="fc-shop-thumb"><img loading="lazy" decoding="async" src="${esc(thumbUrl)}" alt="${esc(content.name)}"></div>
        <div class="fc-shop-info"><b>${esc(content.name)}</b><span>${esc(bazar.name)}</span></div>
        <div class="fc-shop-price">${fmtMT(content.price)}</div>
      </div>`:(content.product?`<div class="fc-buy-bar" onclick="event.stopPropagation()">
        <span class="fc-buy-price">${fmtMT(content.product.price)}</span>
        <button type="button" class="fc-buy-btn" onclick="event.stopPropagation();go('product.html',{id:'${escJsAttr(content.product.slug || content.product.id)}'})">${icon('cart',20,2.4)}<span>Comprar</span></button>
      </div>`:'')}
    </div>`:''}

    <div class="fc-caption-block" style="padding:12px 14px 2px">
      ${isProduct?'':`
        ${(!images.length && content.product)?`<div class="fc-buy-bar fc-buy-bar--inline">
          <span class="fc-buy-price">${fmtMT(content.product.price)}</span>
          <button type="button" class="fc-buy-btn" onclick="go('product.html',{id:'${escJsAttr(content.product.slug || content.product.id)}'})">${icon('cart',20,2.4)}<span>Comprar</span></button>
        </div>`:''}
        <p id="${cardId}-caption" class="fc-caption${captionLong?' truncated':''}" style="font-size:13.5px;color:var(--t2);white-space:pre-wrap;margin:0">${caption}</p>
        ${captionLong?`<button class="fc-caption-more" onclick="toggleCaption(this)">Ver mais</button>`:''}
      `}
    </div>

    ${feedReactionBar(cardId, it.targetType, it.targetId, it.myReaction, it.likeCount, it.shareCount, it.commentCount, isOwn, isProduct, content.isFavorite)}

    <div id="${cardId}-preview" style="padding:6px 14px 4px;display:flex;flex-direction:column;gap:3px"></div>
  </div>`;
}
</script>
