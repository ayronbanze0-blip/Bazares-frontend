<script>
let _srchTab = 'tudo';
let _srchTimer = null;

function bazCardSm(b) {
  const premium = !!b.seller?.isPremium;
  const verified = !!(b.verified||b.seller?.verifiedSeller);
  return `<div class="baz-card baz-card--compact card-hover anim-item${premium?' baz-card--premium':''}" onclick="go('bazar.html',{id:'${escJsAttr(b.slug||b.id)}'})">
    <div class="baz-head${premium?' baz-head--premium':''}">
      ${storeAvatar(b.name,34,bazarLogo(b),verified)}
      <div style="flex:1;min-width:0;position:relative;z-index:1">
        <div style="color:#fff;font-weight:700;font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</div>
        ${premium?`<span style="color:var(--a-500);font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;gap:2px"><svg class="ico-inline" width="9" height="9" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.7 7.1-.7z"/></svg> Premium</span>`:verified?`<span style="color:rgba(255,255,255,.55);font-size:9.5px;font-weight:600">Verificado</span>`:''}
      </div>
    </div>
    <div class="baz-body">
      <div class="baz-footer">
        <div style="font-size:11px">${stars(b.seller?.rating||0)} <span style="color:var(--t4)">${b.seller?.ratingCount?b.seller.rating.toFixed(1)+' ('+b.seller.ratingCount+')':'Sem avaliações'}</span></div>
        <span style="font-size:11px;font-weight:600;color:var(--t3)">${b._count?.products??0} produto(s)</span>
      </div>
    </div>
  </div>`;
}

function personRow(u) {
  return `<div class="person-row" onclick="openPersonChat('${u.id}')">
    ${avatar(u.name, 40, u.avatarUrl || null)}
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13.5px">${esc(u.name)}</div>
      <div style="font-size:12px;color:var(--t4)">@${esc(u.username||'')}</div>
    </div>
    <button class="btn btn-soft btn-xs" onclick="event.stopPropagation();openPersonChat('${u.id}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Falar</button>
  </div>`;
}

async function openPersonChat(id) {
  try { const r = await api.get(`/chat/with/${id}`); go('chat.html', { chatId: r?.data?.chat?.id || '' }); }
  catch (e) { toast(apiErrorMessage(e), 'err'); }
}

initPage({ active: '', onReady: () => {
  const q0 = getParam('q') || '';
  const savedSrch = getListState('search');
  if (savedSrch && savedSrch.tab) _srchTab = savedSrch.tab;
  document.getElementById('view').innerHTML = `
    <div class="pg-hero pg-hero--compact" style="margin-bottom:20px">
      <div class="pg-hero-content">
        <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg> Pesquisa</div>
        <h1>Pesquisar no Bazares</h1>
        <p>Encontra produtos, bazares e pessoas em toda a plataforma.</p>
      </div>
    </div>
    <div class="srch-input-wrap">
      <span class="si"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input id="srch-input" placeholder="Pesquisar produtos, bazares e pessoas..." autocomplete="off" value="${esc(q0)}">
    </div>
    <div class="srch-tabs" id="srch-tabs">
      ${[['tudo','Tudo'],['produtos','Produtos'],['bazares','Bazares'],['pessoas','Pessoas']].map(([k,l])=>
        `<button class="srch-tab ${k===_srchTab?'on':''}" id="tab-${k}" onclick="switchSrchTab('${k}')">${l}</button>`
      ).join('')}
    </div>
    <div id="srch-results"></div>`;

  const input = document.getElementById('srch-input');
  input.addEventListener('input', () => {
    clearTimeout(_srchTimer);
    _srchTimer = setTimeout(() => runSearch(input.value.trim()), 350);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(_srchTimer); runSearch(input.value.trim()); } });
  document.getElementById('srch-results').addEventListener('click', _saveSrchState, true);

  if (q0) {
    runSearch(q0).then(() => { if (savedSrch) restoreScrollY(savedSrch.scrollY); });
  }
  else renderSrchIdleState();
}});

// ─── Estado ocioso: pesquisas recentes em vez do empty state genérico
// quando já existe histórico local ─────────────────────────────────
function renderSrchIdleState() {
  const recent = Bazares.RecentSearches.get();
  const results = document.getElementById('srch-results');
  if (!recent.length) {
    results.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><h3>Comece a escrever para pesquisar</h3><p>Produtos, bazares e pessoas — tudo num só lugar.</p></div>`;
    return;
  }
  results.innerHTML = `<div class="srch-sec-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>Pesquisas recentes</span>
      <button type="button" onclick="Bazares.RecentSearches.clear();renderSrchIdleState()" style="background:none;border:none;color:var(--t4);font-size:11px;font-weight:600;cursor:pointer;text-transform:none">Limpar</button>
    </div>
    ${recent.map(term => `<div class="person-row" style="justify-content:space-between" onclick="document.getElementById('srch-input').value='${escJsAttr(term)}';runSearch('${escJsAttr(term)}')">
      <span style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500">${icon('clock',15)}${esc(term)}</span>
      <button type="button" onclick="event.stopPropagation();Bazares.RecentSearches.remove('${escJsAttr(term)}');renderSrchIdleState()" aria-label="Remover pesquisa" style="background:none;border:none;color:var(--t4);cursor:pointer;padding:4px">${icon('close',13)}</button>
    </div>`).join('')}`;
}

// ─── Memória de listagem (voltar sem perder separador/scroll) ──────
function _saveSrchState(){
  saveListState('search',{tab:_srchTab, scrollY:window.scrollY});
}

function switchSrchTab(tab) {
  _srchTab = tab;
  document.querySelectorAll('.srch-tab').forEach(b => b.classList.remove('on'));
  document.getElementById(`tab-${tab}`).classList.add('on');
  const q = document.getElementById('srch-input').value.trim();
  if (q) runSearch(q);
}

async function runSearch(q) {
  const results = document.getElementById('srch-results');
  if (!q) { renderSrchIdleState(); return; }
  results.innerHTML = `<div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>`;
  history.replaceState(null, '', `search.html?q=${encodeURIComponent(q)}`);

  try {
    const tasks = [];
    const wantProducts = _srchTab==='tudo' || _srchTab==='produtos';
    const wantBazars   = _srchTab==='tudo' || _srchTab==='bazares';
    const wantPeople    = _srchTab==='tudo' || _srchTab==='pessoas';

    const [productsRes, bazarsRes, peopleRes] = await Promise.allSettled([
      wantProducts ? api.get('/products', { q, limit: _srchTab==='tudo'?6:24 }) : Promise.resolve(null),
      wantBazars ? api.get('/bazars', { q, limit: _srchTab==='tudo'?4:24 }) : Promise.resolve(null),
      wantPeople ? api.get('/users/search/mentions', { q }) : Promise.resolve(null),
    ]);

    const products = productsRes.status==='fulfilled' ? (productsRes.value?.data?.products||[]) : [];
    const bazars = bazarsRes.status==='fulfilled' ? (bazarsRes.value?.data?.bazars||[]) : [];
    const people = peopleRes.status==='fulfilled' ? (peopleRes.value?.data?.users||[]) : [];

    if (!products.length && !bazars.length && !people.length) {
      const guess = Bazares.Utils.closestMatch(q, (window.CATS||[]).map(c=>c.l).concat(Bazares.RecentSearches.get()));
      results.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><h3>Sem resultados para "${esc(q)}"</h3><p>${guess ? `Quis dizer <a href="#" onclick="event.preventDefault();document.getElementById('srch-input').value='${escJsAttr(guess)}';runSearch('${escJsAttr(guess)}')" style="color:var(--b-500);font-weight:700">${esc(guess)}</a>? Ou tente outros termos.` : 'Tente outros termos de pesquisa.'}</p></div>`;
      return;
    }
    Bazares.RecentSearches.add(q);

    let html = '';
    if (products.length) {
      html += `<div class="srch-sec-title">Produtos${_srchTab==='tudo'?'':` (${products.length})`}</div>
        <div class="p-grid">${products.map(productCard).join('')}</div>
        ${_srchTab==='tudo' ? `<div style="text-align:center;margin-top:10px"><button class="btn btn-soft btn-sm" onclick="go('products.html',{q:'${esc(q)}'})">Ver todos os produtos</button></div>` : ''}`;
    }
    if (bazars.length) {
      html += `<div class="srch-sec-title">Bazares${_srchTab==='tudo'?'':` (${bazars.length})`}</div>
        <div class="baz-grid">${bazars.map(bazCardSm).join('')}</div>
        ${_srchTab==='tudo' ? `<div style="text-align:center;margin-top:10px"><button class="btn btn-soft btn-sm" onclick="go('bazars.html',{q:'${esc(q)}'})">Ver todos os bazares</button></div>` : ''}`;
    }
    if (people.length) {
      html += `<div class="srch-sec-title">Pessoas${_srchTab==='tudo'?'':` (${people.length})`}</div>
        <div>${people.map(personRow).join('')}</div>`;
    }
    results.innerHTML = html;
    animateItems(results);
  } catch (e) {
    results.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}
</script>
