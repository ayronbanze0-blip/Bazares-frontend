<style>
/* ── Cabeçalho compacto do Perfil — em mobile substitui o #topbar
   padrão (logo/pesquisa) por um cabeçalho minimalista: voltar,
   título centrado, atalho para Definições. Em ecrã largo mantemos o
   #topbar normal, porque lá a barra lateral já resolve a navegação. ── */
.pf-header{display:none;align-items:center;justify-content:space-between;padding:14px 4px 4px;position:relative}
.pf-header-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surf2);color:var(--text);border:none;cursor:pointer;flex-shrink:0}
.pf-header-btn:active{transform:scale(.92)}
.pf-header h1{font-family:var(--f-display);font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.01em}
@media (max-width:900px){
  #topbar{display:none}
  .pf-header{display:flex}
}

.pf-card{display:flex;align-items:center;gap:13px;padding:16px;margin-bottom:18px}
.pf-avatar-wrap{position:relative;flex-shrink:0;cursor:pointer}
.pf-avatar-edit{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--g-green);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--surf)}
.pf-name{font-family:var(--f-display);font-size:16.5px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.pf-handle{font-size:12.5px;color:var(--t3);margin-top:1px}
.pf-public-lnk{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--b-600);margin-top:5px;cursor:pointer;background:none;border:none;padding:0}
.pf-public-lnk svg{width:13px;height:13px}

.pf-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--t4);margin:22px 2px 8px}
.pf-list{padding:2px}
.pf-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;background:none;border:none;text-align:left;cursor:pointer;color:var(--text);border-bottom:1px solid var(--brd)}
.pf-row:last-child{border-bottom:none}
.pf-row:active{background:var(--surf2)}
.pf-row-ico{color:var(--t3);flex-shrink:0;display:flex}
.pf-row-label{flex:1;font-size:13.5px;font-weight:600}
.pf-row-chev{color:var(--t4);flex-shrink:0;display:flex}
.pf-row.danger .pf-row-label,.pf-row.danger .pf-row-ico{color:var(--red)}
</style>
</head>

<script>
initPage({ active:'profile.html', requireAuth:true, onReady: async(user)=>{
  const view = document.getElementById('view');

  const row = (id, iconName, label, danger) => `
    <button class="pf-row${danger?' danger':''}" id="${id}">
      <span class="pf-row-ico">${icon(iconName,18)}</span>
      <span class="pf-row-label">${label}</span>
      <span class="pf-row-chev">${icon('arrowRight',16,2.4)}</span>
    </button>`;

  view.innerHTML = `
    <div class="pf-header">
      <button class="pf-header-btn" onclick="goBack()" aria-label="Voltar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
      <h1>Perfil</h1>
      <button class="pf-header-btn" onclick="go('settings.html')" aria-label="Definições">${icon('settings',17)}</button>
    </div>

    <div class="card pf-card">
      <div class="pf-avatar-wrap" onclick="document.getElementById('avatar-input').click()" title="Alterar foto de perfil">
        ${userPhoto(user)?`<img loading="lazy" decoding="async" src="${esc(userPhoto(user))}" alt="" class="avatar" style="width:56px;height:56px;object-fit:cover">`:avatar(user.name,56)}
        <div class="pf-avatar-edit">${icon('camera',11,2.4)}</div>
      </div>
      <input type="file" id="avatar-input" accept="image/jpeg,image/jpg,image/png,image/webp" hidden>
      <div style="min-width:0;flex:1">
        <div class="pf-name">${esc(user.name)}</div>
        <div class="pf-handle">@${esc(user.username||(user.email||'').split('@')[0])}</div>
        ${user.bazar?`<button class="pf-public-lnk" onclick="go('bazar.html',{id:'${escJsAttr(user.bazar.slug||user.bazar.id)}'})">Ver perfil público ${icon('arrowRight',13,2.6)}</button>`:''}
      </div>
    </div>

    <div class="qa-grid">
      <div class="qa-tile" onclick="go('favorites.html')"><div class="qa-tile-ico" style="background:var(--c-500)">${icon('heart',18)}</div><span>Favoritos</span></div>
      <div class="qa-tile" onclick="go('my-orders.html')"><div class="qa-tile-ico" style="background:var(--b-500)">${icon('box',18)}</div><span>Pedidos</span></div>
      <div class="qa-tile" onclick="go('wallet.html')"><div class="qa-tile-ico" style="background:var(--amb)">${icon('wallet',18)}</div><span>Carteira</span></div>
      <div class="qa-tile" onclick="go('referrals.html')"><div class="qa-tile-ico" style="background:var(--g-green,var(--b-600))">${icon('share',18)}</div><span>Convidar</span></div>
    </div>

    <div class="card pf-list">
      ${row('pf-r-info','clipboard','Informações da conta')}
      ${row('pf-r-edit','user','Editar perfil')}
      ${row('pf-r-addr','pin','Endereço de levantamento')}
      ${user.bazar?row('pf-r-store','store','Ver loja pública'):''}
      ${!user.isPremium?row('pf-r-premium','star','Torna-te Premium'):row('pf-r-premium','star','Gerir Premium')}
    </div>

    <div class="pf-section-title">${user.bazar?'A minha loja':'Vender no Bazares'}</div>
    <div class="card pf-list">
      ${user.bazar?`
        ${row('pf-r-products','box','Meus produtos')}
        ${row('pf-r-finance','wallet','Finanças da loja')}
        ${row('pf-r-editstore','settings','Editar Bazar')}
        ${row('pf-r-ranking','trophy','Ranking de vendedores')}
      ` : row('pf-r-becomeseller','store','Tornar-me vendedor')}
    </div>

    <div class="pf-section-title">Preferências</div>
    <div class="card pf-list">
      ${row('pf-r-notif','bell','Notificações')}
      ${row('pf-r-priv','eye','Privacidade')}
      ${row('pf-r-sec','logout','Segurança')}
    </div>

    <div class="pf-section-title">Suporte e legal</div>
    <div class="card pf-list">
      ${row('pf-r-help','support','Central de ajuda')}
      ${row('pf-r-talk','chat','Falar com o suporte')}
      ${row('pf-r-terms','clipboard','Termos e condições')}
      ${row('pf-r-refund','box','Política de reembolso')}
      ${row('pf-r-logout','logout','Sair da conta',true)}
    </div>
  `;

  document.getElementById('pf-r-info').onclick = () => openAccountInfoModal(user);
  document.getElementById('pf-r-edit').onclick = () => openEditProfile();
  document.getElementById('pf-r-addr').onclick = () => openPickupAddressModal(user);
  document.getElementById('pf-r-premium').onclick = () => go('premium.html');
  document.getElementById('pf-r-notif').onclick = () => openNotifModal();
  document.getElementById('pf-r-priv').onclick = () => openPrivacyModal();
  document.getElementById('pf-r-sec').onclick = () => openSecurityModal();
  document.getElementById('pf-r-help').onclick = () => go('support.html');
  document.getElementById('pf-r-talk').onclick = () => go('support.html');
  document.getElementById('pf-r-terms').onclick = () => go('terms.html');
  document.getElementById('pf-r-refund').onclick = () => go('refund-policy.html');
  document.getElementById('pf-r-logout').onclick = () => doLogout();
  const storeBtn = document.getElementById('pf-r-store');
  if (storeBtn) storeBtn.onclick = () => go('bazar.html',{id:user.bazar.slug||user.bazar.id});
  const productsBtn = document.getElementById('pf-r-products');
  if (productsBtn) productsBtn.onclick = () => go('my-products.html');
  const financeBtn = document.getElementById('pf-r-finance');
  if (financeBtn) financeBtn.onclick = () => go('finance.html');
  const editStoreBtn = document.getElementById('pf-r-editstore');
  if (editStoreBtn) editStoreBtn.onclick = () => go('my-bazar.html');
  const rankingBtn = document.getElementById('pf-r-ranking');
  if (rankingBtn) rankingBtn.onclick = () => go('ranking.html');
  const becomeSellerBtn = document.getElementById('pf-r-becomeseller');
  if (becomeSellerBtn) becomeSellerBtn.onclick = () => go('my-bazar.html');

  document.getElementById('avatar-input').addEventListener('change', async e=>{
    const file=e.target.files[0];
    if(!file) return;
    const accepted=['image/jpeg','image/jpg','image/png','image/webp'];
    if(!accepted.includes(file.type)){ toast('Use uma imagem JPG, PNG ou WEBP.','warn'); return; }
    if(file.size>5*1024*1024){ toast('A imagem deve ter no máximo 5MB.','warn'); return; }
    const compressed = window.MediaCompress ? await MediaCompress.compressImage(file, 800, 0.85) : file;
    const fd=new FormData(); fd.append('avatar',compressed);
    try{
      toast('A actualizar foto de perfil…','info');
      const res=await api.putForm('/users/me',fd);
      if(res?.data?.user?.avatarUrl){
        Session._user = {...Session.user, avatarUrl:res.data.user.avatarUrl};
        toast('Foto de perfil actualizada!');
        setTimeout(()=>location.reload(),600);
      }
    }catch(err){ toast(apiErrorMessage(err),'err'); }
  });
}});

function infoRow(ico,lbl,val){
  return `<div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--surf3);border-radius:var(--r);border:1px solid var(--brd)">
    <span style="width:36px;height:36px;border-radius:10px;background:var(--b-50);color:var(--b-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px">${ico}</span>
    <div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-weight:700">${lbl}</div><div style="font-weight:700;font-size:13.5px;color:var(--text)">${esc(val||'Não indicado')}</div></div>
  </div>`;
}

function openAccountInfoModal(u){
  openModal(`<div class="modal-hd"><h3>Informações da conta</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${infoRow(icon('user',16),'Nome',u.name)}
      ${infoRow(icon('envelope',16),'Email',u.email)}
      ${u.phone?infoRow(icon('chat',16),'Telefone',u.phone):''}
      ${u.location?infoRow(icon('pin',16),'Localização',u.location):''}
      ${infoRow(icon('clock',16),'Membro desde',fmtDate(u.createdAt))}
    </div>`);
}

function openEditProfile(){
  const u=Session.user;
  openModal(`<div class="modal-hd"><h3>Editar perfil</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <div class="fg"><label>Nome</label><input id="ep-name" value="${esc(u.name)}" placeholder="O seu nome"></div>
    <div class="fg"><label>Sobre mim</label><textarea id="ep-bio" rows="3" maxlength="240" placeholder="Fale um pouco sobre si...">${esc(u.bio||'')}</textarea><div class="field-counter" id="ep-bio-count">${(u.bio||'').length}/240</div></div>
    <div class="fg"><label>Telefone</label><input id="ep-phone" value="${esc(u.phone||'')}" placeholder="+258 8X XXX XXXX"></div>
    <div class="fg"><label>Localização</label><input id="ep-loc" value="${esc(u.location||'')}" placeholder="Ex: Maputo, Moçambique"></div>
    <div style="display:flex;gap:9px">
      <button class="btn btn-primary" style="flex:1" onclick="saveProfile()">${icon('check',15,2.4)} Guardar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
  const bioEl=document.getElementById('ep-bio'), bioCount=document.getElementById('ep-bio-count');
  bioEl?.addEventListener('input',()=>{
    const len=bioEl.value.length;
    bioCount.textContent=`${len}/240`;
    bioCount.classList.toggle('field-counter--near', len>=200&&len<240);
    bioCount.classList.toggle('field-counter--full', len>=240);
  });
}
async function saveProfile(){
  const name=document.getElementById('ep-name').value.trim();
  const bio=document.getElementById('ep-bio').value.trim();
  const phone=document.getElementById('ep-phone').value.trim();
  const location=document.getElementById('ep-loc').value.trim();
  if(!name){toast('O nome é obrigatório.','warn');return;}
  const btn=document.querySelector('#modal-root .btn-primary');setLoading(btn,true);
  try{ await api.put('/users/me',{name,bio,phone,location}); closeModal(); toast('Perfil actualizado!'); setTimeout(()=>location.reload(),700); }
  catch(e){setLoading(btn,false);toast(apiErrorMessage(e),'err');}
}

function openPickupAddressModal(u){
  openModal(`<div class="modal-hd"><h3>Endereço de levantamento</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <p style="font-size:12.5px;color:var(--t3);margin-bottom:14px">Usado para entregas e para os compradores saberem onde levantar as suas encomendas.</p>
    <div class="fg"><label>Endereço</label><input id="pa-addr" value="${esc(u.location||'')}" placeholder="Ex: Maputo, Malanga, Av. Julius Nyerere"></div>
    <div style="display:flex;gap:9px">
      <button class="btn btn-primary" style="flex:1" onclick="savePickupAddress()">Guardar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
}
async function savePickupAddress(){
  const location=document.getElementById('pa-addr').value.trim();
  if(!location){toast('Indique um endereço.','warn');return;}
  const btn=document.querySelector('#modal-root .btn-primary');setLoading(btn,true);
  try{ await api.put('/users/me',{location}); closeModal(); toast('Endereço actualizado!'); setTimeout(()=>location.reload(),700); }
  catch(e){setLoading(btn,false);toast(apiErrorMessage(e),'err');}
}

function openNotifModal(){
  openModal(`<div class="modal-hd"><h3>Notificações</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <div id="pf-notif-toggles" style="display:flex;flex-direction:column;gap:7px"></div>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--brd)">
      <div style="font-weight:700;font-size:12.5px;margin-bottom:8px">Notificações push</div>
      <div id="pf-push-status"></div>
    </div>`);
  renderPfNotifToggles();
  renderPfPushStatus();
}
const NOTIF_PREFS = [
  ['notif_orders', icon('box',15)+' Novas encomendas e alterações de estado', true],
  ['notif_chat', icon('chat',15)+' Novas mensagens no chat', true],
  ['notif_promo', icon('megaphone',15)+' Novidades e promoções do Bazares', false],
];
function getNotifPref(key, def){
  const v = localStorage.getItem(key);
  return v===null ? def : v==='1';
}
function renderPfNotifToggles(){
  const el=document.getElementById('pf-notif-toggles');
  if(!el) return;
  el.innerHTML = NOTIF_PREFS.map(([key,label,def])=>{
    const on = getNotifPref(key,def);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:11px;background:var(--surf2);border-radius:var(--r)">
      <div style="font-weight:600;font-size:13px">${label}</div>
      <label class="switch"><input type="checkbox" onchange="toggleNotifPref('${key}')" ${on?'checked':''}><span class="switch__track"></span><span class="switch__thumb"></span></label>
    </div>`;
  }).join('');
}
function toggleNotifPref(key){
  const cur = getNotifPref(key, true);
  localStorage.setItem(key, cur ? '0' : '1');
  renderPfNotifToggles();
}
function renderPfPushStatus(){
  const el = document.getElementById('pf-push-status');
  if (!el) return;
  if (typeof Notification === 'undefined') {
    el.innerHTML = `<div style="padding:11px;background:var(--surf2);border-radius:var(--r);font-size:12.5px;color:var(--t4)">Este navegador não suporta notificações push.</div>`;
    return;
  }
  if (Notification.permission === 'denied') {
    el.innerHTML = `<div style="padding:11px;background:var(--surf2);border-radius:var(--r);font-size:12.5px;color:var(--t4)">Bloqueaste as notificações para este site. Activa-as nas definições do navegador.</div>`;
    return;
  }
  const on = isPushEnabled();
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;padding:11px;background:var(--surf2);border-radius:var(--r)">
    <div><div style="font-weight:600;font-size:13px">${on ? 'Activas neste dispositivo' : 'Desactivadas'}</div><div style="font-size:11px;color:var(--t4)">${on ? 'Vais receber notificações push aqui.' : 'Toca para activar'}</div></div>
    <label class="switch"><input type="checkbox" onchange="togglePfPush()" ${on?'checked':''}><span class="switch__track"></span><span class="switch__thumb"></span></label>
  </div>`;
}
async function togglePfPush(){
  if (isPushEnabled()) { await disablePushNotifications(); } else { await requestPushPermission(); }
  renderPfPushStatus();
}

function openPrivacyModal(){
  const pub = localStorage.getItem('bz_public_profile')!=='0';
  const loc = localStorage.getItem('bz_share_location')==='1';
  openModal(`<div class="modal-hd"><h3>Privacidade</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:11px;background:var(--surf2);border-radius:var(--r)">
        <div><div style="font-weight:600;font-size:13px">Perfil público</div><div style="font-size:11px;color:var(--t4)">Outras pessoas podem ver o seu perfil e loja</div></div>
        <label class="switch"><input type="checkbox" id="pv-public" ${pub?'checked':''}><span class="switch__track"></span><span class="switch__thumb"></span></label>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:11px;background:var(--surf2);border-radius:var(--r)">
        <div><div style="font-weight:600;font-size:13px">Partilhar localização</div><div style="font-size:11px;color:var(--t4)">Usada para "perto de mim" e entregas</div></div>
        <label class="switch"><input type="checkbox" id="pv-loc" ${loc?'checked':''}><span class="switch__track"></span><span class="switch__thumb"></span></label>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm btn-block" onclick="go('privacy.html')">${icon('clipboard',15)} Ver política de privacidade</button>
    <div style="display:flex;gap:9px;margin-top:14px">
      <button class="btn btn-primary" style="flex:1" onclick="savePrivacyPrefs()">Guardar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
}
function savePrivacyPrefs(){
  localStorage.setItem('bz_public_profile', document.getElementById('pv-public').checked?'1':'0');
  localStorage.setItem('bz_share_location', document.getElementById('pv-loc').checked?'1':'0');
  closeModal();
  toast('Preferências de privacidade guardadas!');
}

function openSecurityModal(){
  openModal(`<div class="modal-hd"><h3>Segurança</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-ghost btn-sm btn-block" onclick="closeModal();openChangePw()">${icon('settings',15)} Alterar palavra-passe</button>
      <button class="btn btn-ghost btn-sm btn-block" onclick="closeModal();go('forgot-password.html')">${icon('envelope',15)} Alterar palavra-passe via email</button>
      <button class="btn btn-ghost btn-sm btn-block" onclick="doLogout()">${icon('logout',15)} Encerrar esta sessão</button>
      <button class="btn btn-ghost btn-sm btn-block" onclick="doLogoutAll()">${icon('logout',15)} Encerrar todas as sessões</button>
      <button class="btn btn-ghost btn-sm btn-block" style="color:var(--red);border-color:var(--red-bg)" onclick="closeModal();openDeleteAccount()">${icon('close',15)} Eliminar conta</button>
    </div>`);
}
function openChangePw(){
  openModal(`<div class="modal-hd"><h3>Alterar palavra-passe</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <div class="fg"><label>Palavra-passe actual</label><div class="pw-wrap"><input type="password" id="pw-old" placeholder="Actual"><button type="button" class="pw-eye" onclick="togglePwField(this)" aria-label="Mostrar senha">${pwEyeIcon()}</button></div></div>
    <div class="fg"><label>Nova palavra-passe</label><div class="pw-wrap"><input type="password" id="pw-new" placeholder="Nova (mín. 8)"><button type="button" class="pw-eye" onclick="togglePwField(this)" aria-label="Mostrar senha">${pwEyeIcon()}</button></div></div>
    <div class="fg"><label>Confirmar nova</label><div class="pw-wrap"><input type="password" id="pw-new2" placeholder="Repetir"><button type="button" class="pw-eye" onclick="togglePwField(this)" aria-label="Mostrar senha">${pwEyeIcon()}</button></div></div>
    <div style="display:flex;gap:9px">
      <button class="btn btn-primary" style="flex:1" onclick="changePw()">Alterar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
}
async function changePw(){
  const old=document.getElementById('pw-old').value;
  const nw=document.getElementById('pw-new').value;
  const nw2=document.getElementById('pw-new2').value;
  if(!old||!nw){toast('Preencha todos os campos.','warn');return;}
  if(nw!==nw2){toast('As palavras-passe não coincidem.','err');return;}
  if(nw.length<8){toast('A nova palavra-passe deve ter pelo menos 8 caracteres.','warn');return;}
  const btn=document.querySelector('#modal-root .btn-primary');setLoading(btn,true);
  try{await api.put('/users/me/password',{currentPassword:old,newPassword:nw});closeModal();toast('Palavra-passe alterada!');}
  catch(e){setLoading(btn,false);toast(apiErrorMessage(e),'err');}
}
async function doLogout(){
  try{ await api.post('/auth/logout'); }catch(e){}
  setAccessToken(null); Session._user = null;
  toast('Sessão encerrada.','info');
  setTimeout(()=>go('login.html'),600);
}
async function doLogoutAll() {
  if (!await confirmDialog('Isto termina a sessão em todos os dispositivos, incluindo este. Continuar?', { title:'Terminar todas as sessões', confirmLabel:'Terminar sessões', danger:true })) return;
  try {
    await api.post('/auth/logout-all');
    setAccessToken(null);
    Session._user = null;
    toast('Todas as sessões foram terminadas.', 'info');
    setTimeout(() => go('login.html'), 800);
  } catch (e) { toast(apiErrorMessage(e), 'err'); }
}

function openDeleteAccount(){
  openModal(`<div class="modal-hd"><h3 style="color:var(--red)">${icon('flag',18)} Eliminar conta</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
    <p style="font-size:13px;color:var(--t2);margin-bottom:16px">Esta acção é <strong>permanente e irreversível</strong>. Todos os seus dados, encomendas, produtos e histórico serão eliminados.</p>
    <div class="fg"><label>Escreva <strong>ELIMINAR</strong> para confirmar</label><input id="del-conf" type="text" placeholder="ELIMINAR"></div>
    <div style="display:flex;gap:9px;margin-top:16px">
      <button class="btn btn-danger" onclick="confirmDeleteAccount()">Eliminar permanentemente</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
}
async function confirmDeleteAccount(){
  const val = document.getElementById('del-conf')?.value?.trim();
  if(val !== 'ELIMINAR'){ toast('Escreva ELIMINAR para confirmar.','warn'); return; }
  try{
    await api.delete('/users/me');
    closeModal();
    toast('Conta eliminada.','info');
    setTimeout(()=>go('index.html'),1200);
  }catch(e){ toast(apiErrorMessage(e),'err'); }
}
</script></body></html>
