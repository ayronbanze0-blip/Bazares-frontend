<script>
function bazCard(b){
  const premium = !!b.seller?.isPremium;
  const verified = !!(b.verified||b.seller?.verifiedSeller);
  return `<div class="baz-card baz-card--compact card-hover anim-item${premium?' baz-card--premium':''}" onclick="go('bazar.html',{id:'${escJsAttr(b.slug||b.id)}'})">
    <div class="baz-head${premium?' baz-head--premium':''}">
      ${storeAvatar(b.name,34,bazarLogo(b),verified)}
      <div style="flex:1;min-width:0;position:relative;z-index:1">
        <div style="color:#fff;font-weight:700;font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</div>
        ${premium?`<span style="color:var(--a-500);font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;gap:2px"><svg class="ico-inline" width="9" height="9" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.7 7.1-.7z"/></svg> Premium</span>`:verified?`<span style="color:rgba(255,255,255,.55);font-size:9.5px;font-weight:600">Verificado</span>`:''}
      </div>
    </div>
    <div class="baz-body">
      <div class="baz-footer">
        <div style="font-size:11px">${stars(b.seller?.rating||0)} <span style="color:var(--t4)">${b.seller?.ratingCount?b.seller.rating.toFixed(1)+' ('+b.seller.ratingCount+')':'Sem avaliações'}</span></div>
        <span style="font-size:11px;font-weight:600;color:var(--t3)">${b._count?.products??0} produto(s)</span>
      </div>
    </div>
  </div>`;
}

let _bazCat='';
let _bazAll=[];
let _bazShown=0;
const BAZ_PAGE_SIZE=6;

async function loadBazars(){
  const grid=document.getElementById('baz-grid');
  document.getElementById('baz-loadmore').innerHTML='';
  grid.innerHTML=`<div style="text-align:center;padding:40px;grid-column:1/-1"><span class="spinner spinner-dark"></span></div>`;
  const q=document.getElementById('bsrch').value.trim();
  const sort=document.getElementById('bsort').value;
  const verifiedOnly=document.getElementById('bverif').checked;
  try {
    const res=await api.get('/bazars',{q:q||undefined,category:_bazCat||undefined,sort:sort!=='relevance'?sort:undefined,verified:verifiedOnly||undefined,limit:40});
    let bazars=res?.data?.bazars||[];
    // Salvaguarda no cliente: caso o backend ainda não filtre/ordene por
    // estes parâmetros, aplicamos aqui para que os filtros funcionem já.
    if(_bazCat) bazars=bazars.filter(b=>b.category===_bazCat);
    if(verifiedOnly) bazars=bazars.filter(b=>b.seller?.verifiedSeller);
    if(sort==='rating') bazars=[...bazars].sort((a,b)=>(b.seller?.rating||0)-(a.seller?.rating||0));
    else if(sort==='products') bazars=[...bazars].sort((a,b)=>(b._count?.products||0)-(a._count?.products||0));
    else if(sort==='sales') bazars=[...bazars].sort((a,b)=>(b.monthlySales||0)-(a.monthlySales||0));
    else if(sort==='name') bazars=[...bazars].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const meta=res?.data?.meta;
    const total=meta?.total ?? bazars.length;
    const filtered=!!(q||_bazCat||verifiedOnly||sort!=='relevance');
    document.getElementById('baz-total').innerHTML = total
      ? (filtered
          ? `${total} resultado${total===1?'':'s'} para a tua pesquisa`
          : `<strong style="color:var(--b-600)">+${total}</strong> vendedor(es) activo(s) — Moçambique inteiro conectado`)
      : '';
    _bazAll=bazars;
    _bazShown=0;
    if(!bazars.length){
      grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-6h16l1 6"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21v-6h6v6"/></svg></div><h3>Nenhum bazar encontrado</h3><p>Tente outros filtros ou termos de pesquisa</p></div>`;
      return;
    }
    grid.innerHTML='';
    renderBazPage();
  } catch(e){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}

// ─── Mostra ~6 bazares de cada vez; o scroll infinito revela o
// próximo lote já carregado (sem nova chamada à API). ───────────────
let _bazIO = null;
function _setupBazInfiniteScroll(){
  const sentinel = document.getElementById('baz-loadmore');
  if (!sentinel) return;
  if (_bazIO) _bazIO.disconnect();
  _bazIO = new IntersectionObserver(entries=>{
    if (entries[0].isIntersecting && _bazShown < _bazAll.length) renderBazPage();
  }, { rootMargin: '600px 0px' });
  _bazIO.observe(sentinel);
}
function renderBazPage(){
  const grid=document.getElementById('baz-grid');
  const moreEl=document.getElementById('baz-loadmore');
  const next=_bazAll.slice(_bazShown,_bazShown+BAZ_PAGE_SIZE);
  grid.insertAdjacentHTML('beforeend',next.map(bazCard).join(''));
  _bazShown+=next.length;
  moreEl.innerHTML='';
  animateItems(grid);
  _setupBazInfiniteScroll();
}

function resetBazFilters(){
  document.getElementById('bsort').value='relevance';
  document.getElementById('bverif').checked=false;
  document.getElementById('bcat').value='';
  _bazCat='';
  renderCatStrip('baz-cat-strip','',cat=>{_bazCat=cat;document.getElementById('bcat').value=cat;loadBazars();});
  loadBazars();
}

initPage({ active:'bazars.html', onReady:()=>{
  const sel=document.getElementById('bcat');
  CATS.forEach(c=>sel.insertAdjacentHTML('beforeend',`<option value="${esc(c.l)}">${esc(c.l)}</option>`));
  renderCatStrip('baz-cat-strip','',cat=>{_bazCat=cat;document.getElementById('bcat').value=cat;loadBazars();});
  document.getElementById('bcat').addEventListener('change',e=>{_bazCat=e.target.value;loadBazars();});
  document.getElementById('bverif').addEventListener('change',()=>loadBazars());
  loadBazars();
  let t;
  document.getElementById('bsrch').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(loadBazars,350);});
}});
</script></body></html>
