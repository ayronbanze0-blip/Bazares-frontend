<style>
.od-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
@media (max-width:860px){.od-grid{grid-template-columns:1fr}}
.od-timeline{display:flex;flex-direction:column;gap:0}
.od-tl-item{display:flex;gap:12px;position:relative;padding-bottom:22px}
.od-tl-item:last-child{padding-bottom:0}
.od-tl-item::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--brd)}
.od-tl-item:last-child::before{display:none}
.od-tl-item.done::before{background:var(--b-500)}
.od-tl-dot{width:21px;height:21px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surf3);border:2px solid var(--brd);color:var(--t4);z-index:1}
.od-tl-item.done .od-tl-dot{background:var(--b-500);border-color:var(--b-500);color:#fff}
.od-tl-item.current .od-tl-dot{background:var(--surf);border-color:var(--b-500);color:var(--b-500);box-shadow:0 0 0 3px var(--b-100)}
.od-tl-label{font-size:13px;font-weight:700}
.od-tl-item:not(.done):not(.current) .od-tl-label{color:var(--t4);font-weight:600}
.od-summary-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--brd)}
.od-summary-row:last-child{border-bottom:none}

<body data-require-auth="1">
<header id="topbar"></header><div class="overlay" id="overlay"></div><aside id="sidebar" class="closed"></aside>
<main id="main"><div id="view" class="pg-body"></div></main>
<div id="modal-root"></div><div id="toast-root"></div>
<script src="/js/config.js?v=1788617999"></script><script src="/js/seo.js?v=1788617999"></script><script src="/js/action-queue.js?v=1788617999"></script><script src="/js/api.js?v=1788617999"></script>
  <script src="/js/core.js?v=1788617999"></script><script src="/js/runtime.js?v=1788617999"></script>
  <script src="/js/offline-store.js?v=1788617999"></script>
  <script src="/js/virtual-feed.js?v=1788617999"></script><script src="/js/app.js?v=1788617999"></script><script src="/js/mentions.js?v=1788617999"></script><script src="/js/install-prompt.js?v=1788617999"></script><script src="/js/push-notifications.js?v=1788617999"></script>
<script>
const ORDER_TRANSITIONS = {
  SELLER:{ PENDENTE:['ACEITE','CANCELADA'], ACEITE:['EM_PREPARACAO'], EM_PREPARACAO:['EM_ENTREGA'], EM_ENTREGA:['ENTREGUE'] },
  BUYER:{ PENDENTE:['CANCELADA'] }
};
const ORDER_FLOW = ['PENDENTE','ACEITE','EM_PREPARACAO','EM_ENTREGA','ENTREGUE'];
const ACTION_LABEL = {
  ACEITE: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Aceitar encomenda', EM_PREPARACAO: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> Iniciar preparação',
  EM_ENTREGA: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Marcar como enviada', ENTREGUE: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Marcar como entregue',
  CANCELADA: '<svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Cancelar'
};
const TL_ICON = { PENDENTE:'clipboard', ACEITE:'check', EM_PREPARACAO:'box', EM_ENTREGA:'cart', ENTREGUE:'check' };

let _order = null, _role = '';

initPage({ active:'my-orders.html', requireAuth:true, onReady: async (user) => {
  _role = user.role;
  const id = getParam('id');
  const view = document.getElementById('view');
  if (!id) { go('my-orders.html'); return; }
  try {
    const res = await api.get(`/orders/${id}`);
    _order = res?.data?.order || res?.data;
    if (!_order) throw new Error('not found');
    renderOrder();
  } catch (e) {
    view.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>Encomenda não encontrada</h3><p>Pode ter sido removida ou o link está incorrecto.</p><button class="btn btn-ghost btn-sm" style="margin-top:14px" onclick="go('my-orders.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Ver todas as encomendas</button></div>`;
  }
}});

function renderOrder() {
  const o = _order, role = _role;
  const view = document.getElementById('view');
  const itemCount = (o.items||[]).reduce((s,it)=>s+(it.qty||1),0);
  const subtotal = (o.items||[]).reduce((s,it)=>s+(it.qty||1)*(it.price||0),0);
  const transitions = (ORDER_TRANSITIONS[role]||{})[o.status] || [];
  const canReview = role==='BUYER' && o.status==='ENTREGUE' && !o.reviewed;

  view.innerHTML = `
    <div class="pg-hero" style="margin-bottom:20px">
      <div class="pg-hero-content">
        <div class="section-pill"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> Encomenda #${o.id.slice(0,8).toUpperCase()}</div>
        <h1>Detalhe da encomenda</h1>
        <p>${fmtDate(o.createdAt)} às ${fmtTime(o.createdAt)} · ${itemCount} ${itemCount===1?'item':'itens'}</p>
      </div>
    </div>

    <div class="od-grid">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card" style="padding:18px 20px">
          <h4 style="margin-bottom:14px">Estado da encomenda</h4>
          ${o.status==='CANCELADA'
            ? `<div style="display:flex;align-items:center;gap:8px;color:var(--red);font-weight:700;font-size:13.5px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Esta encomenda foi cancelada</div>`
            : `<div class="od-timeline">${ORDER_FLOW.map((s,i)=>{
                const idx = ORDER_FLOW.indexOf(o.status);
                const done = i < idx, current = i === idx;
                return `<div class="od-tl-item ${done?'done':''} ${current?'current':''}">
                  <div class="od-tl-dot">${done?icon('check',12):icon(TL_ICON[s]||'clipboard',11)}</div>
                  <div><div class="od-tl-label">${STATUS_LABEL[s]}</div>${current?`<div style="font-size:11.5px;color:var(--t4)">Estado actual</div>`:''}</div>
                </div>`;
              }).join('')}</div>`}
        </div>

        <div class="card" style="padding:18px 20px">
          <h4 style="margin-bottom:14px">Itens</h4>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${(o.items||[]).map(it=>`
              <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surf3);border-radius:var(--r);border:1px solid var(--brd);cursor:${it.productId?'pointer':'default'}" ${it.productId?`onclick="go('product.html',{id:'${it.productId}'})"`:''}>
                ${it.image?`<img loading="lazy" decoding="async" src="${esc(it.image)}" alt="${esc(it.name||'')}" style="width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0">`:`<div style="width:52px;height:52px;border-radius:8px;background:var(--surf3);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--t3)">${icon('box',20)}</div>`}
                <div style="flex:1;min-width:0">
                  <div style="font-weight:600;font-size:13.5px">${esc(it.name||it.product?.name||'Produto')}</div>
                  <div style="font-size:11.5px;color:var(--t4)">Qtd: ${it.qty} · ${fmtMT(it.price||0)}/un.</div>
                </div>
                <div style="font-weight:800;color:var(--b-600);font-family:'Inter',sans-serif">${fmtMT((it.qty||1)*(it.price||0))}</div>
              </div>`).join('')}
          </div>
        </div>

        ${o.address ? `<div class="card" style="padding:18px 20px">
          <h4 style="margin-bottom:10px"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Endereço de entrega</h4>
          <p style="font-size:13px;color:var(--t2)">${esc(o.address)}</p>
        </div>` : ''}
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card" style="padding:18px 20px">
          <h4 style="margin-bottom:12px">Resumo</h4>
          <div class="od-summary-row"><span>Estado</span>${stBadge(o.status)}</div>
          <div class="od-summary-row"><span>Subtotal</span><b>${fmtMT(subtotal)}</b></div>
          <div class="od-summary-row"><span>Total</span><b style="color:var(--b-600);font-size:15px">${fmtMT(o.total)}</b></div>
        </div>

        ${(transitions.length || canReview || (role==='BUYER' && o.status!=='CANCELADA')) ? `
        <div class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:8px">
          <h4 style="margin-bottom:4px">Acções</h4>
          ${transitions.map(ns=>`<button class="btn btn-sm btn-block ${ns==='CANCELADA'?'btn-danger':ns==='ENTREGUE'?'btn-success':'btn-primary'}" onclick="updateStatus('${ns}')">${ACTION_LABEL[ns]||STATUS_LABEL[ns]}</button>`).join('')}
          ${canReview?`<button class="btn btn-soft btn-sm btn-block" onclick="openReview('${o.id}','${o.items?.[0]?.productId||''}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Avaliar compra</button>`:''}
          ${role==='BUYER'&&o.status!=='CANCELADA'?`<button class="btn btn-soft btn-sm btn-block" onclick="openChat('${o.sellerId}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Falar com vendedor</button>`:''}
        </div>` : ''}
      </div>
    </div>`;
}

async function updateStatus(newStatus) {
  try { await api.patch(`/orders/${_order.id}/status`, { status: newStatus }); toast('Estado actualizado!'); const res = await api.get(`/orders/${_order.id}`); _order = res?.data?.order || res?.data; renderOrder(); }
  catch (e) { toast(apiErrorMessage(e), 'err'); }
}
async function openChat(sid) {
  try { const r = await api.get(`/chat/with/${sid}`); go('chat.html', { chatId: r?.data?.chat?.id || '' }); }
  catch (e) { toast(apiErrorMessage(e), 'err'); }
}
function openReview(orderId, productId) {
  openModal(`<div class="modal-hd"><h3>Avaliar compra</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="fg"><label>Classificação</label><div id="star-pick" class="star-pick"></div></div>
    <div class="fg"><label>Recomenda este vendedor?</label>
      <div class="thumb-btns" id="rv-thumb-pick">
        <button type="button" class="thumb-btn" data-val="up" onclick="pickThumb(this)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg> Sim</button>
        <button type="button" class="thumb-btn" data-val="down" onclick="pickThumb(this)"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg> Não</button>
      </div>
    </div>
    <div class="fg"><label>Comentário (opcional)</label><textarea id="rv-comment" rows="3" placeholder="Como foi a sua experiência?"></textarea></div>
    <div style="display:flex;gap:9px">
      <button class="btn btn-primary" style="flex:1" onclick="submitReview('${orderId}','${productId}')">Enviar avaliação</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
  starPicker('star-pick');
}
function pickThumb(btn) {
  btn.parentElement.querySelectorAll('.thumb-btn').forEach(b=>b.classList.remove('on-up','on-down'));
  btn.classList.add(btn.dataset.val==='up'?'on-up':'on-down');
}
async function submitReview(orderId, productId) {
  const starEl = document.getElementById('star-pick');
  const r = starEl && starEl._getValue ? starEl._getValue() : 0;
  const comment = document.getElementById('rv-comment').value.trim();
  const thumbBtn = document.querySelector('#rv-thumb-pick .thumb-btn.on-up, #rv-thumb-pick .thumb-btn.on-down');
  const recommend = thumbBtn ? thumbBtn.dataset.val==='up' : undefined;
  if (!r) { toast('Seleccione uma classificação.', 'warn'); return; }
  try { await api.post('/reviews', { orderId, productId, rating: r, comment, recommend }); closeModal(); toast('Avaliação enviada!'); const res = await api.get(`/orders/${_order.id}`); _order = res?.data?.order || res?.data; renderOrder(); }
  catch (e) { toast(apiErrorMessage(e), 'err'); }
}
</script>
