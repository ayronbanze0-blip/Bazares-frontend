<script>
initPage({ active:'bazars.html', onReady: async(user)=>{
  // URL amigável primeiro (/bazar/nome-da-loja, via window.location.pathname).
  // ?id= e window.BAZARES_BAZAR_ID (injectado pela Cloudflare Function em
  // functions/bazar/[slug].js, quando a página é servida por /bazar/:slug)
  // ficam como retrocompatibilidade — ligações antigas já partilhadas
  // continuam a abrir a loja certa.
  const id=getPathSlug('bazar')||getParam('id')||window.BAZARES_BAZAR_ID; const view=document.getElementById('view');
  if(!id){ go('bazars.html'); return; }
  let bazar;
  try { bazar=(await api.get(`/bazars/${id}`))?.data?.bazar; }
  catch { view.innerHTML=`<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-6h16l1 6"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21v-6h6v6"/></svg></div><h3>Bazar não encontrado</h3><button class="btn btn-ghost btn-sm" style="margin-top:14px" onclick="go('bazars.html')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Voltar</button></div>`; return; }
  window._bazar=bazar;
  window.BZSEO?.setStore(bazar);
  _bazBlocked = !!bazar.isBlocked;
  const s=bazar.seller||{};
  const badge = bazar.badge || badgeInfo(bazar.monthlySales||0);
  const isOwner = !!(user && user.id === s.id);
  view.innerHTML=`
    <!-- Mesmo cabeçalho ".mf-hero" que meufeed.html usa para o dono — um
    visitante normal e o "Ver como visitante" do dono veem exactamente
    o mesmo layout, só os botões de acção mudam. -->
    <div class="mf-hero">
      <div class="mf-hero-avatar" ${bazarLogo(bazar)?`onclick="openImageLightbox('${esc(bazarLogo(bazar))}')" style="cursor:pointer"`:''}>${storeAvatar(bazar.name,74,bazarLogo(bazar))}</div>
      <div class="mf-hero-name">${esc(bazar.name)}
        ${s.isPremium?`<span title="Loja Premium"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="15" height="15"><path d="M12 2l2.4 1.2 2.6-.6 1.4 2.3 2.5.9-.2 2.7 1.7 2.1-1.7 2.1.2 2.7-2.5.9-1.4 2.3-2.6-.6L12 22l-2.4-1.2-2.6.6-1.4-2.3-2.5-.9.2-2.7L1.6 13.6l1.7-2.1-.2-2.7 2.5-.9 1.4-2.3 2.6.6z"/><path d="M9 12.5l2 2 4-4.5" stroke="#00B837" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`:''}
        ${s.verifiedSeller?`<span title="Vendedor verificado"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="20 6 9 17 4 12"/></svg></span>`:''}
      </div>
      <div class="mf-hero-sub">${esc(bazar.category||'')}${bazar.location?' · '+esc(bazar.location):''}</div>
      <div class="mf-hero-badges">
        <span class="medal-chip medal-${badge.tier.toLowerCase()}">${badge.icon} ${badge.label}</span>
        ${renderThumbs(s.id, s.thumbsUp||0, s.thumbsDown||0)}
      </div>
      <div class="mf-hero-stats">
        <div class="mf-hero-stat"><b>${s.ratingCount?s.rating.toFixed(1):'Novo'}</b><span>Avaliações</span></div>
        <div class="mf-hero-stat"><b id="baz-follower-count">${bazar.followerCount||0}</b><span>Seguidores</span></div>
        <div class="mf-hero-stat"><b id="baz-stat-products">${bazar.products?.length ?? 0}</b><span>Produtos</span></div>
      </div>
      <div class="mf-hero-btns">
        ${isOwner?`
          <button class="btn btn-sm" style="background:#fff;color:var(--b-700);border:none" onclick="go('my-bazar.html')">${icon('settings',15,2)} Editar Bazar</button>
          <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="go('meufeed.html')">${icon('grid',15,2)} O meu feed</button>
        `:`
          ${user?`<button class="btn ${bazar.isFollowing?'btn-soft':'btn-follow-off'} btn-sm" id="baz-follow-btn" style="${bazar.isFollowing?'':'background:var(--b-50)'}" onclick="toggleBazarFollow('${bazar.id}')">
            <svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="baz-follow-label">${bazar.isFollowing?'A seguir':'Seguir Bazar'}</span>
          </button>`:`<button class="btn btn-sm" style="background:#fff;color:var(--b-700);border:none" onclick="go('login.html')">${icon('user',15,2)} Seguir Bazar</button>`}
          <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="document.getElementById('bzt-produtos')?.scrollIntoView({behavior:'smooth',block:'start'})">${icon('grid',15,2)} Ver loja</button>
          <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="contactSeller('${s.id}')">${icon('chat',15,2)} Mensagem</button>
          ${s.isPremium&&bazar.phone?`<button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="contactSellerWhatsapp('${bazar.id}','${esc(bazar.phone)}')">${icon('chat',15,2)} WhatsApp</button>`:''}
        `}
      </div>
    </div>
    ${!isOwner?`<div style="display:flex;justify-content:center;gap:16px;margin:-12px 0 20px;flex-wrap:wrap">
      <button type="button" class="btn-text" onclick="suggestBazarToFriend()">${icon('send',13,2)} Sugerir a um amigo</button>
      ${user?`<button type="button" class="btn-text" onclick="openReportModal('USER','${s.id}')">${icon('flag',13,2)} Denunciar</button>`:''}
      ${user?`<button type="button" id="baz-block-btn" class="btn-text" onclick="toggleBazarBlock('${s.id}')">${icon('slash',13,2)} <span id="baz-block-label">${bazar.isBlocked?'Desbloquear':'Bloquear'}</span></button>`:''}
    </div>`:''}
    ${bazar.promoTitle?`<div class="card reveal" style="margin-bottom:22px;background:${bazar.promoColor||'#00B837'};border:none;color:#fff;padding:18px 20px">
      <div style="font-weight:700;font-size:15px">${esc(bazar.promoTitle)}</div>
      ${bazar.promoSubtitle?`<div style="font-size:13px;opacity:.9;margin-top:2px">${esc(bazar.promoSubtitle)}</div>`:''}
    </div>`:''}

    <div class="mf-tabs">
      <button class="mf-tab active" id="bzt-tab-produtos" onclick="bztSetTab('produtos')">${icon('box',15,2)} Produtos</button>
      <button class="mf-tab" id="bzt-tab-anuncios" onclick="bztSetTab('anuncios')">${icon('megaphone',15,2)} Posts</button>
      <button class="mf-tab" id="bzt-tab-reels" onclick="bztSetTab('reels')">${icon('video',15,2)} Reels</button>
      <button class="mf-tab" id="bzt-tab-sobre" onclick="bztSetTab('sobre')">${icon('user',15,2)} Sobre</button>
    </div>

    <div id="bzt-produtos" class="ig-grid">${(bazar.products||[]).map(bztProductTileHtml).join('')||'<div style="grid-column:1/-1;text-align:center;padding:40px 20px"><div style="color:var(--t4);margin-bottom:10px">'+icon('box',32,1.5)+'</div><h3>Ainda sem produtos</h3></div>'}</div>
    <div id="bzt-anuncios" style="display:none;flex-direction:column;gap:16px;max-width:560px;margin:0 auto"></div>
    <div id="bzt-reels" class="ig-grid" style="display:none"></div>
    <div id="bzt-sobre" style="display:none;flex-direction:column"></div>`;
  document.getElementById('sticky-cta-mount')?.remove();
  document.body.classList.remove('has-sticky-cta');
  if(user && user.id!==s.id){
    document.body.classList.add('has-sticky-cta');
    document.body.insertAdjacentHTML('beforeend', `<div class="sticky-cta" id="sticky-cta-mount">
      <div class="sc-total"><span>${badge.icon} ${esc(badge.label)}</span><b style="font-size:13px">${esc(bazar.name)}</b></div>
      <button class="btn btn-terra" onclick="contactSeller('${s.id}')"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Contactar</button>
    </div>`);
  }
  document.getElementById('bzt-produtos').dataset.loaded = '1';
}});

function bztSetTab(tab){
  ['produtos','anuncios','reels','sobre'].forEach(t=>{
    document.getElementById(`bzt-tab-${t}`).classList.toggle('active', t===tab);
    const panel = document.getElementById(`bzt-${t}`);
    panel.style.display = t===tab ? (t==='anuncios'||t==='sobre'?'flex':'grid') : 'none';
    if(t==='sobre') panel.style.flexDirection = 'column';
  });
  if(tab==='reels' && !document.getElementById('bzt-reels').dataset.loaded) bztLoadReels();
  if(tab==='anuncios' && !document.getElementById('bzt-anuncios').dataset.loaded) bztLoadAnuncios();
  if(tab==='sobre' && !document.getElementById('bzt-sobre').dataset.loaded) bztRenderSobre();
}

// ─── Produtos — mesmo cartão em grelha (foto+nome+preço) usado em
// meufeed.html, para que a aba "Produtos" seja idêntica quer o dono
// veja o seu Bazar como visitante, quer qualquer outra pessoa. ─────
function bztProductTileHtml(p){
  const img = p.images?.[0]?.url;
  return `<div class="ig-tile" onclick="go('product.html',{id:'${escJsAttr(p.slug || p.id)}'})">
    ${img?`<img src="${esc(cldImg(img,400))}" alt="${esc(p.name)}" loading="lazy">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--t4)">${icon('image',26,1.5)}</div>`}
    <div class="ig-tile-caption">${esc(p.name)} · ${fmtMT(p.price)}</div>
  </div>`;
}

function bztRenderSobre(){
  const panel = document.getElementById('bzt-sobre');
  panel.dataset.loaded = '1';
  const b = window._bazar;
  panel.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <h4 style="margin-bottom:10px">${icon('clipboard',16)} Descrição</h4>
      <p style="font-size:13.5px;line-height:1.7;color:var(--t2)">${esc(b.description||'Esta loja ainda não tem descrição.')}</p>
    </div>
    <div class="card" style="margin-bottom:14px">
      <h4 style="margin-bottom:12px">${icon('pin',16)} Informação</h4>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${b.category?bztInfoRow(icon('grid',15),'Categoria',b.category):''}
        ${b.location?bztInfoRow(icon('pin',15),'Localização',b.location):''}
        ${bztInfoRow(icon('clock',15),'No Bazares desde',fmtDate(b.createdAt))}
      </div>
    </div>
    ${b.latitude!=null&&b.longitude!=null?`<div class="card">
      <div class="sh-row" style="margin-bottom:10px"><h4 style="margin-bottom:0">${icon('pin',16)} Localização da banca</h4>
        <a class="btn btn-soft btn-xs" href="https://www.google.com/maps/dir/?api=1&destination=${b.latitude},${b.longitude}" target="_blank" rel="noopener">${icon('send',13,2)} Direções</a>
      </div>
      <div id="bz-view-map" style="width:100%;height:200px;border-radius:var(--r);background:var(--n-100)"></div>
    </div>`:''}`;
  if(b.latitude!=null && b.longitude!=null){
    createPinMap(document.getElementById('bz-view-map'), { lat: b.latitude, lng: b.longitude, draggable:false }).then(m=>{
      _bzViewMap = m;
      document.addEventListener('bz:spa-leave', () => { try { _bzViewMap?.map?.remove(); _bzViewMap = null; } catch (e) {} }, { once: true });
    }).catch(()=>{
      document.getElementById('bz-view-map')?.remove();
    });
  }
}
function bztInfoRow(ico,lbl,val){
  return `<div style="display:flex;align-items:center;gap:12px;padding:11px;background:var(--surf3);border-radius:var(--r);border:1px solid var(--brd)">
    <span style="width:32px;height:32px;border-radius:9px;background:var(--b-50);color:var(--b-600);display:flex;align-items:center;justify-content:center;flex-shrink:0">${ico}</span>
    <div><div style="font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-weight:700">${lbl}</div><div style="font-weight:700;font-size:13px;color:var(--text)">${esc(val||'Não indicado')}</div></div>
  </div>`;
}

async function bztLoadReels(){
  const grid = document.getElementById('bzt-reels');
  grid.dataset.loaded = '1';
  try{
    const r = await api.get(`/bazars/${window._bazar.id}/reels`, { limit: 60 });
    const reels = r?.data?.reels || [];
    grid.innerHTML = reels.length ? reels.map(bztReelTileHtml).join('') : `
      <div style="grid-column:1/-1;text-align:center;padding:40px 20px">
        <div style="color:var(--t4);margin-bottom:10px">${icon('video',32,1.5)}</div>
        <h3 style="margin-bottom:6px">Ainda sem publicações</h3>
      </div>`;
  }catch(e){ grid.innerHTML = `<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--t4)">${esc(apiErrorMessage(e))}</div>`; }
}
function bztReelTileHtml(rl){
  const isVideo = !!rl.videoUrl;
  const thumb = isVideo
    ? `<video src="${esc(cldVideo(rl.videoUrl,400))}" muted playsinline preload="metadata"></video>`
    : `<img src="${esc(cldImg(rl.imageUrl,400))}" alt="" loading="lazy">`;
  // Mesma lógica do Meu Feed: abre o reel a valer (com reações/comentários),
  // não só a foto/vídeo isolado — usando o deep-link ?reel=&bazar= de
  // reels.html em vez do lightbox simples.
  return `<div class="ig-tile" onclick="go('reels.html',{reel:'${rl.id}',bazar:'${window._bazar.id}'})">
    ${thumb}
    <span class="ig-tile-kind">${isVideo?icon('video',16,2):icon('image',16,2)}</span>
    ${rl.text?`<div class="ig-tile-caption">${esc(rl.text)}</div>`:''}
  </div>`;
}

async function bztLoadAnuncios(){
  const list = document.getElementById('bzt-anuncios');
  list.dataset.loaded = '1';
  list.innerHTML = `<div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div>`;
  try{
    const r = await api.get(`/bazars/${window._bazar.id}/announcements`, { limit: 30 });
    const items = r?.data?.announcements || [];
    list.innerHTML = items.length ? items.map(bztAnnouncementCardHtml).join('') : `<div class="empty"><div class="empty-ico">${icon('megaphone',28)}</div><h3>Ainda sem posts</h3></div>`;
    loadCommentPreviews(items.map(a=>({ targetType:'ANNOUNCEMENT', targetId:a.id, commentCount:a.commentCount||0 })));
  }catch(e){ list.innerHTML = `<div class="empty"><h3>${esc(apiErrorMessage(e))}</h3></div>`; }
}
function bztAnnouncementCardHtml(a){
  const bazar = window._bazar;
  const s = bazar.seller || {};
  const isOwner = !!(Session.user && Session.user.id === s.id);
  const cardId = `feed-ANNOUNCEMENT-${a.id}`;
  const images = a.images?.length ? a.images.map(i=>i.url||i) : (a.imageUrl ? [a.imageUrl] : []);
  const liked = a.myReaction === 1;
  const parsedAnn = parseQuickTags(a.text || '');
  const caption = escWithMentions(parsedAnn.text);
  const captionLong = caption.length > 140;
  return `
  <div class="card feed-card" id="${cardId}" style="padding:0;overflow:hidden">
    <div class="fc-post-header" style="display:flex;align-items:center;gap:10px;padding:12px 14px">
      ${storeAvatar(bazar.name, 34, bazarLogo(bazar))}
      <div style="flex:1;min-width:0">
        <strong style="font-size:13.5px">${esc(bazar.name)}</strong>
        <div style="font-size:11px;color:var(--t4);display:flex;align-items:center;gap:6px;margin-top:2px">
          <span class="fc-type-tag fc-type-tag--post">Post</span>
          <span>${fmtDate(a.createdAt)}</span>
        </div>
      </div>
      ${isOwner ? feedKebabBtnHtml('ANNOUNCEMENT', a.id, bazar.id) : feedMoreBtnHtml('ANNOUNCEMENT', a.id, bazar.id, s.id||'', !!bazar.isFollowing)}
    </div>
    ${quickTagBadgesHtml(parsedAnn.tags)}
    ${images.length?`<div class="fc-carousel" data-heart-host="${cardId}" style="position:relative" ondblclick="doubleTapLike(this,'ANNOUNCEMENT','${a.id}',${liked})">${carouselHtml(images, '', images, cardId)}</div>`:''}
    <div class="fc-caption-block" style="padding:12px 14px 2px">
      <p id="${cardId}-caption" class="fc-caption${captionLong?' truncated':''}" style="font-size:13.5px;color:var(--t2);white-space:pre-wrap;margin:0">${caption}</p>
      ${captionLong?`<button class="fc-caption-more" onclick="toggleCaption(this)">Ver mais</button>`:''}
    </div>
    ${feedReactionBar(cardId, 'ANNOUNCEMENT', a.id, a.myReaction, a.likeCount, a.shareCount)}
    <div id="${cardId}-preview" style="padding:6px 14px 4px;display:flex;flex-direction:column;gap:3px"></div>
    <div id="${cardId}-comments" style="display:none;padding:0 14px 14px;border-top:1px solid var(--brd)"></div>
  </div>`;
}

async function contactSeller(sid){
  if(!Session.isLoggedIn()){go('login.html');return;}
  try{const r=await api.get(`/chat/with/${sid}`);go('chat.html',{with:sid,chatId:r?.data?.chat?.id||''});}
  catch(e){toast(apiErrorMessage(e),'err');}
}
// Botão de contacto directo por WhatsApp (exclusivo bazares Premium com
// telefone definido). Regista o clique para a estatística de contactos
// no dashboard Premium (fire-and-forget — nunca bloqueia a abertura do
// WhatsApp, mesmo se o registo falhar).
function contactSellerWhatsapp(bazarId, phone){
  api.post(`/bazars/${bazarId}/whatsapp-click`, {}).catch(()=>{});
  const digits = (phone||'').replace(/[^0-9]/g,'').slice(-9);
  window.open(`https://wa.me/258${digits}`, '_blank');
}
// Seguir/deixar de seguir o bazar — avisa quando publicar produto novo.
function suggestBazarToFriend(){
  if(window._bazar) suggestToFriend(window._bazar.name, window.location.href);
}
async function toggleBazarFollow(bazarId){
  if(!Session.isLoggedIn()){go('login.html');return;}
  const btn = document.getElementById('baz-follow-btn');
  const label = document.getElementById('baz-follow-label');
  const countEl = document.getElementById('baz-follower-count');
  if(btn) btn.disabled = true;
  try{
    const r = await api.post(`/bazars/${bazarId}/follow`, {});
    const { following, followerCount } = r?.data || {};
    if(label) label.textContent = following ? 'A seguir' : 'Seguir';
    if(btn){
      btn.classList.toggle('btn-soft', following);
      btn.classList.toggle('btn-follow-off', !following);
      btn.style.background = following ? '' : 'var(--b-50)';
      const svg = btn.querySelector('svg');
      if(svg) svg.setAttribute('fill', following ? 'currentColor' : 'none');
    }
    if(countEl) countEl.textContent = `${followerCount} ${followerCount===1?'seguidor':'seguidores'}`;
    toast(following ? 'A seguir este bazar' : 'Deixou de seguir este bazar', 'ok');
  }catch(e){ toast(apiErrorMessage(e),'err'); }
  finally{ if(btn) btn.disabled = false; }
}
// Bloquear/desbloquear o vendedor desta loja diretamente da página dele
// — usa a mesma dupla de endpoints do menu "..." do feed/produto
// (POST bloqueia, DELETE desbloqueia), só que aqui é sempre visível,
// não escondido atrás de um menu.
let _bazBlocked = false;
let _bzViewMap = null; // Ronda 40 — ver cleanup ao sair (bz:spa-leave), mesmo risco de WebGL leak do checkout.html
async function toggleBazarBlock(sellerId){
  if(!Session.isLoggedIn()){ go('login.html'); return; }
  if(!_bazBlocked){
    openModal(`<div class="modal-hd"><h3>Bloquear</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar">${icon('close',18,2)}</button></div>
      <p style="font-size:13.5px;color:var(--t2);margin:0 0 14px">Depois de bloquear, deixam de ver as publicações um do outro e não vos podem enviar mensagens. Pode desbloquear mais tarde, aqui ou em Definições.</p>
      <div style="display:flex;gap:9px"><button class="btn btn-danger" style="flex:1" onclick="closeModal();doBazarBlock('${sellerId}',true)">Bloquear</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>`);
  } else {
    await doBazarBlock(sellerId, false);
  }
}
async function doBazarBlock(sellerId, blocking){
  const btn = document.getElementById('baz-block-btn');
  const label = document.getElementById('baz-block-label');
  if(btn) btn.disabled = true;
  try{
    if(blocking) await api.post(`/users/${sellerId}/block`, {});
    else await api.delete(`/users/${sellerId}/block`);
    _bazBlocked = blocking;
    if(label) label.textContent = blocking ? 'Desbloquear' : 'Bloquear';
    toast(blocking ? 'Utilizador bloqueado.' : 'Utilizador desbloqueado.', 'ok');
    if(blocking) setTimeout(()=>go('bazars.html'), 900);
  }catch(e){ toast(apiErrorMessage(e),'err'); }
  finally{ if(btn) btn.disabled = false; }
}
function openReportModal(type,targetId){
  if(!Session.isLoggedIn()){go('login.html');return;}
  openModal(`<div class="modal-hd"><h3>Denunciar</h3><button class="modal-x" onclick="closeModal()" aria-label="Fechar"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="fg"><label>Motivo</label><select id="rp-r"><option>Comportamento inadequado</option><option>Fraude</option><option>Spam</option><option>Conta falsa</option><option>Outro</option></select></div>
    <div class="fg"><label>Descrição</label><textarea id="rp-d" rows="3" placeholder="Descreva o problema..."></textarea></div>
    <div style="display:flex;gap:9px"><button class="btn btn-danger" onclick="submitReport('${type}','${targetId}')">Enviar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>`);
}
async function submitReport(type,targetId){
  const reason=document.getElementById('rp-r').value;
  const description=document.getElementById('rp-d').value.trim();
  if(!description){toast('Descreva o problema.','warn');return;}
  try{await api.post('/reports',{type,targetId,reason,description});closeModal();toast('Denúncia enviada.');}
  catch(e){toast(apiErrorMessage(e),'err');}
}
</script></body></html>
