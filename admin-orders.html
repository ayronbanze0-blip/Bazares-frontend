<body data-require-auth="1" data-roles="ADMIN">
<header id="topbar"></header>
<div class="overlay" id="overlay"></div>
<aside id="sidebar" class="closed"></aside>
<main id="main">
  <div class="pg-body">
    <div class="sh-row">
      <div class="sh"><h2 id="ao-title">Encomendas</h2></div>
      <select id="ao-status" style="width:180px">
        <option value="">Todos os estados</option>
        <option value="PENDENTE">Pendente</option><option value="ACEITE">Aceite</option>
        <option value="EM_PREPARACAO">Em Preparação</option><option value="EM_ENTREGA">Em Entrega</option>
        <option value="ENTREGUE">Entregue</option><option value="CANCELADA">Cancelada</option>
      </select>
    </div>
    <div id="ao-list" class="reveal"><div style="text-align:center;padding:40px"><span class="spinner spinner-dark"></span></div></div>
    <div id="ao-pagination"></div>
  </div>
</main>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/js/config.js?v=1788617999"></script><script src="/js/seo.js?v=1788617999"></script><script src="/js/action-queue.js?v=1788617999"></script>
<script src="/js/api.js?v=1788617999"></script>
  <script src="/js/core.js?v=1788617999"></script><script src="/js/runtime.js?v=1788617999"></script>
  <script src="/js/offline-store.js?v=1788617999"></script>
  <script src="/js/virtual-feed.js?v=1788617999"></script>
<script src="/js/app.js?v=1788617999"></script><script src="/js/mentions.js?v=1788617999"></script><script src="/js/install-prompt.js?v=1788617999"></script><script src="/js/push-notifications.js?v=1788617999"></script>
<script>
initPage({ active: 'admin-orders.html', requireAuth: true, roles: ['ADMIN'], onReady: () => {
  document.getElementById('ao-status').addEventListener('change', () => loadAdminOrders(1));
  loadAdminOrders(1);
}});

let _aoPage = 1;
async function loadAdminOrders(page = 1) {
  _aoPage = page;
  const list = document.getElementById('ao-list');
  const status = document.getElementById('ao-status').value;
  try {
    const res = await api.get('/admin/orders', { status: status || undefined, page, limit: 30 });
    const orders = res?.data?.orders || [];
    const meta = res?.data?.meta || {};
    document.getElementById('ao-title').textContent = `Encomendas (${meta.total ?? orders.length})`;
    if (!orders.length) {
      list.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div><h3>Sem encomendas</h3></div>`;
      document.getElementById('ao-pagination').innerHTML = '';
      return;
    }
    list.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Produto</th><th>Comprador</th><th>Vendedor</th><th>Total</th><th>Taxa</th><th>Estado</th><th>Data</th></tr></thead><tbody>
      ${orders.map(o => `<tr>
        <td style="font-family:monospace;font-size:11px">${o.id.slice(0,8)}</td>
        <td>${esc(o.items?.[0]?.name||'')}</td>
        <td style="font-size:12px">${esc(o.buyer?.name||'')}</td>
        <td style="font-size:12px">${esc(o.seller?.name||'')}</td>
        <td style="font-weight:700">${fmtMT(o.total)}</td>
        <td style="color:var(--red)">${o.feeAmount>0?fmtMT(o.feeAmount):'Sem taxa'}</td>
        <td>${stBadge(o.status)}</td>
        <td style="font-size:11px;color:var(--t4)">${fmtDate(o.createdAt)}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
    renderPagination('ao-pagination', meta, loadAdminOrders);
  } catch (e) {
    list.innerHTML = `<div class="empty"><div class="empty-ico"><svg class="ico-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>${esc(apiErrorMessage(e))}</h3></div>`;
  }
}
</script>
